// فورم موزون: بيدي وزن أكبر للجولات الأقرب بدل ما يعامل آخر 5 جولات بنفس الأهمية
// (لاعب سجل 2 جولات كويسة الأسبوع اللي فات أهم من لاعب سجلهم بدري وبايت دلوقتي)
function weightedFormPts(history){
  if(!history || !history.length) return 0;
  const sorted = history.slice().sort((a,b)=>a.gw-b.gw);
  let wSum = 0, sum = 0;
  sorted.forEach((h,i)=>{ const w = i+1; wSum += w; sum += w*h.pts; });
  return wSum ? Math.round((sum/wSum)*100)/100 : 0;
}

async function buildLiveDataset(){
  const boot = await fplFetch('bootstrap');
  const teams = boot.teams || [];
  const elements = boot.elements || [];
  const events = boot.events || [];
  const totalManagers = boot.total_players || 0; // إجمالي عدد مديري الفانتازي — لازم لحساب مؤشر توقع تغيير الأسعار

  const clubTag = {}, clubName = {}, teamIdToKey = {}, clubCode = {};
  teams.forEach(t=>{
    const key = (t.short_name || t.name.slice(0,3)).toLowerCase();
    teamIdToKey[t.id] = key;
    clubTag[key] = t.short_name;
    clubName[key] = t.name;
    clubCode[key] = t.code; // مهم جداً عشان نجيب لوجو النادي
  });

  let parsedFixtures = [];
  let fixturesByGw = {}; // مباريات كل جولة (id -> [matches]) عشان نقدر نعرض أي جولة فاتت فورًا
  let liveTeams = new Set();

  // الجولة الحالية: لو الموسم شغال ناخد الجولة الجارية، لو لسه مبدأش ناخد أول جولة قادمة
  let currentEvent = events.find(e=>e.is_current) || events.find(e=>e.is_next) || events[events.length-1];

  // آخر جولة اتلعبت فعليًا (أعلى جولة خلصت) — للتشكيلة المُرحّلة ونقاط "آخر جولة"
  const finishedEvents = events.filter(e=>e.finished);
  const lastPlayedGw = finishedEvents.length ? finishedEvents[finishedEvents.length-1].id : null;

  // بنجيب المباريات بدري عشان نقرر: هل نتقدّم للجولة الجاية؟
  // القاعدة (حسب طلب المستخدم): لو كل ماتشات الجولة الحالية خلصت وعدّى 12 ساعة على آخر ماتش،
  // نتقدّم تلقائيًا للجولة الجاية — من غير ما نستنى الفانتازي تقفلها رسميًا (لأنها بتتأخر ساعات كتير).
  let allFxEarly = [];
  try{ allFxEarly = (await fplFetch('fixtures')) || []; }catch(e){ allFxEarly = []; }
  if(currentEvent){
    const curFx = allFxEarly.filter(f=>f.event === currentEvent.id);
    const allDone = curFx.length && curFx.every(f=>f.finished || f.finished_provisional);
    if(allDone){
      const kicks = curFx.map(f=>new Date(f.kickoff_time).getTime()).filter(t=>!isNaN(t));
      const lastKick = kicks.length ? Math.max.apply(null, kicks) : 0;
      const approxFinish = lastKick + 2*3600000; // نهاية آخر ماتش تقريبًا (الماتش ~ساعتين)
      if(lastKick && Date.now() > approxFinish + 12*3600000){
        const nxt = events.find(e=>e.is_next) || events.find(e=>e.id === currentEvent.id + 1);
        if(nxt) currentEvent = nxt; // اتقدّمنا للجولة الجاية
      }
    }
  }
  const gwId = currentEvent ? currentEvent.id : 1;

  // نجيب نقط لحظية لآخر 5 جولات متخلصة + الجولة الحالية عشان نبني "فورم موزون"
  // (الجولات الأقرب ليها وزن أكبر في الحساب، مش كل الجولات بنفس الأهمية)
  const finishedIds = events.filter(e=>e.finished).map(e=>e.id).slice(-5);
  const liveIds = Array.from(new Set([...finishedIds, gwId]));
  const historyByElement = {};
  // بونص لحظي: بنسجل الـ bps ورقم المباراة (fixture) لكل لاعب في الجولة الحالية بس،
  // عشان بعدين نرتبهم جوه كل مباراة ونديهم بونص افتراضي (3/2/1) قبل ما يتأكد رسمياً
  const currentGwBps = {};
  // دقايق ولو اتأسس اللاعب في الجولة الحالية — عشان نعرف مين "نازل الملعب فعليًا" دلوقتي
  // (مش بس إن فريقه بيلعب)، ومين لسه على دكة الاحتياط
  const currentGwMinutes = {};
  const currentGwStarted = {};
  // إحصائيات لحظية للجولة الحالية لكل لاعب (جول/أسيست/كروت) — دي اللي بنقارنها
  // بالنسخة اللي قبلها (state.lastKnownStats) عشان نطلع إشعار فوري لكل حدث جديد
  // بيخص لاعب من تشكيلة اليوزر (شوف diffPlayerStats تحت).
  const currentGwGoals = {};
  const currentGwAssists = {};
  const currentGwYellow = {};
  const currentGwRed = {};
  const currentGwExplain = {};
  // تفاصيل النقاط (explain) لكل جولة اتجابت — عشان تفاصيل نقاط أي جولة تفتح بالضغط مش الحالية بس
  const explainByElementGw = {};
  for(const evId of liveIds){
    try{
      const live = await fplFetch('live', evId);
      (live.elements || []).forEach(row=>{
        const pts = row.stats ? row.stats.total_points : 0;
        if(!historyByElement[row.id]) historyByElement[row.id] = [];
        historyByElement[row.id].push({ gw: evId, pts: pts||0 });
        if(!explainByElementGw[row.id]) explainByElementGw[row.id] = {};
        explainByElementGw[row.id][evId] = row.explain || [];
        if(evId === gwId){
          const bps = row.stats ? (row.stats.bps || 0) : 0;
          const fx = (row.explain && row.explain[0] && row.explain[0].fixture) || null;
          currentGwBps[row.id] = { bps: bps, fixtureId: fx };
          currentGwMinutes[row.id] = row.stats ? (row.stats.minutes || 0) : 0;
          currentGwStarted[row.id] = !!(row.stats && row.stats.starts);
          currentGwExplain[row.id] = row.explain || [];
          currentGwGoals[row.id] = row.stats ? (row.stats.goals_scored || 0) : 0;
          currentGwAssists[row.id] = row.stats ? (row.stats.assists || 0) : 0;
          currentGwYellow[row.id] = row.stats ? (row.stats.yellow_cards || 0) : 0;
          currentGwRed[row.id] = row.stats ? (row.stats.red_cards || 0) : 0;
        }
      });
    }catch(e){ /* لو جولة معينة فشلت نكمل من غيرها */ }
  }

  // مباريات الجولة الحالية — نبني نص "ضد X (أرض/خارج)" لكل نادي
  // + بيانات صعوبة المباراة (FDR) وقوة هجوم/دفاع كل نادي، عشان محرك التوقعات
  // (توقع النقط / كلين شيت / نصايح البيع والشراء) يعتمد عليها بدل ما يخمّن.
  const teamsById = {};
  teams.forEach(t=>{ teamsById[t.id] = t; });

  const fixturesMap = {};
  const teamFixtures = {}; // clubKey -> { oppKey, isHome, fdr, ownDefHome/Away, oppAtkHome/Away, lookahead, avgFdrNext3 }
  var provisionalBonusByElement = {};
  var hasLiveNow = false;
  try{
    // بنجيب كل مباريات الموسم مرة واحدة (فيها cache في البروكسي)، ومنها بنستخرج
    // مباريات الجولة الحالية + "نظرة قدام" على أقرب 3 مباريات جاية لكل نادي —
    // ده بيخلي نصايح البيع والشراء أدق من الاعتماد على مباراة واحدة بس.
    const allFx = (allFxEarly && allFxEarly.length) ? allFxEarly : (await fplFetch('fixtures'));
    const gwFx = (allFx || []).filter(f=>f.event===gwId);

    // بناء بيانات مركز المباريات وتحديد الأندية اللي بتلعب لايف دلوقتي
    parsedFixtures = gwFx.map(f => {
      const hKey = teamIdToKey[f.team_h];
      const aKey = teamIdToKey[f.team_a];

      // لو الماتش شغال ومخلصش، علم إن الفرقتين دول "لايف"
      if (f.started && !f.finished_provisional && !f.finished) {
        if (hKey) liveTeams.add(hKey);
        if (aKey) liveTeams.add(aKey);
      }

      return {
        id: f.id, team_h: hKey, team_a: aKey,
        score_h: f.team_h_score, score_a: f.team_a_score,
        started: f.started, finished: f.finished_provisional || f.finished,
        minutes: f.minutes, kickoff: f.kickoff_time, stats: f.stats
      };
    });

    gwFx.forEach(f=>{
      const hKey = teamIdToKey[f.team_h], aKey = teamIdToKey[f.team_a];
      const hTeam = teamsById[f.team_h], aTeam = teamsById[f.team_a];
      if(hKey && aKey){
        fixturesMap[hKey] = 'ضد ' + (clubTag[aKey]||'') + ' (أرض)';
        fixturesMap[aKey] = 'ضد ' + (clubTag[hKey]||'') + ' (خارج)';
      }
      if(hKey && aKey && hTeam && aTeam){
        teamFixtures[hKey] = {
          oppKey: aKey, isHome: true, fdr: f.team_h_difficulty || 3,
          ownDefHome: hTeam.strength_defence_home, ownDefAway: hTeam.strength_defence_away,
          oppAtkHome: aTeam.strength_attack_home, oppAtkAway: aTeam.strength_attack_away,
        };
        teamFixtures[aKey] = {
          oppKey: hKey, isHome: false, fdr: f.team_a_difficulty || 3,
          ownDefHome: aTeam.strength_defence_home, ownDefAway: aTeam.strength_defence_away,
          oppAtkHome: hTeam.strength_attack_home, oppAtkAway: hTeam.strength_attack_away,
        };
      }
    });

    // بونص لحظي (Provisional Bonus): بنجمع لاعبين كل مباراة لسه شغالة (بدأت ولسه ما خلصتش)
    // ونرتبهم حسب الـ bps تنازلي، ونديهم 3/2/1 زي قاعدة الفانتازي الرسمية —
    // لو فيه تعادل في الـ bps بين لاعبين أو أكتر بياخدوا نفس البونص وبيتخطى الترتيب اللي بعدهم
    // بنبني نسخة خفيفة جدًا من مباريات كل الجولات (للتصفّح بين الجولات في تبويب المباريات).
    // مهم: من غير مصفوفة stats التفصيلية عشان الكاش يفضل صغير وسريع (الإحصائيات التفصيلية
    // بتفضل متاحة للجولة الحالية عبر state.fixturesList، والجولات القديمة بتوري النتيجة والحالة).
    (allFx || []).forEach(f=>{
      const hK = teamIdToKey[f.team_h], aK = teamIdToKey[f.team_a];
      (fixturesByGw[f.event] = fixturesByGw[f.event] || []).push({
        id: f.id, team_h: hK, team_a: aK,
        score_h: f.team_h_score, score_a: f.team_a_score,
        started: f.started, finished: f.finished_provisional || f.finished,
        minutes: f.minutes, kickoff: f.kickoff_time
      });
    });

    var liveFixtureIds = new Set(gwFx.filter(f=>f.started && !f.finished).map(f=>f.id));
    hasLiveNow = liveFixtureIds.size > 0;
    var bpsByFixture = {};
    Object.keys(currentGwBps).forEach(function(elIdStr){
      var info = currentGwBps[elIdStr];
      if(info.fixtureId!=null && liveFixtureIds.has(info.fixtureId)){
        var fxKey = String(info.fixtureId);
        (bpsByFixture[fxKey] = bpsByFixture[fxKey] || []).push({ id: Number(elIdStr), bps: info.bps });
      }
    });
    Object.keys(bpsByFixture).forEach(function(fxKey){
      var list = bpsByFixture[fxKey];
      var distinctBps = Array.from(new Set(list.map(function(x){ return x.bps; }))).sort(function(a,b){ return b-a; });
      var bonusTiers = [3,2,1];
      var rankIdx = 0;
      distinctBps.forEach(function(bpsVal){
        if(rankIdx >= bonusTiers.length || bpsVal<=0) return;
        var tied = list.filter(function(x){ return x.bps===bpsVal; });
        var bonus = bonusTiers[rankIdx];
        tied.forEach(function(pl){ provisionalBonusByElement[pl.id] = bonus; });
        rankIdx += tied.length;
      });
    });
    // ملاحظة: مش بنضيف provisionalBonusByElement فوق cur.pts هنا —
    // total_points الجاي من live/ API أصلاً شامل البونص اللحظي المحسوب رسميًا،
    // فلو ضفناه تاني هنا هيبقى بونص مكرر (مضروب ×2). provisionalBonusByElement
    // فضل موجود بس عشان شارة النجمة (badge) في الواجهة تدي المستخدم إشارة بصرية.

    // نظرة قدام: أقرب 3 مباريات لسه ما اتلعبتش لكل نادي (بتاخد بعضها لو فيه جولة مزدوجة)
    // استخدمنا !f.started بدل !f.finished عشان الماتش يتشال من "القادمة" فور انطلاقه، مش لما يخلص رسميًا
    const upcoming = (allFx || [])
      .filter(f=>!f.started && f.event!=null && f.event>=gwId)
      .sort((a,b)=>a.event-b.event);
    const lookaheadByTeam = {};
    upcoming.forEach(f=>{
      const hKey = teamIdToKey[f.team_h], aKey = teamIdToKey[f.team_a];
      const hTeam = teamsById[f.team_h], aTeam = teamsById[f.team_a];
      // بنسجل قوة الهجوم/الدفاع الفعلية لكل نادي وخصمه مع كل مباراة قادمة (مش بس رقم الـ FDR)
      // عشان احتمال الكلين شيت للمباريات الجاية يتحسب بنفس الدقة اللي بيتحسب بيها لمباراة الجولة الحالية،
      // بدل ما يتحول لتصنيف خشن (سهلة/متوسطة/صعبة) بيدي نفس النسبة لكل الأندية في نفس الفئة.
      if(hKey){ (lookaheadByTeam[hKey]=lookaheadByTeam[hKey]||[]).push({ event:f.event, fdr:f.team_h_difficulty||3, isHome:true, oppKey:aKey,
        ownDefHome: hTeam?hTeam.strength_defence_home:null, ownDefAway: hTeam?hTeam.strength_defence_away:null,
        ownAtkHome: hTeam?hTeam.strength_attack_home:null, ownAtkAway: hTeam?hTeam.strength_attack_away:null,
        oppAtkHome: aTeam?aTeam.strength_attack_home:null, oppAtkAway: aTeam?aTeam.strength_attack_away:null,
        oppDefHome: aTeam?aTeam.strength_defence_home:null, oppDefAway: aTeam?aTeam.strength_defence_away:null }); }
      if(aKey){ (lookaheadByTeam[aKey]=lookaheadByTeam[aKey]||[]).push({ event:f.event, fdr:f.team_a_difficulty||3, isHome:false, oppKey:hKey,
        ownDefHome: aTeam?aTeam.strength_defence_home:null, ownDefAway: aTeam?aTeam.strength_defence_away:null,
        ownAtkHome: aTeam?aTeam.strength_attack_home:null, ownAtkAway: aTeam?aTeam.strength_attack_away:null,
        oppAtkHome: hTeam?hTeam.strength_attack_home:null, oppAtkAway: hTeam?hTeam.strength_attack_away:null,
        oppDefHome: hTeam?hTeam.strength_defence_home:null, oppDefAway: hTeam?hTeam.strength_defence_away:null }); }
    });
    Object.keys(lookaheadByTeam).forEach(key=>{
      // بنخزّن أقرب 5 مباريات (بدل 3) عشان توقعات النقط والانتقالات تحسب على مدى 3-5 جولات
      const list = lookaheadByTeam[key].slice(0,5);
      const first3 = list.slice(0,3);
      const avgFdr = first3.length ? first3.reduce((s,x)=>s+x.fdr,0)/first3.length : 3;
      if(!teamFixtures[key]) teamFixtures[key] = {}; // نادي معندوش مباراة الجولة دي (bye) لسه ممكن يكون عنده نظرة قدام
      teamFixtures[key].lookahead = list;
      teamFixtures[key].avgFdrNext3 = avgFdr;
    });
  }catch(e){}

  const players = elements.map(el=>{
    const club = teamIdToKey[el.team] || 'unk';
    const hist = (historyByElement[el.id]||[]).sort((a,b)=>a.gw-b.gw);
    const matchesPlayed = el.starts || Math.round((el.minutes||0)/90) || 0;
    return {
      id: el.id,
      code: el.code,
      teamCode: el.team_code,
      name: el.web_name,
      club: club,
      pos: POS_MAP[el.element_type] || 'MID',
      price: (el.now_cost||0) / 10,
      num: el.squad_number || '',
      ownership: parseFloat(el.selected_by_percent) || 0,
      priceChange: (el.cost_change_event||0) / 10,
      transfersInEvent: el.transfers_in_event || 0,   // عدد مرات الشراء من بداية الجولة الحالية (مؤشر توقع تغيير السعر)
      transfersOutEvent: el.transfers_out_event || 0, // عدد مرات البيع من بداية الجولة الحالية
      totalPointsReal: el.total_points || 0,
      status: el.status, // a=متاح, i=مصاب, s=موقوف, d=مشكوك فيه
      history: hist,
      provisionalBonus: provisionalBonusByElement[el.id] || 0, // بونص لحظي غير مؤكد لسه (مبني على bps المباراة الجارية)
      // ===== حقول إضافية لمحرك التوقعات (كلها من الـ API الرسمي) =====
      epNext: parseFloat(el.ep_next) || 0,               // توقع FPL الرسمي لنقط الجولة الجاية
      form: parseFloat(el.form) || 0,                     // متوسط نقط آخر جولات (رسمي)
      formWeighted: weightedFormPts(hist),                // فورم موزون: الجولات الأقرب ليها وزن أكبر
      minutes: el.minutes || 0,
      chanceNext: (el.chance_of_playing_next_round==null) ? 100 : el.chance_of_playing_next_round,
      // ===== إحصائيات متقدمة (xG/xA/ICT) عشان توقع النقط يبقى مبني على "استحقاق"
      // اللاعب الفعلي مش بس النتايج اللي حصلت، ده بيقلل أثر الحظ (زي تسديدة اترد من القايم) =====
      xG90: parseFloat(el.expected_goals_per_90) || 0,           // أهداف متوقعة لكل 90 دقيقة
      xA90: parseFloat(el.expected_assists_per_90) || 0,         // أسيستات متوقعة لكل 90 دقيقة
      xGC90: parseFloat(el.expected_goals_conceded_per_90) || 0, // أهداف متوقع استقبالها لكل 90 دقيقة (لمحرك الكلين شيت)
      savesPer90: parseFloat(el.saves_per_90) || 0,
      ictIndex: parseFloat(el.ict_index) || 0,
      pointsPerGame: parseFloat(el.points_per_game) || 0,
      bonusPerMatch: matchesPlayed ? (el.bonus||0) / matchesPlayed : 0,
      // نسبة الجولات اللي اتأسس فيها من بداية الموسم لحد دلوقتي — مؤشر تقريبي لخطر الدوران
      startsFactor: gwId>1 ? Math.min(1, matchesPlayed / (gwId-1)) : (matchesPlayed>0?1:0),
      // لاعب ضربات ثابتة أساسي (بنالتي/فري كيك/كورنر) — بونص إضافي في نصايح الشراء
      setPiece: el.penalties_order===1 ? 'بنالتي أساسي'
               : el.direct_freekicks_order===1 ? 'ضربات حرة'
               : el.corners_and_indirect_freekicks_order===1 ? 'كورنرات'
               : null,
      // بيلعب دلوقتي فعليًا = مباراة فريقه شغالة + هو نازل الملعب (اتأسس أو عنده دقايق already)
      // مش مجرد إن فريقه بيلعب (عشان محدش على الدكة يتحط عليه هايلايت غلط)
      isPlayingLive: liveTeams.has(club) && (currentGwStarted[el.id] || (currentGwMinutes[el.id]||0) > 0),
      gwMinutes: currentGwMinutes[el.id] || 0,
      gwStarted: !!currentGwStarted[el.id],
      // إحصائيات الجولة الحالية اللحظية (بتتقارن بالنسخة اللي قبلها لتوليد إشعارات الأحداث)
      gwGoals: currentGwGoals[el.id] || 0,
      gwAssists: currentGwAssists[el.id] || 0,
      gwYellow: currentGwYellow[el.id] || 0,
      gwRed: currentGwRed[el.id] || 0,
      gwExplain: currentGwExplain[el.id] || [],
      gwExplainByGw: explainByElementGw[el.id] || {}, // تفاصيل النقاط لكل جولة متاحة
    };
  });

  // الجولة الجاية (اللي المستخدم يقدر يعدّل تشكيلتها دلوقتي) = أقرب جولة ديدلاينها لسه
  // في المستقبل فعليًا. بنعتمد على الديدلاين نفسه مش على فلاج is_next، لأن الفلاج ساعات
  // بيبقى مش متظبط وقت ما الجولة الحالية بتتلعب، وساعتها كان بيطلع عداد "مقفول" بالغلط.
  const nowMs = Date.now();
  const upcoming = events
    .filter(e => e.deadline_time && new Date(e.deadline_time).getTime() > nowMs)
    .sort((a,b) => new Date(a.deadline_time).getTime() - new Date(b.deadline_time).getTime())[0] || null;
  const gwInfo = {
    current: gwId,
    deadline: currentEvent ? currentEvent.deadline_time : new Date(Date.now()+86400000).toISOString(),
    // أقرب ديدلاين جاي + رقم جولته (لو مفيش أي ديدلاين جاي = الموسم خلص، بنرجع للحالية+1)
    nextGw: upcoming ? upcoming.id : (gwId + 1),
    nextDeadline: upcoming ? upcoming.deadline_time : null,
    currentFinished: currentEvent ? !!currentEvent.finished : false,
    lastPlayedGw: lastPlayedGw,   // آخر جولة اتلعبت (للتشكيلة المُرحّلة ونقاط آخر جولة)
    fixtures: fixturesMap,
  };

  return { players, gwInfo, clubTag, clubName, clubCode, teamFixtures, totalManagers, live: hasLiveNow, fixturesList: parsedFixtures, fixturesByGw: fixturesByGw };
}

// ===== إشعارات أحداث اللاعبين اللحظية =====
// بتضيف حدث جديد لقايمة state.liveEventNotifs (الأحدث فوق)، وبتحدد سقف 40 عنصر
// عشان القايمة متكبرش من غير داعي على مدار مباريات كتير.
function pushLiveNotif(entry){
  entry.id = 'ev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  entry.ts = Date.now();
  state.liveEventNotifs.unshift(entry);
  if(state.liveEventNotifs.length > 40) state.liveEventNotifs.length = 40;
}

// نقط الهدف حسب المركز (نفس قاعدة فانتازي البريميرليج الرسمية: حراس/مدافعين 6، وسط 5، مهاجمين 4)
const GOAL_PTS_BY_POS = { GK:6, DEF:6, MID:5, FWD:4 };

// بتقارن كل لاعب من تشكيلة اليوزر بآخر نسخة معروفة من إحصائياته (state.lastKnownStats)،
// ولو لقت فرق في الأهداف/الأسيست/الكروت/البونص اللحظي بتولّد إشعار جديد فوري.
// أول مرة (مفيش نسخة قديمة محفوظة للاعب) بنسجّل بس القيم الحالية كخط أساس من غير إشعار،
// عشان مانطلعش إشعارات وهمية لأحداث حصلت قبل ما اليوزر يفتح التطبيق أصلاً.
function diffPlayerStats(newPlayers){
  const squadIds = new Set(state.mySquadIds.map(e => e.id));
  newPlayers.forEach(p=>{
    if(!squadIds.has(p.id)) return;
    const cur = { goals: p.gwGoals||0, assists: p.gwAssists||0, yellow: p.gwYellow||0, red: p.gwRed||0, bonus: p.provisionalBonus||0 };
    const prev = state.lastKnownStats[p.id];
    state.lastKnownStats[p.id] = cur;
    if(!prev) return; // خط أساس بس، من غير إشعار

    if(cur.goals > prev.goals){
      const n = cur.goals - prev.goals;
      const pts = (GOAL_PTS_BY_POS[p.pos]||4) * n;
      pushLiveNotif({
        kind:'goal', color:'#00FF87', icon: ICON_GOAL,
        title: p.name + ' سجل هدف ⚽' + (n>1 ? ' (×'+n+')' : ''),
        sub: 'من تشكيلتك — تقريبًا +' + pts + ' نقطة'
      });
    }
    if(cur.assists > prev.assists){
      const n = cur.assists - prev.assists;
      pushLiveNotif({
        kind:'assist', color:'#8FCBF2', icon: ICON_ASSIST,
        title: p.name + ' صنع هدف 🎯' + (n>1 ? ' (×'+n+')' : ''),
        sub: 'من تشكيلتك — تقريبًا +' + (3*n) + ' نقطة'
      });
    }
    if(cur.yellow > prev.yellow){
      pushLiveNotif({
        kind:'yellow', color:'var(--gold)', icon: '<div class="card-icon yellow"></div>',
        title: p.name + ' حصل على إنذار',
        sub: 'كارت أصفر — -1 نقطة، وخطر الطرد لو اتكرر'
      });
    }
    if(cur.red > prev.red){
      pushLiveNotif({
        kind:'red', color:'var(--coral)', icon: '<div class="card-icon red"></div>',
        title: p.name + ' طرد بالكارت الأحمر',
        sub: '-3 نقاط، وهيأثر على نقط باقي زمايله في المباراة'
      });
    }
    if(cur.bonus > prev.bonus){
      pushLiveNotif({
        kind:'bonus', color:'var(--gold)', icon: ICON_STAR,
        title: p.name + ' يتصدّر ترتيب البونص الآن',
        sub: 'بونص لحظي +' + cur.bonus + ' نقطة (غير مؤكد لحد ما تنتهي المباراة رسمياً)'
      });
    }
  });
}

// بتقارن نتيجة كل مباراة بآخر نسخة معروفة (state.lastKnownScores)، ولو فريق فيه لاعب
// من تشكيلة اليوزر (حارس/مدافع/وسط — المراكز اللي بتستفيد من الكلين شيت) استقبل هدف
// وهو نازل الملعب فعليًا، بتولّد إشعار "تسرب هدف" لأن فرصة الكلين شيت بتاعته راحت.
function diffFixtureScores(newFixturesList){
  const squadIds = new Set(state.mySquadIds.map(e => e.id));
  (newFixturesList||[]).forEach(f=>{
    if(f.score_h==null || f.score_a==null) return;
    const prev = state.lastKnownScores[f.id];
    state.lastKnownScores[f.id] = { h:f.score_h, a:f.score_a };
    if(!prev) return; // خط أساس بس، من غير إشعار

    if(f.score_a > prev.a) notifyConcede(f.team_h, f, squadIds);
    if(f.score_h > prev.h) notifyConcede(f.team_a, f, squadIds);
  });
}
function notifyConcede(clubKey, f, squadIds){
  if(!clubKey) return;
  state.players
    .filter(p => p.club===clubKey && squadIds.has(p.id) && (p.pos==='GK'||p.pos==='DEF'||p.pos==='MID') && (p.isPlayingLive || (p.gwMinutes||0) > 0))
    .forEach(p=>{
      pushLiveNotif({
        kind:'csleak', color:'var(--coral)', icon: ICON_WARN,
        title: 'تسرب هدف لمرمى ' + (CLUB_NAME[clubKey] || CLUB_TAG[clubKey] || ''),
        sub: p.name + ' — النتيجة الآن ' + f.score_h + ' : ' + f.score_a + ' (فرصة الكلين شيت راحت)'
      });
    });
}

async function loadLiveData(force){
  try{
    if(!force){
      const cachedRaw = await sGet(LIVE_CACHE_KEY, true);
      if(cachedRaw){
        const cached = JSON.parse(cachedRaw);
        const ttl = cached.live ? LIVE_CACHE_TTL_ACTIVE : LIVE_CACHE_TTL;
        if(cached.cachedAt && (Date.now() - cached.cachedAt) < ttl){
          applyLiveDataset(cached);
          state.liveSyncedAt = cached.cachedAt;
          state.liveDataError = false; state.liveDataStale = false;
          return;
        }
      }
    }
    const fresh = await buildLiveDataset();
    fresh.cachedAt = Date.now();
    applyLiveDataset(fresh);
    state.liveSyncedAt = fresh.cachedAt;
    state.liveDataError = false; state.liveDataStale = false;
    await sSet(LIVE_CACHE_KEY, JSON.stringify(fresh), true);
  }catch(e){
    // فشل الاتصال — نستخدم آخر نسخة متخزنة لو موجودة، وإلا بيانات احتياطية بسيطة
    const cachedRaw = await sGet(LIVE_CACHE_KEY, true);
    if(cachedRaw){
      const cached = JSON.parse(cachedRaw);
      applyLiveDataset(cached);
      state.liveSyncedAt = cached.cachedAt;
      state.liveDataStale = true;
    } else {
      state.players = SEED_PLAYERS;
      state.gwInfo = SEED_GW;
      CLUB_TAG = FALLBACK_CLUB_TAG;
      CLUB_NAME = FALLBACK_CLUB_NAME;
      state.liveDataError = true;
    }
  }
}
let CLUB_CODE = {};
function applyLiveDataset(d){
  // توليد إشعارات أحداث اللاعبين (جول/أسيست/كارت/بونص) بمقارنة القديم بالجديد،
  // قبل استبدال state.players، عشان القيم الجديدة تبقى واضحة في d.players.
  diffPlayerStats(d.players || []);
  state.players = d.players;
  // إشعار تسرب الأهداف بيحتاج state.players الجديد (عشان isPlayingLive/gwMinutes
  // يعكسوا آخر حالة للاعب وقت الهدف)، فبنستدعيه بعد استبدال بيانات اللاعبين.
  diffFixtureScores(d.fixturesList || []);

  CLUB_NAME = d.clubName;

  state.totalManagers = d.totalManagers || 0;
  state.hasLiveFixtures = d.live || false;
  state.fixturesList = d.fixturesList || [];
  state.fixturesByGw = d.fixturesByGw || {};
}

async function loadGwView(gw){
  const cur = state.gwInfo && state.gwInfo.current;

  state.gwCache[gw] = { loading:true };
  render();

  try{ picks = await fetchFplPicks(state.deviceId, gw); }catch(e){}
  try{ live = await fplFetch('live', gw); }catch(e){}
  const ptsById = {};
  if(live && live.elements){ live.elements.forEach(row=>{ ptsById[row.id] = (row.stats && row.stats.total_points) || 0; }); }
  state.gwCache[gw] = { loading:false, picks: picks, ptsById: ptsById };
  if(activeViewGw() === gw) render();
}

// دالة بتعرف هل ماتش اللاعب بدأ، وبتجيب اختصار اسم الخصم (مثال: BOU (H))
function getPlayerMatchStatus(p) {
  let started = false;
  let isLive = false;
  let fixtureText = '-';

  if (state.fixturesList && state.fixturesList.length) {
    const fx = state.fixturesList.find(f => f.team_h === p.club || f.team_a === p.club);
    if (fx) {
      started = fx.started;
      isLive = fx.started && !fx.finished;
      const isHome = fx.team_h === p.club;
      const opp = isHome ? CLUB_TAG[fx.team_a] : CLUB_TAG[fx.team_h];
      fixtureText = (opp || '؟') + (isHome ? ' (H)' : ' (A)');
    }
  } else {
     if(currentGwPoints(p) > 0 || p.minutes > 0) started = true;
     fixtureText = (state.gwInfo.fixtures[p.club] || '').split(' ')[1] || '-';
     if(!fixtureText.includes('(')) fixtureText += ' (H)';
  }
  return { started, isLive, fixtureText };
}

function nextFixtureText(club){
  const tf = state.teamFixtures && state.teamFixtures[club];
  if(tf && tf.lookahead && tf.lookahead.length){
    // أقرب مباراة جاية فعليًا (lookahead[0]) — مش حسب رقم الجولة، عشان يفضل صح بعد التقدّم للجولة الجاية
    const nf = tf.lookahead[0];
    if(nf){
      const opp = CLUB_TAG[nf.oppKey] || '؟';
      return opp + (nf.isHome ? ' (H)' : ' (A)');
    }
  }
  return '-';
}

// ===== قفل الجولة: لو الديدلاين فات بقى فيه مباريات شغالة/هتشتغل، والتشكيلة الرسمية اتقفلت =====
// أي تعديل (كابتن / تبديل احتياطي / انتقال) في الحالة دي مينفعش يأثر على الجولة الشغالة —
// فبيتسجل كـ"مسودة" للجولة الجاية وبتتطبق تلقائيًا لما الجولة دي توصل.

function plannerGw(){
  const gi = state.gwInfo; if(!gi) return 1;
  return gi.nextGw || gi.current || 1;
}

function plannerDeadline(){
  const gi = state.gwInfo; if(!gi) return null;
  return gi.nextDeadline || gi.deadline || null;
}
function ensureDraftLoaded(){

}

// ===== قواعد الفانتازي الرسمية =====
const MAX_PER_CLUB = 3; // أقصى عدد لاعبين من نفس النادي في التشكيلة كلها (15 لاعب)
// حدود كل مركز في التشكيلة الأساسية (11 لاعب): حارس واحد بالظبط، 3-5 مدافعين، 2-5 وسط، 1-3 مهاجمين
const FORMATION_RULES = { GK:{min:1,max:1}, DEF:{min:3,max:5}, MID:{min:2,max:5}, FWD:{min:1,max:3} };
// حدود كل مركز في الفريق الكامل (15 لاعب: أساسي + احتياطي): بالظبط 2 حراس، 5 مدافعين، 5 وسط، 3 مهاجمين
const SQUAD_POS_LIMITS = { GK:2, DEF:5, MID:5, FWD:3 };
// عدد لاعبين مركز معين في الفريق كله حاليًا (أساسي + احتياطي)، مع إمكانية استبعاد لاعب معين (زي اللي هيتباع)
function squadPosCount(pos, excludeId, ids){
  const list = ids || state.mySquadIds;
  return list.filter(e=>{
    if(excludeId != null && e.id === excludeId) return false;
    const p = findPlayer(e.id);
    return p && p.pos === pos;
  }).length;
}

// عدد لاعبين نادي معين في تشكيلتي حاليًا (مع إمكانية استبعاد لاعب معين، زي اللي هيتباع)
function clubCountInSquad(club, excludeId, ids){
  const list = ids || state.mySquadIds;
  return list.filter(e=>{
    if(excludeId!=null && e.id===excludeId) return false;
    const p = findPlayer(e.id);
    return p && p.club === club;
  }).length;
}

// هل التبديل بين لاعب أساسي (outPos) ولاعب احتياطي (inPos) هيحافظ على تشكيلة قانونية؟
function formationValidAfterSwap(outPos, inPos, ids){
  if(outPos === inPos) return true;
  const counts = { GK:0, DEF:0, MID:0, FWD:0 };
  starters(ids).forEach(p=>{ counts[p.pos] = (counts[p.pos]||0) + 1; });
  counts[outPos] -= 1;
  counts[inPos] = (counts[inPos]||0) + 1;
  return Object.keys(FORMATION_RULES).every(pos=>{
    const r = FORMATION_RULES[pos];
    return counts[pos] >= r.min && counts[pos] <= r.max;
  });
}

// ============================================================
// ===== محرك التوقعات والنصائح =====
// كل الأرقام هنا "تقديرية" مبنية على بيانات فانتازي البريميرليج الرسمية بس:
// - توقع FPL الرسمي لنقط الجولة الجاية "ep_next"
// - فورم موزون (آخر 5 جولات، الأقرب أهم) بدل الفورم العادي
// - نموذج إحصائي مبني على xG/xA لكل 90 دقيقة (استحقاق اللاعب الفعلي مش بس نتايجه)
// - احتمال الكلين شيت من قوة هجوم/دفاع الأندية + xGC (أهداف متوقع استقبالها)
// - صعوبة المباراة الجاية (FDR) + نظرة على متوسط صعوبة أقرب 3 مباريات
// - نسبة الجولات اللي اتأسس فيها اللاعب (خطر الدوران) + لاعبي الضربات الثابتة
// مفيش أي بيانات مدفوعة ولا نموذج ذكاء اصطناعي، كله حسابات مباشرة وشفافة
// وممكن تتراجع أو تتحسّن في أي وقت.
// ============================================================

function teamFixtureInfo(clubKey){
  return (state.teamFixtures && state.teamFixtures[clubKey]) || null;
}

// صعوبة المباراة (FDR من فانتازي الرسمي: 1 سهلة جدًا -> 5 صعبة جدًا) بتتحول لمضاعف نقط
function fdrMultiplier(fdr){
  const map = {1:1.28, 2:1.14, 3:1.0, 4:0.86, 5:0.72};
  return map[fdr] || 1;
}

// احتمالية مشاركة اللاعب أصلاً (مصاب/موقوف/مشكوك فيه/انتقل بره الدوري/مش مسجل الموسم ده)
// أي حالة غير "a" (متاح) أو "d" (مشكوك فيه) بترفض بشكل افتراضي — ده بيغطي حالات زي
// لاعب اتباع لدوري تاني أو مش مسجل في الدوري الموسم ده (status زي "u")، مش بس الإصابة والإيقاف
function availabilityMultiplier(p){
  if(p.status==='a') return 1;
  if(p.status==='d') return Math.max(0.35, (p.chanceNext!=null ? p.chanceNext : 75) / 100);
  return 0; // i, s, u, n أو أي حالة تانية غير معروفة = مش متاح، منستبعده من كل الترشيحات
}

// ============================================================
// ثوابت المعايرة: قيم strength_attack/strength_defence في FPL بتتحرك في نطاق ~1000..1400
// ومتوسطها التقريبي ~1120. متوسط أهداف الفريق في الماتش الواحد في البريميرليج ~1.35.
const STRENGTH_REF = 1120;
const LEAGUE_AVG_GOALS = 1.35;

// كاش متوسط xGC (دفاعي) و xG (هجومي) لكل نادي — بيتصفّر مع كل تحديث بيانات (resetEngineCaches)
let _teamXgcCache = {};
let _teamXgCache = {};
function resetEngineCaches(){ _teamXgcCache = {}; _teamXgCache = {}; }

// متوسط الأهداف المتوقع استقبالها (xGC90) لدفاع النادي — من مدافعينه/حارسه اللي لعبوا فعليًا.
// ده أقوى مؤشر على جودة الدفاع الحقيقية (مش بس تصنيف FPL الثابت). بيرجع null لو مفيش عينة كافية.
function teamAvgXGC(clubKey){
  if(Object.prototype.hasOwnProperty.call(_teamXgcCache, clubKey)) return _teamXgcCache[clubKey];
  const defs = (state.players||[]).filter(p=>p.club===clubKey && (p.pos==='DEF'||p.pos==='GK') && (p.minutes||0)>60 && (p.xGC90||0)>0);
  let val = null;
  if(defs.length){ val = defs.reduce((s,p)=>s+(p.xGC90||0),0)/defs.length; }
  _teamXgcCache[clubKey] = val;
  return val;
}

// متوسط الأهداف المتوقع تسجيلها (xG) لهجوم النادي في الـ90 دقيقة — تقدير قوة هجومه الحقيقية
// من مهاجميه/لاعبي وسطه اللي لعبوا فعليًا. بيرجع null لو العينة صغيرة (بداية موسم).
function teamAvgXG(clubKey){
  if(Object.prototype.hasOwnProperty.call(_teamXgCache, clubKey)) return _teamXgCache[clubKey];
  const atk = (state.players||[]).filter(p=>p.club===clubKey && (p.pos==='MID'||p.pos==='FWD') && (p.minutes||0)>60 && (p.xG90||0)>0);
  let val = null;
  if(atk.length>=3){
    // مجموع xG90 لأعلى 5 مساهمين هجوميًا ≈ الأهداف المتوقعة للفريق في الـ90 دقيقة
    const top = atk.map(p=>p.xG90).sort((a,b)=>b-a).slice(0,5);
    val = top.reduce((s,x)=>s+x,0);
  }
  _teamXgCache[clubKey] = val;
  return val;
}

// ثقة بيانات الـ xG بتكبر مع تقدم الموسم: ~0 في أول 3 جولات (عينة صغيرة → نعتمد على تصنيفات
// القوة الرسمية الثابتة)، وبتوصل 1 حوالي الجولة 9 (عينة كافية → نعتمد على الأداء الفعلي xG/xGC).
// ده بيمنع طفرات العينة الصغيرة من تشويش التوقعات بدري في الموسم.
function xgConfidence(){
  const gw = (state.gwInfo && state.gwInfo.current) || 1;
  return Math.max(0, Math.min(1, (gw - 3) / 6));
}

// λ = الأهداف المتوقع أن يستقبلها النادي في مباراة معيّنة (أساس موديل بواسون للكلين شيت)
// = خط أساس دفاعي (xGC حقيقي أو مشتق من قوة الدفاع الرسمية) × عامل هجوم الخصم × عامل الأرض/الخارج
function expectedConcede(clubKey, fx){
  if(!fx) return LEAGUE_AVG_GOALS;
  const ownDef = fx.isHome ? fx.ownDefHome : fx.ownDefAway;
  const oppAtk = fx.isHome ? fx.oppAtkAway : fx.oppAtkHome;

  let baseXGC = teamAvgXGC(clubKey);
  if(baseXGC==null || !isFinite(baseXGC)){
    // مفيش عينة كفاية (بداية موسم مثلاً) → نشتق خط الأساس من قوة الدفاع الرسمية
    baseXGC = (ownDef && ownDef>0) ? LEAGUE_AVG_GOALS * (STRENGTH_REF/ownDef) : LEAGUE_AVG_GOALS;
  }
  // عامل هجوم الخصم: تصنيف القوة الرسمي (متاح دايمًا) مدموج مع أهداف الخصم المتوقعة الفعلية (xG).
  // كل ما تقدّم الموسم (xgConfidence) كل ما اعتمدنا على الأداء الحقيقي أكتر من التصنيف الثابت.
  let oppFactor = (oppAtk && oppAtk>0) ? (oppAtk/STRENGTH_REF) : 1; // هجوم الخصم نسبةً للمتوسط
  const oppXG = fx.oppKey ? teamAvgXG(fx.oppKey) : null;
  if(oppXG!=null && isFinite(oppXG)){
    const realFactor = oppXG / LEAGUE_AVG_GOALS; // هجوم الخصم الحقيقي نسبةً لمتوسط الدوري
    const c = xgConfidence();
    oppFactor = oppFactor*(1-c) + realFactor*c;
  }
  const haFactor  = fx.isHome ? 0.92 : 1.08;                          // الأرض بتقلل الاستقبال، الخارج بيزوّده
  const lam = baseXGC * oppFactor * haFactor;
  return Math.max(0.15, Math.min(4.0, lam));
}

// احتمال الكلين شيت لمباراة معيّنة = P(صفر أهداف) حسب توزيع بواسون = e^(−λ)
// ده بيكافئ الدفاعات القوية (λ صغيرة → احتمال عالي) ويعاقب الضعيفة بشكل متماثل وواقعي.
function cleanSheetProbFor(clubKey, fx){
  if(!fx) return 0.25;
  return Math.exp(-expectedConcede(clubKey, fx));
}

// (متوافق مع الاسم القديم) احتمال الكلين شيت للاعب في مباراته الجاية
function cleanSheetProbability(p){
  const fx = teamFixtureInfo(p.club);
  const nf = (fx && fx.lookahead && fx.lookahead[0]) ? fx.lookahead[0] : null;
  return cleanSheetProbFor(p.club, nf);
}

// عامل صعوبة الهجوم لمباراة معيّنة: كل ما دفاع الخصم أضعف كل ما زاد العائد الهجومي المتوقع.
// بندمج المشتق من قوة دفاع الخصم (دقيق لكل خصم) مع مضاعف الـ FDR الرسمي (توازن).
function attackMultiplier(fx){
  if(!fx) return 1;
  const oppDef = fx.isHome ? fx.oppDefAway : fx.oppDefHome;
  let m = (oppDef && oppDef>0) ? (STRENGTH_REF/oppDef) : 1;
  // دمج جودة دفاع الخصم الفعلية (xGC): دفاع بيستقبل أهداف كتير → أسهل نسجّل عليه.
  // مدموج بوزن ثقة العينة زي محرك الكلين شيت بالظبط (اتساق كامل بين الهجوم والدفاع).
  const oppXGC = fx.oppKey ? teamAvgXGC(fx.oppKey) : null;
  if(oppXGC!=null && isFinite(oppXGC)){
    const realFactor = oppXGC / LEAGUE_AVG_GOALS;
    const c = xgConfidence();
    m = m*(1-c) + realFactor*c;
  }
  m *= fx.isHome ? 1.05 : 0.95;              // ميزة الأرض للهجوم
  const fm = fdrMultiplier(fx.fdr);
  m = (m*0.6) + (fm*0.4);
  return Math.max(0.6, Math.min(1.5, m));
}

// 🔑 جوهر الدقة: توقع نقاط اللاعب في مباراة واحدة محددة — بيفصل بين:
//   • نقط الظهور: ثابتة، مش بتتأثر بصعوبة الخصم إطلاقًا (الخطأ القديم كان بيضرب FDR في كل النقط)
//   • العائد الهجومي (xG/xA): بيتأثر بصعوبة الهجوم للمباراة دي بالذات
//   • الكلين شيت: احتمال بواسون حقيقي للمباراة دي + خصم متوقع للأهداف + نقط التصديات للحارس
function fixtureExpectedPoints(p, fx){
  const minFactor = (p.startsFactor!=null && p.startsFactor>0) ? p.startsFactor : ((p.minutes||0)>0 ? 0.6 : 0);
  if(minFactor<=0) return 0;

  const posGoalPts = {GK:6,DEF:6,MID:5,FWD:4}[p.pos] || 4;
  const posCSPts   = {GK:4,DEF:4,MID:1,FWD:0}[p.pos] || 0;

  const appearancePts = minFactor * 2; // نقط الظهور (لحد نقطتين للأساسي) — مستقلة عن الخصم

  // العائد الهجومي: xG/xA مقيّدين لتفادي طفرات العينة الصغيرة، × صعوبة هجوم المباراة
  const atkMul = attackMultiplier(fx);
  const safeXG90 = Math.min(p.xG90 || 0, 1.1);
  const safeXA90 = Math.min(p.xA90 || 0, 0.8);
  const goalPts   = safeXG90 * minFactor * posGoalPts * atkMul;
  const assistPts = safeXA90 * minFactor * 3 * atkMul;

  // الكلين شيت + خصم الأهداف (للحارس/المدافع) + التصديات (للحارس)
  let csPts = 0, concedePts = 0, savePts = 0;
  const isDefender = (p.pos==='GK' || p.pos==='DEF');
  if(posCSPts>0 || isDefender){
    const lam = fx ? expectedConcede(p.club, fx) : LEAGUE_AVG_GOALS;
    const csProb = Math.exp(-lam);
    csPts = csProb * posCSPts * minFactor;
    if(isDefender){
      // قاعدة FPL: −1 لكل هدفين. تقدير مبسّط للخصم المتوقع من λ
      concedePts = -Math.max(0, (lam-0.5)) * 0.35 * minFactor;
    }
  }
  if(p.pos==='GK'){ savePts = ((p.savesPer90||0)/3) * minFactor; } // نقطة لكل 3 تصديات

  const bonusPts = (p.bonusPerMatch||0) * minFactor * (0.5 + 0.5*atkMul);
  return appearancePts + goalPts + assistPts + csPts + concedePts + savePts + bonusPts;
}

// خط أساس مبني على فئة اللاعب (سعره/ملكيته) — مرساة بتمنع طفرات الجولة الواحدة من تضليل التوقع
function classBaseline(p){
  const posFloor = {GK:4.0, DEF:4.0, MID:4.5, FWD:4.5}[p.pos] || 4.0;
  return 1.5 + (Math.max(0, p.price - posFloor) * 0.8) + (Math.min(p.ownership||0, 40) * 0.05);
}

// توقع نقاط اللاعب لمباراة واحدة مع الدمج الذكي (توقع FPL الرسمي + الإحصائي + الفورم + الفئة).
// isImmediate=true للجولة الجاية (فيها ep_next وتأثير السوق)، false للجولات الأبعد في الأفق.
function blendedFixturePoints(p, fx, isImmediate){
  const stat = fixtureExpectedPoints(p, fx);
  const cls  = classBaseline(p);
  const isEarlySeason = state.gwInfo && state.gwInfo.current <= 3;

  let base;
  if(isImmediate){
    if(isEarlySeason){
      base = (p.epNext && p.epNext>0) ? (cls*0.35) + (p.epNext*0.45) + (stat*0.20)
                                      : (cls*0.6) + (stat*0.4);
    } else if(p.epNext && p.epNext>0 && p.formWeighted>0){
      base = (p.epNext*0.35) + (stat*0.40) + (p.formWeighted*0.25);
    } else if(p.epNext && p.epNext>0){
      base = (p.epNext*0.45) + (stat*0.55);
    } else if(p.formWeighted>0){
      base = (p.formWeighted*0.45) + (stat*0.55);
    } else {
      base = stat>0 ? stat : cls;
    }
    // تأثير السوق (حكمة الجمهور) — إشارة قصيرة المدى للجولة الجاية بس، بوزن مخفّض (كان مبالغ فيه قبل كده)
    const net = (p.transfersInEvent||0) - (p.transfersOutEvent||0);
    let marketBonus = 0;
    if(net!==0) marketBonus = Math.max(-1.2, Math.min(1.2, (net/40000) * 0.25));
    if(isEarlySeason) marketBonus *= 1.3;
    base += marketBonus;
  } else {
    // جولات أبعد: مفيش ep_next مخصص ليها → الإحصائي هو الأساس، مع مرساة فئة بصعوبة الجولة دي
    const fxAtk = fx ? attackMultiplier(fx) : 1;
    if(isEarlySeason){
      base = ((cls*0.55) + (stat*0.45)) * (0.7 + 0.3*fxAtk);
    } else if(p.formWeighted>0){
      base = (stat*0.6) + (p.formWeighted*0.4*fxAtk);
    } else {
      base = stat>0 ? stat : (cls*0.5*fxAtk);
    }
  }

  base = Math.max(0.5, base);
  const avail = availabilityMultiplier(p);
  return Math.max(0, base * avail);
}

// توقع نقاط اللاعب في الجولة الجاية (مباراة واحدة) — بيستخدمه الكابتن والتشكيل والدريم تيم والسوق.
// بيعتمد على المحرك الجديد اللي بيفصل نقط الظهور عن العائد الهجومي (مش بيضرب FDR في كل النقط زي قبل).
function predictedPoints(p){
  if(availabilityMultiplier(p) === 0) return 0;
  const fx = teamFixtureInfo(p.club);
  const look = (fx && fx.lookahead) ? fx.lookahead : [];
  const nextGw = state.gwInfo && state.gwInfo.nextGw;
  // مباريات النادي في الجولة الجاية بالذات (بتبقى 2+ في الجولة المزدوجة DGW)
  const dgw = (nextGw!=null) ? look.filter(f=>f.event===nextGw) : [];
  if(dgw.length >= 2){
    // جولة مزدوجة: المباراة الأولى بالدمج الكامل (فيها ep_next اللي بيغطي الجولة)، والباقي
    // بالإحصائي فقط — عشان مانكررش تأثير ep_next على كل مباراة فيطلع الرقم منفوخ.
    const avail = availabilityMultiplier(p);
    let pts = blendedFixturePoints(p, dgw[0], true);
    for(let i=1;i<dgw.length;i++){ pts += Math.max(0, fixtureExpectedPoints(p, dgw[i]) * avail); }
    return Math.max(0, Math.round(pts * 10) / 10);
  }
  // الوضع العادي (مباراة واحدة) — أو fallback لو حقل الجولة مش متوفر
  const nextFix = look[0] || null;
  const pts = blendedFixturePoints(p, nextFix, true);
  return Math.max(0, Math.round(pts * 10) / 10);
}

// 🔭 توقع مجموع النقاط على أقرب N جولات (افتراضي 5) — أساس نصايح الانتقال واللاعبين الأعلى توقعًا.
// بيجمع توقع كل مباراة قادمة (الجولة الجاية بالدمج الكامل، والأبعد بالإحصائي + الفورم)، فبيدي
// صورة أدق بكتير من مباراة واحدة: لاعب بمباراة صعبة الجولة دي بس رن سهل بعدها ماينفعش يتشال.
function projectedPointsHorizon(p, n){
  if(availabilityMultiplier(p) === 0) return { total:0, perGw:0, count:0 };
  const fx = teamFixtureInfo(p.club);
  const list = (fx && fx.lookahead) ? fx.lookahead.slice(0, n||5) : [];
  if(!list.length){
    const one = predictedPoints(p);
    return { total: one, perGw: one, count: 1 };
  }
  let total = 0;
  list.forEach((f, i)=>{ total += blendedFixturePoints(p, f, i===0); });
  total = Math.round(total*10)/10;
  return { total, perGw: Math.round((total/list.length)*10)/10, count: list.length };
}

// ترتيب الكلين شيت بموديل بواسون: احتمال الجولة الجاية = e^(−λ)، والترتيب بيدمج الجولة الجاية
// مع متوسط أقرب 3 مباريات (عشان الفرق اللي عندها رن سهل أو جولة مزدوجة تطلع فوق).
function cleanSheetRanking(){
  return Object.keys(CLUB_TAG).map(key=>{
    const fxInfo = state.teamFixtures[key];
    if(!fxInfo || !fxInfo.lookahead || !fxInfo.lookahead.length) return null;
    const nextFix = fxInfo.lookahead[0];
    const nextProb = cleanSheetProbFor(key, nextFix);                 // 0..1 لأقرب مباراة
    const next3 = fxInfo.lookahead.slice(0,3);
    const avg3 = next3.reduce((s,f)=>s+cleanSheetProbFor(key,f),0)/next3.length; // متوسط الرن
    const rankScore = (nextProb*0.65) + (avg3*0.35);
    return {
      club: key,
      prob: Math.max(2, Math.min(85, Math.round(nextProb*100))),
      avg3: Math.round(avg3*100),
      rankScore: rankScore,
      fx: nextFix
    };
  }).filter(Boolean).sort((a,b)=>b.rankScore-a.rankScore);
}

// 🟢 بترجع الفرق (بدل الحارس) الأعلى احتمالاً للكلين شيت
function topCleanSheetTeams(limit){
  return cleanSheetRanking().slice(0, limit||8);
}

// اللاعبون الأعلى توقعاً — على مدى أقرب 5 جولات (مش مباراة واحدة)، عشان الترشيح يبقى قرار
// انتقال حقيقي مش لمعة جولة. بنرتب بالمجموع الكلي، ونستبعد الرخاص جدًا (< £5.0) اللي تألقوا صدفة.
function inFormRanking(limit){
  return state.players.filter(p => availabilityMultiplier(p) > 0 && p.price >= 5.0)
    .map(p => { const h = projectedPointsHorizon(p, 5); return { p, score: h.perGw, total: h.total, count: h.count }; })
    .filter(x => x.score > 3.0)
    .sort((a,b) => b.total - a.total)
    .slice(0, limit || 10);
}

// 🔁 أفضل مقترحات الانتقال — بتقارن الإسقاط على 5 جولات: لكل لاعب في تشكيلتك بندوّر على أفضل
// بديل في نفس المركز داخل الميزانية (البنك + سعر البيع) وبيحترم حد 3 لاعبين لكل نادي، ونرتب
// بمكسب النقط المتوقع على المدى. ده أشمل بكتير من الطريقة القديمة اللي كانت بتشترط "سببين".
function bestTransferSuggestions(horizon){
  const N = horizon || 5;
  const owned = new Set(state.mySquadIds.map(e=>e.id));
  const byPos = { GK:[], DEF:[], MID:[], FWD:[] };
  pool().forEach(p=>{
    if(availabilityMultiplier(p) <= 0) return;
    if(owned.has(p.id)) return;
    if(!byPos[p.pos]) return;
    byPos[p.pos].push(p);
  });
  Object.keys(byPos).forEach(k=>{
    byPos[k].forEach(p=>{ p._proj = projectedPointsHorizon(p, N).total; });
    byPos[k].sort((a,b)=>b._proj - a._proj);
  });

  const suggestions = [];
  squad().forEach(sellP=>{
    const sellProj = projectedPointsHorizon(sellP, N).total;
    const budget = (state.bank||0) + sellP.price;
    const list = byPos[sellP.pos] || [];
    let bestBuy = null, bestGain = 0;
    for(let i=0;i<list.length;i++){
      const b = list[i];
      if(b.price > budget) continue;
      if(b.club !== sellP.club && clubCountInSquad(b.club, sellP.id) >= MAX_PER_CLUB) continue;
      const gain = b._proj - sellProj;
      if(gain > bestGain){ bestGain = gain; bestBuy = b; }
    }
    if(bestBuy && bestGain > 0.5){
      suggestions.push({ sellP: sellP, buyP: bestBuy, diff: Math.round(bestGain*10)/10, horizon: N });
    }
  });

  // نتفادى ترشيح نفس لاعب البيع أو الشراء أكتر من مرة
  suggestions.sort((a,b)=>b.diff-a.diff);
  const usedBuy = new Set(), usedSell = new Set(), out = [];
  for(const s of suggestions){
    if(usedBuy.has(s.buyP.id) || usedSell.has(s.sellP.id)) continue;
    usedBuy.add(s.buyP.id); usedSell.add(s.sellP.id);
    out.push(s);
    if(out.length >= 3) break;
  }
  return out;
}

// نصايح البيع: لو لاعب غالي ومتوقع يجيب نقط قليلة هيرشحلك تبيعه فوراً
function sellAdvice(){
  return squad().map(p=>{
    const reasons = [];
    let score = predictedPoints(p);
    
    if(p.status==='i'){ reasons.push('مصاب'); score -= 5; }
    else if(p.status==='s'){ reasons.push('موقوف'); score -= 5; }
    else if(p.status==='d'){ reasons.push('مشكوك في مشاركته'); score -= 1.5; }
    
    const fx = teamFixtureInfo(p.club);
    const nextFix = (fx && fx.lookahead && fx.lookahead[0]) ? fx.lookahead[0] : null;
    if(nextFix && nextFix.fdr >= 4){ reasons.push('مباراة صعبة الجولة القادمة'); score -= 0.8; }
    
    if(score < 3.5 && p.price >= 5.5){ reasons.push('توقع نقاط ضعيف مقارنة بسعره'); score -= 1.5; }
    if(p.priceChange < 0){ reasons.push('مؤشر هبوط سعره'); }
    
    return { p, score, reasons };
  }).filter(x=>x.reasons.length>0).sort((a,b)=>a.score-b.score).slice(0,5);
}

// نصايح الشراء: متجاوبة مع التريندات
function buyAdvice(){
  return pool().filter(p=>availabilityMultiplier(p)>0)
    .map(p=>{
      const reasons = [];
      const pred = predictedPoints(p);
      const fx = teamFixtureInfo(p.club);
      const nextFix = (fx && fx.lookahead && fx.lookahead[0]) ? fx.lookahead[0] : null;
      
      if(nextFix && nextFix.fdr <= 2) reasons.push('مباراة سهلة الجولة القادمة');
      if(pred >= 4.8) reasons.push('توقع نقاط ممتاز الجولة القادمة');
      if(p.priceChange > 0) reasons.push('مؤشر صعود سعره');
      
      const netTransfers = (p.transfersInEvent || 0) - (p.transfersOutEvent || 0);
      if(netTransfers > 30000) reasons.push('الأكثر شراءً حالياً (تريند السوق)');
      
      return { p, pred, reasons };
    })
    .filter(x=>x.reasons.length >= 2) // لازم سببين عشان يبقى ترشيح قوي
    .sort((a,b)=>b.pred-a.pred)
    .slice(0,8);
}

// توقع مجموع نقاط التشكيلة الأساسية (بمضاعفة الكابتن)
function predictedSquadPoints(){
  const c = captain();
  const isCapStarting = c && state.mySquadIds.find(e=>e.id===c.id && e.slot==='start');
  const base = starters().reduce((s,p)=>s+predictedPoints(p),0);
  const extra = isCapStarting ? predictedPoints(c) : 0;
  return Math.round((base+extra)*10)/10;
}

// متوسط نسبة ملكية لاعبين تشكيلتك الـ15 (مؤشر تقريبي — مش effective ownership)
function squadOwnershipAvg(){
  const s = squad();
  if(!s.length) return 0;
  return Math.round((s.reduce((sum,p)=>sum+p.ownership,0)/s.length)*10)/10;
}

// الأعلى نسبة ملكية بين كل المديرين
function ownershipRanking(limit){
  return state.players.slice().sort((a,b)=>b.ownership-a.ownership).slice(0, limit||10);
}

// ===== مؤشر توقع تغيير الأسعار (تقديري) =====
// بيعتمد على صافي التحويلات (شراء - بيع) من بداية الجولة الحالية، مقسومة على عدد
// مديري الفانتازي المالكين للاعب حاليًا — كل ما زادت النسبة دي كل ما زاد احتمال
// ارتفاع/انخفاض سعر اللاعب في التحديث القادم من فانتازي البريميرليج.
// ده مش رقم رسمي من فانتازي (الخوارزمية الحقيقية مش معلنة)، لكنه أقرب تقدير ممكن.
function netTransfers(p){ return (p.transfersInEvent||0) - (p.transfersOutEvent||0); }

function priceMoveScore(p){
  const owners = Math.max(1, Math.round((p.ownership/100) * (state.totalManagers||0)));
  const net = netTransfers(p);
  return { net, owners, ratio: net / owners };
}

function priceRisers(limit){
  return state.players
    .map(p=>({ p: p, net: priceMoveScore(p).net, owners: priceMoveScore(p).owners, ratio: priceMoveScore(p).ratio }))
    .filter(x=>x.net > 0)
    .sort((a,b)=>b.ratio - a.ratio || b.net - a.net)
    .slice(0, limit||10);
}

function priceFallers(limit){
  return state.players
    .map(p=>({ p: p, net: priceMoveScore(p).net, owners: priceMoveScore(p).owners, ratio: priceMoveScore(p).ratio }))
    .filter(x=>x.net < 0)
    .sort((a,b)=>a.ratio - b.ratio || a.net - b.net)
    .slice(0, limit||10);
}

// ===== تريندات السوق: أكثر اللاعبين شراءً وبيعاً هذه الجولة (خام، بدون حساب نسبة الملكية) =====
function topTransfersIn(limit){
  return state.players
    .filter(p=>(p.transfersInEvent||0) > 0)
    .slice()
    .sort((a,b)=>(b.transfersInEvent||0) - (a.transfersInEvent||0))
    .slice(0, limit||3);
}

function topTransfersOut(limit){
  return state.players
    .filter(p=>(p.transfersOutEvent||0) > 0)
    .slice()
    .sort((a,b)=>(b.transfersOutEvent||0) - (a.transfersOutEvent||0))
    .slice(0, limit||3);
}

// ===== الدريم تيم: أفضل 11 لاعب ممكنين للجولة الجاية من كل قاعدة اللاعبين =====
// (من غير أي تقيد بالميزانية — الهدف إنها تكون أداة استرشادية قبل قفل الجولة، مش تشكيلة رسمية)
function dreamTeamXI(){
  // التحقق: هل الجولة بدأت وفيه أي لاعب جاب نقط فعلية؟
  const isStarted = new Date(state.gwInfo.deadline).getTime() < Date.now();
  const hasLivePoints = state.players.some(p => currentGwPoints(p) > 0);
  const useLive = isStarted && hasLivePoints;

  const byPos = { GK:[], DEF:[], MID:[], FWD:[] };
  state.players.forEach(p=>{
    // لو بنحسب توقعات نستبعد المصابين، لكن في اللايف اللي جاب نقطة يدخل حتى لو كان مصاب
    if(!useLive && availabilityMultiplier(p) <= 0) return;

    const score = useLive ? currentGwPoints(p) : predictedPoints(p);
    if(score <= 0) return;

    if(!byPos[p.pos]) return;
    byPos[p.pos].push({ p:p, score:score });
  });

  // ترتيب اللاعبين داخل كل مركز (في حالة التعادل في النقط، الأرخص بيكسب)
  Object.keys(byPos).forEach(k => {
    byPos[k].sort((a,b) => b.score - a.score || a.p.price - b.p.price);
  });

  if(byPos.GK.length<1) return null;

  let best = null;
  for(let def=FORMATION_RULES.DEF.min; def<=FORMATION_RULES.DEF.max; def++){
    for(let mid=FORMATION_RULES.MID.min; mid<=FORMATION_RULES.MID.max; mid++){
      const fwd = 10 - def - mid;
      if(fwd < FORMATION_RULES.FWD.min || fwd > FORMATION_RULES.FWD.max) continue;
      if(byPos.DEF.length<def || byPos.MID.length<mid || byPos.FWD.length<fwd) continue;

      const picks = [].concat(byPos.GK.slice(0,1), byPos.DEF.slice(0,def), byPos.MID.slice(0,mid), byPos.FWD.slice(0,fwd));
      const total = picks.reduce((s,x)=>s+x.score, 0);

      if(!best || total > best.total){
        best = { total:total, picks:picks, formation: def+'-'+mid+'-'+fwd };
      }
    }
  }
  if(!best) return null;

  const capEntry = best.picks.slice().sort((a,b)=>b.score-a.score)[0];
  const scoreById = {};
  best.picks.forEach(x=>{ scoreById[x.p.id] = x.score; });

  // الكابتن بياخد النقط دبل
  const finalTotal = best.total + (capEntry ? capEntry.score : 0);

  return {
    xi: best.picks.map(x=>x.p),
    formation: best.formation,
    total: useLive ? finalTotal : Math.round(finalTotal*10)/10,
    captainId: capEntry ? capEntry.p.id : null,
    scoreById: scoreById,
    useLive: useLive // متغير بيفهم الواجهة إحنا لايف ولا توقعات
  };
}

// ===== كشف حساب الذكاء الاصطناعي (التشكيلة المتوقعة بنقاط لايف) =====
function aiEvaluationTeam(){
  const byPos = { GK:[], DEF:[], MID:[], FWD:[] };
  state.players.forEach(p=>{
    // بنختار بناءً على التوقع قبل الماتش عشان نثبت التشكيلة
    const predScore = predictedPoints(p);
    if(predScore <= 0 || availabilityMultiplier(p) <= 0) return;
    if(!byPos[p.pos]) return;
    byPos[p.pos].push({ p:p, pred:predScore });
  });

  Object.keys(byPos).forEach(k => {
    byPos[k].sort((a,b) => b.pred - a.pred || a.p.price - b.p.price);
  });

  if(byPos.GK.length<1) return null;

  let best = null;
  for(let def=FORMATION_RULES.DEF.min; def<=FORMATION_RULES.DEF.max; def++){
    for(let mid=FORMATION_RULES.MID.min; mid<=FORMATION_RULES.MID.max; mid++){
      const fwd = 10 - def - mid;
      if(fwd < FORMATION_RULES.FWD.min || fwd > FORMATION_RULES.FWD.max) continue;
      if(byPos.DEF.length<def || byPos.MID.length<mid || byPos.FWD.length<fwd) continue;

      const picks = [].concat(byPos.GK.slice(0,1), byPos.DEF.slice(0,def), byPos.MID.slice(0,mid), byPos.FWD.slice(0,fwd));
      const totalPred = picks.reduce((s,x)=>s+x.pred, 0);

      if(!best || totalPred > best.totalPred){
        best = { totalPred:totalPred, picks:picks, formation: def+'-'+mid+'-'+fwd };
      }
    }
  }
  if(!best) return null;

  // الكابتن هو أعلى واحد في التوقع
  const capEntry = best.picks.slice().sort((a,b)=>b.pred-a.pred)[0];

  const isStarted = new Date(state.gwInfo.deadline).getTime() < Date.now();
  const hasLivePoints = state.players.some(p => currentGwPoints(p) > 0);
  const isLive = isStarted && hasLivePoints;

  let actualTotal = 0;
  const scoreById = {};

  best.picks.forEach(x => {
    // النقط المعروضة: لو لايف نجيب النقط الحقيقية، لو لسه يبقى التوقع
    let pts = isLive ? currentGwPoints(x.p) : x.pred;
    if (capEntry && x.p.id === capEntry.p.id) pts *= 2;
    scoreById[x.p.id] = pts;
    actualTotal += pts;
  });

  return {
    xi: best.picks.map(x=>x.p),
    formation: best.formation,
    total: isLive ? actualTotal : Math.round(actualTotal*10)/10,
    captainId: capEntry ? capEntry.p.id : null,
    scoreById: scoreById,
    isLive: isLive
  };
}

// اسم الشيب بالعربي (أو null لو مفيش شيب مُفعّل)
function chipLabel(chip){
  return { '3xc':'تريبل كابتن', 'bboost':'بنش بوست', 'wildcard':'وايلد كارد', 'freehit':'فري هيت', 'manager':'المدير المساعد' }[chip] || null;
}
function chipBadgeHtml(){
  const lbl = chipLabel(state.activeChip);
  return lbl ? '<div class="chip-badge"><span class="dot"></span>شيب مُفعّل هذه الجولة: ' + lbl + '</div>' : '';
}
function roundPoints(){
  const tripleCap  = state.activeChip === '3xc';    // الكابتن ×3 بدل ×2
  const benchBoost = state.activeChip === 'bboost';  // نقط الاحتياطي بتتحسب كمان
  // بنش بوست: كل الـ15 لاعب بيحتسبوا؛ غير كده الأساسيين بس
  const scoring = benchBoost ? squad() : starters();
  const base = scoring.reduce((s,p)=>s+currentGwPoints(p),0);
  const c = captain();
  const isCapStarting = c && state.mySquadIds.find(e=>e.id===c.id && e.slot==='start');
  // الكابتن أصلاً محتسب مرة في base؛ بنضيفله مرة (×2 عادي) أو مرتين (×3 تريبل كابتن)
  const extra = isCapStarting ? currentGwPoints(c) * (tripleCap ? 2 : 1) : 0;
  return base + extra;
}
// نقط الجولة المعروضة (تاريخية) — مجموع الأساسيين + الكابتن مرة زيادة، بدون أي شيب
// (الشيب بتاع الجولة الحالية مش بيتطبّق على جولة فاتت).
function viewGwPoints(){
  const base = starters().reduce((s,p)=>s+currentGwPoints(p),0);
  const c = captain();
  const capStart = c && state.mySquadIds.find(e=>e.id===c.id && e.slot==='start');
  return base + (capStart ? currentGwPoints(c) : 0);
}
function squadValue(ids){ return squad(ids).reduce((s,p)=>s+p.price,0); }

}

// ===== persistence =====
async function savePersonal(){
  await sSet('mazareta_squad:'+state.deviceId, JSON.stringify({
    mySquadIds:state.mySquadIds, captainId:state.captainId, bank:state.bank,
    freeTransfers:state.freeTransfers, seasonBaseline:state.seasonBaseline,
    squadGw: state.gwInfo && state.gwInfo.current // الجولة اللي التشكيلة دي خاصة بيها
  }), false);
  pushPublicEntry();
}
async function pushPublicEntry(){
  await sSet('public_entry:'+state.deviceId, JSON.stringify({
    managerName:state.managerName, teamName:state.teamName,
    total:seasonTotal(), gw:roundPoints(), updatedAt:Date.now()
  }), true);
}
async function saveManager(){
  // state.deviceId now holds the user's FPL Team ID, so this row (and its key)
  // is effectively keyed on fpl_team_id — matching the managers table's new primary key
  await sSet('mazareta_manager:'+state.deviceId, JSON.stringify({
    deviceId:state.deviceId, fplTeamId:state.deviceId,
    managerName:state.managerName, teamName:state.teamName
  }), false);
}
// ===== boot =====
async function boot(){
  state.phase = 'boot';
  render();
  try{
    await loadLiveData();
    try{
      const linksRaw = await sGet('mazareta_admin_links', true);
      if(linksRaw) state.adminLinks = JSON.parse(linksRaw);
    }catch(e){}

    // if this browser already has an FPL Team ID saved, skip onboarding and go
    // straight into the app; otherwise show the onboarding screen to collect it
    const savedFplId = getLocalDeviceId();
    if(!savedFplId){
      state.phase = 'onboard';
      render();
      return;
    }

    state.deviceId = savedFplId;
    let raw = await sGet('mazareta_manager:'+state.deviceId, false);
    if(raw){
      const m = JSON.parse(raw);
      state.managerName = m.managerName; state.teamName = m.teamName;
    }

    // نجيب بيانات المدير الحقيقية من FPL — ده مصدرنا الوحيد للترتيب العام والدوريات
    const entry = await fetchFplEntry(savedFplId);
    if(entry && !entry.error){
      if(!raw){ state.managerName = entry.managerName; state.teamName = entry.teamName; await saveManager(); }
      state.overallRank = entry.overallRank;
      state.eventRank = entry.eventRank;
      state.eventPoints = entry.eventPoints;
      state.overallPoints = entry.overallPoints;
      state.realLeagues = entry.leagues;
    } else if(!raw){
      state.managerName = 'مدير ' + savedFplId;
      state.teamName = 'فريق ' + savedFplId;
      await saveManager();
    }

    await loadSquadOrDraft();
    state.phase = 'app';
    render();
  } catch(e){
    state.bootError = 'حصل خطأ في تحميل البيانات. حاول تاني.';
    render();
  }
}

// لو فيه مسودة تعديلات محفوظة (كابتن/تبديل/انتقال اتعمل وقت الجولة كانت شغالة):
// - لو الجولة اللي كانت المسودة مستنياها وصلت (أو فاتت)، نطبقها كتشكيلة رسمية دلوقتي ونمسحها.
// - غير كده (لسه بدري)، نسيبها محمّلة في state.draft* عشان المستخدم يكمّل يعدّل فيها.
async function syncDraftForGw(gw){
  try{
    const raw = await sGet('mazareta_squad_next:'+state.deviceId, false);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || !d.draftForGw) return;
    if(d.draftForGw <= gw){
      state.mySquadIds = d.mySquadIds;
      state.captainId = d.captainId;
      if(typeof d.bank === 'number') state.bank = d.bank;
      if(d.freeTransfers != null) state.freeTransfers = d.freeTransfers;
      await savePersonal();
      await sDelete('mazareta_squad_next:'+state.deviceId);
      state.draftSquadIds = null; state.draftCaptainId = null; state.draftBank = null;
      state.draftFreeTransfers = null; state.draftForGw = null;
    } else {
      state.draftSquadIds = d.mySquadIds;
      state.draftCaptainId = d.captainId;
      state.draftBank = d.bank;
      state.draftFreeTransfers = d.freeTransfers;
      state.draftForGw = d.draftForGw;
    }
  }catch(e){}
}

async function loadSquadOrDraft(){
  const gw = state.gwInfo && state.gwInfo.current;
  const isStarted = new Date(state.gwInfo.deadline).getTime() < Date.now();

  // لو الجولة المركزية لسه مبدأتش (اتقدّمنا للجولة الجاية بعد ما اللي قبلها خلصت)، نجيب
  // تشكيلة آخر جولة اتلعبت كأساس "مُرحّل" — لأن الفانتازي لسه ما عندهاش تشكيلة للجولة الجاية.
  const lastPlayed = state.gwInfo && state.gwInfo.lastPlayedGw;
  const picksGw = (!isStarted && lastPlayed && lastPlayed < gw) ? lastPlayed : gw;
  const carriedForward = (picksGw !== gw);

  // ١. الأولوية المطلقة: محاولة جلب التشكيلة الرسمية من سيرفر الفانتازي
  // (لو الديدلاين قفل، الفانتازي هيرجع الداتا الحقيقية وهنمسح بيها التشكيلة التجريبية)
  try{
    const picks = state.deviceId ? await fetchFplPicks(state.deviceId, picksGw) : null;
    if(picks && picks.squadIds && picks.squadIds.length){
      state.mySquadIds = picks.squadIds;
      state.captainId = picks.captainId;
      state.bank = picks.bank;
      // الشيب بتاع الجولة اللي جبناها — بس لو دي نفس الجولة المركزية (مش تشكيلة مُرحّلة لجولة جاية)
      state.activeChip = carriedForward ? null : (picks.activeChip || null);

      // تحديد التبديلات بذكاء (غير محدود قبل بداية الموسم، و 1 بعد البداية)
      state.freeTransfers = (gw === 1 && !isStarted) ? 'غير محدود' : 1;

      state.seasonBaseline = 0;

      // حفظ التشكيلة الرسمية في التخزين المحلي عشان نكتب فوق التشكيلة التجريبية
      await savePersonal();
      await syncDraftForGw(gw);
      return;
    }
  }catch(e){
    // الجولة لسه مقفلتش (الفانتازي مخبي التشكيلة) أو مفيش إنترنت
  }

  // ٢. لو الفانتازي لسه مخبي التشكيلة: نعرض التشكيلة التجريبية اللي اليوزر عاملها جوه الأبلكيشن
  try{
    const savedRaw = await sGet('mazareta_squad:'+state.deviceId, false);
    if(savedRaw){
      const saved = JSON.parse(savedRaw);
      if(saved && saved.mySquadIds && saved.mySquadIds.length && saved.squadGw === gw){
        state.mySquadIds = saved.mySquadIds;
        state.captainId = saved.captainId;
        state.bank = typeof saved.bank === 'number' ? saved.bank : 100;
        state.activeChip = null; // التشكيلة التجريبية مفيهاش شيب رسمي

        state.freeTransfers = (gw === 1 && !isStarted) ? 'غير محدود' : 1;

        state.seasonBaseline = saved.seasonBaseline || 0;
        await syncDraftForGw(gw);
        return;
      }
    }
  }catch(e){}

  // ٣. لو مفيش داتا خالص: نبدأ بتشكيلة فاضية
  state.mySquadIds = [];
  state.captainId = null;
  state.bank = 100;
  state.activeChip = null;
  state.freeTransfers = (gw === 1 && !isStarted) ? 'غير محدود' : 1;
  state.seasonBaseline = 0;
  await savePersonal();
  await syncDraftForGw(gw);
}

async function refreshLiveData(){
  state.refreshing = true; render();
  await loadLiveData(true);
  ensureLeagues(true); // نحدّث الدوريات كمان مع التحديث اليدوي (من غير ما نستنّاها)
  state.refreshing = false;
  render();
}

// ===== onboarding submit =====
async function submitOnboard(){
  const inputEl = document.getElementById('obFplId');
  const errEl = document.getElementById('obError');
  const btnEl = document.getElementById('obSubmit');
  const fplId = inputEl.value.trim();

  if(errEl){ errEl.style.display = 'none'; errEl.textContent = ''; }

  if(!fplId){
    if(errEl){ errEl.textContent = 'اكتب الـ FPL Team ID الأول'; errEl.style.display = 'block'; }
    return;
  }

  if(btnEl){ btnEl.disabled = true; btnEl.textContent = 'جاري التحقق...'; }

  const entry = await fetchFplEntry(fplId);

  if(!entry || entry.error){
    if(errEl){ errEl.textContent = (entry && entry.error) ? entry.error : 'تأكد من رقم الـ ID وحاول تاني'; errEl.style.display = 'block'; }
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = 'ابدأ اللعب'; }
    return;
  }

  // نجحنا — نخزّن الـ ID محليًا عشان boot() يتخطى الأونبوردينج المرة الجاية
  try{ localStorage.setItem('mazareta_fpl_id', fplId); } catch(e){}

  state.deviceId = fplId;
  state.managerName = entry.managerName;
  state.teamName = entry.teamName;
  state.overallRank = entry.overallRank;
  state.eventRank = entry.eventRank;
  state.eventPoints = entry.eventPoints;
  state.overallPoints = entry.overallPoints;
  state.realLeagues = entry.leagues;

  await saveManager();
  await loadSquadOrDraft(); // هتجيب التشكيلة الحقيقية من FPL (شوف التعديل فوق)
  state.phase = 'app';
  render();
}

// ===== countdown =====
function countdown(iso){
  const diff = new Date(iso).getTime() - Date.now();
  if(diff<=0) return 'التشكيلة مقفولة';
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  if(d>0) return 'يوم'.length && (d===1?'يوم واحد':(d===2?'يومان':d+' أيام')) + ' و' + h + ' ساعة';
  const m = Math.floor((diff%3600000)/60000);
  return h+' ساعة و'+m+' دقيقة';
}

function renderLiveSyncedAt(){
  if(!state.liveSyncedAt) return '';
  const timeText = new Date(state.liveSyncedAt).toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });
  return '<div class="live-synced">آخر تحديث للنقاط: ' + timeText + '</div>';
}
// ===== مركز المباريات (Fixtures Hub) =====
function renderFixturesList(onlyLive) {
  if (!state.fixturesList || !state.fixturesList.length) return '';

  let matches = state.fixturesList;
  if (onlyLive) {
    // فلترة لعرض المباريات الشغالة دلوقتي بس
    matches = matches.filter(f => f.started && !f.finished);
    if (!matches.length) return '';
  }

  const listHtml = matches.map(f => {
    let timeOrScore = '';
    let badge = '';

    if (f.started && !f.finished) {
      timeOrScore = `<div class="match-score">${f.score_h} - ${f.score_a}</div>`;
      badge = `<div class="match-live-badge">مباشر • الدقيقة ${f.minutes}'</div>`;
    } else if (f.finished) {
      timeOrScore = `<div class="match-score">${f.score_h} - ${f.score_a}</div>`;
      badge = `<div class="match-time">انتهت</div>`;
    } else {
      const time = new Date(f.kickoff).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
      timeOrScore = `<div class="match-score" style="background:transparent; font-size:16px; color:var(--muted);">- : -</div>`;
      badge = `<div class="match-time">${time}</div>`;
    }

    return `
    <div class="match-card" data-match="${f.id}">
      <div class="match-team">
        <img class="match-team-logo" src="https://resources.premierleague.com/premierleague/badges/t${CLUB_CODE[f.team_h]}.png" onerror="this.style.display='none'">
        <div class="match-team-name">${CLUB_NAME[f.team_h]}</div>
      </div>
      <div class="match-center">
        ${timeOrScore}
        ${badge}
      </div>
      <div class="match-team">
        <img class="match-team-logo" src="https://resources.premierleague.com/premierleague/badges/t${CLUB_CODE[f.team_a]}.png" onerror="this.style.display='none'">
        <div class="match-team-name">${CLUB_NAME[f.team_a]}</div>
      </div>
    </div>`;
  }).join('');

  const title = onlyLive ? '<span class="h2-icon" style="color:var(--coral);">' + ICON_LIVE + ' مباريات تلعب الآن</span>' : 'مباريات الجولة ' + (activeViewGw()||'');
  return '<div class="section-title"><h2>' + title + '</h2></div>' +
         '<div style="margin: 0 20px 20px;">' + listHtml + '</div>';
}

// دالة منفصلة لشاشة كل المباريات
function renderFixtures(){
  const emptyMsg = (!state.fixturesList || !state.fixturesList.length)
    ? '<div class="hint" style="margin:20px;">لا توجد مباريات لهذه الجولة.</div>' : '';
  return '' +
  '<div class="topbar"><div class="spacer"></div><h1>المباريات</h1><div class="spacer"></div></div>' +
  renderGwNav() +
  renderFixturesList(false) +
  emptyMsg;
}

// تشكيلة كل فريق في الماتش (أساسي + بدلاء نزلوا فعلاً) — مبنية من بيانات اللايف
// بتاعة الجولة الحالية، فبتشتغل بس للجولة اللي بتُلعب/اتلعبت دلوقتي
function renderMatchLineup(f){
  const posOrder = { GK:0, DEF:1, MID:2, FWD:3 };
  const posGroupLabel = { GK:'حراسة المرمى', DEF:'الدفاع', MID:'الوسط', FWD:'الهجوم' };

  const teamPlayers = clubKey => state.players
    .filter(p => p.club === clubKey && (p.gwStarted || (p.gwMinutes||0) > 0))
    .sort((a,b) => (Number(b.gwStarted)-Number(a.gwStarted)));

  const hPlayers = teamPlayers(f.team_h);
  const aPlayers = teamPlayers(f.team_a);
  if(!hPlayers.length && !aPlayers.length) return '';

  const row = p => {
    const posLabel = { GK:'ح', DEF:'د', MID:'و', FWD:'هـ' }[p.pos] || p.pos;
    return '<div class="lineup-row' + (!p.gwStarted ? ' is-sub' : '') + '">' +
      '<div class="lineup-pos">' + posLabel + '</div>' +
      '<div class="lineup-name">' + p.name + '</div>' +
      (!p.gwStarted ? '<div class="lineup-sub">بديل</div>' : '') +
      (p.isPlayingLive ? '<div class="lineup-live-dot" title="بيلعب دلوقتي"></div>' : '') +
    '</div>';
  };

  const groupsHtml = ['GK','DEF','MID','FWD'].map(pos => {
    const h = hPlayers.filter(p => p.pos === pos);
    const a = aPlayers.filter(p => p.pos === pos);
    if(!h.length && !a.length) return '';
    return '<div class="lineup-group">' +
      '<div class="lineup-group-label">' + posGroupLabel[pos] + '</div>' +
      '<div class="lineup-wrap">' +
        '<div class="lineup-col home">' + h.map(row).join('') + '</div>' +
        '<div class="lineup-col away">' + a.map(row).join('') + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="section-title" style="margin:14px 0 8px;"><h2 style="font-size:12.5px;">التشكيلة</h2></div>' +
    groupsHtml;
}

function renderMatchModal() {
  if(!state.viewMatchId) return '';
  // بندوّر في مباريات الجولة المعروضة (الحالية أو جولة تاريخية اتصفّحناها)
  const f = state.fixturesList.find(x => x.id === state.viewMatchId)
    || ((state.fixturesByGw && state.fixturesByGw[activeViewGw()]) || []).find(x => x.id === state.viewMatchId);
  if(!f) return '';

  // قاموس الإحصائيات
  const labels = {
    goals_scored: `<span class="icon-inline">${ICON_GOAL} أهداف</span>`,
    assists: `<span class="icon-inline">${ICON_ASSIST} أسيست</span>`,
    own_goals: `<span class="icon-inline" style="color:var(--coral)">${ICON_CLOSE} هدف عكسي</span>`,
    penalties_saved: `<span class="icon-inline">${ICON_GLOVE} تصدي جزاء</span>`,
    penalties_missed: `<span class="icon-inline" style="color:var(--gold)">${ICON_WARN} إهدار جزاء</span>`,
    yellow_cards: `<span class="icon-inline"><div class="card-icon yellow"></div> إنذار</span>`,
    red_cards: `<span class="icon-inline"><div class="card-icon red"></div> طرد</span>`,
    saves: `<span class="icon-inline">${ICON_GLOVE} تصديات</span>`,
    bps: `<span class="icon-inline" style="color:var(--gold)">${ICON_STAR} BPS</span>`,
    bonus: `<span class="icon-inline" style="color:var(--gold)">${ICON_STAR} بونص</span>`
  };

  let statsHtml = '';
  (f.stats || []).forEach(stat => {
    if(!labels[stat.identifier]) return;
    if(stat.a.length === 0 && stat.h.length === 0) return;

    const hItems = stat.h.map(x => `<div>${findPlayer(x.element)?.name||'لاعب'} <span style="color:var(--muted);font-size:9.5px;">(${x.value})</span></div>`).join('');
    const aItems = stat.a.map(x => `<div><span style="color:var(--muted);font-size:9.5px;">(${x.value})</span> ${findPlayer(x.element)?.name||'لاعب'}</div>`).join('');

    statsHtml += `
    <div class="stat-row">
      <div class="stat-h">${hItems}</div>
      <div class="stat-lbl">${labels[stat.identifier]}</div>
      <div class="stat-a">${aItems}</div>
    </div>`;
  });

  if(!statsHtml) statsHtml = '<div class="hint" style="margin-top:20px;">لا توجد إحصائيات فعلية حتى الآن.</div>';

  return `
  <div class="modal-overlay open" id="matchModalOverlay">
    <div class="modal-content" id="matchModalContent" onclick="event.stopPropagation()">
      <button class="modal-close" id="closeMatchModal">${ICON_CLOSE}</button>
      <div style="text-align:center; margin-bottom:20px;">
        <div style="display:flex; justify-content:center; align-items:center; gap:14px; margin-bottom:10px;">
          <img src="https://resources.premierleague.com/premierleague/badges/t${CLUB_CODE[f.team_h]}.png" style="width:40px;">
          <div style="font-family:'Cairo'; font-size:22px; font-weight:900; color:var(--text);">${f.score_h!=null?f.score_h:'-'} : ${f.score_a!=null?f.score_a:'-'}</div>
          <img src="https://resources.premierleague.com/premierleague/badges/t${CLUB_CODE[f.team_a]}.png" style="width:40px;">
        </div>
        <div style="font-size:12px; color:var(--muted); font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;">${f.started && !f.finished ? '<span style="color:var(--coral);display:flex;align-items:center;">'+ICON_LIVE+' مباشر</span> - الدقيقة '+f.minutes+"'" : (f.finished ? 'انتهت المباراة' : 'لم تبدأ بعد')}</div>
      </div>
      ${renderMatchLineup(f)}
      <div style="background:rgba(255,255,255,0.02); border:1px solid var(--card-line); border-radius:16px; padding:10px;">
        ${statsHtml}
      </div>
    </div>
  </div>`;
}

// ترتيب الجولة الرسمي (summary_event_rank من فانتازي البريميرليج نفسها).
// فانتازي البريميرليج بترجّعه فاضي لحد ما تخلّص معالجة البونص الرسمية للجولة —
// يعني مش هيبان أثناء المباريات وده حد رسمي من فانتازي مش تقصير من التطبيق،
// فبنوضحه بدل ما نوهم بترتيب "لايف" مش موجود أصلاً كمصدر رسمي موثوق.
function renderEventRankLine(){
  if(state.eventRank){
    return '<div class="k" style="margin-top:5px;opacity:.8;">ترتيب الجولة: #' + state.eventRank.toLocaleString() + '</div>';
  }
  return '<div class="k" style="margin-top:5px;opacity:.5;">ترتيب الجولة: قيد الاحتساب الرسمي من FPL</div>';
}

function leagueRankChange(lg){
  const cur = lg.entry_rank, prev = lg.entry_last_rank;
  if(cur==null || prev==null || prev===cur) return { dir:'up', chg:0 };
  return cur < prev ? { dir:'up', chg: prev-cur } : { dir:'down', chg: cur-prev };
}

function renderLeaguePreviewItems(){
  if(!state.realLeagues.length){
    // مفيش دوريات لسه — نحاول نجيبها من الفانتازي (لو ما جرّبناش قبل كده)
    if(state.deviceId && !state.leaguesTried && !state.leaguesFetching) ensureLeagues();
    if(state.leaguesFetching) return '<div class="hint">جاري تحميل الدوريات...</div>';
    return '<div class="hint">لم تقم بالانضمام لأي دوري خاص حتى الآن.</div>';
  }
  return state.realLeagues.map(lg => {
    const rc = leagueRankChange(lg);
    return '<button class="league-item" data-league="' + lg.id + '">' +
      '<div><div class="li-name">' + escapeHtml(lg.name) + '</div><div class="li-sub">' + (lg.rank_count ? lg.rank_count.toLocaleString() + ' مدير' : '') + '</div></div>' +
      '<div class="li-rank"><div class="num">#' + (lg.entry_rank!=null ? lg.entry_rank.toLocaleString() : '-') + '</div>' +
      (rc.chg ? '<div class="chg ' + rc.dir + '">' + (rc.dir==='up'?ICON_UP:ICON_DOWN) + rc.chg + '</div>' : '') + '</div>' +
    '</button>';
  }).join('');
}

function renderNotifPanel(){

  // 0. إشعارات أحداث اللاعبين اللحظية (لو في تحديثات جديدة من تشكيلتك)
  const liveEventsHtml = renderLiveEventNotifs();

  } else {

  }

  // 2. إشعار المباريات المباشرة
  if (state.hasLiveFixtures) {
    notifs.push('<div class="n-item"><div class="t1" style="color:#00FF87; display:flex; gap:6px; align-items:center;">' + ICON_LIVE + 'مباريات تلعب الآن</div><div class="t2">النقاط والبونص يتم تحديثها لحظياً مع كل حدث.</div></div>');
  }

  // 3. إشعار حالة الاتصال بالسيرفر
  const syncTime = state.liveSyncedAt ? new Date(state.liveSyncedAt).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) : 'الآن';
  if (state.liveDataError) {
     notifs.push('<div class="n-item"><div class="t1" style="color:var(--coral); display:flex; gap:6px; align-items:center;">' + ICON_WARN + 'خطأ في الاتصال</div><div class="t2">تعذر جلب البيانات. التطبيق يعمل ببيانات احتياطية.</div></div>');
