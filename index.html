    --easy-green:#3DD68C;
    --mid-grey:#AFA9B8;
    --muted:rgba(235,238,244,0.52);
    --muted2:rgba(235,238,244,0.34);
    --text:#F3F5F8;
  }

  /* ===== app screen (no phone frame — fills the real viewport) ===== */
  .screen{
    width:100%; max-width:480px; margin:0 auto;
    min-height:100vh;
    background:
      radial-gradient(140% 30% at 8% -4%, rgba(216,27,96,0.09) 0%, transparent 55%),
      radial-gradient(130% 34% at 100% -6%, rgba(92,18,104,0.38) 0%, transparent 55%),
      var(--ink);
    position:relative;
    display:flex; flex-direction:column;
  }

  #app-body{ flex:1; padding-bottom:100px; position:relative; }

  .i{ width:18px; height:18px; stroke:currentColor; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; display:block; }

  /* ===== generic top title bar (non-home tabs) ===== */
  .topbar{ padding:22px 20px 4px; display:flex; align-items:center; justify-content:space-between; }
  .topbar h1{ font-family:'Cairo'; font-weight:800; font-size:16px; color:var(--text); }
  .topbar .back{
    width:34px; height:34px; border-radius:10px; background:var(--card); border:1px solid var(--card-line);
    display:flex; align-items:center; justify-content:center; color:var(--text);
  }
  .topbar .spacer{ width:34px; }

  /* ===== header (home) ===== */
  .header{ padding:22px 20px 4px; display:flex; align-items:center; justify-content:space-between; position:relative; }
  .brand{ display:flex; align-items:center; gap:11px; }
  .crest{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 32% 26%, #4A1257, #17081F 72%);
    border:1px solid rgba(216,27,96,0.38);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .crest::before{
    content:''; position:absolute; inset:3px; border-radius:50%;
    border:1px solid rgba(216,27,96,0.16);
  }
  .crest span{ font-family:'Cairo'; font-weight:900; font-size:14px; color:var(--primary-soft); letter-spacing:-0.5px; }
  .greet .hi{ font-size:11px; color:var(--muted); }
  .greet .name{ font-family:'Cairo'; font-weight:800; font-size:15.5px; color:var(--text); margin-top:2px; letter-spacing:0.1px; }
  .header-actions{ display:flex; align-items:center; gap:8px; }
  .icon-btn{
    width:38px; height:38px; border-radius:12px; background:var(--card);
    border:1px solid var(--card-line);
    display:flex; align-items:center; justify-content:center; position:relative;
    color:var(--muted);
  }
  .icon-btn .dot{
    position:absolute; top:8px; right:8px; width:5px; height:5px; border-radius:50%;
    background:var(--coral); box-shadow:0 0 0 2px var(--card);
  }
  .icon-btn.spin svg{ animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .notif-panel{
    position:absolute; top:64px; left:20px; width:250px; background:var(--card);
    border:1px solid var(--card-line); border-radius:14px; padding:6px; z-index:50;
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
  }
  .notif-panel .n-item{ padding:10px 10px; border-radius:10px; }
  .notif-panel .n-item:not(:last-child){ border-bottom:1px solid var(--card-line); }
  .notif-panel .n-item .t1{ font-size:11.5px; color:var(--text); font-weight:700; font-family:'Cairo'; }
  .notif-panel .n-item .t2{ font-size:10px; color:var(--muted); margin-top:2px; }

  /* ===== live pill ===== */
  .live-pill{
    margin:12px 20px 0; display:flex; align-items:center; gap:6px; width:fit-content;
    font-size:10px; font-weight:800; font-family:'Cairo'; color:var(--primary-soft);
    background:rgba(216,27,96,0.1); border:1px solid rgba(216,27,96,0.25);
    padding:5px 10px; border-radius:20px;
  }
  .live-pill .dotpulse{ width:6px; height:6px; border-radius:50%; background:var(--primary); box-shadow:0 0 0 0 rgba(216,27,96,0.6); animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(216,27,96,0.5);} 70%{box-shadow:0 0 0 6px rgba(216,27,96,0);} 100%{box-shadow:0 0 0 0 rgba(216,27,96,0);} }
  .live-pill.warn{ color:var(--coral); background:rgba(255,77,109,0.1); border-color:rgba(255,77,109,0.28); }
  .live-pill.warn .dotpulse{ background:var(--coral); }
  .live-synced{ font-size:9.5px; color:var(--muted); margin:4px 20px 0; }
  .rank-live-badge{ display:inline-block; font-family:'Cairo'; font-weight:800; font-size:7.5px; color:#04321B; background:var(--primary-soft); padding:1px 5px; border-radius:6px; margin-inline-start:5px; vertical-align:middle; }
  .bonus-badge{ font-family:'Cairo'; font-weight:800; font-size:9px; color:#241A08; background:var(--gold); padding:1px 6px; border-radius:6px; white-space:nowrap; flex-shrink:0; margin-inline-start:5px; }
  .ppts.has-bonus{ background:var(--gold); color:#241A08; }

  /* ===== deadline strip ===== */
  .deadline{
    margin:14px 20px 0; padding:13px 16px; border-radius:14px;
    background:linear-gradient(90deg, rgba(92,18,104,0.32), rgba(92,18,104,0.06));
    border:1px solid rgba(160,60,190,0.32);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .deadline .left{ display:flex; align-items:center; gap:10px; }
  .deadline .ic{ color:var(--primary-soft); flex-shrink:0; }
  .deadline .lbl{ font-size:10px; color:var(--muted); }
  .deadline .val{ font-family:'Cairo'; font-weight:800; font-size:13.5px; color:var(--text); margin-top:2px; }
  .deadline .cta{
    font-family:'Cairo'; font-weight:800; font-size:11px; color:#04321B;
    background:linear-gradient(160deg,var(--primary-soft),var(--primary-deep));
    padding:9px 15px; border-radius:11px; white-space:nowrap; letter-spacing:0.2px;
  }

  /* ===== points summary ===== */
  .summary{
    margin:14px 20px 0; padding:20px; border-radius:18px;
    background:linear-gradient(165deg, #3A0F45 0%, #1B0A22 100%);
    border:1px solid rgba(255,255,255,0.06);
    position:relative; overflow:hidden;
  }
  .summary::after{
    content:''; position:absolute; width:200px; height:200px; border-radius:50%;
    background:radial-gradient(circle, rgba(216,27,96,0.10), transparent 70%);
    top:-90px; left:-60px; pointer-events:none;
  }
  .summary-top{ display:flex; justify-content:space-between; align-items:flex-start; position:relative; }
  .summary-top .lbl{ font-size:10.5px; color:var(--muted); letter-spacing:0.2px; }
  .summary-top .big{ font-family:'Cairo'; font-weight:900; font-size:32px; color:var(--text); margin-top:4px; }
  .summary-top .big span{ font-size:13px; color:var(--muted); font-weight:500; }
  .badge-rank{
    display:flex; align-items:center; gap:4px;
    font-family:'Cairo'; font-weight:700; font-size:10px; color:var(--primary-soft);
    background:rgba(216,27,96,0.12); border:1px solid rgba(216,27,96,0.28);
    padding:6px 10px 6px 8px; border-radius:20px; white-space:nowrap;
  }
  .badge-rank svg{ width:11px; height:11px; }
  .summary-grid{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:18px; position:relative;
  }
  .summary-grid .cell{ text-align:center; padding-top:12px; border-top:1px solid rgba(255,255,255,0.07); }
  .summary-grid .cell .v{ font-family:'Cairo'; font-weight:800; font-size:14.5px; color:var(--text); }
  .summary-grid .cell .k{ font-size:9.5px; color:var(--muted); margin-top:3px; }

  /* ===== section title ===== */
  .section-title{ display:flex; align-items:center; justify-content:space-between; margin:22px 20px 10px; }
  .section-title h2{ font-family:'Cairo'; font-weight:800; font-size:14px; color:var(--text); }
  .section-title a{ font-size:11px; color:var(--primary-soft); font-weight:700; display:flex; align-items:center; gap:2px; }
  .section-title a svg{ width:13px; height:13px; }

  /* ===== segmented control ===== */
  .segment{ margin:2px 20px 14px; display:flex; background:var(--card); border:1px solid var(--card-line); border-radius:12px; padding:4px; gap:4px; }
  .segment button{ flex:1; padding:8px 0; border-radius:9px; font-family:'Cairo'; font-weight:800; font-size:11.5px; color:var(--muted); }
  .segment button.on{ background:rgba(216,27,96,0.14); color:var(--primary-soft); }
  .hint{ margin:0 20px 10px; font-size:10.5px; color:var(--muted); text-align:center; }

  /* ===== pitch ===== */
  .pitch-card{ margin:0 20px; border-radius:20px; overflow:hidden; border:1px solid rgba(255,255,255,0.06); box-shadow:0 18px 40px rgba(0,0,0,0.35); }
  .pitch{
    position:relative; padding:20px 10px 16px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 44px, transparent 44px 88px),
      radial-gradient(120% 90% at 50% 0%, var(--pitch1) 0%, var(--pitch2) 100%);
  }
  .pitch::before{ content:''; position:absolute; inset:10px; border:1.5px solid rgba(255,255,255,0.55); border-radius:4px; }
  .pitch::after{ content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:74px; height:74px; border:1.5px solid rgba(255,255,255,0.55); border-radius:50%; }
  .row{ display:flex; justify-content:center; gap:15px; position:relative; z-index:2; margin-bottom:15px; }
  .row:last-child{ margin-bottom:0; }
  .player{ display:flex; flex-direction:column; align-items:center; width:52px; cursor:pointer; }
  .jersey{
    width:36px; height:34px;
    clip-path:polygon(22% 0%, 38% 0%, 50% 13%, 62% 0%, 78% 0%, 100% 22%, 84% 36%, 84% 100%, 16% 100%, 16% 36%, 0% 22%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Cairo'; font-weight:900; font-size:11px;
    position:relative; cursor:pointer;
    box-shadow:0 0 0 1.5px rgba(255,255,255,0.5), 0 4px 8px rgba(0,0,0,0.3);
  }
  .jersey.selected{ box-shadow:0 0 0 2.5px var(--primary-soft), 0 4px 10px rgba(0,0,0,0.4); }
  .jersey.gk{ background:linear-gradient(165deg,#3FA65C,#1B5C34); color:rgba(255,255,255,0.9); }
  .jersey.liv{ background:linear-gradient(165deg,#D3182C,#7A0C1E); color:rgba(255,255,255,0.9); }
  .jersey.ars{ background:linear-gradient(to bottom, #fff 0 16%, transparent 16%), linear-gradient(165deg,#EF0107,#9C0007); color:#fff; }
  .jersey.mci{ background:linear-gradient(165deg,#8FCBF2,#1C4E80); color:#0A2540; }
  .jersey.mun{ background:linear-gradient(to bottom, #111 0 14%, transparent 14%), linear-gradient(165deg,#DC2B20,#7A0F09); color:rgba(255,255,255,0.9); }
  .jersey.che{ background:linear-gradient(165deg,#2E6FD1,#0A2B5E); color:rgba(255,255,255,0.9); }
  .jersey.new{ background:repeating-linear-gradient(90deg,#0B0B0B 0 5px,#F5F5F5 5px 10px); color:#111; }
  .jersey.tot{ background:linear-gradient(to bottom, #14213D 0 14%, transparent 14%), linear-gradient(165deg,#fdfdfd,#cfcfcf); color:#0B1F3A; }

  /* ===== real shirt image (pitch + bench) ===== */
  .jersey.jersey-photo{
    clip-path:none;
    background:transparent;
    box-shadow:none;
    display:flex; align-items:center; justify-content:center;
  }
  .jersey.jersey-photo.selected{ box-shadow:none; }
  .jersey-shirt{ width:38px; height:auto; display:block; }
  .jersey.jersey-photo.selected .jersey-shirt{ outline:2.5px solid var(--primary-soft); outline-offset:1px; border-radius:6px; }
  .bench .jersey-shirt{ width:28px; }
  /* لاعب بيلعب لايف دلوقتي (مباراته شغالة وهو نازل الملعب فعليًا) — تمييز واضح في التشكيلة */
  .jersey.jersey-photo.live-now .jersey-shirt{
    outline:2.5px solid #2ed573; outline-offset:1px; border-radius:6px;
    animation: pulse-live-ring 1.8s infinite;
  }
  .live-dot.pulse{ animation: pulse-live-dot 1.8s infinite; }
  @keyframes pulse-live-ring{
    0%{ filter:drop-shadow(0 0 0px rgba(46,213,115,0.9)); }
    50%{ filter:drop-shadow(0 0 5px rgba(46,213,115,0.95)); }
    100%{ filter:drop-shadow(0 0 0px rgba(46,213,115,0.9)); }
  }
  @keyframes pulse-live-dot{
    0%{ box-shadow:0 0 0 0 rgba(46,213,115,0.7); }
    70%{ box-shadow:0 0 0 6px rgba(46,213,115,0); }
    100%{ box-shadow:0 0 0 0 rgba(46,213,115,0); }
  }

  .cap{
    position:absolute; top:-6px; left:-6px; width:15px; height:15px; border-radius:50%;
    background:var(--gold); color:#241A08; font-family:'Cairo'; font-weight:900; font-size:8.5px;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--pitch2);
  }
  /* ===== ستايل كارت الاسم والنقاط (نسخة طبق الأصل من الصورة اللي طلبتها) ===== */
  .pname { 
    margin-top: 6px; 
    font-size: 9.5px; 
    color: var(--text); 
    font-weight: 700; 
    background: rgba(0,0,0,0.6); 
    padding: 2px 7px; 
    border-radius: 6px; 
    white-space: nowrap; 
    cursor: pointer; 
    max-width: 60px; 
    overflow: hidden; 
    text-overflow: ellipsis; 
    direction: ltr; /* بيخلي الأسامي الإنجليزي تظهر معدولة */
  }
  .ppts { 
    margin-top: 4px; 
    font-size: 9.5px; 
    font-weight: 800; 
    padding: 2px 8px; 
    border-radius: 10px; /* الكبسولة المدورة */
    white-space: nowrap; 
    direction: ltr; /* عشان كلمة pts تفضل على الشمال */
  }
  
  /* تلوين النقط بذكاء حسب حالة الماتش */
  .ppts.upcoming { 
    background: rgba(255, 255, 255, 0.15); /* رمادي شفاف شيك للماتشات اللي لسه */
    color: var(--text); 
    border: none; 
  }
  .ppts.played { 
    background: var(--primary-soft); /* اللون البينك الفاتح المميز بتاعك */
    color: #04321B; /* لون الخط الكحلي الغامق من جوه */
  }
  .ppts.live-playing { 
    background: linear-gradient(135deg, #e90052, #ff005a) !important; 
    color: #ffffff !important; 
    animation: pulse-live-bg 2s infinite; 
    box-shadow: 0 2px 8px rgba(233, 0, 82, 0.4); 
  }
  
  /* المكان الفاضي في الدكة */
  .pname.placeholder-name { 
    color: rgba(255,255,255,0.25); 
    background: rgba(255,255,255,0.04); 
    font-size: 8px; 
    margin-top: 4px; 
  }
  @keyframes pulse-live-bg {
    0% { filter: brightness(1); }
    50% { filter: brightness(1.2); }
    100% { filter: brightness(1); }
  }

  /* ===== placeholder jersey (empty slot) ===== */
  .jersey.placeholder{
    background:rgba(255,255,255,0.07);
    border:2px dashed rgba(255,255,255,0.22);
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.35);
    font-size:16px; font-weight:900;
    box-shadow:none;
    cursor:default;
  }
  .pname.placeholder-name{
    color:rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.04);
    font-size:8px;
  }

  .bench{ background:#0B0F14; padding:13px 16px; display:flex; gap:8px; justify-content:space-between; border-top:1px solid rgba(255,255,255,0.05); }
  .bench .player{ width:auto; opacity:0.85; }
  .bench .jersey{ width:29px; height:27px; font-size:9.5px; }
  .bench .pname{ font-size:8px; margin-top:5px; }

  /* ===== leagues ===== */
  .league-list{ margin:0 20px; display:flex; flex-direction:column; gap:9px; }
  .league-item{
    display:flex; align-items:center; justify-content:space-between; width:100%; text-align:right;
    background:var(--card); border:1px solid var(--card-line); padding:13px 16px; border-radius:14px;
  }
  .league-item .li-name{ font-family:'Cairo'; font-weight:700; font-size:12.5px; color:var(--text); }
  .league-item .li-sub{ font-size:10px; color:var(--muted); margin-top:3px; }
  .li-rank{ text-align:left; }
  .li-rank .num{ font-family:'Cairo'; font-weight:800; font-size:14.5px; color:var(--text); }
  .li-rank .chg{ font-size:9.5px; font-weight:700; margin-top:3px; display:flex; align-items:center; justify-content:flex-end; gap:2px; }
  .li-rank .chg svg{ width:9px; height:9px; }
  .up{ color:var(--primary-soft); } .down{ color:var(--coral); }

  .standing-row{ display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--card-line); padding:11px 14px; border-radius:12px; }
  .standing-row .s-left{ display:flex; align-items:center; gap:10px; }
  .standing-row .s-rank{ font-family:'Cairo'; font-weight:800; font-size:12px; color:var(--muted); width:22px; }
  .standing-row .s-name{ font-family:'Cairo'; font-weight:700; font-size:12.5px; color:var(--text); }
  .standing-row .s-pts{ font-family:'Cairo'; font-weight:800; font-size:12.5px; color:var(--primary-soft); }
  .standing-row.me{ border-color:rgba(216,27,96,0.35); background:rgba(216,27,96,0.06); }

  /* ===== transfer nudge ===== */
  .nudge{ margin:20px 20px 4px; padding:15px; border-radius:16px; background:linear-gradient(120deg, rgba(92,18,104,0.28), rgba(92,18,104,0.03)); border:1px solid rgba(160,60,190,0.26); display:flex; align-items:center; gap:12px; }
  .nudge .ic{ width:36px; height:36px; border-radius:11px; background:rgba(216,27,96,0.12); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--primary-soft); }
  .nudge .txt .t1{ font-family:'Cairo'; font-weight:800; font-size:12px; color:var(--text); }
  .nudge .txt .t2{ font-size:10px; color:var(--muted); margin-top:3px; line-height:1.5; }

  /* ===== transfers screen ===== */
  .stat-strip{ margin:10px 20px 0; display:flex; gap:8px; }
  .stat-pill{ flex:1; background:var(--card); border:1px solid var(--card-line); border-radius:13px; padding:10px 8px; text-align:center; }
  .stat-pill .v{ font-family:'Cairo'; font-weight:800; font-size:14px; color:var(--text); }
  .stat-pill .k{ font-size:9px; color:var(--muted); margin-top:2px; }
  .msg-banner{ margin:10px 20px 0; padding:9px 12px; border-radius:10px; font-size:11px; font-weight:700; text-align:center; }
  .msg-banner.err{ background:rgba(255,77,109,0.14); color:var(--coral); border:1px solid rgba(255,77,109,0.3); }
  .msg-banner.ok{ background:rgba(216,27,96,0.12); color:var(--primary-soft); border:1px solid rgba(216,27,96,0.28); }

  .p-row{ display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.05); padding:12px 16px; border-radius:16px; margin-bottom:10px; }
  .p-row.out-selected{ border-color:rgba(255,77,109,0.4); background:rgba(255,77,109,0.06); }
  .p-left{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .p-mini{ width:24px; height:23px; border-radius:5px; flex-shrink:0; box-shadow:0 0 0 1px rgba(255,255,255,0.4); }
  .p-mini.jersey-photo{ width:26px; height:auto; border-radius:0; box-shadow:none; background:transparent; flex-shrink:0; display:block; }
  .p-info .p-name{ font-family:'Cairo'; font-weight:700; font-size:12px; color:var(--text); }
  .p-info .p-meta{ font-size:9.5px; color:var(--muted); margin-top:2px; }
  .p-btn{ font-family:'Cairo'; font-weight:800; font-size:10.5px; padding:7px 13px; border-radius:9px; white-space:nowrap; }
  .p-btn.out{ background:rgba(255,77,109,0.14); color:var(--coral); border:1px solid rgba(255,77,109,0.3); }
  .p-btn.out.active{ background:var(--coral); color:#2B0007; }
  .p-btn.in{ background:rgba(216,27,96,0.14); color:var(--primary-soft); border:1px solid rgba(216,27,96,0.3); }
  .p-btn.in:disabled{ opacity:0.35; }
  .pos-head{ margin:16px 20px 8px; font-family:'Cairo'; font-weight:800; font-size:11px; color:var(--muted); letter-spacing:0.5px; }

  /* ===== more tab (redesigned) ===== */
  .more-list{ margin:0 20px 20px; }
  .more-hero{
    display:flex; align-items:center; gap:12px; padding:18px; border-radius:18px; margin-bottom:22px;
    background:linear-gradient(135deg, rgba(216,27,96,0.14), rgba(92,18,104,0.28)), var(--card);
    border:1px solid var(--card-line);
  }
  .more-hero .mh-crest{ width:46px; height:46px; border-radius:50%; overflow:hidden; flex-shrink:0; box-shadow:0 0 0 2px rgba(124,255,194,0.35); }
  .more-hero .mh-crest img{ width:100%; height:100%; object-fit:cover; }
  .more-hero .mh-text .mh-team{ font-family:'Cairo'; font-weight:800; font-size:14.5px; color:var(--text); }
  .more-hero .mh-text .mh-manager{ font-size:10.5px; color:var(--muted); margin-top:2px; }

  .more-group-label{ margin:0 4px 10px; font-family:'Cairo'; font-weight:800; font-size:11px; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; }
  .more-section{ margin-bottom:24px; }

  .tile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .feature-tile{
    display:flex; flex-direction:column; gap:10px; text-align:right; padding:16px 14px; border-radius:16px;
    background:var(--card); border:1px solid var(--card-line); text-decoration:none;
  }
  .feature-tile:active{ border-color:var(--primary-soft); }
  .feature-tile .ft-icon{
    width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px;
    background:linear-gradient(160deg,var(--primary-soft),var(--primary-deep)); color:#04321B;
  }
  .feature-tile.alt .ft-icon{ background:linear-gradient(160deg,#FFD98D,var(--gold)); }
  .feature-tile .ft-title{ font-family:'Cairo'; font-weight:800; font-size:12.5px; color:var(--text); }
  .feature-tile .ft-sub{ font-size:9.5px; color:var(--muted); line-height:1.5; }

  .grouped-card{ background:var(--card); border:1px solid var(--card-line); border-radius:16px; overflow:hidden; }
  .grouped-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 16px;
    text-decoration:none; color:inherit;
  }
  .grouped-row:not(:last-child){ border-bottom:1px solid var(--card-line); }
  .grouped-row .gr-left{ display:flex; align-items:center; gap:11px; }
  .grouped-row .gr-icon{ width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13.5px; background:rgba(255,255,255,0.06); color:var(--muted); flex-shrink:0; }
  .grouped-row .gr-icon.fb{ background:rgba(24,119,242,0.16); color:#4E9EFF; }
  .grouped-row .gr-text{ display:flex; flex-direction:column; gap:1px; }
  .grouped-row .gr-text span{ font-family:'Cairo'; font-weight:700; font-size:12px; color:var(--text); }
  .grouped-row .gr-sub{ font-size:9px; color:var(--muted); }
  .grouped-row .gr-chev{ color:var(--muted2); flex-shrink:0; }
  .grouped-row .gr-chev svg{ width:14px; height:14px; }
  .more-footer{ text-align:center; margin-top:26px; font-size:9.5px; color:var(--muted2); line-height:1.8; }
  .switch{ width:40px; height:23px; border-radius:20px; background:rgba(255,255,255,0.12); position:relative; transition:background .15s; flex-shrink:0; }
  .switch.on{ background:var(--primary-deep); }
  .switch .knob{ position:absolute; top:2.5px; right:2.5px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s; }
  .switch.on .knob{ transform:translateX(-17px); }

  /* ===== bottom nav ===== */
  .navbar{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    width:calc(100% - 28px); max-width:452px;
    background:rgba(26,10,34,0.92); backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:20px; padding:9px 4px;
    display:flex; justify-content:space-around; align-items:center;
    z-index:30;
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:8.5px; color:var(--muted2); font-weight:700; width:16%; }
  .nav-item svg{ width:18px; height:18px; stroke:currentColor; stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .nav-item.active{ color:var(--primary-soft); }
  .nav-item.active svg{ stroke-width:1.9; }
  .nav-item .dash{ width:14px; height:2px; border-radius:2px; background:transparent; margin-top:1px; }
  .nav-item.active .dash{ background:var(--primary); }

  /* ===== boot / onboarding ===== */
  .boot{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px; text-align:center; }
  .boot .spinner{ width:38px; height:38px; border-radius:50%; border:3px solid rgba(255,255,255,0.12); border-top-color:var(--primary-soft); animation:spin .8s linear infinite; }
  .boot .t{ font-family:'Cairo'; font-weight:700; font-size:12.5px; color:var(--muted); }
  .boot .err{ color:var(--coral); font-size:11.5px; max-width:280px; }

  .onboard{ min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:28px 24px; gap:18px; }
  .onboard .crest{ width:64px; height:64px; margin:0 auto 6px; }
  .onboard .crest span{ font-size:22px; }
  .onboard h1{ font-family:'Cairo'; font-weight:900; font-size:19px; color:var(--text); text-align:center; }
  .onboard p{ font-size:12px; color:var(--muted); text-align:center; line-height:1.6; margin-top:2px; }
  .field{ margin-top:6px; }
  .field label{ font-size:11px; color:var(--muted); font-weight:700; display:block; margin-bottom:6px; }
  .field input{
    width:100%; background:var(--card); border:1px solid var(--card-line); border-radius:12px;
    padding:13px 14px; font-size:13px; color:var(--text); outline:none;
  }
  .field input:focus{ border-color:rgba(216,27,96,0.4); }
  .btn-primary{
    margin-top:8px; font-family:'Cairo'; font-weight:800; font-size:13px;
    background:rgba(216,27,96,0.1); color:var(--primary-soft);
    border:1px solid rgba(216,27,96,0.3);
    padding:14px; border-radius:14px; text-align:center; transition:all 0.2s;
  }
  .btn-primary:active{ background:rgba(216,27,96,0.2); }
  .btn-primary:disabled{ opacity:0.4; }
  .btn-ghost{
    font-family:'Cairo'; font-weight:700; font-size:12px; color:var(--text);
    background:var(--card); border:1px solid var(--card-line); padding:12px; border-radius:12px; text-align:center;
  }

  /* ===== player profile ===== */
  .profile-hero{ margin:6px 20px 0; padding:22px 18px; border-radius:20px; text-align:center; position:relative; overflow:hidden;
    background:linear-gradient(165deg, #3A0F45 0%, #1B0A22 100%); border:1px solid rgba(255,255,255,0.06); }
  .profile-hero .pj-photo{ width:74px; height:auto; display:block; margin:0 auto; border-radius:10px; }
  .profile-hero .pn{ font-family:'Cairo'; font-weight:900; font-size:17px; color:var(--text); margin-top:12px; }
  .profile-hero .pm{ font-size:11px; color:var(--muted); margin-top:4px; }
  /* ===== upcoming fixtures (player profile) ===== */
  .pp-fixtures{ display:flex; gap:8px; margin:0 20px; }
  .pp-fixcard{ flex:1; background:var(--card); border:1px solid var(--card-line); border-radius:12px; padding:10px 6px; text-align:center; }
  .pp-fixcard .opp{ font-family:'Cairo'; font-weight:800; font-size:11.5px; color:var(--text); }
  .pp-fixcard .venue{ font-size:9px; color:var(--muted); margin-top:2px; }
  .pp-fixcard{ position:relative; overflow:hidden; border-top:2.5px solid transparent; }
  .pp-fixcard.easy{ border-top-color:var(--easy-green); }
  .pp-fixcard.mid{ border-top-color:var(--mid-grey); }
  .pp-fixcard.hard{ border-top-color:var(--coral); }
  .pp-fixcard .fdr{ margin-top:6px; display:inline-block; min-width:20px; padding:3px 8px; border-radius:7px; font-size:11px; font-weight:900; font-family:'Cairo'; }
  .pp-fixcard .fdr.easy{ background:rgba(61,214,140,0.16); color:var(--easy-green); }
  .pp-fixcard .fdr.mid{ background:rgba(175,169,184,0.16); color:var(--mid-grey); }
  .pp-fixcard .fdr.hard{ background:rgba(255,77,109,0.18); color:var(--coral); }
  .price-tag{ display:inline-flex; align-items:center; gap:5px; margin-top:10px; background:rgba(0,0,0,0.25); padding:6px 12px; border-radius:20px; }
  .price-tag .amt{ font-family:'Cairo'; font-weight:800; font-size:13px; color:var(--text); }
  .price-tag .chg{ font-size:10.5px; font-weight:800; display:flex; align-items:center; gap:2px; }
  .price-tag .chg svg{ width:9px; height:9px; }
  .profile-stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:14px 20px 0; }
  .profile-stats .cell{ background:var(--card); border:1px solid var(--card-line); border-radius:13px; padding:12px 6px; text-align:center; }
  .profile-stats .cell .v{ font-family:'Cairo'; font-weight:800; font-size:15px; color:var(--text); }
  .profile-stats .cell .k{ font-size:9px; color:var(--muted); margin-top:3px; }
  .own-bar{ margin:14px 20px 0; background:var(--card); border:1px solid var(--card-line); border-radius:13px; padding:12px 14px; }
  .own-bar .row1{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); margin-bottom:7px; }
  .own-bar .track{ height:6px; border-radius:4px; background:rgba(255,255,255,0.08); overflow:hidden; }
  .own-bar .fill{ height:100%; background:linear-gradient(90deg,var(--primary-deep),var(--primary-soft)); }
  .fix-row{ margin:12px 20px 0; background:var(--card); border:1px solid var(--card-line); border-radius:13px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; }
  .fix-row .k{ font-size:10.5px; color:var(--muted); }
  .fix-row .v{ font-family:'Cairo'; font-weight:800; font-size:12.5px; color:var(--text); }
  .form-card{ margin:0 20px; background:var(--card); border:1px solid var(--card-line); border-radius:16px; padding:16px 14px 12px; }
  .form-bars{ display:flex; align-items:flex-end; justify-content:center; gap:14px; }
  .form-bars .fb{ flex:0 0 auto; width:52px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .form-bars .val{ font-family:'Cairo'; font-weight:900; font-size:13.5px; color:var(--text); }
  .form-bars .bar-wrap{ position:relative; width:34px; height:74px; border-radius:8px; background:rgba(255,255,255,0.06); overflow:hidden; display:flex; align-items:flex-end; }
  .form-bars .bar{ width:100%; border-radius:6px 6px 0 0; min-height:6px; background:linear-gradient(180deg,var(--primary-soft),var(--primary-deep)); }
  .form-bars .lbl{ font-size:10px; color:var(--muted2); font-weight:700; }
  .hist-row{ display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--card-line); padding:10px 14px; border-radius:12px; }
  .hist-row .g{ font-size:11px; color:var(--muted); font-weight:700; }
  .hist-row .p{ font-family:'Cairo'; font-weight:800; font-size:12.5px; color:var(--primary-soft); }

  /* ===== admin ===== */
  .admin-card{ margin:0 20px 14px; background:var(--card); border:1px solid var(--card-line); border-radius:16px; padding:16px; }
  .admin-card h3{ font-family:'Cairo'; font-weight:800; font-size:12.5px; color:var(--text); margin-bottom:12px; }
  .a-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .a-field{ display:flex; flex-direction:column; gap:5px; }
  .a-field label{ font-size:9.5px; color:var(--muted); }
  .a-field input{ background:#0A0512; border:1px solid var(--card-line); border-radius:9px; padding:8px 10px; font-size:11.5px; color:var(--text); outline:none; }
  .a-field input:focus{ border-color:rgba(216,27,96,0.4); }
  .a-player{ background:#0A0512; border:1px solid var(--card-line); border-radius:13px; padding:12px; margin-bottom:8px; }
  .a-player .head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .a-player .head .nm{ font-family:'Cairo'; font-weight:700; font-size:12px; color:var(--text); }
  .a-player .head .cl{ font-size:9.5px; color:var(--muted); }
  .a-row4{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; }
  .a-row4 .a-field label{ font-size:8.5px; }
  .a-row4 .a-field input{ padding:7px 6px; font-size:10.5px; text-align:center; }
  .admin-save{ position:sticky; bottom:14px; margin:16px 20px 0; }
  .pin-wrap{ min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  .pin-wrap input{ width:160px; text-align:center; letter-spacing:6px; font-family:'Cairo'; font-weight:800; font-size:18px; background:var(--card); border:1px solid var(--card-line); border-radius:12px; padding:12px; color:var(--text); outline:none; }
  .banner-ok{ margin:0 20px 14px; padding:10px 12px; border-radius:10px; background:rgba(216,27,96,0.12); border:1px solid rgba(216,27,96,0.28); color:var(--primary-soft); font-size:11px; font-weight:700; text-align:center; }

  /* ===== predictions & advice ===== */
  .pred-banner{ margin:6px 20px 0; padding:20px; border-radius:18px; text-align:center; position:relative; overflow:hidden;
    background:linear-gradient(165deg, #0F3324 0%, #0F0A1A 100%); border:1px solid rgba(216,27,96,0.2); }
  .pred-banner .lbl{ font-size:10.5px; color:var(--muted); }
  .pred-banner .big{ font-family:'Cairo'; font-weight:900; font-size:30px; color:var(--primary-soft); margin-top:4px; }
  .pred-banner .sub{ font-size:10.5px; color:var(--muted); margin-top:8px; }
  .pred-note{ margin:10px 20px 0; font-size:9.5px; color:var(--muted2); line-height:1.8; text-align:center; }
  .pred-chip{ font-family:'Cairo'; font-weight:800; font-size:13px; padding:6px 14px; border-radius:10px; white-space:nowrap; flex-shrink:0; text-align:center; min-width:65px; letter-spacing:0.5px; background:rgba(216,27,96,0.12); color:var(--primary-soft); border:1px solid rgba(216,27,96,0.25); }
  .pred-chip.warn, .pred-chip.mkt-out{ background:rgba(255,77,109,0.12); color:#ff4d6d; border:1px solid rgba(255,77,109,0.25); }
  .pred-chip.mkt-in{ background:rgba(46,213,115,0.12); color:#2ed573; border:1px solid rgba(46,213,115,0.25); }
  .adv-card{ background:var(--card); border:1px solid var(--card-line); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .adv-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .adv-reasons{ display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .reason-tag{ font-size:9.5px; color:var(--muted); background:rgba(255,255,255,0.05); border:1px solid var(--card-line); padding:3px 8px; border-radius:20px; }
  .reason-tag.buy{ color:var(--primary-soft); background:rgba(216,27,96,0.08); border-color:rgba(216,27,96,0.2); }
  .reason-tag.sell{ color:var(--coral); background:rgba(255,77,109,0.08); border-color:rgba(255,77,109,0.22); }
  .cs-row{ display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--card-line); border-radius:13px; padding:11px 14px; margin-bottom:8px; }
  .cs-row .cs-prob{ font-family:'Cairo'; font-weight:800; font-size:13px; color:var(--primary-soft); flex-shrink:0; }

  /* ===== swap suggestions (predictions tab) ===== */
  .swap-card{ background:var(--card); border:1px solid var(--card-line); border-radius:16px; padding:14px; margin-bottom:10px; }
  .swap-title{ font-family:'Cairo'; font-weight:800; font-size:12px; color:var(--gold); text-align:center; margin-bottom:12px; }
  .swap-body{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .swap-side{ flex:1; min-width:0; text-align:center; cursor:pointer; }
  .swap-tag{ font-family:'Cairo'; font-weight:800; font-size:9.5px; margin-bottom:6px; }
  .swap-side.sell .swap-tag{ color:var(--coral); }
  .swap-side.buy .swap-tag{ color:var(--primary-soft); }
  .swap-photo{ width:42px; height:auto; margin:0 auto; display:block; }
  .swap-name{ font-family:'Cairo'; font-weight:700; font-size:11px; color:var(--text); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .swap-price{ font-size:9.5px; color:var(--muted); margin-top:1px; }
  .swap-icon{ flex-shrink:0; width:26px; height:26px; margin-top:14px; border-radius:50%; background:rgba(255,255,255,0.05); border:1px solid var(--card-line); display:flex; align-items:center; justify-content:center; color:var(--primary-soft); }
  .swap-icon svg{ width:14px; height:14px; }

  /* ===== image fallback (shown when a FPL image fails to load) ===== */
  .img-fallback{
    aspect-ratio:1/1; border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,var(--primary-soft),var(--primary-deep)); color:#04321B;
    font-family:'Cairo'; font-weight:900; font-size:11px; line-height:1;
  }
  .img-fallback.img-fallback-profile{ aspect-ratio:110/140; border-radius:10px; font-size:26px; }

  .live-dot { position:absolute; top:-4px; right:-4px; width:10px; height:10px; background:#2ed573; border-radius:50%; border:2px solid var(--pitch2); }

  /* ===== كروت المباريات وتفاصيلها ===== */
  .match-card { background: var(--card); border: 1px solid var(--card-line); border-radius: 16px; padding: 12px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
  .match-card:active { border-color: var(--primary-soft); background: rgba(216,27,96,0.05); }
  .match-team { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .match-team-logo { width: 38px; height: 38px; object-fit: contain; }
  .match-team-name { font-family: 'Cairo'; font-weight: 700; font-size: 11px; color: var(--text); }
  .match-center { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 10px; }
  .match-time { font-size: 10px; color: var(--muted); }
  .match-score { font-family: 'Cairo'; font-weight: 900; font-size: 22px; color: var(--text); background: rgba(0,0,0,0.3); padding: 2px 16px; border-radius: 10px; }
  .match-live-badge { font-family: 'Cairo'; font-weight: 800; font-size: 9px; color: #04321B; background: #2ed573; padding: 2px 8px; border-radius: 10px; animation: pulse 2s infinite; }

  /* Modal (شاشة تفاصيل الماتش) */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: flex; flex-direction: column; justify-content: flex-end; backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: 0.3s; }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-content { background: var(--ink); border-top: 1px solid var(--card-line); border-radius: 24px 24px 0 0; padding: 20px 20px 40px; max-height: 85vh; overflow-y: auto; transform: translateY(100%); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .modal-overlay.open .modal-content { transform: translateY(0); }
  .modal-close { position: absolute; top: 16px; right: 20px; width: 32px; height: 32px; border-radius: 10px; background: var(--card); color: var(--text); display: flex; align-items: center; justify-content: center; border: 1px solid var(--card-line); cursor: pointer; }
  .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 11.5px; }
  .stat-h, .stat-a { flex: 1; display: flex; flex-direction: column; gap: 6px; color: var(--text); }
  .stat-h { text-align: right; padding-left: 10px; }
  .stat-a { text-align: left; padding-right: 10px; }
  .stat-lbl { flex-shrink: 0; width: 66px; text-align: center; color: var(--muted); font-size: 10px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border-radius: 8px; padding: 2px; }

  /* ===== تشكيلة الماتش جوه المودال ===== */
  .lineup-group { margin-bottom: 10px; }
  .lineup-group-label {
    text-align: center; font-family: 'Cairo'; font-weight: 800; font-size: 9.5px;
    letter-spacing: 0.3px; color: var(--muted); margin: 0 0 6px;
  }
  .lineup-wrap { display: flex; gap: 0; position: relative; }
  .lineup-wrap::after {
    content: ''; position: absolute; left: 50%; top: 2px; bottom: 2px; width: 1px;
    background: rgba(255,255,255,0.08); transform: translateX(-0.5px);
  }
  .lineup-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .lineup-col.home { padding-inline-end: 10px; align-items: flex-start; }
  .lineup-col.away { padding-inline-start: 10px; align-items: flex-end; }
  .lineup-row { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text); max-width: 100%; }
  .lineup-col.away .lineup-row { flex-direction: row-reverse; }
  .lineup-pos { flex-shrink: 0; width: 18px; text-align: center; font-family: 'Cairo'; font-weight: 800; font-size: 8px; color: var(--muted); background: rgba(255,255,255,0.05); border-radius: 5px; padding: 1.5px 0; }
  .lineup-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 108px; }
  .lineup-row.is-sub .lineup-name { color: var(--muted); }
  .lineup-sub {
    flex-shrink: 0; color: var(--primary-soft); font-size: 8px; font-weight: 800; font-family: 'Cairo';
    background: rgba(216,27,96,0.14); border-radius: 5px; padding: 1.5px 5px; white-space: nowrap;
  }
  .lineup-live-dot { width: 6px; height: 6px; border-radius: 50%; background: #2ed573; flex-shrink: 0; animation: pulse-live-dot 1.8s infinite; }

  /* ===== ستايلات الأيقونات الاحترافية (بديل الإيموشنات) ===== */

// إعدادات، من غير ما يرفض (reject) أبدًا — وساعتها الـ try/catch اللي تحت مبيحميش

// يدوي، وأول واحد يخلّص هو اللي بياخد القرار.
function withTimeout(promise, ms){
  return new Promise((resolve, reject)=>{
    const timer = setTimeout(()=>reject(new Error('supabase timeout')), ms || 8000);
    promise.then(
      (v)=>{ clearTimeout(timer); resolve(v); },
      (e)=>{ clearTimeout(timer); reject(e); }
    );
  });
}

}

// أو السيرفر بتاعنا نفسه واقف بيستنى، أو حتى مجرد قطع اتصال هادي من غير أي error حقيقي.

// مش مرفوض، وده اللي بيسبب "السبينر اللي مابيتحركش" اللي المستخدم شايفه.
async function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs || 12000);
  try{
    return await fetch(url, { ...(options||{}), signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function fplFetch(type, event){
  const url = FPL_ENDPOINT + '?type=' + type + (event ? '&event=' + event : '');
  let res;
  try{
    res = await fetchWithTimeout(url, undefined, 12000);
  } catch(e){
    const timedOut = e && e.name === 'AbortError';
    throw new Error(timedOut ? ('استغرق جلب ' + type + ' وقت طويل جدًا (Timeout)') : ('تعذّر الاتصال بالسيرفر: ' + type));
  }
  if(!res.ok) throw new Error('fpl fetch failed: ' + type);
  return res.json();
}

async function fetchFplEntry(fplId){
  const id = String(fplId || '').trim();
  if(!id || !/^\d+$/.test(id)){
    return { error: 'رقم الـ FPL Team ID غير صحيح' };
  }
  try{
    const res = await fetchWithTimeout(FPL_ENDPOINT + '?type=entry&id=' + encodeURIComponent(id), undefined, 12000);
    if(res.status === 404){
      return { error: 'لم يتم العثور على فريق بهذا المعرف. يرجى التأكد من الرقم والمحاولة مرة أخرى' };
    }
    if(!res.ok){
      return { error: 'حدث خطأ في الاتصال بخوادم FPL. يرجى المحاولة مرة أخرى' };
    }
    const data = await res.json();
    if(!data || (data.player_first_name == null && data.name == null)){
      return { error: 'لم يتم العثور على فريق بهذا المعرف. يرجى التأكد من الرقم والمحاولة مرة أخرى' };
    }
    return {
      managerName: [data.player_first_name, data.player_last_name].filter(Boolean).join(' ') || ('مدير ' + id),
      teamName: data.name || ('فريق ' + id),
      currentEvent: data.current_event || null,
      overallRank: data.summary_overall_rank,
      // ترتيب الجولة الحالية الرسمي — فانتازي البريميرليج نفسها بترجّعه null/فاضي لحد ما
      // تخلّص معالجة البونص الرسمية للجولة، يعني مش هيبان لايف أثناء المباريات (حد من فانتازي نفسها مش منّا)
      eventRank: data.summary_event_rank || null,
      leagues: data.leagues?.classic || [],
    };
  }catch(e){
    return { error: 'حصل خطأ في الاتصال بـ FPL. تأكد من النت وحاول تاني' };
  }
}

// ===== جلب التشكيلة الحقيقية لجولة معيّنة (أساسي/احتياطي/كابتن) =====
async function fetchFplPicks(fplId, gw){
  const id = String(fplId || '').trim();
  if(!id || !gw) return null;
  try{
    const res = await fetchWithTimeout(FPL_ENDPOINT + '?type=picks&id=' + encodeURIComponent(id) + '&event=' + encodeURIComponent(gw), undefined, 12000);
    if(!res.ok) return null;
    const data = await res.json();
    const picks = data.picks || [];
    if(!picks.length) return null;

    // multiplier: 0 = احتياطي، 1/2/3 = أساسي (2 و3 حالات الكابتن/التريبل كابتن)
    const squadIds = picks.map(p => ({
      id: p.element,
      slot: p.multiplier > 0 ? 'start' : 'bench'
    }));
    const captainPick = picks.find(p => p.is_captain);
    const captainId = captainPick ? captainPick.element : (picks[0] ? picks[0].element : null);
    const bank = (data.entry_history && typeof data.entry_history.bank === 'number')
      ? data.entry_history.bank / 10
      : 0;

    return { squadIds, captainId, bank };
  }catch(e){
    return null;
  }
}

// ===== جلب ترتيب دوري خاص (كل الأعضاء) عشان نعرضهم كلهم مش أنا بس =====
async function fetchLeagueStandings(leagueId, page){
  const id = String(leagueId || '').trim();
  if(!id) return null;
  try{
    const res = await fetchWithTimeout(FPL_ENDPOINT + '?type=standings&id=' + encodeURIComponent(id) + '&page=' + (page||1), undefined, 12000);
    if(!res.ok) return null;
    const data = await res.json();
    const results = (data.standings && data.standings.results) || [];
    return {
      leagueName: data.league && data.league.name,
      results: results.map(r => ({
        entryId: r.entry,
        rank: r.rank,
        teamName: r.entry_name,
        managerName: r.player_name,
        total: r.total,
      })),
      hasNext: !!(data.standings && data.standings.has_next),
    };
  }catch(e){
    return null;
  }
}

// ===== منحنى الرتبة العامة التقديري (نقط ↔ رتبة) =====
// بنسحب صفحات standings لدوري الـ Overall (314) عند رتب موزّعة على كل المدى (من 1
// لحد إجمالي عدد المديرين)، وبنبني مصفوفة {rank, total} مرتبة تصاعديًا بالنقط.
// الكاش مشترك بين كل الزوار عبر Supabase (mazareta_kv) عشان محدش يضرب على FPL API
// لوحده — أي متصفح يلاقي الكاش قديم بياخد قفل مؤقت ويبنيه، والباقي بيقروا من الكاش.
async function sampleOverallRankCurve(totalManagers){
  const total = Number(totalManagers) || 9000000;
  const points = [];
  for(let i=0;i<RANK_CURVE_SAMPLE_POINTS;i++){
    // توزيع أكثف قرب القمة (رتب صغيرة) لأن الزحمة والتفاوت هناك أكبر نسبيًا،
    // وأخف كل ما نزلنا لرتب كبيرة (منحنى تربيعي بسيط بدل توزيع خطي)
    const frac = Math.pow(i/(RANK_CURVE_SAMPLE_POINTS-1), 2);
    const rank = Math.max(1, Math.round(1 + frac * (total-1)));
    const page = Math.max(1, Math.ceil(rank/50));
    const data = await fetchLeagueStandings(OVERALL_LEAGUE_ID, page);
    if(data && data.results && data.results.length){
      const r = data.results[0];
      if(r && typeof r.total === 'number') points.push({ rank: r.rank || rank, total: r.total });
    }
  }
  points.sort((a,b)=> a.total - b.total);
  return points;
}

async function loadOrBuildRankCurve(){
  try{
    const raw = await sGet(RANK_CURVE_KEY, true);
    const cached = raw ? JSON.parse(raw) : null;
    const ttl = state.hasLiveFixtures ? RANK_CURVE_TTL_ACTIVE : RANK_CURVE_TTL_IDLE;
    const fresh = cached && cached.points && cached.points.length && (Date.now() - (cached.updatedAt||0) < ttl);
    if(fresh){ state.rankCurve = cached; return; }
    if(cached && cached.points && cached.points.length) state.rankCurve = cached; // كاش قديم أحسن من ولا حاجة لحد ما نبني واحد جديد

    // محاولة أخذ قفل بناء — لو حد تاني قافلها من ثواني، منعملش نفس الشغل مرتين
    const lockRaw = await sGet(RANK_CURVE_LOCK_KEY, true);
    const lock = lockRaw ? JSON.parse(lockRaw) : null;
    if(lock && (Date.now() - (lock.at||0) < RANK_CURVE_LOCK_TTL)) return; // حد تاني بيبني دلوقتي
    await sSet(RANK_CURVE_LOCK_KEY, JSON.stringify({ at: Date.now() }), true);

    const points = await sampleOverallRankCurve(state.totalManagers);
    if(points.length >= 4){
      const payload = { points, updatedAt: Date.now(), gw: state.gwInfo && state.gwInfo.current };
      state.rankCurve = payload;
      await sSet(RANK_CURVE_KEY, JSON.stringify(payload), true);
    }
  }catch(e){ /* تجاهل — التقدير هيفضل يستخدم آخر كاش متاح لو موجود */ }
}

// تفسير خطي (interpolation) على منحنى النقط↔الرتبة عشان نقدّر رتبة أي مجموع نقط
function estimateRankForPoints(curve, totalPoints){
  const pts = curve && curve.points;
  if(!pts || pts.length < 2) return null;
  if(totalPoints <= pts[0].total) return pts[0].rank;
  if(totalPoints >= pts[pts.length-1].total) return pts[pts.length-1].rank;
  for(let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1];
    if(totalPoints >= a.total && totalPoints <= b.total){
      if(b.total === a.total) return a.rank;
      const frac = (totalPoints - a.total) / (b.total - a.total);
      return Math.round(a.rank + frac * (b.rank - a.rank));
    }
  }
  return null;
}

// كام نقطة كمان محتاجها عشان تتحسن رتبتك التقديرية عن رتبتك الرسمية قبل الجولة دي
// (ده تعريف "السهم الأخضر" — بيقارن رتبتك دلوقتي برتبتك قبل ما الجولة تبدأ)
function overallRankOutlook(){
  const curve = state.rankCurve;
  const baseline = state.overallRank;
  if(!curve || !baseline) return null;
  const curTotal = seasonTotal();
  const estRank = estimateRankForPoints(curve, curTotal);
  if(estRank == null) return null;

  if(estRank <= baseline){
    return { estRank, baseline, arrow:'up', marginRanks: baseline - estRank, pointsNeeded: 0 };
  }
  // بندور بزيادة نقطة نقطة (لحد سقف معقول) على أول نقطة تخلي التقدير يتحسن عن الأساس
  for(let add=1; add<=30; add++){
    const r = estimateRankForPoints(curve, curTotal + add);
    if(r != null && r <= baseline){
      return { estRank, baseline, arrow:'down', marginRanks: estRank - baseline, pointsNeeded: add };
    }
  }
  return { estRank, baseline, arrow:'down', marginRanks: estRank - baseline, pointsNeeded: null };
}

// تأثير كل نقطة إضافية (من أي لاعب أساسي) على رتبتك التقديرية — منحدر محلي بسيط
// حوالين نقطك الحالية على المنحنى. الكابتن هيدّي ضعف (أو 3 أضعاف لو تريبل كابتن) التأثير.
function rankSwingPerPoint(){
  const curve = state.rankCurve;
  if(!curve) return null;
  const curTotal = seasonTotal();
  const r0 = estimateRankForPoints(curve, curTotal);
  const r1 = estimateRankForPoints(curve, curTotal + 3); // نطاق أوسع من نقطة واحدة عشان يبقى أدق وسط التقريب
  if(r0 == null || r1 == null) return null;
  return Math.max(0, Math.round((r0 - r1) / 3));
}

// أكتر اللاعبين اللي مش في تشكيلتك ونسبة امتلاكهم عالميًا عالية وبيسجلوا نقط لحظيًا —
// دول اللي على الأغلب "هيقصروا عليك" في الرتبة العامة لأن غالبية اللي حواليك فيها عندهم
// نفس اللاعبين دول. (مفهوم "مين حواليّ بالظبط" مش قابل للتطبيق على 10+ مليون مدير)
function overallThreats(limit){
  const owned = new Set((state.mySquadIds||[]).map(e=>e.id));
  return state.players
    .filter(p => !owned.has(p.id) && (p.ownership||0) >= 5 && currentGwPoints(p) > 0)
    .sort((a,b)=> (b.ownership*currentGwPoints(b)) - (a.ownership*currentGwPoints(a)))
    .slice(0, limit || 5);
}

// نتأكد إن ترتيب الدوري محمّل (أو بنجيبه أول مرة) — بيتخزن في كاش عشان منجيبوش من الأول كل مرة
async function ensureLeagueStandings(leagueId){
  if(state.leagueStandingsCache[leagueId]) return;
  state.leagueStandingsCache[leagueId] = { loading:true, results:[] };
  const data = await fetchLeagueStandings(leagueId, 1);
  state.leagueStandingsCache[leagueId] = data
    ? { loading:false, results:data.results, leagueName:data.leagueName }
    : { loading:false, error:true, results:[] };
  if(state.tab==='leagues' && String(state.activeLeagueId)===String(leagueId) && !state.viewMemberId) renderBody();
}

// بنفتح تشكيلة عضو تاني في الدوري (زميلي)، بنستخدم نفس fetchFplPicks اللي شغالة بأي ID
async function openMemberSquad(entryId, teamName, managerName){
  state.viewMemberId = entryId;
  state.viewMemberSquad = { loading:true, teamName, managerName };
  renderBody();
  const gw = state.gwInfo && state.gwInfo.current;
  const picks = await fetchFplPicks(entryId, gw);
  state.viewMemberSquad = (picks && picks.squadIds && picks.squadIds.length)
    ? { loading:false, teamName, managerName, squadIds:picks.squadIds, captainId:picks.captainId }
    : { loading:false, error:true, teamName, managerName };
  if(state.tab==='leagues' && String(state.viewMemberId)===String(entryId)) renderBody();
}

// فورم موزون: بيدي وزن أكبر للجولات الأقرب بدل ما يعامل آخر 5 جولات بنفس الأهمية
// (لاعب سجل 2 جولات كويسة الأسبوع اللي فات أهم من لاعب سجلهم بدري وبايت دلوقتي)
function weightedFormPts(history){
  if(!history || !history.length) return 0;
  const sorted = history.slice().sort((a,b)=>a.gw-b.gw);
  let wSum = 0, sum = 0;
  sorted.forEach((h,i)=>{ const w = i+1; wSum += w; sum += w*h.pts; });
  return wSum ? Math.round((sum/wSum)*100)/100 : 0;
}

async function buildLiveDataset(){
  const boot = await fplFetch('bootstrap');
  const teams = boot.teams || [];
  const elements = boot.elements || [];
  const events = boot.events || [];
  const totalManagers = boot.total_players || 0; // إجمالي عدد مديري الفانتازي — لازم لحساب مؤشر توقع تغيير الأسعار

  const clubTag = {}, clubName = {}, teamIdToKey = {}, clubCode = {};
  teams.forEach(t=>{
    const key = (t.short_name || t.name.slice(0,3)).toLowerCase();
    teamIdToKey[t.id] = key;
    clubTag[key] = t.short_name;
    clubName[key] = t.name;
    clubCode[key] = t.code; // مهم جداً عشان نجيب لوجو النادي
  });

  let parsedFixtures = [];
  let liveTeams = new Set();

  // الجولة الحالية: لو الموسم شغال ناخد الجولة الجارية، لو لسه مبدأش ناخد أول جولة قادمة
  const currentEvent = events.find(e=>e.is_current) || events.find(e=>e.is_next) || events[events.length-1];
  const gwId = currentEvent ? currentEvent.id : 1;

  // نجيب نقط لحظية لآخر 5 جولات متخلصة + الجولة الحالية عشان نبني "فورم موزون"
  // (الجولات الأقرب ليها وزن أكبر في الحساب، مش كل الجولات بنفس الأهمية)
  const finishedIds = events.filter(e=>e.finished).map(e=>e.id).slice(-5);
  const liveIds = Array.from(new Set([...finishedIds, gwId]));
  const historyByElement = {};
  // بونص لحظي: بنسجل الـ bps ورقم المباراة (fixture) لكل لاعب في الجولة الحالية بس،
  // عشان بعدين نرتبهم جوه كل مباراة ونديهم بونص افتراضي (3/2/1) قبل ما يتأكد رسمياً
  const currentGwBps = {};
  // دقايق ولو اتأسس اللاعب في الجولة الحالية — عشان نعرف مين "نازل الملعب فعليًا" دلوقتي
  // (مش بس إن فريقه بيلعب)، ومين لسه على دكة الاحتياط
  const currentGwMinutes = {};
  const currentGwStarted = {};
  // إحصائيات لحظية للجولة الحالية لكل لاعب (جول/أسيست/كروت) — دي اللي بنقارنها
  // بالنسخة اللي قبلها (state.lastKnownStats) عشان نطلع إشعار فوري لكل حدث جديد
  // بيخص لاعب من تشكيلة اليوزر (شوف diffPlayerStats تحت).
  const currentGwGoals = {};
  const currentGwAssists = {};
  const currentGwYellow = {};
  const currentGwRed = {};
  for(const evId of liveIds){
    try{
      const live = await fplFetch('live', evId);
      (live.elements || []).forEach(row=>{
        const pts = row.stats ? row.stats.total_points : 0;
        if(!historyByElement[row.id]) historyByElement[row.id] = [];
        historyByElement[row.id].push({ gw: evId, pts: pts||0 });
        if(evId === gwId){
          const bps = row.stats ? (row.stats.bps || 0) : 0;
          const fx = (row.explain && row.explain[0] && row.explain[0].fixture) || null;
          currentGwBps[row.id] = { bps: bps, fixtureId: fx };
          currentGwMinutes[row.id] = row.stats ? (row.stats.minutes || 0) : 0;
          currentGwStarted[row.id] = !!(row.stats && row.stats.starts);
          currentGwGoals[row.id] = row.stats ? (row.stats.goals_scored || 0) : 0;
          currentGwAssists[row.id] = row.stats ? (row.stats.assists || 0) : 0;
          currentGwYellow[row.id] = row.stats ? (row.stats.yellow_cards || 0) : 0;
          currentGwRed[row.id] = row.stats ? (row.stats.red_cards || 0) : 0;
        }
      });
    }catch(e){ /* لو جولة معينة فشلت نكمل من غيرها */ }
  }

  // مباريات الجولة الحالية — نبني نص "ضد X (أرض/خارج)" لكل نادي
  // + بيانات صعوبة المباراة (FDR) وقوة هجوم/دفاع كل نادي، عشان محرك التوقعات
  // (توقع النقط / كلين شيت / نصايح البيع والشراء) يعتمد عليها بدل ما يخمّن.
  const teamsById = {};
  teams.forEach(t=>{ teamsById[t.id] = t; });

  const fixturesMap = {};
  const teamFixtures = {}; // clubKey -> { oppKey, isHome, fdr, ownDefHome/Away, oppAtkHome/Away, lookahead, avgFdrNext3 }
  var provisionalBonusByElement = {};
  var hasLiveNow = false;
  try{
    // بنجيب كل مباريات الموسم مرة واحدة (فيها cache في البروكسي)، ومنها بنستخرج
    // مباريات الجولة الحالية + "نظرة قدام" على أقرب 3 مباريات جاية لكل نادي —
    // ده بيخلي نصايح البيع والشراء أدق من الاعتماد على مباراة واحدة بس.
    const allFx = await fplFetch('fixtures');
    const gwFx = (allFx || []).filter(f=>f.event===gwId);

    // بناء بيانات مركز المباريات وتحديد الأندية اللي بتلعب لايف دلوقتي
    parsedFixtures = gwFx.map(f => {
      const hKey = teamIdToKey[f.team_h];
      const aKey = teamIdToKey[f.team_a];

      // لو الماتش شغال ومخلصش، علم إن الفرقتين دول "لايف"
      if (f.started && !f.finished_provisional && !f.finished) {
        if (hKey) liveTeams.add(hKey);
        if (aKey) liveTeams.add(aKey);
      }

      return {
        id: f.id, team_h: hKey, team_a: aKey,
        score_h: f.team_h_score, score_a: f.team_a_score,
        started: f.started, finished: f.finished_provisional || f.finished,
        minutes: f.minutes, kickoff: f.kickoff_time, stats: f.stats
      };
    });

    gwFx.forEach(f=>{
      const hKey = teamIdToKey[f.team_h], aKey = teamIdToKey[f.team_a];
      const hTeam = teamsById[f.team_h], aTeam = teamsById[f.team_a];
      if(hKey && aKey){
        fixturesMap[hKey] = 'ضد ' + (clubTag[aKey]||'') + ' (أرض)';
        fixturesMap[aKey] = 'ضد ' + (clubTag[hKey]||'') + ' (خارج)';
      }
      if(hKey && aKey && hTeam && aTeam){
        teamFixtures[hKey] = {
          oppKey: aKey, isHome: true, fdr: f.team_h_difficulty || 3,
          ownDefHome: hTeam.strength_defence_home, ownDefAway: hTeam.strength_defence_away,
          oppAtkHome: aTeam.strength_attack_home, oppAtkAway: aTeam.strength_attack_away,
        };
        teamFixtures[aKey] = {
          oppKey: hKey, isHome: false, fdr: f.team_a_difficulty || 3,
          ownDefHome: aTeam.strength_defence_home, ownDefAway: aTeam.strength_defence_away,
          oppAtkHome: hTeam.strength_attack_home, oppAtkAway: hTeam.strength_attack_away,
        };
      }
    });

    // بونص لحظي (Provisional Bonus): بنجمع لاعبين كل مباراة لسه شغالة (بدأت ولسه ما خلصتش)
    // ونرتبهم حسب الـ bps تنازلي، ونديهم 3/2/1 زي قاعدة الفانتازي الرسمية —
    // لو فيه تعادل في الـ bps بين لاعبين أو أكتر بياخدوا نفس البونص وبيتخطى الترتيب اللي بعدهم
    var liveFixtureIds = new Set(gwFx.filter(f=>f.started && !f.finished).map(f=>f.id));
    hasLiveNow = liveFixtureIds.size > 0;
    var bpsByFixture = {};
    Object.keys(currentGwBps).forEach(function(elIdStr){
      var info = currentGwBps[elIdStr];
      if(info.fixtureId!=null && liveFixtureIds.has(info.fixtureId)){
        var fxKey = String(info.fixtureId);
        (bpsByFixture[fxKey] = bpsByFixture[fxKey] || []).push({ id: Number(elIdStr), bps: info.bps });
      }
    });
    Object.keys(bpsByFixture).forEach(function(fxKey){
      var list = bpsByFixture[fxKey];
      var distinctBps = Array.from(new Set(list.map(function(x){ return x.bps; }))).sort(function(a,b){ return b-a; });
      var bonusTiers = [3,2,1];
      var rankIdx = 0;
      distinctBps.forEach(function(bpsVal){
        if(rankIdx >= bonusTiers.length || bpsVal<=0) return;
        var tied = list.filter(function(x){ return x.bps===bpsVal; });
        var bonus = bonusTiers[rankIdx];
        tied.forEach(function(pl){ provisionalBonusByElement[pl.id] = bonus; });
        rankIdx += tied.length;
      });
    });
    // نضيف البونص الافتراضي لإجمالي نقاط اللاعب في الجولة الحالية جوه الـ history
    Object.keys(provisionalBonusByElement).forEach(function(elIdStr){
      var elId = Number(elIdStr);
      var bonus = provisionalBonusByElement[elId];
      var hist = historyByElement[elId];
      if(hist){
        var cur = hist.find(function(h){ return h.gw===gwId; });
        if(cur) cur.pts += bonus;
      }
    });

    // نظرة قدام: أقرب 3 مباريات لسه ما اتلعبتش لكل نادي (بتاخد بعضها لو فيه جولة مزدوجة)
    const upcoming = (allFx || [])
      .filter(f=>!f.finished && f.event!=null && f.event>=gwId)
      .sort((a,b)=>a.event-b.event);
    const lookaheadByTeam = {};
    upcoming.forEach(f=>{
      const hKey = teamIdToKey[f.team_h], aKey = teamIdToKey[f.team_a];
      if(hKey){ (lookaheadByTeam[hKey]=lookaheadByTeam[hKey]||[]).push({ event:f.event, fdr:f.team_h_difficulty||3, isHome:true, oppKey:aKey }); }
      if(aKey){ (lookaheadByTeam[aKey]=lookaheadByTeam[aKey]||[]).push({ event:f.event, fdr:f.team_a_difficulty||3, isHome:false, oppKey:hKey }); }
    });
    Object.keys(lookaheadByTeam).forEach(key=>{
      const list = lookaheadByTeam[key].slice(0,3);
      const avgFdr = list.length ? list.reduce((s,x)=>s+x.fdr,0)/list.length : 3;
      if(!teamFixtures[key]) teamFixtures[key] = {}; // نادي معندوش مباراة الجولة دي (bye) لسه ممكن يكون عنده نظرة قدام
      teamFixtures[key].lookahead = list;
      teamFixtures[key].avgFdrNext3 = avgFdr;
    });
  }catch(e){}

  const players = elements.map(el=>{
    const club = teamIdToKey[el.team] || 'unk';
    const hist = (historyByElement[el.id]||[]).sort((a,b)=>a.gw-b.gw);
    const matchesPlayed = el.starts || Math.round((el.minutes||0)/90) || 0;
    return {
      id: el.id,
      code: el.code,
      teamCode: el.team_code,
      name: el.web_name,
      club: club,
      pos: POS_MAP[el.element_type] || 'MID',
      price: (el.now_cost||0) / 10,
      num: el.squad_number || '',
      ownership: parseFloat(el.selected_by_percent) || 0,
      priceChange: (el.cost_change_event||0) / 10,
      transfersInEvent: el.transfers_in_event || 0,   // عدد مرات الشراء من بداية الجولة الحالية (مؤشر توقع تغيير السعر)
      transfersOutEvent: el.transfers_out_event || 0, // عدد مرات البيع من بداية الجولة الحالية
      totalPointsReal: el.total_points || 0,
      status: el.status, // a=متاح, i=مصاب, s=موقوف, d=مشكوك فيه
      history: hist,
      provisionalBonus: provisionalBonusByElement[el.id] || 0, // بونص لحظي غير مؤكد لسه (مبني على bps المباراة الجارية)
      // ===== حقول إضافية لمحرك التوقعات (كلها من الـ API الرسمي) =====
      epNext: parseFloat(el.ep_next) || 0,               // توقع FPL الرسمي لنقط الجولة الجاية
      form: parseFloat(el.form) || 0,                     // متوسط نقط آخر جولات (رسمي)
      formWeighted: weightedFormPts(hist),                // فورم موزون: الجولات الأقرب ليها وزن أكبر
      minutes: el.minutes || 0,
      chanceNext: (el.chance_of_playing_next_round==null) ? 100 : el.chance_of_playing_next_round,
      // ===== إحصائيات متقدمة (xG/xA/ICT) عشان توقع النقط يبقى مبني على "استحقاق"
      // اللاعب الفعلي مش بس النتايج اللي حصلت، ده بيقلل أثر الحظ (زي تسديدة اترد من القايم) =====
      xG90: parseFloat(el.expected_goals_per_90) || 0,           // أهداف متوقعة لكل 90 دقيقة
      xA90: parseFloat(el.expected_assists_per_90) || 0,         // أسيستات متوقعة لكل 90 دقيقة
      xGC90: parseFloat(el.expected_goals_conceded_per_90) || 0, // أهداف متوقع استقبالها لكل 90 دقيقة (لمحرك الكلين شيت)
      savesPer90: parseFloat(el.saves_per_90) || 0,
      ictIndex: parseFloat(el.ict_index) || 0,
      pointsPerGame: parseFloat(el.points_per_game) || 0,
      bonusPerMatch: matchesPlayed ? (el.bonus||0) / matchesPlayed : 0,
      // نسبة الجولات اللي اتأسس فيها من بداية الموسم لحد دلوقتي — مؤشر تقريبي لخطر الدوران
      startsFactor: gwId>1 ? Math.min(1, matchesPlayed / (gwId-1)) : (matchesPlayed>0?1:0),
      // لاعب ضربات ثابتة أساسي (بنالتي/فري كيك/كورنر) — بونص إضافي في نصايح الشراء
      setPiece: el.penalties_order===1 ? 'بنالتي أساسي'
               : el.direct_freekicks_order===1 ? 'ضربات حرة'
               : el.corners_and_indirect_freekicks_order===1 ? 'كورنرات'
               : null,
      // بيلعب دلوقتي فعليًا = مباراة فريقه شغالة + هو نازل الملعب (اتأسس أو عنده دقايق already)
      // مش مجرد إن فريقه بيلعب (عشان محدش على الدكة يتحط عليه هايلايت غلط)
      isPlayingLive: liveTeams.has(club) && (currentGwStarted[el.id] || (currentGwMinutes[el.id]||0) > 0),
      gwMinutes: currentGwMinutes[el.id] || 0,
      gwStarted: !!currentGwStarted[el.id],
      // إحصائيات الجولة الحالية اللحظية (بتتقارن بالنسخة اللي قبلها لتوليد إشعارات الأحداث)
      gwGoals: currentGwGoals[el.id] || 0,
      gwAssists: currentGwAssists[el.id] || 0,
      gwYellow: currentGwYellow[el.id] || 0,
      gwRed: currentGwRed[el.id] || 0,
    };
  });

  const gwInfo = {
    current: gwId,
    deadline: currentEvent ? currentEvent.deadline_time : new Date(Date.now()+86400000).toISOString(),
    fixtures: fixturesMap,
  };

  return { players, gwInfo, clubTag, clubName, clubCode, teamFixtures, totalManagers, live: hasLiveNow, fixturesList: parsedFixtures };
}

// ===== إشعارات أحداث اللاعبين اللحظية =====
// بتضيف حدث جديد لقايمة state.liveEventNotifs (الأحدث فوق)، وبتحدد سقف 40 عنصر
// عشان القايمة متكبرش من غير داعي على مدار مباريات كتير.
function pushLiveNotif(entry){
  entry.id = 'ev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  entry.ts = Date.now();
  state.liveEventNotifs.unshift(entry);
  if(state.liveEventNotifs.length > 40) state.liveEventNotifs.length = 40;
}

// نقط الهدف حسب المركز (نفس قاعدة فانتازي البريميرليج الرسمية: حراس/مدافعين 6، وسط 5، مهاجمين 4)
const GOAL_PTS_BY_POS = { GK:6, DEF:6, MID:5, FWD:4 };

// بتقارن كل لاعب من تشكيلة اليوزر بآخر نسخة معروفة من إحصائياته (state.lastKnownStats)،
// ولو لقت فرق في الأهداف/الأسيست/الكروت/البونص اللحظي بتولّد إشعار جديد فوري.
// أول مرة (مفيش نسخة قديمة محفوظة للاعب) بنسجّل بس القيم الحالية كخط أساس من غير إشعار،
// عشان مانطلعش إشعارات وهمية لأحداث حصلت قبل ما اليوزر يفتح التطبيق أصلاً.
function diffPlayerStats(newPlayers){
  const squadIds = new Set(state.mySquadIds.map(e => e.id));
  newPlayers.forEach(p=>{
    if(!squadIds.has(p.id)) return;
    const cur = { goals: p.gwGoals||0, assists: p.gwAssists||0, yellow: p.gwYellow||0, red: p.gwRed||0, bonus: p.provisionalBonus||0 };
    const prev = state.lastKnownStats[p.id];
    state.lastKnownStats[p.id] = cur;
    if(!prev) return; // خط أساس بس، من غير إشعار

    if(cur.goals > prev.goals){
      const n = cur.goals - prev.goals;
      const pts = (GOAL_PTS_BY_POS[p.pos]||4) * n;
      pushLiveNotif({
        kind:'goal', color:'#2ed573', icon: ICON_GOAL,
        title: p.name + ' سجل هدف ⚽' + (n>1 ? ' (×'+n+')' : ''),
        sub: 'من تشكيلتك — تقريبًا +' + pts + ' نقطة'
      });
    }
    if(cur.assists > prev.assists){
      const n = cur.assists - prev.assists;
      pushLiveNotif({
        kind:'assist', color:'#8FCBF2', icon: ICON_ASSIST,
        title: p.name + ' صنع هدف 🎯' + (n>1 ? ' (×'+n+')' : ''),
        sub: 'من تشكيلتك — تقريبًا +' + (3*n) + ' نقطة'
      });
    }
    if(cur.yellow > prev.yellow){
      pushLiveNotif({
        kind:'yellow', color:'var(--gold)', icon: '<div class="card-icon yellow"></div>',
        title: p.name + ' حصل على إنذار',
        sub: 'كارت أصفر — -1 نقطة، وخطر الطرد لو اتكرر'
      });
    }
    if(cur.red > prev.red){
      pushLiveNotif({
        kind:'red', color:'var(--coral)', icon: '<div class="card-icon red"></div>',
        title: p.name + ' طرد بالكارت الأحمر',
        sub: '-3 نقاط، وهيأثر على نقط باقي زمايله في المباراة'
      });
    }
    if(cur.bonus > prev.bonus){
      pushLiveNotif({
        kind:'bonus', color:'var(--gold)', icon: ICON_STAR,
        title: p.name + ' يتصدّر ترتيب البونص الآن',
        sub: 'بونص لحظي +' + cur.bonus + ' نقطة (غير مؤكد لحد ما تنتهي المباراة رسمياً)'
      });
    }
  });
}

// بتقارن نتيجة كل مباراة بآخر نسخة معروفة (state.lastKnownScores)، ولو فريق فيه لاعب
// من تشكيلة اليوزر (حارس/مدافع/وسط — المراكز اللي بتستفيد من الكلين شيت) استقبل هدف
// وهو نازل الملعب فعليًا، بتولّد إشعار "تسرب هدف" لأن فرصة الكلين شيت بتاعته راحت.
function diffFixtureScores(newFixturesList){
  const squadIds = new Set(state.mySquadIds.map(e => e.id));
  (newFixturesList||[]).forEach(f=>{
    if(f.score_h==null || f.score_a==null) return;
    const prev = state.lastKnownScores[f.id];
    state.lastKnownScores[f.id] = { h:f.score_h, a:f.score_a };
    if(!prev) return; // خط أساس بس، من غير إشعار

    if(f.score_a > prev.a) notifyConcede(f.team_h, f, squadIds);
    if(f.score_h > prev.h) notifyConcede(f.team_a, f, squadIds);
  });
}
function notifyConcede(clubKey, f, squadIds){
  if(!clubKey) return;
  state.players
    .filter(p => p.club===clubKey && squadIds.has(p.id) && (p.pos==='GK'||p.pos==='DEF'||p.pos==='MID') && (p.isPlayingLive || (p.gwMinutes||0) > 0))
    .forEach(p=>{
      pushLiveNotif({
        kind:'csleak', color:'var(--coral)', icon: ICON_WARN,
        title: 'تسرب هدف لمرمى ' + (CLUB_NAME[clubKey] || CLUB_TAG[clubKey] || ''),
        sub: p.name + ' — النتيجة الآن ' + f.score_h + ' : ' + f.score_a + ' (فرصة الكلين شيت راحت)'
      });
    });
}

async function loadLiveData(force){
  try{
    if(!force){
      const cachedRaw = await sGet(LIVE_CACHE_KEY, true);
      if(cachedRaw){
        const cached = JSON.parse(cachedRaw);
        const ttl = cached.live ? LIVE_CACHE_TTL_ACTIVE : LIVE_CACHE_TTL;
        if(cached.cachedAt && (Date.now() - cached.cachedAt) < ttl){
          applyLiveDataset(cached);
          state.liveSyncedAt = cached.cachedAt;
          state.liveDataError = false; state.liveDataStale = false;
          return;
        }
      }
    }
    const fresh = await buildLiveDataset();
    fresh.cachedAt = Date.now();
    applyLiveDataset(fresh);
    state.liveSyncedAt = fresh.cachedAt;
    state.liveDataError = false; state.liveDataStale = false;
    await sSet(LIVE_CACHE_KEY, JSON.stringify(fresh), true);
  }catch(e){
    // فشل الاتصال — نستخدم آخر نسخة متخزنة لو موجودة، وإلا بيانات احتياطية بسيطة
    const cachedRaw = await sGet(LIVE_CACHE_KEY, true);
    if(cachedRaw){
      const cached = JSON.parse(cachedRaw);
      applyLiveDataset(cached);
      state.liveSyncedAt = cached.cachedAt;
      state.liveDataStale = true;
    } else {
      state.players = SEED_PLAYERS;
      state.gwInfo = SEED_GW;
      CLUB_TAG = FALLBACK_CLUB_TAG;
      CLUB_NAME = FALLBACK_CLUB_NAME;
      state.liveDataError = true;
    }
  }
}
let CLUB_CODE = {};
function applyLiveDataset(d){
  // توليد إشعارات أحداث اللاعبين (جول/أسيست/كارت/بونص) بمقارنة القديم بالجديد،
  // قبل استبدال state.players، عشان القيم الجديدة تبقى واضحة في d.players.
  diffPlayerStats(d.players || []);
  state.players = d.players;
  // إشعار تسرب الأهداف بيحتاج state.players الجديد (عشان isPlayingLive/gwMinutes
  // يعكسوا آخر حالة للاعب وقت الهدف)، فبنستدعيه بعد استبدال بيانات اللاعبين.
  diffFixtureScores(d.fixturesList || []);
  state.gwInfo = d.gwInfo;
  CLUB_TAG = d.clubTag;
  CLUB_NAME = d.clubName;
  CLUB_CODE = d.clubCode || {};
  state.teamFixtures = d.teamFixtures || {};
  state.totalManagers = d.totalManagers || 0;
  state.hasLiveFixtures = d.live || false;
  state.fixturesList = d.fixturesList || [];
}

function jerseyClass(p){ return p.pos==='GK' ? 'gk' : p.club; }
function fmt(n){ return Number(n).toFixed(1); }
function fmtCount(n){ // بيفرمت رقم التحويلات بشكل مختصر (زي 12.3K)
  const a = Math.abs(n);
  const sign = n<0 ? '-' : '';
  if(a >= 1000) return sign + (a/1000).toFixed(1) + 'K';
  return sign + String(a);
}
function findPlayer(id){ return state.players.find(p=>p.id===id); }
function totalPoints(p){ return (p.totalPointsReal!=null) ? p.totalPointsReal : (p.history||[]).reduce((s,h)=>s+h.pts,0); }
function currentGwPoints(p){ const h=(p.history||[]).find(h=>h.gw===state.gwInfo.current); return h?h.pts:0; }
// بيحدد حالة مباراة اللاعب دلوقتي: لسه ماجاش، شغالة، أو خلصت — عشان نعرض الوقت أو النقط بشكل مناسب
// دالة بتعرف هل ماتش اللاعب بدأ، وبتجيب اختصار اسم الخصم (مثال: BOU (H))
function getPlayerMatchStatus(p) {
  let started = false;
  let isLive = false;
  let fixtureText = '-';

  if (state.fixturesList && state.fixturesList.length) {
    const fx = state.fixturesList.find(f => f.team_h === p.club || f.team_a === p.club);
    if (fx) {
      started = fx.started;
      isLive = fx.started && !fx.finished;
      const isHome = fx.team_h === p.club;
      const opp = isHome ? CLUB_TAG[fx.team_a] : CLUB_TAG[fx.team_h];
      fixtureText = (opp || '؟') + (isHome ? ' (H)' : ' (A)');
    }
  } else {
     if(currentGwPoints(p) > 0 || p.minutes > 0) started = true;
     fixtureText = (state.gwInfo.fixtures[p.club] || '').split(' ')[1] || '-';
     if(!fixtureText.includes('(')) fixtureText += ' (H)';
  }
  return { started, isLive, fixtureText };
}
function lastForm(p, n){ return (p.history||[]).slice(-n); }

// المباراة الجاية لنادي معين (الجولة اللي بعد الحالية) — بتتستخدم في عرض مسودة تشكيلة الجولة الجاية
function nextFixtureText(club){
  const tf = state.teamFixtures && state.teamFixtures[club];
  const nextGw = (state.gwInfo && state.gwInfo.current || 1) + 1;
  if(tf && tf.lookahead && tf.lookahead.length){
    const nf = tf.lookahead.find(x=>x.event===nextGw) || tf.lookahead.find(x=>x.event > (state.gwInfo.current||1));
    if(nf){
      const opp = CLUB_TAG[nf.oppKey] || '؟';
      return opp + (nf.isHome ? ' (H)' : ' (A)');
    }
  }
  return '-';
}

function squad(ids){ const list = ids || state.mySquadIds; return list.map(e=>{ const p=findPlayer(e.id); return p?Object.assign({},p,{slot:e.slot}):null; }).filter(Boolean); }
function starters(ids){ return squad(ids).filter(p=>p.slot==='start'); }
function benched(ids){ return squad(ids).filter(p=>p.slot==='bench'); }
function captain(){ return findPlayer(state.captainId); }
function pool(ids){ const list = ids || state.mySquadIds; const owned=new Set(list.map(e=>e.id)); return state.players.filter(p=>!owned.has(p.id)); }

// ===== قفل الجولة: لو الديدلاين فات بقى فيه مباريات شغالة/هتشتغل، والتشكيلة الرسمية اتقفلت =====
// أي تعديل (كابتن / تبديل احتياطي / انتقال) في الحالة دي مينفعش يأثر على الجولة الشغالة —
// فبيتسجل كـ"مسودة" للجولة الجاية وبتتطبق تلقائيًا لما الجولة دي توصل.
function isGwLocked(){
  return !!(state.gwInfo && new Date(state.gwInfo.deadline).getTime() < Date.now());
}
function ensureDraftLoaded(){
  if(!state.draftSquadIds){
    state.draftSquadIds = state.mySquadIds.map(e=>Object.assign({}, e));
    state.draftCaptainId = state.captainId;
    state.draftBank = state.bank;
    state.draftFreeTransfers = state.freeTransfers;
    state.draftForGw = (state.gwInfo && state.gwInfo.current || 1) + 1;
  }
}
function activeIds(){ if(isGwLocked()){ ensureDraftLoaded(); return state.draftSquadIds; } return state.mySquadIds; }
function activeCaptainId(){ if(isGwLocked()){ ensureDraftLoaded(); return state.draftCaptainId; } return state.captainId; }
function activeBank(){ if(isGwLocked()){ ensureDraftLoaded(); return state.draftBank; } return state.bank; }
function activeFreeTransfers(){ if(isGwLocked()){ ensureDraftLoaded(); return state.draftFreeTransfers; } return state.freeTransfers; }
async function saveActive(){

      draftForGw: state.draftForGw, mySquadIds: state.draftSquadIds, captainId: state.draftCaptainId,

    }), false);
