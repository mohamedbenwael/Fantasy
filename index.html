<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>المزاريطة فانتازي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#020305;
    min-height:100vh;
    font-family:'Tajawal', sans-serif;
  }
  button{ font-family:inherit; border:none; background:none; cursor:pointer; }
  input{ font-family:inherit; }

  :root{
    --pitch1:#0FBE5E; --pitch2:#0A9A4B;
    --ink:#0A0512;
    --card:#150A1F;
    --card-line:rgba(255,255,255,0.07);
    --green:#00E676; --green-soft:#7CFFC2; --green-deep:#00A85B;
    --gold:#E8C468;
    --coral:#FF4D6D;
    --muted:rgba(235,238,244,0.52);
    --muted2:rgba(235,238,244,0.34);
    --text:#F3F5F8;
  }

  /* ===== app screen (no phone frame — fills the real viewport) ===== */
  .screen{
    width:100%; max-width:480px; margin:0 auto;
    min-height:100vh;
    background:
      radial-gradient(140% 30% at 8% -4%, rgba(0,230,118,0.09) 0%, transparent 55%),
      radial-gradient(130% 34% at 100% -6%, rgba(92,18,104,0.38) 0%, transparent 55%),
      var(--ink);
    position:relative;
    display:flex; flex-direction:column;
  }

  #app-body{ flex:1; padding-bottom:100px; position:relative; }

  .i{ width:18px; height:18px; stroke:currentColor; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; display:block; }

  /* ===== generic top title bar (non-home tabs) ===== */
  .topbar{ padding:22px 20px 4px; display:flex; align-items:center; justify-content:space-between; }
  .topbar h1{ font-family:'Cairo'; font-weight:800; font-size:16px; color:var(--text); }
  .topbar .back{
    width:34px; height:34px; border-radius:10px; background:var(--card); border:1px solid var(--card-line);
    display:flex; align-items:center; justify-content:center; color:var(--text);
  }
  .topbar .spacer{ width:34px; }

  /* ===== header (home) ===== */
  .header{ padding:22px 20px 4px; display:flex; align-items:center; justify-content:space-between; position:relative; }
  .brand{ display:flex; align-items:center; gap:11px; }
  .crest{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 32% 26%, #4A1257, #17081F 72%);
    border:1px solid rgba(0,230,118,0.38);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .crest::before{
    content:''; position:absolute; inset:3px; border-radius:50%;
    border:1px solid rgba(0,230,118,0.16);
  }
  .crest span{ font-family:'Cairo'; font-weight:900; font-size:14px; color:var(--green-soft); letter-spacing:-0.5px; }
  .greet .hi{ font-size:11px; color:var(--muted); }
  .greet .name{ font-family:'Cairo'; font-weight:800; font-size:15.5px; color:var(--text); margin-top:2px; letter-spacing:0.1px; }
  .header-actions{ display:flex; align-items:center; gap:8px; }
  .icon-btn{
    width:38px; height:38px; border-radius:12px; background:var(--card);
    border:1px solid var(--card-line);
    display:flex; align-items:center; justify-content:center; position:relative;
    color:var(--muted);
  }
  .icon-btn .dot{
    position:absolute; top:8px; right:8px; width:5px; height:5px; border-radius:50%;
    background:var(--coral); box-shadow:0 0 0 2px var(--card);
  }
  .icon-btn.spin svg{ animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .notif-panel{
    position:absolute; top:64px; left:20px; width:250px; background:var(--card);
    border:1px solid var(--card-line); border-radius:14px; padding:6px; z-index:50;
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
  }
  .notif-panel .n-item{ padding:10px 10px; border-radius:10px; }
  .notif-panel .n-item:not(:last-child){ border-bottom:1px solid var(--card-line); }
  .notif-panel .n-item .t1{ font-size:11.5px; color:var(--text); font-weight:700; font-family:'Cairo'; }
  .notif-panel .n-item .t2{ font-size:10px; color:var(--muted); margin-top:2px; }

  /* ===== live pill ===== */
  .live-pill{
    margin:12px 20px 0; display:flex; align-items:center; gap:6px; width:fit-content;
    font-size:10px; font-weight:800; font-family:'Cairo'; color:var(--green-soft);
    background:rgba(0,230,118,0.1); border:1px solid rgba(0,230,118,0.25);
    padding:5px 10px; border-radius:20px;
  }
  .live-pill .dotpulse{ width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(0,230,118,0.6); animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(0,230,118,0.5);} 70%{box-shadow:0 0 0 6px rgba(0,230,118,0);} 100%{box-shadow:0 0 0 0 rgba(0,230,118,0);} }
  .live-pill.warn{ color:var(--coral); background:rgba(255,77,109,0.1); border-color:rgba(255,77,109,0.28); }
  .live-pill.warn .dotpulse{ background:var(--coral); }
  .live-synced{ font-size:9.5px; color:var(--muted); margin:4px 20px 0; }
  .rank-live-badge{ display:inline-block; font-family:'Cairo'; font-weight:800; font-size:7.5px; color:#04321B; background:var(--green-soft); padding:1px 5px; border-radius:6px; margin-inline-start:5px; vertical-align:middle; }
  .bonus-badge{ font-family:'Cairo'; font-weight:800; font-size:9px; color:#241A08; background:var(--gold); padding:1px 6px; border-radius:6px; white-space:nowrap; flex-shrink:0; margin-inline-start:5px; }
  .ppts.has-bonus{ background:var(--gold); color:#241A08; }

  /* ===== deadline strip ===== */
  .deadline{
    margin:14px 20px 0; padding:13px 16px; border-radius:14px;
    background:linear-gradient(90deg, rgba(92,18,104,0.32), rgba(92,18,104,0.06));
    border:1px solid rgba(160,60,190,0.32);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .deadline .left{ display:flex; align-items:center; gap:10px; }
  .deadline .ic{ color:var(--green-soft); flex-shrink:0; }
  .deadline .lbl{ font-size:10px; color:var(--muted); }
  .deadline .val{ font-family:'Cairo'; font-weight:800; font-size:13.5px; color:var(--text); margin-top:2px; }
  .deadline .cta{
    font-family:'Cairo'; font-weight:800; font-size:11px; color:#04321B;
    background:linear-gradient(160deg,var(--green-soft),var(--green-deep));
    padding:9px 15px; border-radius:11px; white-space:nowrap; letter-spacing:0.2px;
  }

  /* ===== points summary ===== */
  .summary{
    margin:14px 20px 0; padding:20px; border-radius:18px;
    background:linear-gradient(165deg, #3A0F45 0%, #1B0A22 100%);
    border:1px solid rgba(255,255,255,0.06);
    position:relative; overflow:hidden;
  }
  .summary::after{
    content:''; position:absolute; width:200px; height:200px; border-radius:50%;
    background:radial-gradient(circle, rgba(0,230,118,0.10), transparent 70%);
    top:-90px; left:-60px; pointer-events:none;
  }
  .summary-top{ display:flex; justify-content:space-between; align-items:flex-start; position:relative; }
  .summary-top .lbl{ font-size:10.5px; color:var(--muted); letter-spacing:0.2px; }
  .summary-top .big{ font-family:'Cairo'; font-weight:900; font-size:32px; color:var(--text); margin-top:4px; }
  .summary-top .big span{ font-size:13px; color:var(--muted); font-weight:500; }
  .badge-rank{
    display:flex; align-items:center; gap:4px;
    font-family:'Cairo'; font-weight:700; font-size:10px; color:var(--green-soft);
    background:rgba(0,230,118,0.12); border:1px solid rgba(0,230,118,0.28);
    padding:6px 10px 6px 8px; border-radius:20px; white-space:nowrap;
  }
  .badge-rank svg{ width:11px; height:11px; }
  .summary-grid{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:18px; position:relative;
  }
  .summary-grid .cell{ text-align:center; padding-top:12px; border-top:1px solid rgba(255,255,255,0.07); }
  .summary-grid .cell .v{ font-family:'Cairo'; font-weight:800; font-size:14.5px; color:var(--text); }
  .summary-grid .cell .k{ font-size:9.5px; color:var(--muted); margin-top:3px; }

  /* ===== section title ===== */
  .section-title{ display:flex; align-items:center; justify-content:space-between; margin:22px 20px 10px; }
  .section-title h2{ font-family:'Cairo'; font-weight:800; font-size:14px; color:var(--text); }
  .section-title a{ font-size:11px; color:var(--green-soft); font-weight:700; display:flex; align-items:center; gap:2px; }
  .section-title a svg{ width:13px; height:13px; }

  /* ===== segmented control ===== */
  .segment{ margin:2px 20px 14px; display:flex; background:var(--card); border:1px solid var(--card-line); border-radius:12px; padding:4px; gap:4px; }
  .segment button{ flex:1; padding:8px 0; border-radius:9px; font-family:'Cairo'; font-weight:800; font-size:11.5px; color:var(--muted); }
  .segment button.on{ background:rgba(0,230,118,0.14); color:var(--green-soft); }
  .hint{ margin:0 20px 10px; font-size:10.5px; color:var(--muted); text-align:center; }

  /* ===== pitch ===== */
  .pitch-card{ margin:0 20px; border-radius:20px; overflow:hidden; border:1px solid rgba(255,255,255,0.06); box-shadow:0 18px 40px rgba(0,0,0,0.35); }
  .pitch{
    position:relative; padding:20px 10px 16px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 44px, transparent 44px 88px),
      radial-gradient(120% 90% at 50% 0%, var(--pitch1) 0%, var(--pitch2) 100%);
  }
  .pitch::before{ content:''; position:absolute; inset:10px; border:1.5px solid rgba(255,255,255,0.55); border-radius:4px; }
  .pitch::after{ content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:74px; height:74px; border:1.5px solid rgba(255,255,255,0.55); border-radius:50%; }
  .row{ display:flex; justify-content:center; gap:15px; position:relative; z-index:2; margin-bottom:15px; }
  .row:last-child{ margin-bottom:0; }
  .player{ display:flex; flex-direction:column; align-items:center; width:52px; cursor:pointer; }
  .jersey{
    width:36px; height:34px;
    clip-path:polygon(22% 0%, 38% 0%, 50% 13%, 62% 0%, 78% 0%, 100% 22%, 84% 36%, 84% 100%, 16% 100%, 16% 36%, 0% 22%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Cairo'; font-weight:900; font-size:11px;
    position:relative; cursor:pointer;
    box-shadow:0 0 0 1.5px rgba(255,255,255,0.5), 0 4px 8px rgba(0,0,0,0.3);
  }
  .jersey.selected{ box-shadow:0 0 0 2.5px var(--green-soft), 0 4px 10px rgba(0,0,0,0.4); }
  .jersey.gk{ background:linear-gradient(165deg,#3FA65C,#1B5C34); color:rgba(255,255,255,0.9); }
  .jersey.liv{ background:linear-gradient(165deg,#D3182C,#7A0C1E); color:rgba(255,255,255,0.9); }
  .jersey.ars{ background:linear-gradient(to bottom, #fff 0 16%, transparent 16%), linear-gradient(165deg,#EF0107,#9C0007); color:#fff; }
  .jersey.mci{ background:linear-gradient(165deg,#8FCBF2,#1C4E80); color:#0A2540; }
  .jersey.mun{ background:linear-gradient(to bottom, #111 0 14%, transparent 14%), linear-gradient(165deg,#DC2B20,#7A0F09); color:rgba(255,255,255,0.9); }
  .jersey.che{ background:linear-gradient(165deg,#2E6FD1,#0A2B5E); color:rgba(255,255,255,0.9); }
  .jersey.new{ background:repeating-linear-gradient(90deg,#0B0B0B 0 5px,#F5F5F5 5px 10px); color:#111; }
  .jersey.tot{ background:linear-gradient(to bottom, #14213D 0 14%, transparent 14%), linear-gradient(165deg,#fdfdfd,#cfcfcf); color:#0B1F3A; }

  /* ===== real shirt image (pitch + bench) ===== */
  .jersey.jersey-photo{
    clip-path:none;
    background:transparent;
    box-shadow:none;
    display:flex; align-items:center; justify-content:center;
  }
  .jersey.jersey-photo.selected{ box-shadow:none; }
  .jersey-shirt{ width:38px; height:auto; display:block; }
  .jersey.jersey-photo.selected .jersey-shirt{ outline:2.5px solid var(--green-soft); outline-offset:1px; border-radius:6px; }
  .bench .jersey-shirt{ width:28px; }

  .cap{
    position:absolute; top:-6px; left:-6px; width:15px; height:15px; border-radius:50%;
    background:var(--gold); color:#241A08; font-family:'Cairo'; font-weight:900; font-size:8.5px;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--pitch2);
  }
  .pname{ margin-top:6px; font-size:9px; color:var(--text); font-weight:700; background:rgba(0,0,0,0.55); padding:2px 7px; border-radius:6px; white-space:nowrap; cursor:pointer; }
  .ppts{ margin-top:3px; font-size:8px; color:#04321B; font-weight:800; background:var(--green-soft); padding:1px 6px; border-radius:5px; white-space:nowrap; }

  /* ===== placeholder jersey (empty slot) ===== */
  .jersey.placeholder{
    background:rgba(255,255,255,0.07);
    border:2px dashed rgba(255,255,255,0.22);
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.35);
    font-size:16px; font-weight:900;
    box-shadow:none;
    cursor:default;
  }
  .pname.placeholder-name{
    color:rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.04);
    font-size:8px;
  }

  .bench{ background:#0B0F14; padding:13px 16px; display:flex; gap:8px; justify-content:space-between; border-top:1px solid rgba(255,255,255,0.05); }
  .bench .player{ width:auto; opacity:0.85; }
  .bench .jersey{ width:29px; height:27px; font-size:9.5px; }
  .bench .pname{ font-size:8px; margin-top:5px; }

  /* ===== leagues ===== */
  .league-list{ margin:0 20px; display:flex; flex-direction:column; gap:9px; }
  .league-item{
    display:flex; align-items:center; justify-content:space-between; width:100%; text-align:right;
    background:var(--card); border:1px solid var(--card-line); padding:13px 16px; border-radius:14px;
  }
  .league-item .li-name{ font-family:'Cairo'; font-weight:700; font-size:12.5px; color:var(--text); }
  .league-item .li-sub{ font-size:10px; color:var(--muted); margin-top:3px; }
  .li-rank{ text-align:left; }
  .li-rank .num{ font-family:'Cairo'; font-weight:800; font-size:14.5px; color:var(--text); }
  .li-rank .chg{ font-size:9.5px; font-weight:700; margin-top:3px; display:flex; align-items:center; justify-content:flex-end; gap:2px; }
  .li-rank .chg svg{ width:9px; height:9px; }
  .up{ color:var(--green-soft); } .down{ color:var(--coral); }

  .standing-row{ display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--card-line); padding:11px 14px; border-radius:12px; }
  .standing-row .s-left{ display:flex; align-items:center; gap:10px; }
  .standing-row .s-rank{ font-family:'Cairo'; font-weight:800; font-size:12px; color:var(--muted); width:22px; }
  .standing-row .s-name{ font-family:'Cairo'; font-weight:700; font-size:12.5px; color:var(--text); }
  .standing-row .s-pts{ font-family:'Cairo'; font-weight:800; font-size:12.5px; color:var(--green-soft); }
  .standing-row.me{ border-color:rgba(0,230,118,0.35); background:rgba(0,230,118,0.06); }

  /* ===== transfer nudge ===== */
  .nudge{ margin:20px 20px 4px; padding:15px; border-radius:16px; background:linear-gradient(120deg, rgba(92,18,104,0.28), rgba(92,18,104,0.03)); border:1px solid rgba(160,60,190,0.26); display:flex; align-items:center; gap:12px; }
  .nudge .ic{ width:36px; height:36px; border-radius:11px; background:rgba(0,230,118,0.12); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--green-soft); }
  .nudge .txt .t1{ font-family:'Cairo'; font-weight:800; font-size:12px; color:var(--text); }
  .nudge .txt .t2{ font-size:10px; color:var(--muted); margin-top:3px; line-height:1.5; }

  /* ===== transfers screen ===== */
  .stat-strip{ margin:10px 20px 0; display:flex; gap:8px; }
  .stat-pill{ flex:1; background:var(--card); border:1px solid var(--card-line); border-radius:13px; padding:10px 8px; text-align:center; }
  .stat-pill .v{ font-family:'Cairo'; font-weight:800; font-size:14px; color:var(--text); }
  .stat-pill .k{ font-size:9px; color:var(--muted); margin-top:2px; }
  .msg-banner{ margin:10px 20px 0; padding:9px 12px; border-radius:10px; font-size:11px; font-weight:700; text-align:center; }
  .msg-banner.err{ background:rgba(255,77,109,0.14); color:var(--coral); border:1px solid rgba(255,77,109,0.3); }
  .msg-banner.ok{ background:rgba(0,230,118,0.12); color:var(--green-soft); border:1px solid rgba(0,230,118,0.28); }

  .p-row{ display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--card-line); padding:10px 14px; border-radius:13px; }
  .p-row.out-selected{ border-color:rgba(255,77,109,0.4); background:rgba(255,77,109,0.06); }
  .p-left{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .p-mini{ width:24px; height:23px; border-radius:5px; flex-shrink:0; box-shadow:0 0 0 1px rgba(255,255,255,0.4); }
  .p-mini.jersey-photo{ width:26px; height:auto; border-radius:0; box-shadow:none; background:transparent; flex-shrink:0; display:block; }
  .p-info .p-name{ font-family:'Cairo'; font-weight:700; font-size:12px; color:var(--text); }
  .p-info .p-meta{ font-size:9.5px; color:var(--muted); margin-top:2px; }
  .p-btn{ font-family:'Cairo'; font-weight:800; font-size:10.5px; padding:7px 13px; border-radius:9px; white-space:nowrap; }
  .p-btn.out{ background:rgba(255,77,109,0.14); color:var(--coral); border:1px solid rgba(255,77,109,0.3); }
  .p-btn.out.active{ background:var(--coral); color:#2B0007; }
  .p-btn.in{ background:rgba(0,230,118,0.14); color:var(--green-soft); border:1px solid rgba(0,230,118,0.3); }
  .p-btn.in:disabled{ opacity:0.35; }
  .pos-head{ margin:16px 20px 8px; font-family:'Cairo'; font-weight:800; font-size:11px; color:var(--muted); letter-spacing:0.5px; }

  /* ===== more tab ===== */
  .more-list{ margin:0 20px; display:flex; flex-direction:column; gap:8px; }
  .more-row{ display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--card-line); padding:13px 16px; border-radius:14px; }
  .more-row .m-left{ display:flex; align-items:center; gap:11px; color:var(--muted); }
  .more-row .m-left span{ font-family:'Cairo'; font-weight:700; font-size:12.5px; color:var(--text); }
  .more-row.danger .m-left span{ color:var(--coral); }
  .switch{ width:40px; height:23px; border-radius:20px; background:rgba(255,255,255,0.12); position:relative; transition:background .15s; flex-shrink:0; }
  .switch.on{ background:var(--green-deep); }
  .switch .knob{ position:absolute; top:2.5px; right:2.5px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s; }
  .switch.on .knob{ transform:translateX(-17px); }

  /* ===== bottom nav ===== */
  .navbar{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    width:calc(100% - 28px); max-width:452px;
    background:rgba(26,10,34,0.92); backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:20px; padding:9px 4px;
    display:flex; justify-content:space-around; align-items:center;
    z-index:30;
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:5px; font-size:9px; color:var(--muted2); font-weight:700; width:58px; }
  .nav-item svg{ width:19px; height:19px; stroke:currentColor; stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .nav-item.active{ color:var(--green-soft); }
  .nav-item.active svg{ stroke-width:1.9; }
  .nav-item .dash{ width:14px; height:2px; border-radius:2px; background:transparent; margin-top:1px; }
  .nav-item.active .dash{ background:var(--green); }

  /* ===== boot / onboarding ===== */
  .boot{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px; text-align:center; }
  .boot .spinner{ width:38px; height:38px; border-radius:50%; border:3px solid rgba(255,255,255,0.12); border-top-color:var(--green-soft); animation:spin .8s linear infinite; }
  .boot .t{ font-family:'Cairo'; font-weight:700; font-size:12.5px; color:var(--muted); }
  .boot .err{ color:var(--coral); font-size:11.5px; max-width:280px; }

const POS_MAP = {1:'GK',2:'DEF',3:'MID',4:'FWD'};

async function fplFetch(type, event){
  const url = FPL_ENDPOINT + '?type=' + type + (event ? '&event=' + event : '');
  const res = await fetch(url);
  if(!res.ok) throw new Error('fpl fetch failed: ' + type);
  return res.json();
}

// ===== جلب بيانات المدير الحقيقية (اسم المدير / اسم الفريق) والتحقق من الـ ID =====
async function fetchFplEntry(fplId){
  const id = String(fplId || '').trim();
  if(!id || !/^\d+$/.test(id)){
    return { error: 'رقم الـ FPL Team ID غير صحيح' };
  }
  try{
    const res = await fetch(FPL_ENDPOINT + '?type=entry&id=' + encodeURIComponent(id));
    if(res.status === 404){
      return { error: 'مفيش فريق بالـ ID ده. تأكد من الرقم وحاول تاني' };
    }
    if(!res.ok){
      return { error: 'حصل خطأ في الاتصال بـ FPL. حاول تاني' };
    }
    const data = await res.json();
    if(!data || (data.player_first_name == null && data.name == null)){
      return { error: 'مفيش فريق بالـ ID ده. تأكد من الرقم وحاول تاني' };
    }
    return {
      managerName: [data.player_first_name, data.player_last_name].filter(Boolean).join(' ') || ('مدير ' + id),
      teamName: data.name || ('فريق ' + id),
      currentEvent: data.current_event || null,
      overallRank: data.summary_overall_rank,
      leagues: data.leagues?.classic || [],
    };
  }catch(e){
    return { error: 'حصل خطأ في الاتصال بـ FPL. تأكد من النت وحاول تاني' };
  }
}

// ===== جلب التشكيلة الحقيقية لجولة معيّنة (أساسي/احتياطي/كابتن) =====
async function fetchFplPicks(fplId, gw){
  const id = String(fplId || '').trim();
  if(!id || !gw) return null;
  try{
    const res = await fetch(FPL_ENDPOINT + '?type=picks&id=' + encodeURIComponent(id) + '&event=' + encodeURIComponent(gw));
    if(!res.ok) return null;
    const data = await res.json();
    const picks = data.picks || [];
    if(!picks.length) return null;

    // multiplier: 0 = احتياطي، 1/2/3 = أساسي (2 و3 حالات الكابتن/التريبل كابتن)
    const squadIds = picks.map(p => ({
      id: p.element,
      slot: p.multiplier > 0 ? 'start' : 'bench'
    }));
    const captainPick = picks.find(p => p.is_captain);
    const captainId = captainPick ? captainPick.element : (picks[0] ? picks[0].element : null);
    const bank = (data.entry_history && typeof data.entry_history.bank === 'number')
      ? data.entry_history.bank / 10
      : 0;

    return { squadIds, captainId, bank };
  }catch(e){
    return null;
  }
}

// فورم موزون: بيدي وزن أكبر للجولات الأقرب بدل ما يعامل آخر 5 جولات بنفس الأهمية
// (لاعب سجل 2 جولات كويسة الأسبوع اللي فات أهم من لاعب سجلهم بدري وبايت دلوقتي)
function weightedFormPts(history){
  if(!history || !history.length) return 0;
  const sorted = history.slice().sort((a,b)=>a.gw-b.gw);
  let wSum = 0, sum = 0;
  sorted.forEach((h,i)=>{ const w = i+1; wSum += w; sum += w*h.pts; });
  return wSum ? Math.round((sum/wSum)*100)/100 : 0;
}

async function buildLiveDataset(){
  const boot = await fplFetch('bootstrap');
  const teams = boot.teams || [];
  const elements = boot.elements || [];
  const events = boot.events || [];

  const clubTag = {}, clubName = {}, teamIdToKey = {};
  teams.forEach(t=>{
    const key = (t.short_name || t.name.slice(0,3)).toLowerCase();
    teamIdToKey[t.id] = key;
    clubTag[key] = t.short_name;
    clubName[key] = t.name;
  });

  // الجولة الحالية: لو الموسم شغال ناخد الجولة الجارية، لو لسه مبدأش ناخد أول جولة قادمة
  const currentEvent = events.find(e=>e.is_current) || events.find(e=>e.is_next) || events[events.length-1];
  const gwId = currentEvent ? currentEvent.id : 1;

  // نجيب نقط لحظية لآخر 5 جولات متخلصة + الجولة الحالية عشان نبني "فورم موزون"
  // (الجولات الأقرب ليها وزن أكبر في الحساب، مش كل الجولات بنفس الأهمية)
  const finishedIds = events.filter(e=>e.finished).map(e=>e.id).slice(-5);
  const liveIds = Array.from(new Set([...finishedIds, gwId]));
  const historyByElement = {};
  // بونص لحظي: بنسجل الـ bps ورقم المباراة (fixture) لكل لاعب في الجولة الحالية بس،
  // عشان بعدين نرتبهم جوه كل مباراة ونديهم بونص افتراضي (3/2/1) قبل ما يتأكد رسمياً
  const currentGwBps = {};
  for(const evId of liveIds){
    try{
      const live = await fplFetch('live', evId);
      (live.elements || []).forEach(row=>{
        const pts = row.stats ? row.stats.total_points : 0;
        if(!historyByElement[row.id]) historyByElement[row.id] = [];
        historyByElement[row.id].push({ gw: evId, pts: pts||0 });
        if(evId === gwId){
          const bps = row.stats ? (row.stats.bps || 0) : 0;
          const fx = (row.explain && row.explain[0] && row.explain[0].fixture) || null;
          currentGwBps[row.id] = { bps: bps, fixtureId: fx };
        }
      });
    }catch(e){ /* لو جولة معينة فشلت نكمل من غيرها */ }
  }

  // مباريات الجولة الحالية — نبني نص "ضد X (أرض/خارج)" لكل نادي
  // + بيانات صعوبة المباراة (FDR) وقوة هجوم/دفاع كل نادي، عشان محرك التوقعات
  // (توقع النقط / كلين شيت / نصايح البيع والشراء) يعتمد عليها بدل ما يخمّن.
  const teamsById = {};
  teams.forEach(t=>{ teamsById[t.id] = t; });

  const fixturesMap = {};
  const teamFixtures = {}; // clubKey -> { oppKey, isHome, fdr, ownDefHome/Away, oppAtkHome/Away, lookahead, avgFdrNext3 }
  var provisionalBonusByElement = {};
  try{
    // بنجيب كل مباريات الموسم مرة واحدة (فيها cache في البروكسي)، ومنها بنستخرج
    // مباريات الجولة الحالية + "نظرة قدام" على أقرب 3 مباريات جاية لكل نادي —
    // ده بيخلي نصايح البيع والشراء أدق من الاعتماد على مباراة واحدة بس.
    const allFx = await fplFetch('fixtures');
    const gwFx = (allFx || []).filter(f=>f.event===gwId);
    gwFx.forEach(f=>{
      const hKey = teamIdToKey[f.team_h], aKey = teamIdToKey[f.team_a];
      const hTeam = teamsById[f.team_h], aTeam = teamsById[f.team_a];
      if(hKey && aKey){
        fixturesMap[hKey] = 'ضد ' + (clubTag[aKey]||'') + ' (أرض)';
        fixturesMap[aKey] = 'ضد ' + (clubTag[hKey]||'') + ' (خارج)';
      }
      if(hKey && aKey && hTeam && aTeam){
        teamFixtures[hKey] = {
          oppKey: aKey, isHome: true, fdr: f.team_h_difficulty || 3,
          ownDefHome: hTeam.strength_defence_home, ownDefAway: hTeam.strength_defence_away,
          oppAtkHome: aTeam.strength_attack_home, oppAtkAway: aTeam.strength_attack_away,
        };
        teamFixtures[aKey] = {
          oppKey: hKey, isHome: false, fdr: f.team_a_difficulty || 3,
          ownDefHome: aTeam.strength_defence_home, ownDefAway: aTeam.strength_defence_away,
          oppAtkHome: hTeam.strength_attack_home, oppAtkAway: hTeam.strength_attack_away,
        };
      }
    });

    // بونص لحظي (Provisional Bonus): بنجمع لاعبين كل مباراة لسه شغالة (بدأت ولسه ما خلصتش)
    // ونرتبهم حسب الـ bps تنازلي، ونديهم 3/2/1 زي قاعدة الفانتازي الرسمية —
    // لو فيه تعادل في الـ bps بين لاعبين أو أكتر بياخدوا نفس البونص وبيتخطى الترتيب اللي بعدهم
    var liveFixtureIds = new Set(gwFx.filter(f=>f.started && !f.finished).map(f=>f.id));
    var bpsByFixture = {};
    Object.keys(currentGwBps).forEach(function(elIdStr){
      var info = currentGwBps[elIdStr];
      if(info.fixtureId!=null && liveFixtureIds.has(info.fixtureId)){
        var fxKey = String(info.fixtureId);
        (bpsByFixture[fxKey] = bpsByFixture[fxKey] || []).push({ id: Number(elIdStr), bps: info.bps });
      }
    });
    Object.keys(bpsByFixture).forEach(function(fxKey){
      var list = bpsByFixture[fxKey];
      var distinctBps = Array.from(new Set(list.map(function(x){ return x.bps; }))).sort(function(a,b){ return b-a; });
      var bonusTiers = [3,2,1];
      var rankIdx = 0;
      distinctBps.forEach(function(bpsVal){
        if(rankIdx >= bonusTiers.length || bpsVal<=0) return;
        var tied = list.filter(function(x){ return x.bps===bpsVal; });
        var bonus = bonusTiers[rankIdx];
        tied.forEach(function(pl){ provisionalBonusByElement[pl.id] = bonus; });
        rankIdx += tied.length;
      });
    });
    // نضيف البونص الافتراضي لإجمالي نقاط اللاعب في الجولة الحالية جوه الـ history
    Object.keys(provisionalBonusByElement).forEach(function(elIdStr){
      var elId = Number(elIdStr);
      var bonus = provisionalBonusByElement[elId];
      var hist = historyByElement[elId];
      if(hist){
        var cur = hist.find(function(h){ return h.gw===gwId; });
        if(cur) cur.pts += bonus;
      }
    });

    // نظرة قدام: أقرب 3 مباريات لسه ما اتلعبتش لكل نادي (بتاخد بعضها لو فيه جولة مزدوجة)
    const upcoming = (allFx || [])
      .filter(f=>!f.finished && f.event!=null && f.event>=gwId)
      .sort((a,b)=>a.event-b.event);
    const lookaheadByTeam = {};
    upcoming.forEach(f=>{
      const hKey = teamIdToKey[f.team_h], aKey = teamIdToKey[f.team_a];
      if(hKey){ (lookaheadByTeam[hKey]=lookaheadByTeam[hKey]||[]).push({ event:f.event, fdr:f.team_h_difficulty||3, isHome:true, oppKey:aKey }); }
      if(aKey){ (lookaheadByTeam[aKey]=lookaheadByTeam[aKey]||[]).push({ event:f.event, fdr:f.team_a_difficulty||3, isHome:false, oppKey:hKey }); }
    });
    Object.keys(lookaheadByTeam).forEach(key=>{
      const list = lookaheadByTeam[key].slice(0,3);
      const avgFdr = list.length ? list.reduce((s,x)=>s+x.fdr,0)/list.length : 3;
      if(!teamFixtures[key]) teamFixtures[key] = {}; // نادي معندوش مباراة الجولة دي (bye) لسه ممكن يكون عنده نظرة قدام
      teamFixtures[key].lookahead = list;
      teamFixtures[key].avgFdrNext3 = avgFdr;
    });
  }catch(e){}

  const players = elements.map(el=>{
    const club = teamIdToKey[el.team] || 'unk';
    const hist = (historyByElement[el.id]||[]).sort((a,b)=>a.gw-b.gw);
    const matchesPlayed = el.starts || Math.round((el.minutes||0)/90) || 0;
    return {
      id: el.id,
      code: el.code,
      teamCode: el.team_code,
      name: el.web_name,
      club: club,
      pos: POS_MAP[el.element_type] || 'MID',
      price: (el.now_cost||0) / 10,
      num: el.squad_number || '',
      ownership: parseFloat(el.selected_by_percent) || 0,
      priceChange: (el.cost_change_event||0) / 10,
      totalPointsReal: el.total_points || 0,
      status: el.status, // a=متاح, i=مصاب, s=موقوف, d=مشكوك فيه
      history: hist,
      provisionalBonus: provisionalBonusByElement[el.id] || 0, // بونص لحظي غير مؤكد لسه (مبني على bps المباراة الجارية)
      // ===== حقول إضافية لمحرك التوقعات (كلها من الـ API الرسمي) =====
      epNext: parseFloat(el.ep_next) || 0,               // توقع FPL الرسمي لنقط الجولة الجاية
      form: parseFloat(el.form) || 0,                     // متوسط نقط آخر جولات (رسمي)
      formWeighted: weightedFormPts(hist),                // فورم موزون: الجولات الأقرب ليها وزن أكبر
      minutes: el.minutes || 0,
      chanceNext: (el.chance_of_playing_next_round==null) ? 100 : el.chance_of_playing_next_round,
      // ===== إحصائيات متقدمة (xG/xA/ICT) عشان توقع النقط يبقى مبني على "استحقاق"
      // اللاعب الفعلي مش بس النتايج اللي حصلت، ده بيقلل أثر الحظ (زي تسديدة اترد من القايم) =====
      xG90: parseFloat(el.expected_goals_per_90) || 0,           // أهداف متوقعة لكل 90 دقيقة
      xA90: parseFloat(el.expected_assists_per_90) || 0,         // أسيستات متوقعة لكل 90 دقيقة
      xGC90: parseFloat(el.expected_goals_conceded_per_90) || 0, // أهداف متوقع استقبالها لكل 90 دقيقة (لمحرك الكلين شيت)
      savesPer90: parseFloat(el.saves_per_90) || 0,
      ictIndex: parseFloat(el.ict_index) || 0,
      pointsPerGame: parseFloat(el.points_per_game) || 0,
      bonusPerMatch: matchesPlayed ? (el.bonus||0) / matchesPlayed : 0,
      // نسبة الجولات اللي اتأسس فيها من بداية الموسم لحد دلوقتي — مؤشر تقريبي لخطر الدوران
      startsFactor: gwId>1 ? Math.min(1, matchesPlayed / (gwId-1)) : (matchesPlayed>0?1:0),
      // لاعب ضربات ثابتة أساسي (بنالتي/فري كيك/كورنر) — بونص إضافي في نصايح الشراء
      setPiece: el.penalties_order===1 ? 'بنالتي أساسي'
               : el.direct_freekicks_order===1 ? 'ضربات حرة'
               : el.corners_and_indirect_freekicks_order===1 ? 'كورنرات'
               : null,
    };
  });

  const gwInfo = {
    current: gwId,
    deadline: currentEvent ? currentEvent.deadline_time : new Date(Date.now()+86400000).toISOString(),
    fixtures: fixturesMap,
  };

  return { players, gwInfo, clubTag, clubName, teamFixtures };
}

async function loadLiveData(force){
  try{
    if(!force){
      const cachedRaw = await sGet(LIVE_CACHE_KEY, true);
      if(cachedRaw){
        const cached = JSON.parse(cachedRaw);
        if(cached.cachedAt && (Date.now() - cached.cachedAt) < LIVE_CACHE_TTL){
          applyLiveDataset(cached);
          state.liveSyncedAt = cached.cachedAt;
          state.liveDataError = false; state.liveDataStale = false;
          return;
        }
      }
    }
    const fresh = await buildLiveDataset();
    fresh.cachedAt = Date.now();
    applyLiveDataset(fresh);
    state.liveSyncedAt = fresh.cachedAt;
    state.liveDataError = false; state.liveDataStale = false;
    await sSet(LIVE_CACHE_KEY, JSON.stringify(fresh), true);
  }catch(e){
    // فشل الاتصال — نستخدم آخر نسخة متخزنة لو موجودة، وإلا بيانات احتياطية بسيطة
    const cachedRaw = await sGet(LIVE_CACHE_KEY, true);
    if(cachedRaw){
      const cached = JSON.parse(cachedRaw);
      applyLiveDataset(cached);
      state.liveSyncedAt = cached.cachedAt;
      state.liveDataStale = true;
    } else {
      state.players = SEED_PLAYERS;
      state.gwInfo = SEED_GW;
      CLUB_TAG = FALLBACK_CLUB_TAG;
      CLUB_NAME = FALLBACK_CLUB_NAME;
      state.liveDataError = true;
    }
  }
}
function applyLiveDataset(d){
  state.players = d.players;
  state.gwInfo = d.gwInfo;
  CLUB_TAG = d.clubTag;
  CLUB_NAME = d.clubName;
  state.teamFixtures = d.teamFixtures || {};
}

// ============================================================
// ===== محرك التوقعات والنصايح =====
// كل الأرقام هنا "تقديرية" مبنية على بيانات فانتازي البريميرليج الرسمية بس:
// - توقع FPL الرسمي لنقط الجولة الجاية "ep_next"
// - فورم موزون (آخر 5 جولات، الأقرب أهم) بدل الفورم العادي
// - نموذج إحصائي مبني على xG/xA لكل 90 دقيقة (استحقاق اللاعب الفعلي مش بس نتايجه)
// - احتمال الكلين شيت من قوة هجوم/دفاع الأندية + xGC (أهداف متوقع استقبالها)
// - صعوبة المباراة الجاية (FDR) + نظرة على متوسط صعوبة أقرب 3 مباريات
// - نسبة الجولات اللي اتأسس فيها اللاعب (خطر الدوران) + لاعبي الضربات الثابتة
// مفيش أي بيانات مدفوعة ولا نموذج ذكاء اصطناعي، كله حسابات مباشرة وشفافة
// وممكن تتراجع أو تتحسّن في أي وقت.
// ============================================================

function teamFixtureInfo(clubKey){
  return (state.teamFixtures && state.teamFixtures[clubKey]) || null;
}

// صعوبة المباراة (FDR من فانتازي الرسمي: 1 سهلة جدًا -> 5 صعبة جدًا) بتتحول لمضاعف نقط
function fdrMultiplier(fdr){
  const map = {1:1.28, 2:1.14, 3:1.0, 4:0.86, 5:0.72};
  return map[fdr] || 1;
}

// احتمالية مشاركة اللاعب أصلاً (مصاب/موقوف/مشكوك فيه)
function availabilityMultiplier(p){
  if(p.status==='i' || p.status==='s') return 0;
  if(p.status==='d') return Math.max(0.35, (p.chanceNext!=null ? p.chanceNext : 75) / 100);
  return 1;
}

// احتمال الكلين شيت الأساسي لنادي اللاعب في مباراته الجاية (قوة دفاعه مقابل هجوم الخصم)
// + تعديل بسيط لو اللاعب نفسه بيستقبل أهداف أكتر من المتوقع لمركزه (xGC90 عالي شخصيًا)
function cleanSheetProbability(p){
  const fx = teamFixtureInfo(p.club);
  let prob = 0.28;
  if(fx && fx.ownDefHome!=null){
    const defStrength = fx.isHome ? fx.ownDefHome : fx.ownDefAway;
    const oppAtk = fx.isHome ? fx.oppAtkAway : fx.oppAtkHome;
    if(defStrength!=null && oppAtk!=null){
      prob = Math.max(0.03, Math.min(0.65, 0.32 + (defStrength-oppAtk)/220));
    }
  }
  if((p.pos==='DEF'||p.pos==='GK') && p.xGC90>1.1){ prob = Math.max(0.02, prob - (p.xGC90-1.1)*0.12); }
  return prob;
}

// نموذج إحصائي: نبني توقع نقط اللاعب من "استحقاقه" الفعلي (xG/xA/كلين شيت/بونص)
// مش بس النتايج القديمة — ده بيقلل أثر الحظ (تسديدة اترد من القايم، أو أهداف من تسديدات ضعيفة)
function statModelPoints(p){
  const posGoalPts = {GK:6,DEF:6,MID:5,FWD:4}[p.pos] || 4;
  const posCSPts   = {GK:4,DEF:4,MID:1,FWD:0}[p.pos] || 0;
  const minFactor = (p.startsFactor!=null && p.startsFactor>0) ? p.startsFactor : (p.minutes>0 ? 0.5 : 0);
  if(minFactor<=0) return 0;
  const appearancePts = minFactor * 2; // تقدير نقط الظهور (60+ دقيقة)
  const goalPts   = (p.xG90||0) * minFactor * posGoalPts;
  const assistPts = (p.xA90||0) * minFactor * 3;
  const csPts     = cleanSheetProbability(p) * posCSPts * minFactor;
  const bonusPts  = (p.bonusPerMatch||0) * minFactor;
  const savePts   = p.pos==='GK' ? ((p.savesPer90||0)/3) * minFactor : 0;
  return appearancePts + goalPts + assistPts + csPts + bonusPts + savePts;
}

// توقع نقاط اللاعب في الجولة الجاية:
// بنمزج بين توقع FPL الرسمي (ep_next) والنموذج الإحصائي (xG/xA/كلين شيت/بونص)،
// وإلا لو معندناش ep_next بنمزج الفورم الموزون مع النموذج الإحصائي،
// وبعدين بنضرب في صعوبة المباراة (FDR) واحتمال المشاركة.
function predictedPoints(p){
  const avail = availabilityMultiplier(p);
  if(avail===0) return 0;
  const fx = teamFixtureInfo(p.club);
  const fdrMul = fx ? fdrMultiplier(fx.fdr) : 1;
  const stat = statModelPoints(p);
  let base;
  if(p.epNext && p.epNext>0){ base = p.epNext*0.5 + stat*0.5; }
  else if(p.formWeighted && p.formWeighted>0){ base = p.formWeighted*0.6 + stat*0.4; }
  else if(stat>0){ base = stat; }
  else { base = state.gwInfo.current>0 ? totalPoints(p)/state.gwInfo.current : 2; }
  const pts = base * fdrMul * avail;
  return Math.max(0, Math.round(pts*10)/10);
}

// توقع مجموع نقاط التشكيلة الأساسية (بمضاعفة الكابتن)
function predictedSquadPoints(){
  const c = captain();
  const isCapStarting = c && state.mySquadIds.find(e=>e.id===c.id && e.slot==='start');
  const base = starters().reduce((s,p)=>s+predictedPoints(p),0);
  const extra = isCapStarting ? predictedPoints(c) : 0;
  return Math.round((base+extra)*10)/10;
}

// متوسط نسبة ملكية لاعبين تشكيلتك الـ15 (مؤشر تقريبي — مش effective ownership)
function squadOwnershipAvg(){
  const s = squad();
  if(!s.length) return 0;
  return Math.round((s.reduce((sum,p)=>sum+p.ownership,0)/s.length)*10)/10;
}

// ترتيب الأندية حسب احتمال الكلين شيت الجولة الجاية (قوة دفاعهم مقابل هجوم الخصم +
// سهولة المباراة + متوسط الأهداف المتوقع استقبالها لحارس/دفاع كل نادي xGC)
function cleanSheetRanking(){
  return Object.keys(CLUB_TAG).map(key=>{
    const fx = teamFixtureInfo(key);
    if(!fx || fx.ownDefHome==null) return null;
    const keepers = state.players.filter(p=>p.pos==='GK' && p.club===key);
    const refPlayer = { pos:'GK', club:key, xGC90: keepers.length ? keepers[0].xGC90 : 0 };
    const prob = Math.round(cleanSheetProbability(refPlayer) * 100);
    return { club:key, prob: Math.max(3, Math.min(72, prob)), fx };
  }).filter(Boolean).sort((a,b)=>b.prob-a.prob);
}

// أفضل حراس مرمى مرشحين لكلين شيت (أول حارس أساسي في كل نادي من أعلى الترتيب)
function topCleanSheetKeepers(limit){
  return cleanSheetRanking().map(r=>{
    const keepers = state.players.filter(p=>p.pos==='GK' && p.club===r.club && p.status!=='i' && p.status!=='s');
    if(!keepers.length) return null;
    keepers.sort((a,b)=> b.minutes-a.minutes || b.ownership-a.ownership);
    return { p:keepers[0], prob:r.prob, fx:r.fx };
  }).filter(Boolean).slice(0, limit||8);
}

// الأكثر تألقًا متوقع الجولة دي (فورم + مباراة سهلة، من كل اللاعبين اللي بيلعبوا فعليًا)
function inFormRanking(limit){
  return state.players.filter(p=>availabilityMultiplier(p)>0 && p.minutes>0)
    .map(p=>({ p, score: predictedPoints(p) }))
    .sort((a,b)=>b.score-a.score)
    .slice(0, limit||10);
}

// الأعلى نسبة ملكية بين كل المديرين
function ownershipRanking(limit){
  return state.players.slice().sort((a,b)=>b.ownership-a.ownership).slice(0, limit||10);
}

// نصايح: مين تبيع من فريقك الحالي
function sellAdvice(){
  return squad().map(p=>{
    const reasons = [];
    let score = predictedPoints(p);
    if(p.status==='i'){ reasons.push('مصاب'); score -= 5; }
    else if(p.status==='s'){ reasons.push('موقوف'); score -= 5; }
    else if(p.status==='d'){ reasons.push('مشكوك في مشاركته'); score -= 1.5; }
    const fx = teamFixtureInfo(p.club);
    if(fx && fx.fdr>=4){ reasons.push('مباراة صعبة الجولة الجاية'); score -= 0.8; }
    if(fx && fx.avgFdrNext3 && fx.avgFdrNext3>=3.6){ reasons.push('سلسلة مباريات صعبة قدامه'); score -= 0.6; }
    if((p.formWeighted||p.form||0) < 2){ reasons.push('فورم ضعيف'); score -= 0.6; }
    if((p.startsFactor!=null) && p.startsFactor<0.5 && p.minutes>0){ reasons.push('خطر دوران (مش أساسي ثابت)'); score -= 0.7; }
    if(p.pos!=='GK' && (p.form||0) > (p.xG90+p.xA90)*4 + 1.5){ reasons.push('نتايجه أحسن من مستواه الفعلي (ممكن ترجع لطبيعتها)'); score -= 0.4; }
    if(p.priceChange < 0){ reasons.push('سعره بينزل'); }
    return { p, score, reasons };
  }).filter(x=>x.reasons.length>0).sort((a,b)=>a.score-b.score).slice(0,5);
}

// نصايح: مين تشتري (من برا فريقك)
function buyAdvice(){
  return pool().filter(p=>availabilityMultiplier(p)>0)
    .map(p=>{
      const reasons = [];
      const pred = predictedPoints(p);
      const fx = teamFixtureInfo(p.club);
      if(fx && fx.fdr<=2) reasons.push('مباراة سهلة الجولة الجاية');
      if(fx && fx.avgFdrNext3 && fx.avgFdrNext3<=2.4) reasons.push('سلسلة مباريات سهلة قدامه');
      if((p.formWeighted||p.form||0) >= 4) reasons.push('فورم ممتاز');
      if(p.pos!=='GK' && (p.xG90+p.xA90) >= 0.5) reasons.push('معدل مشاركة عالي في الأهداف (xG/xA)');
      if(p.setPiece) reasons.push(p.setPiece);
      if((p.startsFactor||0) >= 0.85) reasons.push('أساسي ثابت');
      if(p.priceChange > 0) reasons.push('سعره بيطلع');
      if(p.ownership < 8 && pred>=4) reasons.push('لاعب مميز (differential)');
      return { p, pred, reasons };
    })
    .sort((a,b)=>b.pred-a.pred)
    .slice(0,8);
}

function roundPoints(){
  const base = starters().reduce((s,p)=>s+currentGwPoints(p),0);
  const c = captain();
  const isCapStarting = c && state.mySquadIds.find(e=>e.id===c.id && e.slot==='start');
  const extra = isCapStarting ? currentGwPoints(c) : 0;
  return base + extra;
}

  await sSet('mazareta_manager:'+state.deviceId, JSON.stringify({

// ===== boot =====
async function boot(){
  state.phase = 'boot';
  render();
  try{
    await loadLiveData();
    try{
      const linksRaw = await sGet('mazareta_admin_links', true);
      if(linksRaw) state.adminLinks = JSON.parse(linksRaw);
    }catch(e){}

    // if this browser already has an FPL Team ID saved, skip onboarding and go
    // straight into the app; otherwise show the onboarding screen to collect it
    const savedFplId = getLocalDeviceId();
    if(!savedFplId){
      state.phase = 'onboard';
      render();
      return;
    }

    state.deviceId = savedFplId;
    let raw = await sGet('mazareta_manager:'+state.deviceId, false);
    if(raw){
      const m = JSON.parse(raw);
      state.managerName = m.managerName; state.teamName = m.teamName;
    }

    // نجيب بيانات المدير الحقيقية من FPL — ده مصدرنا الوحيد للترتيب العام والدوريات
    const entry = await fetchFplEntry(savedFplId);
    if(entry && !entry.error){
      if(!raw){ state.managerName = entry.managerName; state.teamName = entry.teamName; await saveManager(); }
      state.overallRank = entry.overallRank;
      state.realLeagues = entry.leagues;
    } else if(!raw){
      state.managerName = 'مدير ' + savedFplId;
      state.teamName = 'فريق ' + savedFplId;
      await saveManager();
    }

    await loadSquadOrDraft();
    state.phase = 'app';
    render();
  } catch(e){
    state.bootError = 'حصل خطأ في تحميل البيانات. حاول تاني.';
    render();
  }
}

async function loadSquadOrDraft(){
  // ⓪ امسح فورًا أي تشكيلة قديمة مخزنة (Supabase + أي أثر محلي) عشان منعتمدش على بيانات قديمة أبداً
  try{ localStorage.removeItem('mazareta_squad:'+state.deviceId); }catch(e){}
  await sSet('mazareta_squad:'+state.deviceId, '', false);

  // ① نجبر النظام يجيب التشكيلة الحقيقية من FPL للجولة الحالية فورًا (من غير ما نعتمد على أي كاش قديم)
  try{
    const gw = state.gwInfo && state.gwInfo.current;
    const picks = state.deviceId ? await fetchFplPicks(state.deviceId, gw) : null;
    if(picks && picks.squadIds && picks.squadIds.length){
      state.mySquadIds = picks.squadIds;
      state.captainId = picks.captainId;
      state.bank = picks.bank;
      state.freeTransfers = 2;
      state.seasonBaseline = 0;
      await savePersonal();
      return;
    }
  }catch(e){
    // الجولة الأولى لم تبدأ بعد أو API غير متاح — نبدأ بتشكيلة فارغة
  }

  // ② تشكيلة فارغة تماماً — المستخدم يبني فريقه من الصفر
  state.mySquadIds = [];
  state.captainId = null;
  state.bank = 100;
  state.freeTransfers = 100;
  state.seasonBaseline = 0;
  await savePersonal();
}

async function refreshLiveData(){
  state.refreshing = true; render();
  await loadLiveData(true);
  state.refreshing = false;
  render();
}

// ===== onboarding submit =====
async function submitOnboard(){
  const inputEl = document.getElementById('obFplId');
  const errEl = document.getElementById('obError');
  const btnEl = document.getElementById('obSubmit');
  const fplId = inputEl.value.trim();

  if(errEl){ errEl.style.display = 'none'; errEl.textContent = ''; }

  if(!fplId){
    if(errEl){ errEl.textContent = 'اكتب الـ FPL Team ID الأول'; errEl.style.display = 'block'; }
    return;
  }

  if(btnEl){ btnEl.disabled = true; btnEl.textContent = 'بنتأكد من الـ ID...'; }

  const entry = await fetchFplEntry(fplId);

  if(!entry || entry.error){
    if(errEl){ errEl.textContent = (entry && entry.error) ? entry.error : 'تأكد من رقم الـ ID وحاول تاني'; errEl.style.display = 'block'; }
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = 'ابدأ اللعب'; }
    return;
  }

  // نجحنا — نخزّن الـ ID محليًا عشان boot() يتخطى الأونبوردينج المرة الجاية
  try{ localStorage.setItem('mazareta_fpl_id', fplId); } catch(e){}

  state.deviceId = fplId;
  state.managerName = entry.managerName;
  state.teamName = entry.teamName;
  state.overallRank = entry.overallRank;
  state.realLeagues = entry.leagues;

  await saveManager();
  await loadSquadOrDraft(); // هتجيب التشكيلة الحقيقية من FPL (شوف التعديل فوق)
  state.phase = 'app';
  render();
}

// ===== countdown =====
function countdown(iso){
  const diff = new Date(iso).getTime() - Date.now();
  if(diff<=0) return 'التشكيلة مقفولة';
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  if(d>0) return 'يوم'.length && (d===1?'يوم واحد':(d===2?'يومان':d+' أيام')) + ' و' + h + ' ساعة';
  const m = Math.floor((diff%3600000)/60000);
  return h+' ساعة و'+m+' دقيقة';
}

function leagueRankChange(lg){
  const cur = lg.entry_rank, prev = lg.entry_last_rank;
  if(cur==null || prev==null || prev===cur) return { dir:'up', chg:0 };
  return cur < prev ? { dir:'up', chg: prev-cur } : { dir:'down', chg: cur-prev };
}

function renderLeaguePreviewItems(){
  if(!state.realLeagues.length) return '<div class="hint">لسه مش منضم لأي دوري خاص على فانتازي البريميرليج</div>';
  return state.realLeagues.map(lg => {
    const rc = leagueRankChange(lg);
    return '<button class="league-item" data-league="' + lg.id + '">' +
      '<div><div class="li-name">' + lg.name + '</div><div class="li-sub">' + (lg.rank_count ? lg.rank_count.toLocaleString() + ' مدير' : '') + '</div></div>' +
      '<div class="li-rank"><div class="num">#' + (lg.entry_rank!=null ? lg.entry_rank.toLocaleString() : '-') + '</div>' +
      (rc.chg ? '<div class="chg ' + rc.dir + '">' + (rc.dir==='up'?ICON_UP:ICON_DOWN) + rc.chg + '</div>' : '') + '</div>' +
    '</button>';
  }).join('');
}

function renderJersey(p, opts){
  opts = opts || {};
  let cls = 'jersey jersey-photo';
  if(opts.selected) cls += ' selected';
  const isCap = p.id === state.captainId;
  const showPts = p.slot === 'start';
  const mode = opts.mode || 'view';
  const dataAttr = ' data-player="' + p.id + '" data-mode="' + mode + '"';
  const shirtSrc = 'https://fantasy.premierleague.com/dist/img/shirts/standard/shirt_' + p.teamCode + (p.pos==='GK' ? '_1' : '') + '-66.webp';
  const hasBonus = (p.provisionalBonus||0) > 0;
  // نقاط الجولة أصلاً بتتضمن البونص اللحظي (اتضاف في buildLiveDataset)، هنا بس بنميّزه بنجمة
  const ptsVal = isCap ? currentGwPoints(p)*2 : currentGwPoints(p);
  return '<div class="player" data-viewprofile="' + p.id + '">' +
    '<div class="' + cls + '"' + dataAttr + '>' +
      '<img class="jersey-shirt" src="' + shirtSrc + '" alt="' + p.name + '" loading="lazy">' +
      (isCap ? '<div class="cap">C</div>' : '') +
    '</div>' +
    '<div class="pname">' + p.name + '</div>' +
    (showPts ? '<div class="ppts' + (hasBonus?' has-bonus':'') + '">' + ptsVal + ' pts' + (hasBonus?' ⭐':'') + '</div>' : '') +
  '</div>';
}
function renderPlaceholder(pos, slot){
  const label = {GK:'حارس', DEF:'مدافع', MID:'وسط', FWD:'مهاجم'}[pos] || pos;
  return '<div class="player" data-add-pos="' + pos + '" data-add-slot="' + (slot || 'start') + '" style="cursor:pointer;">' +
    '<div class="jersey placeholder">＋</div>' +
    '<div class="pname placeholder-name">' + label + '</div>' +
  '</div>';
}
function renderPitchCard(interactive){
  const gkAll  = starters().filter(p=>p.pos==='GK');
  const defAll = starters().filter(p=>p.pos==='DEF');
  const midAll = starters().filter(p=>p.pos==='MID');
  const fwdAll = starters().filter(p=>p.pos==='FWD');
  const benchAll = benched();

  const opts = { mode: interactive ? state.teamMode : 'view' };

  // دالة مساعدة: تملأ صف بلاعبين حقيقيين + placeholders لو الصف ناقص
  function rowHtml(players, needed, pos){
    let html = '';
    players.forEach(p => { html += renderJersey(p, opts); });
    for(let i = players.length; i < needed; i++){
      html += renderPlaceholder(pos, 'start');
    }
    return '<div class="row">' + html + '</div>';
  }

  // لو التشكيلة فاضية تمامًا نرسم 11 مكان فارغ بتكوين 1-4-4-2 الرسمي،
  // أما لو فيه لاعبين فعلاً بنرسم العدد الموجود فقط بدون أي placeholders زيادة (حتى لا يتجاوز 11 لاعبًا)
  const isEmpty = starters().length === 0;
  const gkNeed  = isEmpty ? 1 : gkAll.length;
  const defNeed = isEmpty ? 4 : defAll.length;
  const midNeed = isEmpty ? 4 : midAll.length;
  const fwdNeed = isEmpty ? 2 : fwdAll.length;

  // الاحتياطي: نعرض ما هو موجود + placeholders لإكمال 4
  const benchPositions = ['GK','DEF','MID','FWD'];
  let benchHtml = '';
  benchAll.forEach(p => {
    const o = Object.assign({}, opts, { selected: interactive && state.selectedBenchId===p.id });
    benchHtml += renderJersey(p, o);
  });
  for(let i = benchAll.length; i < 4; i++){
    benchHtml += renderPlaceholder(benchPositions[i] || 'GK', 'bench');
  }

  return '<div class="pitch-card"><div class="pitch">' +
    rowHtml(gkAll,  gkNeed,  'GK') +
    rowHtml(defAll, defNeed, 'DEF') +
    rowHtml(midAll, midNeed, 'MID') +
    rowHtml(fwdAll, fwdNeed, 'FWD') +
  '</div><div class="bench">' + benchHtml + '</div></div>';
}

// --- سوق الانتقالات: مستخرجة في دالة مستقلة عشان يمكن تحديثها لوحدها ---
function renderTransferMarket(){
  const outPlayer = state.transferOutId ? findPlayer(state.transferOutId) : null;
  // لو فيه لاعب مختار للبيع نعرض نفس مركزه فقط، أو لو فيه مركز فاضي محدد من الملعب نعرض مركزه فقط، غير كده نعرض الكل
  const positions = outPlayer ? [outPlayer.pos] : (state.transferAddPos ? [state.transferAddPos] : ['GK', 'DEF', 'MID', 'FWD']);
  const posLabel  = {GK:'حراس المرمى', DEF:'المدافعون', MID:'خط الوسط', FWD:'المهاجمون'};

  const searchTerm = (state.transferSearch || '').trim().toLowerCase();

  return positions.map(pos => {
    // القائمة الحقيقية فيها مئات اللاعبين — بنعرض أفضل 40 بالنسبة للنقاط المتوقعة عشان القائمة تفضل عملية
    let candidates = pool()
      .filter(p => p.pos === pos)
      .filter(p => !searchTerm || p.name.toLowerCase().includes(searchTerm))
      .filter(p => state.transferFilterClub === 'all' || p.club === state.transferFilterClub)
      .filter(p => state.transferFilterPrice === 'all' || p.price <= parseFloat(state.transferFilterPrice))
      .sort((a, b) => predictedPoints(b) - predictedPoints(a) || totalPoints(b) - totalPoints(a))
      .slice(0, 40);

    if(!candidates.length) return '';

    const rows = candidates.map(p => {
      const budget = state.bank + (outPlayer ? outPlayer.price : 0);
      const disabled = outPlayer ? (outPlayer.pos !== pos || (budget - p.price) < 0)
        : (state.transferAddPos ? (state.transferAddPos !== pos || (budget - p.price) < 0) : true);
      return '<div class="p-row">' +
        '<div class="p-left" data-viewprofile="' + p.id + '">' +
          '<img class="p-mini jersey-photo" src="https://fantasy.premierleague.com/dist/img/shirts/standard/shirt_' + p.teamCode + (p.pos==='GK'?'_1':'') + '-66.webp" alt="' + p.name + '" loading="lazy">' +
          '<div class="p-info"><div class="p-name">' + p.name + '</div>' +
          '<div class="p-meta">' + (CLUB_TAG[p.club] || '') + ' · £' + fmt(p.price) + 'm' +
            ' · ' + totalPoints(p) + ' نقطة · متوقع ' + fmt(predictedPoints(p)) + '</div></div></div>' +
        '<button class="p-btn in" data-in="' + p.id + '"' + (disabled ? ' disabled' : '') + '>إضافة</button>' +
      '</div>';
    }).join('');

    return '<div class="pos-head">' + posLabel[pos] + '</div>' +
           '<div class="league-list" style="gap:8px;">' + rows + '</div>';
  }).join('');
}

function renderPlayerProfile(){
  const p = findPlayer(state.viewPlayerId);
  if(!p) return '<div class="topbar"><button class="back" id="profBack">'+ICON_BACK+'</button><h1>اللاعب</h1><div class="spacer"></div></div>';
  const hist = (p.history||[]).slice().sort((a,b)=>a.gw-b.gw);
  const last4 = hist.slice(-4);
  const maxPts = Math.max(1, ...last4.map(h=>h.pts));
  const chg = p.priceChange||0;

function predRow(p, chipText, chipClass, metaExtra){
  const shirtSrc = 'https://fantasy.premierleague.com/dist/img/shirts/standard/shirt_' + p.teamCode + (p.pos==='GK' ? '_1' : '') + '-66.webp';

    '<img class="p-mini jersey-photo" src="' + shirtSrc + '" alt="' + p.name + '" loading="lazy">' +

    '<div class="pred-chip' + (chipClass?(' '+chipClass):'') + '">' + chipText + '</div>' +
    (hasBonus ? '<div class="bonus-badge">⭐ +' + p.provisionalBonus + '</div>' : '') +

}

function toLocalInput(iso){
  const d = new Date(iso);
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}

// تنفيذ عملية الشراء: إما استبدال لاعب موجود (transferOutId) أو إضافة لاعب جديد لمكان فارغ (transferAddPos)
function tryBuyPlayer(inId){
  const inPlayer = findPlayer(inId);
  if(!inPlayer) return;

  const outEntry = state.mySquadIds.find(e=>e.id===state.transferOutId);
  const outPlayer = outEntry ? findPlayer(outEntry.id) : null;

  if(outPlayer){
    // ① استبدال لاعب موجود في الفريق بلاعب تاني في نفس المركز
    if(outPlayer.pos !== inPlayer.pos){ setFlash('err','اختر لاعبًا في نفس المركز'); return; }
    const newBank = state.bank + outPlayer.price - inPlayer.price;
    if(newBank < 0){ setFlash('err','الرصيد غير كافٍ لإتمام هذا الانتقال'); return; }

    outEntry.id = inPlayer.id; // keep the slot, swap identity
    state.bank = newBank;
    if(state.captainId === outPlayer.id) state.captainId = inPlayer.id;
    if(state.freeTransfers > 0) state.freeTransfers -= 1;
    state.transferOutId = null;
    savePersonal();

    setFlash('ok','تم تنفيذ الانتقال بنجاح' + (state.freeTransfers===0 ? ' — التبديل التالي سيخصم 4 نقاط' : ''));
    return;
  }

  if(state.transferAddPos){
    // ② إضافة لاعب جديد لمكان فارغ في التشكيلة (مش استبدال — مفيش لاعب يتباع)
    if(inPlayer.pos !== state.transferAddPos){ setFlash('err','اختر لاعبًا في نفس المركز'); return; }
    if(state.mySquadIds.some(e=>e.id===inPlayer.id)){ setFlash('err','اللاعب موجود بالفعل في فريقك'); return; }
    if(state.mySquadIds.length >= 15){ setFlash('err','التشكيلة مكتملة بالفعل (15 لاعب)'); return; }
    const newBank = state.bank - inPlayer.price;
    if(newBank < 0){ setFlash('err','الرصيد غير كافٍ لشراء هذا اللاعب'); return; }

    state.mySquadIds.push({ id: inPlayer.id, slot: state.transferAddSlot || 'start' });
    state.bank = newBank;
    state.transferAddPos = null;
    state.transferAddSlot = null;
    savePersonal();

    setFlash('ok','تمت إضافة اللاعب لتشكيلتك بنجاح');
    return;
  }
}

function bindMarketListItems(container){
  container.querySelectorAll('[data-viewprofile]').forEach(b=>{
    b.addEventListener('click', (e)=>{ e.stopPropagation(); goToPlayer(parseInt(b.getAttribute('data-viewprofile'))); });
  });
  container.querySelectorAll('[data-in]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      tryBuyPlayer(parseInt(b.getAttribute('data-in')));
    });
  });
}

function bindBody(){
  const el = document.getElementById('app-body');

  // boot retry
  const retry = el.querySelector('#retryBoot');
  if(retry) retry.addEventListener('click', ()=>{ state.bootError=null; boot(); });

  // onboarding
  const obSubmit = el.querySelector('#obSubmit');
  if(obSubmit) obSubmit.addEventListener('click', submitOnboard);

  // bell / refresh
  const bell = el.querySelector('#bellBtn');
  if(bell) bell.addEventListener('click', (e)=>{ e.stopPropagation(); state.notifOpen = !state.notifOpen; renderBody(); });
  const refreshBtn = el.querySelector('#refreshBtn');
  if(refreshBtn) refreshBtn.addEventListener('click', refreshLiveData);

  // go-to buttons
  el.querySelectorAll('[data-goto]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.tab = b.getAttribute('data-goto'); state.notifOpen=false; render(); });
  });

  // placeholders الفارغة على الملعب — تنقل المستخدم لسوق الانتقالات لاختيار لاعب في نفس المركز
  el.querySelectorAll('[data-add-pos]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const pos = b.getAttribute('data-add-pos');
      const slot = b.getAttribute('data-add-slot') || 'start';
      state.transferOutId = null;
      state.transferAddPos = pos;
      state.transferAddSlot = slot;
      state.tab = 'transfers';
      render();
    });
  });

  // league items
  el.querySelectorAll('[data-league]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.tab = 'leagues'; state.activeLeagueId = b.getAttribute('data-league'); render(); });
  });
  const leagueBack = el.querySelector('#leagueBack');
  if(leagueBack) leagueBack.addEventListener('click', ()=>{ state.activeLeagueId = null; renderBody(); });

  // profile back
  const profBack = el.querySelector('#profBack');
  if(profBack) profBack.addEventListener('click', ()=>{ state.tab = state.profileBack; render(); });

  // admin back
  const adminBack = el.querySelector('#adminBack');
  if(adminBack) adminBack.addEventListener('click', ()=>{ state.tab = 'more'; render(); });

  // predictions back
  const predBack = el.querySelector('#predBack');
  if(predBack) predBack.addEventListener('click', ()=>{ state.tab = 'more'; render(); });

  // view profile triggers (jersey name tags, transfer rows)
  el.querySelectorAll('[data-viewprofile]').forEach(b=>{
    b.addEventListener('click', (e)=>{ e.stopPropagation(); goToPlayer(parseInt(b.getAttribute('data-viewprofile'))); });
  });

  // team tab: segment mode switch
  el.querySelectorAll('[data-mode]').forEach(b=>{
    if(!b.hasAttribute('data-mode') || b.tagName!=='BUTTON') return;
  });
  el.querySelectorAll('.segment [data-mode]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.teamMode = b.getAttribute('data-mode'); state.selectedBenchId = null; renderBody(); });
  });

  // team tab: player taps (captain or bench-swap) — jersey elements carry data-mode = view/captain/bench
  el.querySelectorAll('.jersey[data-player]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = parseInt(b.getAttribute('data-player'));
      const mode = b.getAttribute('data-mode');
      if(mode==='view'){ return; } // handled by pname / no-op on view pitch
      const entry = state.mySquadIds.find(e=>e.id===id);
      if(!entry) return;
      if(mode==='captain'){
        if(entry.slot==='start'){ state.captainId = id; savePersonal(); renderBody(); }
      } else if(mode==='bench'){
        if(entry.slot==='bench'){
          state.selectedBenchId = (state.selectedBenchId===id) ? null : id;
          renderBody();
        } else if(entry.slot==='start' && state.selectedBenchId){
          const benchEntry = state.mySquadIds.find(e=>e.id===state.selectedBenchId);
          const benchP = findPlayer(benchEntry.id);
          const startP = findPlayer(id);
          if(benchP.pos === startP.pos){
            benchEntry.slot = 'start'; entry.slot = 'bench';
            state.selectedBenchId = null;
            savePersonal();
            renderBody();
          } else {
            state.selectedBenchId = null;
            renderBody();
          }
        }
      }
    });
  });

  // transfers: select "out"
  el.querySelectorAll('[data-out]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = parseInt(b.getAttribute('data-out'));
      state.transferOutId = (state.transferOutId===id) ? null : id;
      state.transferAddPos = null;
      state.transferAddSlot = null;
      renderBody();
    });
  });

  // transfers: "in" -> execute swap or add-to-empty-slot
  el.querySelectorAll('[data-in]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      tryBuyPlayer(parseInt(b.getAttribute('data-in')));
    });
  });

  // more tab: toggles
  el.querySelectorAll('[data-toggle]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.toggles[b.getAttribute('data-toggle')] = !state.toggles[b.getAttribute('data-toggle')]; renderBody(); });
  });

  // admin pin
  const pinInput = el.querySelector('#pinInput');
  const pinSubmit = el.querySelector('#pinSubmit');
  if(pinSubmit) pinSubmit.addEventListener('click', ()=>{
    const val = pinInput.value;
    if(val === ADMIN_PIN){ state.adminUnlocked = true; state.adminPinInput=''; }
    else { state.adminPinInput = 'wrong'; }
    renderBody();
  });

  // admin: force a fresh sync from the official FPL API
  const forceSync = el.querySelector('#adminForceSync');
  if(forceSync) forceSync.addEventListener('click', async ()=>{
    await loadLiveData(true);
    state.adminSavedBanner = true;
    renderBody();
    setTimeout(()=>{ state.adminSavedBanner = false; if(state.tab==='admin') renderBody(); }, 3000);
  });

  // transfers: search box — نحدث marketList فقط عشان الحقل ميفقدش الـ focus
  const searchBox = el.querySelector('#transferSearch');
  if(searchBox){
    searchBox.addEventListener('input', ()=>{
      state.transferSearch = searchBox.value;
      const marketList = el.querySelector('#marketList');
      if(marketList){
        marketList.innerHTML = renderTransferMarket();
        bindMarketListItems(marketList);
      }
    });
  }
  const filterClub = el.querySelector('#transferFilterClub');
  if(filterClub){
    filterClub.addEventListener('change', ()=>{
      state.transferFilterClub = filterClub.value;
      const marketList = el.querySelector('#marketList');
      if(marketList){ marketList.innerHTML = renderTransferMarket(); bindMarketListItems(marketList); }
    });
  }
  const filterPrice = el.querySelector('#transferFilterPrice');
  if(filterPrice){
    filterPrice.addEventListener('change', ()=>{
      state.transferFilterPrice = filterPrice.value;
      const marketList = el.querySelector('#marketList');
      if(marketList){ marketList.innerHTML = renderTransferMarket(); bindMarketListItems(marketList); }
    });
  }

  // admin: save news/advice links
  const saveLinks = el.querySelector('#adminSaveLinks');
  if(saveLinks) saveLinks.addEventListener('click', async ()=>{
    state.adminLinks = {
      news: el.querySelector('#adminNewsLink').value.trim(),
      advice: el.querySelector('#adminAdviceLink').value.trim(),
    };
    const ok = await sSet('mazareta_admin_links', JSON.stringify(state.adminLinks), true);
    saveLinks.textContent = ok ? 'تم الحفظ ✓' : 'فشل الحفظ';
    setTimeout(()=>{ saveLinks.textContent = 'حفظ الروابط'; }, 2000);
  });
}

// close notif panel when tapping elsewhere
document.addEventListener('click', (e)=>{
  if(state.notifOpen && !e.target.closest('#bellBtn') && !e.target.closest('.notif-panel')){
    state.notifOpen = false;
    if(state.tab==='home') renderBody();
  }
});

// bottom nav bindings
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.tab = btn.getAttribute('data-tab');
    state.notifOpen = false;
    if(state.tab !== 'leagues') state.activeLeagueId = null;
    render();
  });
});

// refresh deadline text + overall standings periodically
setInterval(()=>{ if(state.phase==='app' && state.tab==='home') renderBody(); }, 60000);

boot();
</script>
</body>
</html>
