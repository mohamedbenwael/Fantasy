}

// ===== قواعد الفانتازي الرسمية =====
const MAX_PER_CLUB = 3; // أقصى عدد لاعبين من نفس النادي في التشكيلة كلها (15 لاعب)
// حدود كل مركز في التشكيلة الأساسية (11 لاعب): حارس واحد بالظبط، 3-5 مدافعين، 2-5 وسط، 1-3 مهاجمين
const FORMATION_RULES = { GK:{min:1,max:1}, DEF:{min:3,max:5}, MID:{min:2,max:5}, FWD:{min:1,max:3} };
// حدود كل مركز في الفريق الكامل (15 لاعب: أساسي + احتياطي): بالظبط 2 حراس، 5 مدافعين، 5 وسط، 3 مهاجمين
const SQUAD_POS_LIMITS = { GK:2, DEF:5, MID:5, FWD:3 };
// عدد لاعبين مركز معين في الفريق كله حاليًا (أساسي + احتياطي)، مع إمكانية استبعاد لاعب معين (زي اللي هيتباع)
function squadPosCount(pos, excludeId, ids){
  const list = ids || state.mySquadIds;
  return list.filter(e=>{
    if(excludeId != null && e.id === excludeId) return false;
    const p = findPlayer(e.id);
    return p && p.pos === pos;
  }).length;
}

// عدد لاعبين نادي معين في تشكيلتي حاليًا (مع إمكانية استبعاد لاعب معين، زي اللي هيتباع)
function clubCountInSquad(club, excludeId, ids){
  const list = ids || state.mySquadIds;
  return list.filter(e=>{
    if(excludeId!=null && e.id===excludeId) return false;
    const p = findPlayer(e.id);
    return p && p.club === club;
  }).length;
}

// هل التبديل بين لاعب أساسي (outPos) ولاعب احتياطي (inPos) هيحافظ على تشكيلة قانونية؟
function formationValidAfterSwap(outPos, inPos, ids){
  if(outPos === inPos) return true;
  const counts = { GK:0, DEF:0, MID:0, FWD:0 };
  starters(ids).forEach(p=>{ counts[p.pos] = (counts[p.pos]||0) + 1; });
  counts[outPos] -= 1;
  counts[inPos] = (counts[inPos]||0) + 1;
  return Object.keys(FORMATION_RULES).every(pos=>{
    const r = FORMATION_RULES[pos];
    return counts[pos] >= r.min && counts[pos] <= r.max;
  });
}

// ============================================================
// ===== محرك التوقعات والنصائح =====
// كل الأرقام هنا "تقديرية" مبنية على بيانات فانتازي البريميرليج الرسمية بس:
// - توقع FPL الرسمي لنقط الجولة الجاية "ep_next"
// - فورم موزون (آخر 5 جولات، الأقرب أهم) بدل الفورم العادي
// - نموذج إحصائي مبني على xG/xA لكل 90 دقيقة (استحقاق اللاعب الفعلي مش بس نتايجه)
// - احتمال الكلين شيت من قوة هجوم/دفاع الأندية + xGC (أهداف متوقع استقبالها)
// - صعوبة المباراة الجاية (FDR) + نظرة على متوسط صعوبة أقرب 3 مباريات
// - نسبة الجولات اللي اتأسس فيها اللاعب (خطر الدوران) + لاعبي الضربات الثابتة
// مفيش أي بيانات مدفوعة ولا نموذج ذكاء اصطناعي، كله حسابات مباشرة وشفافة
// وممكن تتراجع أو تتحسّن في أي وقت.
// ============================================================

function teamFixtureInfo(clubKey){
  return (state.teamFixtures && state.teamFixtures[clubKey]) || null;
}

// صعوبة المباراة (FDR من فانتازي الرسمي: 1 سهلة جدًا -> 5 صعبة جدًا) بتتحول لمضاعف نقط
function fdrMultiplier(fdr){
  const map = {1:1.28, 2:1.14, 3:1.0, 4:0.86, 5:0.72};
  return map[fdr] || 1;
}

// احتمالية مشاركة اللاعب أصلاً (مصاب/موقوف/مشكوك فيه/انتقل بره الدوري/مش مسجل الموسم ده)
// أي حالة غير "a" (متاح) أو "d" (مشكوك فيه) بترفض بشكل افتراضي — ده بيغطي حالات زي
// لاعب اتباع لدوري تاني أو مش مسجل في الدوري الموسم ده (status زي "u")، مش بس الإصابة والإيقاف
function availabilityMultiplier(p){
  if(p.status==='a') return 1;
  if(p.status==='d') return Math.max(0.35, (p.chanceNext!=null ? p.chanceNext : 75) / 100);
  return 0; // i, s, u, n أو أي حالة تانية غير معروفة = مش متاح، منستبعده من كل الترشيحات
}

// احتمال الكلين شيت الأساسي لنادي اللاعب في مباراته الجاية (قوة دفاعه مقابل هجوم الخصم)
// + تعديل بسيط لو اللاعب نفسه بيستقبل أهداف أكتر من المتوقع لمركزه (xGC90 عالي شخصيًا)
function cleanSheetProbability(p){
  const fx = teamFixtureInfo(p.club);
  let prob = 0.28;
  if(fx && fx.ownDefHome!=null){
    const defStrength = fx.isHome ? fx.ownDefHome : fx.ownDefAway;
    const oppAtk = fx.isHome ? fx.oppAtkAway : fx.oppAtkHome;
    if(defStrength!=null && oppAtk!=null){
      prob = Math.max(0.03, Math.min(0.65, 0.32 + (defStrength-oppAtk)/220));
    }
  }
  if((p.pos==='DEF'||p.pos==='GK') && p.xGC90>1.1){ prob = Math.max(0.02, prob - (p.xGC90-1.1)*0.12); }
  return prob;
}

// نموذج إحصائي: نبني توقع نقط اللاعب من "استحقاقه" الفعلي (xG/xA/كلين شيت/بونص)
// مش بس النتايج القديمة — ده بيقلل أثر الحظ (تسديدة اترد من القايم، أو أهداف من تسديدات ضعيفة)
function statModelPoints(p){
  const posGoalPts = {GK:6,DEF:6,MID:5,FWD:4}[p.pos] || 4;
  const posCSPts   = {GK:4,DEF:4,MID:1,FWD:0}[p.pos] || 0;
  const minFactor = (p.startsFactor!=null && p.startsFactor>0) ? p.startsFactor : (p.minutes>0 ? 0.5 : 0);
  if(minFactor<=0) return 0;
  const appearancePts = minFactor * 2; // تقدير نقط الظهور (60+ دقيقة)
  const goalPts   = (p.xG90||0) * minFactor * posGoalPts;
  const assistPts = (p.xA90||0) * minFactor * 3;
  const csPts     = cleanSheetProbability(p) * posCSPts * minFactor;
  const bonusPts  = (p.bonusPerMatch||0) * minFactor;
  const savePts   = p.pos==='GK' ? ((p.savesPer90||0)/3) * minFactor : 0;
  return appearancePts + goalPts + assistPts + csPts + bonusPts + savePts;
}

// خوارزمية الجولة الأولى: من غير أي مباريات لعبت فعلاً في الموسم ده، أي إحصائية جاية من الـ API
// (xG90, xA90, بونص لكل مباراة... إلخ) ممكن تكون محسوبة على 5 دقايق لعبهم آخر الموسم اللي فات
// وطلعت رقم فلكي لمجرد إنهم شاطوا كورة فيها. عشان كده في الجولة الأولى بنتجاهل كل إحصائيات
// الـ API تمامًا (مفيش statModelPoints هنا خالص) ونعتمد 100% على مؤشرين مضمونين:
// - سعر اللاعب: فانتازي نفسها حطته بناءً على مستواه وموسمه اللي فات.
// - نسبة ملكيته: يعني آلاف المديرين راجعوا بياناته واختاروه فعلاً (مش رقم مهرج من الـ API).
// أي لاعب ملكيته أقل من 1% بياخد قيمة أرضية ثابتة ومفيهاش أي اعتماد على إحصائياته المحتمل تكون مضروبة.
function gw1BaseEstimate(p){
  if((p.ownership||0) < 1) return 1; // استبعاد فوري: نقطة ظهور تقريبية بس، من غير أي إحصائيات API

  const posFloor = {GK:4.0, DEF:4.0, MID:4.5, FWD:4.5}[p.pos] || 4.0;
  const priceScore = Math.max(0, (p.price - posFloor)) * 0.9; // كل نص مليون فوق سعر مركزه ≈ نقطة إضافية
  const ownScore = Math.min(p.ownership||0, 45) * 0.09;        // الملكية بتضيف تدريجيًا لغاية سقف معقول
  return 1.5 + priceScore + ownScore; // 1.5 قاعدة أساسية تقريبية لنقط الظهور
}

// توقع نقاط اللاعب في الجولة الجاية:
// - في الجولة الأولى: سعر + ملكية بس (gw1BaseEstimate)، وexception واحد بيقطع epNext تمامًا.
// - من الجولة التانية: بنمزج بين توقع FPL الرسمي (ep_next) والنموذج الإحصائي (xG/xA/كلين شيت/بونص)،
//   وإلا لو معندناش ep_next بنمزج الفورم الموزون مع النموذج الإحصائي.
// وبعدين بنضرب في صعوبة المباراة (FDR) واحتمال المشاركة.
function predictedPoints(p){
  const avail = availabilityMultiplier(p);
  if(avail===0) return 0;
  const fx = teamFixtureInfo(p.club);
  const fdrMul = fx ? fdrMultiplier(fx.fdr) : 1;
  let base;
  if(state.gwInfo.current<=1){
    base = gw1BaseEstimate(p); // ما فيهاش أي استدعاء لـ statModelPoints في الجولة الأولى، خالص
  }
  else {
    const stat = statModelPoints(p);
    if(p.epNext && p.epNext>0){ base = p.epNext*0.5 + stat*0.5; }
    else if(p.formWeighted && p.formWeighted>0){ base = p.formWeighted*0.6 + stat*0.4; }
    else if(stat>0){ base = stat; }
    else { base = state.gwInfo.current>0 ? totalPoints(p)/state.gwInfo.current : 2; }
  }
  const pts = base * fdrMul * avail;
  return Math.max(0, Math.round(pts*10)/10);
}

// توقع مجموع نقاط التشكيلة الأساسية (بمضاعفة الكابتن)
function predictedSquadPoints(){
  const c = captain();
  const isCapStarting = c && state.mySquadIds.find(e=>e.id===c.id && e.slot==='start');
  const base = starters().reduce((s,p)=>s+predictedPoints(p),0);
  const extra = isCapStarting ? predictedPoints(c) : 0;
  return Math.round((base+extra)*10)/10;
}

// متوسط نسبة ملكية لاعبين تشكيلتك الـ15 (مؤشر تقريبي — مش effective ownership)
function squadOwnershipAvg(){
  const s = squad();
  if(!s.length) return 0;
  return Math.round((s.reduce((sum,p)=>sum+p.ownership,0)/s.length)*10)/10;
}

// ترتيب الأندية حسب احتمال الكلين شيت في مباراتهم القادمة اللي لسه ما اتلعبتش
// (بنعتمد على lookahead[0] بدل مباراة الجولة الحالية، عشان لو مباراة النادي خلصت
// بالفعل في الجولة الجارية، القسم ده يتحول تلقائيًا لمباراته الجاية مش يفضل واقف عليها)
function cleanSheetRanking(){
  return Object.keys(CLUB_TAG).map(key=>{
    const fxInfo = state.teamFixtures[key];
    if(!fxInfo || !fxInfo.lookahead || !fxInfo.lookahead.length) return null;
    const nextFix = fxInfo.lookahead[0];
    const keepers = state.players.filter(p=>p.pos==='GK' && p.club===key);
    const refPlayer = { pos:'GK', club:key, xGC90: keepers.length ? keepers[0].xGC90 : 0 };
    let prob = nextFix.fdr <= 2 ? 0.38 : (nextFix.fdr >= 4 ? 0.18 : 0.28);
    if(refPlayer.xGC90>1.1){ prob = Math.max(0.02, prob - (refPlayer.xGC90-1.1)*0.12); }
    return { club:key, prob: Math.max(3, Math.min(72, Math.round(prob*100))), fx: nextFix };
  }).filter(Boolean).sort((a,b)=>b.prob-a.prob);
}

// أفضل حراس مرمى مرشحين لكلين شيت (أول حارس أساسي في كل نادي من أعلى الترتيب)
function topCleanSheetKeepers(limit){
  return cleanSheetRanking().map(r=>{
    const keepers = state.players.filter(p=>p.pos==='GK' && p.club===r.club && availabilityMultiplier(p)>0);
    if(!keepers.length) return null;
    keepers.sort((a,b)=> b.minutes-a.minutes || b.ownership-a.ownership);
    return { p:keepers[0], prob:r.prob, fx:r.fx };
  }).filter(Boolean).slice(0, limit||8);
}

// اللاعبون الأعلى توقعاً للمباراة القادمة (فورم + مباراة سهلة، من كل اللاعبين المتاحين فعلاً)
// بنشيل تأثير fdr مباراة الجولة الحالية من predictedPoints ونحطله بدالها fdr المباراة
// القادمة اللي لسه ما اتلعبتش، عشان لاعب مباراته خلصت بالفعل ميفضلش ظاهر بتوقع قديم.
// ملحوظة مهمة: بنفلتر بـ availabilityMultiplier بس (مش p.minutes>0) — لأن p.minutes هي
// دقايق الموسم المتراكمة، وأول ما جولة تبدأ (أو أول جولة في الموسم) بتكون صفر لكل لاعبي
// الفرق اللي لسه ما لعبتش، فلو فلترنا بيها هتستبعد كل اللاعبين إلا لاعبي الفريق الوحيد
// اللي خلص ماتشه فعلاً — وده بالظبط اللي كان بيحصل.
function inFormRanking(limit){
  return state.players.filter(p=>availabilityMultiplier(p)>0)
    .map(p=>{
      const curFx = teamFixtureInfo(p.club);
      const curMul = curFx ? fdrMultiplier(curFx.fdr) : 1;
      const fxInfo = state.teamFixtures[p.club];
      const nextFix = (fxInfo && fxInfo.lookahead && fxInfo.lookahead[0]) ? fxInfo.lookahead[0] : null;
      const nextMul = nextFix ? fdrMultiplier(nextFix.fdr) : curMul;
      const base = predictedPoints(p) / (curMul || 1);
      const score = Math.max(0, Math.round(base * nextMul * 10) / 10);
      return { p, score, fx: nextFix };
    })
    .sort((a,b)=>b.score-a.score)
    .slice(0, limit||10);
}

// الأعلى نسبة ملكية بين كل المديرين
function ownershipRanking(limit){
  return state.players.slice().sort((a,b)=>b.ownership-a.ownership).slice(0, limit||10);
}

// ===== مؤشر توقع تغيير الأسعار (تقديري) =====
// بيعتمد على صافي التحويلات (شراء - بيع) من بداية الجولة الحالية، مقسومة على عدد
// مديري الفانتازي المالكين للاعب حاليًا — كل ما زادت النسبة دي كل ما زاد احتمال
// ارتفاع/انخفاض سعر اللاعب في التحديث القادم من فانتازي البريميرليج.
// ده مش رقم رسمي من فانتازي (الخوارزمية الحقيقية مش معلنة)، لكنه أقرب تقدير ممكن.
function netTransfers(p){ return (p.transfersInEvent||0) - (p.transfersOutEvent||0); }

function priceMoveScore(p){
  const owners = Math.max(1, Math.round((p.ownership/100) * (state.totalManagers||0)));
  const net = netTransfers(p);
  return { net, owners, ratio: net / owners };
}

function priceRisers(limit){
  return state.players
    .map(p=>({ p: p, net: priceMoveScore(p).net, owners: priceMoveScore(p).owners, ratio: priceMoveScore(p).ratio }))
    .filter(x=>x.net > 0)
    .sort((a,b)=>b.ratio - a.ratio || b.net - a.net)
    .slice(0, limit||10);
}

function priceFallers(limit){
  return state.players
    .map(p=>({ p: p, net: priceMoveScore(p).net, owners: priceMoveScore(p).owners, ratio: priceMoveScore(p).ratio }))
    .filter(x=>x.net < 0)
    .sort((a,b)=>a.ratio - b.ratio || a.net - b.net)
    .slice(0, limit||10);
}

// ===== تريندات السوق: أكثر اللاعبين شراءً وبيعاً هذه الجولة (خام، بدون حساب نسبة الملكية) =====
function topTransfersIn(limit){
  return state.players
    .filter(p=>(p.transfersInEvent||0) > 0)
    .slice()
    .sort((a,b)=>(b.transfersInEvent||0) - (a.transfersInEvent||0))
    .slice(0, limit||3);
}

function topTransfersOut(limit){
  return state.players
    .filter(p=>(p.transfersOutEvent||0) > 0)
    .slice()
    .sort((a,b)=>(b.transfersOutEvent||0) - (a.transfersOutEvent||0))
    .slice(0, limit||3);
}

// نصايح: مين تبيع من فريقك الحالي
function sellAdvice(){
  return squad().map(p=>{
    const reasons = [];
    let score = predictedPoints(p);
    if(p.status==='i'){ reasons.push('مصاب'); score -= 5; }
    else if(p.status==='s'){ reasons.push('موقوف'); score -= 5; }
    else if(p.status==='d'){ reasons.push('مشكوك في مشاركته'); score -= 1.5; }
    const fx = teamFixtureInfo(p.club);
    if(fx && fx.fdr>=4){ reasons.push('مباراة صعبة الجولة الجاية'); score -= 0.8; }
    if(fx && fx.avgFdrNext3 && fx.avgFdrNext3>=3.6){ reasons.push('سلسلة مباريات صعبة قدامه'); score -= 0.6; }
    if(p.minutes>0 && (p.formWeighted||p.form||0) < 2){ reasons.push('فورم ضعيف'); score -= 0.6; }
    if((p.startsFactor!=null) && p.startsFactor<0.5 && p.minutes>0){ reasons.push('خطر دوران (مش أساسي ثابت)'); score -= 0.7; }
    if(p.pos!=='GK' && (p.form||0) > (p.xG90+p.xA90)*4 + 1.5){ reasons.push('نتايجه أحسن من مستواه الفعلي (ممكن ترجع لطبيعتها)'); score -= 0.4; }
    if(p.priceChange < 0){ reasons.push('سعره بينزل'); }
    return { p, score, reasons };
  }).filter(x=>x.reasons.length>0).sort((a,b)=>a.score-b.score).slice(0,5);
}

// نصايح: مين تشتري (من برا فريقك)
function buyAdvice(){
  return pool().filter(p=>availabilityMultiplier(p)>0)
    .map(p=>{
      const reasons = [];
      const pred = predictedPoints(p);
      const fx = teamFixtureInfo(p.club);
      if(fx && fx.fdr<=2) reasons.push('مباراة سهلة الجولة الجاية');
      if(fx && fx.avgFdrNext3 && fx.avgFdrNext3<=2.4) reasons.push('سلسلة مباريات سهلة قدامه');
      if((p.formWeighted||p.form||0) >= 4) reasons.push('فورم ممتاز');
      if(p.pos!=='GK' && (p.xG90+p.xA90) >= 0.5) reasons.push('معدل مشاركة عالي في الأهداف (xG/xA)');
      if(p.setPiece) reasons.push(p.setPiece);
      if((p.startsFactor||0) >= 0.85) reasons.push('أساسي ثابت');
      if(p.priceChange > 0) reasons.push('سعره بيطلع');
      if(p.ownership < 8 && pred>=4) reasons.push('لاعب مميز (differential)');
      return { p, pred, reasons };
    })
    .sort((a,b)=>b.pred-a.pred)
    .slice(0,8);
}

// ===== الدريم تيم: أفضل 11 لاعب ممكنين للجولة الجاية من كل قاعدة اللاعبين =====
// (من غير أي تقيد بالميزانية — الهدف إنها تكون أداة استرشادية قبل قفل الجولة، مش تشكيلة رسمية)
function dreamTeamXI(){
  // التحقق: هل الجولة بدأت وفيه أي لاعب جاب نقط فعلية؟
  const isStarted = new Date(state.gwInfo.deadline).getTime() < Date.now();
  const hasLivePoints = state.players.some(p => currentGwPoints(p) > 0);
  const useLive = isStarted && hasLivePoints;

  const byPos = { GK:[], DEF:[], MID:[], FWD:[] };
  state.players.forEach(p=>{
    // لو بنحسب توقعات نستبعد المصابين، لكن في اللايف اللي جاب نقطة يدخل حتى لو كان مصاب
    if(!useLive && availabilityMultiplier(p) <= 0) return;

    const score = useLive ? currentGwPoints(p) : predictedPoints(p);
    if(score <= 0) return;

    if(!byPos[p.pos]) return;
    byPos[p.pos].push({ p:p, score:score });
  });

  // ترتيب اللاعبين داخل كل مركز (في حالة التعادل في النقط، الأرخص بيكسب)
  Object.keys(byPos).forEach(k => {
    byPos[k].sort((a,b) => b.score - a.score || a.p.price - b.p.price);
  });

  if(byPos.GK.length<1) return null;

  let best = null;
  for(let def=FORMATION_RULES.DEF.min; def<=FORMATION_RULES.DEF.max; def++){
    for(let mid=FORMATION_RULES.MID.min; mid<=FORMATION_RULES.MID.max; mid++){
      const fwd = 10 - def - mid;
      if(fwd < FORMATION_RULES.FWD.min || fwd > FORMATION_RULES.FWD.max) continue;
      if(byPos.DEF.length<def || byPos.MID.length<mid || byPos.FWD.length<fwd) continue;

      const picks = [].concat(byPos.GK.slice(0,1), byPos.DEF.slice(0,def), byPos.MID.slice(0,mid), byPos.FWD.slice(0,fwd));
      const total = picks.reduce((s,x)=>s+x.score, 0);

      if(!best || total > best.total){
        best = { total:total, picks:picks, formation: def+'-'+mid+'-'+fwd };
      }
    }
  }
  if(!best) return null;

  const capEntry = best.picks.slice().sort((a,b)=>b.score-a.score)[0];
  const scoreById = {};
  best.picks.forEach(x=>{ scoreById[x.p.id] = x.score; });

  // الكابتن بياخد النقط دبل
  const finalTotal = best.total + (capEntry ? capEntry.score : 0);

  return {
    xi: best.picks.map(x=>x.p),
    formation: best.formation,
    total: useLive ? finalTotal : Math.round(finalTotal*10)/10,
    captainId: capEntry ? capEntry.p.id : null,
    scoreById: scoreById,
    useLive: useLive // متغير بيفهم الواجهة إحنا لايف ولا توقعات
  };
}

function renderDreamTeamJersey(p, scoreById, capId, useLive){
  const shirtSrc = 'https://fantasy.premierleague.com/dist/img/shirts/standard/shirt_' + p.teamCode + (p.pos==='GK' ? '_1' : '') + '-66.webp';
  const isCap = p.id === capId;

  let pts = scoreById[p.id] != null ? scoreById[p.id] : (useLive ? currentGwPoints(p) : predictedPoints(p));
  if (isCap) pts *= 2;

  const ptsFormatted = useLive ? pts : fmt(pts);
  const status = getPlayerMatchStatus(p);

  let pptsClass = 'ppts';
  let displayBottom = '';

// ===== كشف حساب الذكاء الاصطناعي (التشكيلة المتوقعة بنقاط لايف) =====
function aiEvaluationTeam(){
  const byPos = { GK:[], DEF:[], MID:[], FWD:[] };
  state.players.forEach(p=>{
    // بنختار بناءً على التوقع قبل الماتش عشان نثبت التشكيلة
    const predScore = predictedPoints(p);
    if(predScore <= 0 || availabilityMultiplier(p) <= 0) return;
    if(!byPos[p.pos]) return;
    byPos[p.pos].push({ p:p, pred:predScore });
  });

  Object.keys(byPos).forEach(k => {
    byPos[k].sort((a,b) => b.pred - a.pred || a.p.price - b.p.price);
  });

  if(byPos.GK.length<1) return null;

  let best = null;
  for(let def=FORMATION_RULES.DEF.min; def<=FORMATION_RULES.DEF.max; def++){
    for(let mid=FORMATION_RULES.MID.min; mid<=FORMATION_RULES.MID.max; mid++){
      const fwd = 10 - def - mid;
      if(fwd < FORMATION_RULES.FWD.min || fwd > FORMATION_RULES.FWD.max) continue;
      if(byPos.DEF.length<def || byPos.MID.length<mid || byPos.FWD.length<fwd) continue;

      const picks = [].concat(byPos.GK.slice(0,1), byPos.DEF.slice(0,def), byPos.MID.slice(0,mid), byPos.FWD.slice(0,fwd));
      const totalPred = picks.reduce((s,x)=>s+x.pred, 0);

      if(!best || totalPred > best.totalPred){
        best = { totalPred:totalPred, picks:picks, formation: def+'-'+mid+'-'+fwd };
      }
    }
  }
  if(!best) return null;

  // الكابتن هو أعلى واحد في التوقع
  const capEntry = best.picks.slice().sort((a,b)=>b.pred-a.pred)[0];

  const isStarted = new Date(state.gwInfo.deadline).getTime() < Date.now();
  const hasLivePoints = state.players.some(p => currentGwPoints(p) > 0);
  const isLive = isStarted && hasLivePoints;

  let actualTotal = 0;
  const scoreById = {};

  best.picks.forEach(x => {
    // النقط المعروضة: لو لايف نجيب النقط الحقيقية، لو لسه يبقى التوقع
    let pts = isLive ? currentGwPoints(x.p) : x.pred;
    if (capEntry && x.p.id === capEntry.p.id) pts *= 2;
    scoreById[x.p.id] = pts;
    actualTotal += pts;
  });

  return {
    xi: best.picks.map(x=>x.p),
    formation: best.formation,
    total: isLive ? actualTotal : Math.round(actualTotal*10)/10,
    captainId: capEntry ? capEntry.p.id : null,
    scoreById: scoreById,
    isLive: isLive
  };
}

async function savePersonal(){
  await sSet('mazareta_squad:'+state.deviceId, JSON.stringify({
    mySquadIds:state.mySquadIds, captainId:state.captainId, bank:state.bank,
    freeTransfers:state.freeTransfers, seasonBaseline:state.seasonBaseline,
    squadGw: state.gwInfo && state.gwInfo.current // الجولة اللي التشكيلة دي خاصة بيها
  }), false);
  pushPublicEntry();
}
async function pushPublicEntry(){
  await sSet('public_entry:'+state.deviceId, JSON.stringify({
    managerName:state.managerName, teamName:state.teamName,
    total:seasonTotal(), gw:roundPoints(), updatedAt:Date.now()
  }), true);
}
async function saveManager(){
  // state.deviceId now holds the user's FPL Team ID, so this row (and its key)
  // is effectively keyed on fpl_team_id — matching the managers table's new primary key
  await sSet('mazareta_manager:'+state.deviceId, JSON.stringify({
    deviceId:state.deviceId, fplTeamId:state.deviceId,
    managerName:state.managerName, teamName:state.teamName
  }), false);
}
// ===== boot =====
async function boot(){
  state.phase = 'boot';
  render();
  try{
    await loadLiveData();
    try{
      const linksRaw = await sGet('mazareta_admin_links', true);
      if(linksRaw) state.adminLinks = JSON.parse(linksRaw);
    }catch(e){}

    // if this browser already has an FPL Team ID saved, skip onboarding and go
    // straight into the app; otherwise show the onboarding screen to collect it
    const savedFplId = getLocalDeviceId();
    if(!savedFplId){
      state.phase = 'onboard';
      render();
      return;
    }

    state.deviceId = savedFplId;
    let raw = await sGet('mazareta_manager:'+state.deviceId, false);
    if(raw){
      const m = JSON.parse(raw);
      state.managerName = m.managerName; state.teamName = m.teamName;
    }

    // نجيب بيانات المدير الحقيقية من FPL — ده مصدرنا الوحيد للترتيب العام والدوريات
    const entry = await fetchFplEntry(savedFplId);
    if(entry && !entry.error){
      if(!raw){ state.managerName = entry.managerName; state.teamName = entry.teamName; await saveManager(); }
      state.overallRank = entry.overallRank;
      state.eventRank = entry.eventRank;
      state.realLeagues = entry.leagues;
    } else if(!raw){
      state.managerName = 'مدير ' + savedFplId;
      state.teamName = 'فريق ' + savedFplId;
      await saveManager();
    }

    await loadSquadOrDraft();
    state.phase = 'app';
    render();
    loadOrBuildRankCurve().then(()=>{ if(state.tab==='home' || state.tab==='team') renderBody(); }); // مش بنستنى — أول تحميل ممكن ياخد شوية ثواني (سحب عينة صفحات)
  } catch(e){
    state.bootError = 'حصل خطأ في تحميل البيانات. حاول تاني.';
    render();
  }
}

// لو فيه مسودة تعديلات محفوظة (كابتن/تبديل/انتقال اتعمل وقت الجولة كانت شغالة):
// - لو الجولة اللي كانت المسودة مستنياها وصلت (أو فاتت)، نطبقها كتشكيلة رسمية دلوقتي ونمسحها.
// - غير كده (لسه بدري)، نسيبها محمّلة في state.draft* عشان المستخدم يكمّل يعدّل فيها.
async function syncDraftForGw(gw){
  try{
    const raw = await sGet('mazareta_squad_next:'+state.deviceId, false);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || !d.draftForGw) return;
    if(d.draftForGw <= gw){
      state.mySquadIds = d.mySquadIds;
      state.captainId = d.captainId;
      if(typeof d.bank === 'number') state.bank = d.bank;
      if(d.freeTransfers != null) state.freeTransfers = d.freeTransfers;
      await savePersonal();
      await sDelete('mazareta_squad_next:'+state.deviceId);
      state.draftSquadIds = null; state.draftCaptainId = null; state.draftBank = null;
      state.draftFreeTransfers = null; state.draftForGw = null;
    } else {
      state.draftSquadIds = d.mySquadIds;
      state.draftCaptainId = d.captainId;
      state.draftBank = d.bank;
      state.draftFreeTransfers = d.freeTransfers;
      state.draftForGw = d.draftForGw;
    }
  }catch(e){}
}

async function loadSquadOrDraft(){
  const gw = state.gwInfo && state.gwInfo.current;
  const isStarted = new Date(state.gwInfo.deadline).getTime() < Date.now();

  // ١. الأولوية المطلقة: محاولة جلب التشكيلة الرسمية من سيرفر الفانتازي
  // (لو الديدلاين قفل، الفانتازي هيرجع الداتا الحقيقية وهنمسح بيها التشكيلة التجريبية)
  try{
    const picks = state.deviceId ? await fetchFplPicks(state.deviceId, gw) : null;
    if(picks && picks.squadIds && picks.squadIds.length){
      state.mySquadIds = picks.squadIds;
      state.captainId = picks.captainId;
      state.bank = picks.bank;

      // تحديد التبديلات بذكاء (غير محدود قبل بداية الموسم، و 1 بعد البداية)
      state.freeTransfers = (gw === 1 && !isStarted) ? 'غير محدود' : 1;

      state.seasonBaseline = 0;

      // حفظ التشكيلة الرسمية في التخزين المحلي عشان نكتب فوق التشكيلة التجريبية
      await savePersonal();
      await syncDraftForGw(gw);
      return;
    }
  }catch(e){
    // الجولة لسه مقفلتش (الفانتازي مخبي التشكيلة) أو مفيش إنترنت
  }

  // ٢. لو الفانتازي لسه مخبي التشكيلة: نعرض التشكيلة التجريبية اللي اليوزر عاملها جوه الأبلكيشن
  try{
    const savedRaw = await sGet('mazareta_squad:'+state.deviceId, false);
    if(savedRaw){
      const saved = JSON.parse(savedRaw);
      if(saved && saved.mySquadIds && saved.mySquadIds.length && saved.squadGw === gw){
        state.mySquadIds = saved.mySquadIds;
        state.captainId = saved.captainId;
        state.bank = typeof saved.bank === 'number' ? saved.bank : 100;

        state.freeTransfers = (gw === 1 && !isStarted) ? 'غير محدود' : 1;

        state.seasonBaseline = saved.seasonBaseline || 0;
        await syncDraftForGw(gw);
        return;
      }
    }
  }catch(e){}

  // ٣. لو مفيش داتا خالص: نبدأ بتشكيلة فاضية
  state.mySquadIds = [];
  state.captainId = null;
  state.bank = 100;
  state.freeTransfers = (gw === 1 && !isStarted) ? 'غير محدود' : 1;
  state.seasonBaseline = 0;
  await savePersonal();
  await syncDraftForGw(gw);
}

// ===== onboarding submit =====
async function submitOnboard(){
  const inputEl = document.getElementById('obFplId');
  const errEl = document.getElementById('obError');
  const btnEl = document.getElementById('obSubmit');
  const fplId = inputEl.value.trim();

  if(errEl){ errEl.style.display = 'none'; errEl.textContent = ''; }

  if(!fplId){
    if(errEl){ errEl.textContent = 'اكتب الـ FPL Team ID الأول'; errEl.style.display = 'block'; }
    return;
  }

  if(btnEl){ btnEl.disabled = true; btnEl.textContent = 'جاري التحقق...'; }

  const entry = await fetchFplEntry(fplId);

  if(!entry || entry.error){
    if(errEl){ errEl.textContent = (entry && entry.error) ? entry.error : 'تأكد من رقم الـ ID وحاول تاني'; errEl.style.display = 'block'; }
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = 'ابدأ اللعب'; }
    return;
  }

  // نجحنا — نخزّن الـ ID محليًا عشان boot() يتخطى الأونبوردينج المرة الجاية
  try{ localStorage.setItem('mazareta_fpl_id', fplId); } catch(e){}

  state.deviceId = fplId;
  state.managerName = entry.managerName;
  state.teamName = entry.teamName;
  state.overallRank = entry.overallRank;
  state.eventRank = entry.eventRank;
  state.realLeagues = entry.leagues;

  await saveManager();
  await loadSquadOrDraft(); // هتجيب التشكيلة الحقيقية من FPL (شوف التعديل فوق)
  state.phase = 'app';
  render();
}

// ===== countdown =====
function countdown(iso){
  const diff = new Date(iso).getTime() - Date.now();
  if(diff<=0) return 'التشكيلة مقفولة';
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  if(d>0) return 'يوم'.length && (d===1?'يوم واحد':(d===2?'يومان':d+' أيام')) + ' و' + h + ' ساعة';
  const m = Math.floor((diff%3600000)/60000);
  return h+' ساعة و'+m+' دقيقة';
}

// ===== HOME =====
function renderLivePill(){
  if(state.liveDataError){
    return '<div class="live-pill warn"><div class="dotpulse"></div>تعذر الاتصال بخوادم FPL (وضع عدم الاتصال).</div>';
  }
  if(state.liveDataStale){
    return '<div class="live-pill warn"><div class="dotpulse"></div>تأخر التحديث الأخير (البيانات غير محدثة).</div>';
  }
  return '<div class="live-pill"><div class="dotpulse"></div>متصل (البيانات محدثة مباشرة).</div>';
}
function renderLiveSyncedAt(){
  if(!state.liveSyncedAt) return '';
  const timeText = new Date(state.liveSyncedAt).toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });
  return '<div class="live-synced">آخر تحديث للنقاط: ' + timeText + '</div>';
}
// ===== مركز المباريات (Fixtures Hub) =====
function renderFixturesList(onlyLive) {
  if (!state.fixturesList || !state.fixturesList.length) return '';

  let matches = state.fixturesList;
  if (onlyLive) {
    // فلترة لعرض المباريات الشغالة دلوقتي بس
    matches = matches.filter(f => f.started && !f.finished);
    if (!matches.length) return '';
  }

  const listHtml = matches.map(f => {
    let timeOrScore = '';
    let badge = '';

    if (f.started && !f.finished) {
      timeOrScore = `<div class="match-score">${f.score_h} - ${f.score_a}</div>`;
      badge = `<div class="match-live-badge">مباشر • الدقيقة ${f.minutes}'</div>`;
    } else if (f.finished) {
      timeOrScore = `<div class="match-score">${f.score_h} - ${f.score_a}</div>`;
      badge = `<div class="match-time">انتهت</div>`;
    } else {
      const time = new Date(f.kickoff).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
      timeOrScore = `<div class="match-score" style="background:transparent; font-size:16px; color:var(--muted);">- : -</div>`;
      badge = `<div class="match-time">${time}</div>`;
    }

    return `
    <div class="match-card" data-match="${f.id}">
      <div class="match-team">
        <img class="match-team-logo" src="https://resources.premierleague.com/premierleague/badges/t${CLUB_CODE[f.team_h]}.png" onerror="this.style.display='none'">
        <div class="match-team-name">${CLUB_NAME[f.team_h]}</div>
      </div>
      <div class="match-center">
        ${timeOrScore}
        ${badge}
      </div>
      <div class="match-team">
        <img class="match-team-logo" src="https://resources.premierleague.com/premierleague/badges/t${CLUB_CODE[f.team_a]}.png" onerror="this.style.display='none'">
        <div class="match-team-name">${CLUB_NAME[f.team_a]}</div>
      </div>
    </div>`;
  }).join('');

  const title = onlyLive ? '<span class="h2-icon" style="color:var(--coral);">' + ICON_LIVE + ' مباريات تلعب الآن</span>' : 'مباريات الجولة ' + state.gwInfo.current;
  return '<div class="section-title"><h2>' + title + '</h2></div>' +
         '<div style="margin: 0 20px 20px;">' + listHtml + '</div>';
}

// دالة منفصلة لشاشة كل المباريات
function renderFixtures(){
  return '' +
  '<div class="topbar"><button class="back" id="fixBack">' + ICON_BACK + '</button><h1>مباريات الجولة</h1><div class="spacer"></div></div>' +
  renderFixturesList(false);
}

// تشكيلة كل فريق في الماتش (أساسي + بدلاء نزلوا فعلاً) — مبنية من بيانات اللايف
// بتاعة الجولة الحالية، فبتشتغل بس للجولة اللي بتُلعب/اتلعبت دلوقتي
function renderMatchLineup(f){
  const posOrder = { GK:0, DEF:1, MID:2, FWD:3 };
  const posGroupLabel = { GK:'حراسة المرمى', DEF:'الدفاع', MID:'الوسط', FWD:'الهجوم' };

  const teamPlayers = clubKey => state.players
    .filter(p => p.club === clubKey && (p.gwStarted || (p.gwMinutes||0) > 0))
    .sort((a,b) => (Number(b.gwStarted)-Number(a.gwStarted)));

  const hPlayers = teamPlayers(f.team_h);
  const aPlayers = teamPlayers(f.team_a);
  if(!hPlayers.length && !aPlayers.length) return '';

  const row = p => {
    const posLabel = { GK:'ح', DEF:'د', MID:'و', FWD:'هـ' }[p.pos] || p.pos;
    return '<div class="lineup-row' + (!p.gwStarted ? ' is-sub' : '') + '">' +
      '<div class="lineup-pos">' + posLabel + '</div>' +
      '<div class="lineup-name">' + p.name + '</div>' +
      (!p.gwStarted ? '<div class="lineup-sub">بديل</div>' : '') +
      (p.isPlayingLive ? '<div class="lineup-live-dot" title="بيلعب دلوقتي"></div>' : '') +
    '</div>';
  };

  const groupsHtml = ['GK','DEF','MID','FWD'].map(pos => {
    const h = hPlayers.filter(p => p.pos === pos);
    const a = aPlayers.filter(p => p.pos === pos);
    if(!h.length && !a.length) return '';
    return '<div class="lineup-group">' +
      '<div class="lineup-group-label">' + posGroupLabel[pos] + '</div>' +
      '<div class="lineup-wrap">' +
        '<div class="lineup-col home">' + h.map(row).join('') + '</div>' +
        '<div class="lineup-col away">' + a.map(row).join('') + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="section-title" style="margin:14px 0 8px;"><h2 style="font-size:12.5px;">التشكيلة</h2></div>' +
    groupsHtml;
}

function renderMatchModal() {
  if(!state.viewMatchId) return '';
  const f = state.fixturesList.find(x => x.id === state.viewMatchId);
  if(!f) return '';

  // قاموس الإحصائيات
  const labels = {
    goals_scored: `<span class="icon-inline">${ICON_GOAL} أهداف</span>`,
    assists: `<span class="icon-inline">${ICON_ASSIST} أسيست</span>`,
    own_goals: `<span class="icon-inline" style="color:var(--coral)">${ICON_CLOSE} هدف عكسي</span>`,
    penalties_saved: `<span class="icon-inline">${ICON_GLOVE} تصدي جزاء</span>`,
    penalties_missed: `<span class="icon-inline" style="color:var(--gold)">${ICON_WARN} إهدار جزاء</span>`,
    yellow_cards: `<span class="icon-inline"><div class="card-icon yellow"></div> إنذار</span>`,
    red_cards: `<span class="icon-inline"><div class="card-icon red"></div> طرد</span>`,
    saves: `<span class="icon-inline">${ICON_GLOVE} تصديات</span>`,
    bps: `<span class="icon-inline" style="color:var(--gold)">${ICON_STAR} BPS</span>`,
    bonus: `<span class="icon-inline" style="color:var(--gold)">${ICON_STAR} بونص</span>`
  };

  let statsHtml = '';
  (f.stats || []).forEach(stat => {
    if(!labels[stat.identifier]) return;
    if(stat.a.length === 0 && stat.h.length === 0) return;

    const hItems = stat.h.map(x => `<div>${findPlayer(x.element)?.name||'لاعب'} <span style="color:var(--muted);font-size:9.5px;">(${x.value})</span></div>`).join('');
    const aItems = stat.a.map(x => `<div><span style="color:var(--muted);font-size:9.5px;">(${x.value})</span> ${findPlayer(x.element)?.name||'لاعب'}</div>`).join('');

    statsHtml += `
    <div class="stat-row">
      <div class="stat-h">${hItems}</div>
      <div class="stat-lbl">${labels[stat.identifier]}</div>
      <div class="stat-a">${aItems}</div>
    </div>`;
  });

  if(!statsHtml) statsHtml = '<div class="hint" style="margin-top:20px;">لا توجد إحصائيات فعلية حتى الآن.</div>';

  return `
  <div class="modal-overlay open" id="matchModalOverlay">
    <div class="modal-content" id="matchModalContent" onclick="event.stopPropagation()">
      <button class="modal-close" id="closeMatchModal">${ICON_CLOSE}</button>
      <div style="text-align:center; margin-bottom:20px;">
        <div style="display:flex; justify-content:center; align-items:center; gap:14px; margin-bottom:10px;">
          <img src="https://resources.premierleague.com/premierleague/badges/t${CLUB_CODE[f.team_h]}.png" style="width:40px;">
          <div style="font-family:'Cairo'; font-size:22px; font-weight:900; color:var(--text);">${f.score_h!=null?f.score_h:'-'} : ${f.score_a!=null?f.score_a:'-'}</div>

function leagueRankChange(lg){
  const cur = lg.entry_rank, prev = lg.entry_last_rank;
  if(cur==null || prev==null || prev===cur) return { dir:'up', chg:0 };
  return cur < prev ? { dir:'up', chg: prev-cur } : { dir:'down', chg: cur-prev };
}

function renderLeaguePreviewItems(){
  if(!state.realLeagues.length) return '<div class="hint">لم تقم بالانضمام لأي دوري خاص حتى الآن.</div>';
  return state.realLeagues.map(lg => {
    const rc = leagueRankChange(lg);
    return '<button class="league-item" data-league="' + lg.id + '">' +
      '<div><div class="li-name">' + lg.name + '</div><div class="li-sub">' + (lg.rank_count ? lg.rank_count.toLocaleString() + ' مدير' : '') + '</div></div>' +
      '<div class="li-rank"><div class="num">#' + (lg.entry_rank!=null ? lg.entry_rank.toLocaleString() : '-') + '</div>' +
      (rc.chg ? '<div class="chg ' + rc.dir + '">' + (rc.dir==='up'?ICON_UP:ICON_DOWN) + rc.chg + '</div>' : '') + '</div>' +
    '</button>';
  }).join('');
}

function renderNotifPanel(){

  const diffHours = (deadline - now) / 3600000;

  // 0. إشعارات أحداث اللاعبين اللحظية (لو في تحديثات جديدة من تشكيلتك)
  const liveEventsHtml = renderLiveEventNotifs();

  // 1. إشعار حالة الجولة والديدلاين

    notifs.push('<div class="n-item"><div class="t1" style="color:var(--gold); display:flex; gap:6px; align-items:center;">' + ICON_CLOCK + 'اقتراب الموعد النهائي</div><div class="t2">متبقي أقل من 24 ساعة لإغلاق التشكيلة. يرجى التأكيد.</div></div>');

  } else {
    notifs.push('<div class="n-item"><div class="t1" style="color:#8FCBF2; display:flex; gap:6px; align-items:center;">' + ICON_REFRESH + 'سوق الانتقالات مفتوح</div><div class="t2">يمكنك إجراء التبديلات لفريقك الآن.</div></div>');
  }

  // 2. إشعار المباريات المباشرة
  if (state.hasLiveFixtures) {
    notifs.push('<div class="n-item"><div class="t1" style="color:#2ed573; display:flex; gap:6px; align-items:center;">' + ICON_LIVE + 'مباريات تلعب الآن</div><div class="t2">النقاط والبونص يتم تحديثها لحظياً مع كل حدث.</div></div>');
  }

  // 3. إشعار حالة الاتصال بالسيرفر
  const syncTime = state.liveSyncedAt ? new Date(state.liveSyncedAt).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) : 'الآن';
  if (state.liveDataError) {
     notifs.push('<div class="n-item"><div class="t1" style="color:var(--coral); display:flex; gap:6px; align-items:center;">' + ICON_WARN + 'خطأ في الاتصال</div><div class="t2">تعذر جلب البيانات. التطبيق يعمل ببيانات احتياطية.</div></div>');

  }

  return '<div class="notif-panel">' + liveEventsHtml + notifs.join('') + '</div>';

function renderJersey(p, opts){
  opts = opts || {};
  let cls = 'jersey jersey-photo';
  if(opts.selected) cls += ' selected';

  const isCap = p.id === (opts.captainId !== undefined ? opts.captainId : state.captainId);
  const showPts = p.slot === 'start';
  const mode = opts.mode || 'view';
  const dataAttr = ' data-player="' + p.id + '" data-mode="' + mode + '"';
  const shirtSrc = 'https://fantasy.premierleague.com/dist/img/shirts/standard/shirt_' + p.teamCode + (p.pos==='GK' ? '_1' : '') + '-66.webp';
  const hasBonus = (p.provisionalBonus||0) > 0;
  const ptsVal = isCap ? currentGwPoints(p)*2 : currentGwPoints(p);

  let pptsClass = 'ppts';
  let displayBottom = '';
  let liveDotHtml = '';

  if(opts.planningMode){
    // ده عرض مسودة تشكيلة الجولة الجاية — منعرضش نقط ولا حالة لايف خالص، بس مباراة كل لاعب الجاية
    pptsClass += ' upcoming';
    displayBottom = nextFixtureText(p.club);
  } else {
    const status = getPlayerMatchStatus(p);
    if (status.started) {
      pptsClass += ' played';
      if (status.isLive) pptsClass += ' live-playing';
      if (hasBonus) pptsClass += ' has-bonus';
      // تنسيق النقط زي الصورة بالظبط (pts 10) أو (pts (C) 10)
      const bonusIcon = '<span class="bonus-star">' + ICON_STAR + '</span>';
      displayBottom = 'pts ' + (isCap ? '(C) ' : '') + ptsVal + (hasBonus ? bonusIcon : '');
    } else {
      pptsClass += ' upcoming';
      displayBottom = status.fixtureText; // مثال: BOU (H)
    }
    liveDotHtml = (p.isPlayingLive ? '<div class="live-dot pulse" title="بيلعب دلوقتي"></div>' : '');
  }

  return '<div class="player" data-viewprofile="' + p.id + '">' +
    '<div class="' + cls + '"' + dataAttr + '>' +
      '<img class="jersey-shirt" src="' + shirtSrc + '" alt="' + p.name + '" onerror="imgFallback(this)" loading="lazy">' +
      (isCap ? '<div class="cap">C</div>' : '') +
      liveDotHtml +
    '</div>' +
    '<div class="pname">' + p.name + '</div>' +
    (showPts ? '<div class="' + pptsClass + '">' + displayBottom + '</div>' : '') +
  '</div>';
}
function renderPlaceholder(pos, slot){
  const label = {GK:'حارس', DEF:'مدافع', MID:'وسط', FWD:'مهاجم'}[pos] || pos;
  return '<div class="player" data-add-pos="' + pos + '" data-add-slot="' + (slot || 'start') + '" style="cursor:pointer;">' +
    '<div class="jersey placeholder">＋</div>' +
    '<div class="pname placeholder-name">' + label + '</div>' +
  '</div>';
}
function renderPitchCard(interactive){
  // في وضع التعديل (تشكيلتي): لو الجولة شغالة/مقفولة، بنشتغل على مسودة الجولة الجاية
  // مش على التشكيلة الحقيقية المقفولة؛ غير كده (أو في وضع العرض بس) بنستخدم التشكيلة الحقيقية
  const ids = interactive ? activeIds() : state.mySquadIds;
  const capId = interactive ? activeCaptainId() : state.captainId;
  const planning = interactive && isGwLocked(); // بنعرض مسودة الجولة الجاية بدل التشكيلة المقفولة

  const gkAll  = starters(ids).filter(p=>p.pos==='GK');
  const defAll = starters(ids).filter(p=>p.pos==='DEF');
  const midAll = starters(ids).filter(p=>p.pos==='MID');
  const fwdAll = starters(ids).filter(p=>p.pos==='FWD');
  const benchAll = benched(ids);

  const opts = { mode: interactive ? state.teamMode : 'view', captainId: capId, planningMode: planning };

  // دالة مساعدة: تملأ صف بلاعبين حقيقيين + placeholders لو الصف ناقص
  function rowHtml(players, needed, pos){
    let html = '';
    players.forEach(p => { html += renderJersey(p, opts); });
    for(let i = players.length; i < needed; i++){
      html += renderPlaceholder(pos, 'start');
    }
    return '<div class="row">' + html + '</div>';
  }

  // التشكيلة الأساسية لازم تكون 11 لاعب بالظبط (حارس + 10 لاعبين خط)
  // فمش كفاية إننا نوري الحد الأدنى لكل مركز (7 بس) — لازم نكمل الباقي كأماكن فاضية
  // مع الالتزام بحدود كل مركز (مدافعين 3-5، وسط 2-5، مهاجمين 1-3)
  function computeStartNeeds(gkCount, defCount, midCount, fwdCount){
    const mins = { DEF: FORMATION_RULES.DEF.min, MID: FORMATION_RULES.MID.min, FWD: FORMATION_RULES.FWD.min };
    const maxs = { DEF: FORMATION_RULES.DEF.max, MID: FORMATION_RULES.MID.max, FWD: FORMATION_RULES.FWD.max };
    const counts = { DEF: defCount, MID: midCount, FWD: fwdCount };
    const needed = { GK: 1, DEF: Math.max(mins.DEF, counts.DEF), MID: Math.max(mins.MID, counts.MID), FWD: Math.max(mins.FWD, counts.FWD) };
    let total = needed.GK + needed.DEF + needed.MID + needed.FWD;

    if(total < 11){
      // نكمل الباقي: نفضّل المركز اللي عند اللاعب فيه لاعب احتياطي جاهز أصلاً (عشان يقدر
      // يكمّل التشكيلة بتبديل فوري بدل ما يضطر يروح سوق الانتقالات)، وبعدين نرجع لترتيب
      // افتراضي معقول (مهاجم الأول، لأن ده اللي المستخدمين غالبًا بيدوروا يزودوه)
      const benchCounts = { DEF:0, MID:0, FWD:0 };
      benchAll.forEach(p=>{ if(benchCounts[p.pos] != null) benchCounts[p.pos]++; });
      const growOrder = ['FWD','MID','DEF','FWD','MID','DEF','FWD','MID']
        .slice()
        .sort((a,b)=> (benchCounts[b]>0?1:0) - (benchCounts[a]>0?1:0));
      let gi = 0, guard = 0;
      while(total < 11 && guard < 40){
        const k = growOrder[gi % growOrder.length]; gi++; guard++;
        if(needed[k] < maxs[k]){ needed[k]++; total++; }
      }
    } else if(total > 11){
      // لو المستخدم عنده لاعبين زيادة في مركز معين، نقلل الأماكن الفاضية في مراكز تانية (من غير ما نلمس لاعبين حقيقيين)
      const shrinkOrder = ['FWD','MID','DEF'];
      let guard = 0;
      while(total > 11 && guard < 40){
        guard++;
        let shrunk = false;
        for(const k of shrinkOrder){
          if(needed[k] > Math.max(mins[k], counts[k])){ needed[k]--; total--; shrunk = true; break; }
        }
        if(!shrunk) break;
      }
    }
    return needed;
  }
  const needs = computeStartNeeds(gkAll.length, defAll.length, midAll.length, fwdAll.length);
  const gkNeed  = needs.GK;
  const defNeed = needs.DEF;
  const midNeed = needs.MID;
  const fwdNeed = needs.FWD;

  // الاحتياطي: نعرض ما هو موجود + placeholders لإكمال 4
  const benchPositions = ['GK','DEF','MID','FWD'];
  let benchHtml = '';
  benchAll.forEach(p => {
    const o = Object.assign({}, opts, { selected: interactive && state.selectedBenchId===p.id });
    benchHtml += renderJersey(p, o);
  });
  for(let i = benchAll.length; i < 4; i++){
    benchHtml += renderPlaceholder(benchPositions[i] || 'GK', 'bench');
  }

  return '<div class="pitch-card"><div class="pitch">' +
    rowHtml(gkAll,  gkNeed,  'GK') +
    rowHtml(defAll, defNeed, 'DEF') +
    rowHtml(midAll, midNeed, 'MID') +
    rowHtml(fwdAll, fwdNeed, 'FWD') +
  '</div><div class="bench">' + benchHtml + '</div></div>';
}

// --- سوق الانتقالات: مستخرجة في دالة مستقلة عشان يمكن تحديثها لوحدها ---
function renderTransferMarket(){
  const ids = activeIds();
  const bank = activeBank();
  const outPlayer = state.transferOutId ? findPlayer(state.transferOutId) : null;
  // لو فيه لاعب مختار للبيع نعرض نفس مركزه فقط، أو لو فيه مركز فاضي محدد من الملعب نعرض مركزه فقط، غير كده نعرض الكل
  const positions = outPlayer ? [outPlayer.pos] : (state.transferAddPos ? [state.transferAddPos] : ['GK', 'DEF', 'MID', 'FWD']);
  const posLabel  = {GK:'حراس المرمى', DEF:'المدافعون', MID:'خط الوسط', FWD:'المهاجمون'};

  const searchTerm = (state.transferSearch || '').trim().toLowerCase();

  return positions.map(pos => {
    // القائمة الحقيقية فيها مئات اللاعبين — بنعرض أفضل 40 بالنسبة للنقاط المتوقعة عشان القائمة تفضل عملية
    let candidates = pool(ids)
      .filter(p => p.pos === pos)
      .filter(p => !searchTerm || p.name.toLowerCase().includes(searchTerm))
      .filter(p => state.transferFilterClub === 'all' || p.club === state.transferFilterClub)
      .filter(p => state.transferFilterPrice === 'all' || p.price <= parseFloat(state.transferFilterPrice))
      .sort((a, b) => predictedPoints(b) - predictedPoints(a) || totalPoints(b) - totalPoints(a))
      .slice(0, 40);

    if(!candidates.length) return '';

    const rows = candidates.map(p => {
      const budget = bank + (outPlayer ? outPlayer.price : 0);
      const clubLimitHit = outPlayer
        ? (p.club !== outPlayer.club && clubCountInSquad(p.club, outPlayer.id, ids) >= MAX_PER_CLUB)
        : (clubCountInSquad(p.club, null, ids) >= MAX_PER_CLUB);
      const disabled = outPlayer ? (outPlayer.pos !== pos || (budget - p.price) < 0 || clubLimitHit)
        : (state.transferAddPos ? (state.transferAddPos !== pos || (budget - p.price) < 0 || clubLimitHit) : true);
      return '<div class="p-row">' +
        '<div class="p-left" data-viewprofile="' + p.id + '">' +
          '<img class="p-mini jersey-photo" src="https://fantasy.premierleague.com/dist/img/shirts/standard/shirt_' + p.teamCode + (p.pos==='GK'?'_1':'') + '-66.webp" alt="' + p.name + '" onerror="imgFallback(this)" loading="lazy">' +
          '<div class="p-info"><div class="p-name">' + p.name + '</div>' +
          '<div class="p-meta">' + (CLUB_TAG[p.club] || '') + ' · £' + fmt(p.price) + 'm' +
            ' · ' + totalPoints(p) + ' نقطة · متوقع ' + fmt(predictedPoints(p)) + '</div></div></div>' +
        '<button class="p-btn in" data-in="' + p.id + '"' + (disabled ? ' disabled' : '') + '>إضافة</button>' +
      '</div>';
    }).join('');

    return '<div class="pos-head">' + posLabel[pos] + '</div>' +
           '<div class="league-list" style="gap:8px;">' + rows + '</div>';
  }).join('');
}

// ===== LEAGUES TAB =====
function renderLeagues(){
  // ===== شاشة تشكيلة عضو تاني في الدوري =====
  if(state.viewMemberId){
    const vm = state.viewMemberSquad || {};
    const header = '<div class="topbar"><button class="back" id="memberBack">' + ICON_BACK + '</button><h1>' + (vm.teamName || 'التشكيلة') + '</h1><div class="spacer"></div></div>';
    if(vm.loading){
      return header + '<div class="hint" style="margin:20px;">جاري تحميل التشكيلة...</div>';
    }
    if(vm.error || !vm.squadIds){
      return header + '<div class="hint" style="margin:20px;">تعذر تحميل تشكيلة هذا المدير حاليًا (غالبًا لسه ما أعلنش تشكيلته للجولة دي)</div>';
    }
    // بنستعير renderPitchCard اللي شغالة بتشكيلتي، بس بنبدّل بيانات التشكيلة مؤقتًا للعضو ده
    const savedSquad = state.mySquadIds, savedCap = state.captainId;
    state.mySquadIds = vm.squadIds;
    state.captainId = vm.captainId;
    const pitchHtml = renderPitchCard(false);
    state.mySquadIds = savedSquad;
    state.captainId = savedCap;
    return header +
      (vm.managerName ? '<div class="hint" style="margin:0 20px 10px;">' + vm.managerName + '</div>' : '') +
      pitchHtml;
  }

  // ===== ترتيب دوري معيّن (كل الأعضاء) =====
  if(state.activeLeagueId){
    const lg = state.realLeagues.find(l=>String(l.id)===String(state.activeLeagueId));
    const cache = state.leagueStandingsCache[state.activeLeagueId];
    if(!cache) ensureLeagueStandings(state.activeLeagueId);
    const title = (lg && lg.name) || (cache && cache.leagueName) || 'الدوري';
    const header = '<div class="topbar"><button class="back" id="leagueBack">' + ICON_BACK + '</button><h1>' + title + '</h1><div class="spacer"></div></div>';
    if(!cache || cache.loading){
      return header + '<div class="hint" style="margin:20px;">جاري تحميل الترتيب...</div>';
    }
    if(cache.error || !cache.results.length){
      return header + '<div class="hint" style="margin:20px;">تعذر تحميل ترتيب هذا الدوري حاليًا</div>';
    }
    const rows = cache.results.map(r=>{
      const isMe = state.deviceId && String(r.entryId)===String(state.deviceId);
      return '<button class="standing-row' + (isMe ? ' me' : '') + '" data-member="' + r.entryId + '" ' +
        'data-teamname="' + String(r.teamName||'').replace(/"/g,'&quot;') + '" ' +
        'data-managername="' + String(r.managerName||'').replace(/"/g,'&quot;') + '" ' +
        'style="width:100%;text-align:right;">' +
        '<div class="s-left"><div class="s-rank">#' + r.rank + '</div><div class="s-name">' + r.teamName + '</div></div>' +
        '<div class="s-pts">' + r.total + '</div>' +
      '</button>';
    }).join('');
    return header + '<div class="league-list">' + rows + '</div>';
  }

  // ===== كل الدوريات الخاصة بيا =====
  return '' +
  '<div class="topbar"><div class="spacer"></div><h1>الدوريات الخاصة بك</h1><div class="spacer"></div></div>' +
  '<div class="league-list">' + renderLeaguePreviewItems() + '</div>';
}

// ===== PLAYER PROFILE =====
function renderPlayerProfile(){
  const p = findPlayer(state.viewPlayerId);
  if(!p) return '<div class="topbar"><button class="back" id="profBack">'+ICON_BACK+'</button><h1>اللاعب</h1><div class="spacer"></div></div>';
  const hist = (p.history||[]).slice().sort((a,b)=>a.gw-b.gw);
  const last4 = hist.slice(-4);
  const maxPts = Math.max(1, ...last4.map(h=>h.pts));
  const chg = p.priceChange||0;
  const chgIcon = chg>0?ICON_UP:(chg<0?ICON_DOWN:'');
  const chgColor = chg>0?'up':(chg<0?'down':'');

  const statusNote = {i:'مصاب', s:'موقوف', d:'مشكوك في مشاركته'}[p.status] || '';
  const adminBlock = state.adminUnlocked ? (
    '<div class="admin-card"><h3>مصدر البيانات</h3>' +
    '<div style="font-size:11.5px;color:var(--muted);line-height:1.7;">بيانات هذا اللاعب (السعر/النقاط/نسبة الملكية) تُجلب مباشرة من واجهة برمجة التطبيقات (API) الرسمية لـ Fantasy Premier League، ويتم تحديثها تلقائياً دون أي تعديل يدوي.' +
    (statusNote ? ('<br><span style="color:var(--coral);font-weight:700;">الحالة: '+statusNote+'</span>') : '') +
    '</div></div>'
  ) : '';

  const lookahead = (state.teamFixtures[p.club] && state.teamFixtures[p.club].lookahead) || [];
  const fixturesHtml = lookahead.length ? lookahead.map(f=>{
    const fdrCls = f.fdr<=2 ? 'easy' : (f.fdr>=4 ? 'hard' : 'mid');

  return '' +
  '<div class="topbar"><button class="back" id="profBack">'+ICON_BACK+'</button><h1>بروفايل اللاعب</h1><div class="spacer"></div></div>' +
  '<div class="profile-hero"><img class="pj-photo" src="https://resources.premierleague.com/premierleague/photos/players/110x140/p' + p.code + '.png" alt="' + p.name + '" onerror="imgFallback(this)">' +
    '<div class="pn">' + p.name + '</div>' +
    '<div class="pm">' + CLUB_NAME[p.club] + ' · ' + p.pos + '</div>' +
    '<div class="price-tag"><span class="amt">£' + fmt(p.price) + 'm</span>' +
    (chg!==0 ? '<span class="chg '+chgColor+'">'+chgIcon+(chg>0?'+':'')+fmt(chg)+'</span>' : '') +
    '</div></div>' +
  '<div class="profile-stats">' +
    '<div class="cell"><div class="v">' + totalPoints(p) + '</div><div class="k">إجمالي النقط</div></div>' +
    '<div class="cell"><div class="v">' + currentGwPoints(p) + '</div><div class="k">نقاط الجولة</div></div>' +
    '<div class="cell"><div class="v">' + p.ownership + '%</div><div class="k">نسبة الملكية</div></div>' +
  '</div>' +
  '<div class="own-bar"><div class="row1"><span>نسبة الملكية بين المديرين</span><span>' + p.ownership + '%</span></div>' +
    '<div class="track"><div class="fill" style="width:' + Math.min(100,p.ownership) + '%;"></div></div></div>' +

function limitedListHtml(items, toggleKey, wrapClass, wrapStyle){
  if(!items.length) return '';
  const expanded = !!state.toggles[toggleKey];
  const shown = expanded ? items : items.slice(0,3);
  const moreBtn = items.length>3 ?
    '<button class="btn-ghost" data-toggle="' + toggleKey + '" style="width:calc(100% - 40px); margin:8px 20px 0; display:block;">' +
      (expanded ? 'عرض أقل' : 'عرض المزيد (' + (items.length-3) + ')') +

// ===== ترشيح الكابتن: أعلى لاعب توقع نقاط داخل تشكيلة المستخدم كلها =====
function suggestedCaptain(){
  const sq = squad();
  if(!sq.length) return null;
  return sq.slice().sort((a,b)=>predictedPoints(b)-predictedPoints(a))[0];
}

// ===== ترشيح الأساسي/الاحتياطي: أفضل 11 لاعب ممكن بناءً على توقع النقاط مع مراعاة قواعد التشكيل =====
function optimalStartingXI(){
  const sq = squad();
  const byPos = { GK:[], DEF:[], MID:[], FWD:[] };
  sq.forEach(p=>{ if(byPos[p.pos]) byPos[p.pos].push(p); });
  Object.keys(byPos).forEach(pos=> byPos[pos].sort((a,b)=>predictedPoints(b)-predictedPoints(a)));

  const startXI = [];
  if(byPos.GK.length) startXI.push(byPos.GK[0]); // حارس واحد بس

  const mins = { DEF:3, MID:2, FWD:1 };
  const maxs = { DEF:5, MID:5, FWD:3 };
  const picked = { DEF:0, MID:0, FWD:0 };

  ['DEF','MID','FWD'].forEach(pos=>{
    for(let i=0; i<mins[pos] && i<byPos[pos].length; i++){
      startXI.push(byPos[pos][i]);
      picked[pos]++;
    }
  });

  let remainingSlots = 11 - startXI.length;
  const remainingPool = [];
  ['DEF','MID','FWD'].forEach(pos=>{
    for(let i=picked[pos]; i<byPos[pos].length; i++) remainingPool.push(byPos[pos][i]);
  });
  remainingPool.sort((a,b)=>predictedPoints(b)-predictedPoints(a));

  for(const p of remainingPool){
    if(remainingSlots<=0) break;
    if(picked[p.pos] >= maxs[p.pos]) continue; // ما يكسرش الحد الأقصى للمركز
    startXI.push(p);
    picked[p.pos]++;
    remainingSlots--;
  }

  return startXI;
}

// مقارنة التشكيلة المثالية بالتشكيلة الأساسية الحالية، وإرجاع قائمة التبديلات المقترحة
function suggestedLineupSwaps(){
  const optimal = optimalStartingXI();
  const optimalIds = new Set(optimal.map(p=>p.id));
  const currentStarters = starters();
  const currentIds = new Set(currentStarters.map(p=>p.id));

  const shouldStart = optimal.filter(p=>!currentIds.has(p.id)).sort((a,b)=>predictedPoints(b)-predictedPoints(a));
  const shouldBench = currentStarters.filter(p=>!optimalIds.has(p.id)).sort((a,b)=>predictedPoints(a)-predictedPoints(b));

  const swaps = [];
  const n = Math.min(shouldStart.length, shouldBench.length);
  for(let i=0; i<n; i++){
    swaps.push({ inP: shouldStart[i], outP: shouldBench[i], diff: predictedPoints(shouldStart[i]) - predictedPoints(shouldBench[i]) });
  }
  return swaps;
}

function toLocalInput(iso){
  const d = new Date(iso);
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}

// تنفيذ عملية الشراء: إما استبدال لاعب موجود (transferOutId) أو إضافة لاعب جديد لمكان فارغ (transferAddPos)
function tryBuyPlayer(inId){
  const inPlayer = findPlayer(inId);
  if(!inPlayer) return;

  const locked = isGwLocked();
  const ids = activeIds();
  const bank = activeBank();
  const freeT = activeFreeTransfers();

  const outEntry = ids.find(e=>e.id===state.transferOutId);
  const outPlayer = outEntry ? findPlayer(outEntry.id) : null;

  if(outPlayer){
    // ① استبدال لاعب موجود في الفريق بلاعب تاني في نفس المركز
    if(outPlayer.pos !== inPlayer.pos){ setFlash('err','اختر لاعبًا في نفس المركز'); return; }
    const newBank = bank + outPlayer.price - inPlayer.price;
    if(newBank < 0){ setFlash('err','الرصيد غير كافٍ لإتمام هذا الانتقال'); return; }
    if(inPlayer.club !== outPlayer.club && clubCountInSquad(inPlayer.club, outPlayer.id, ids) >= MAX_PER_CLUB){
      setFlash('err','لا يمكن ضم أكثر من ' + MAX_PER_CLUB + ' لاعبين من نفس النادي'); return;
    }

    outEntry.id = inPlayer.id; // keep the slot, swap identity
    const capId = locked ? state.draftCaptainId : state.captainId;
    const newCapId = (capId === outPlayer.id) ? inPlayer.id : capId;
    const newFreeT = freeT > 0 ? freeT - 1 : freeT;
    if(locked){
      state.draftBank = newBank; state.draftCaptainId = newCapId; state.draftFreeTransfers = newFreeT;
    } else {
      state.bank = newBank; state.captainId = newCapId; state.freeTransfers = newFreeT;
    }
    state.transferOutId = null;
    saveActive();

    setFlash('ok','تم تنفيذ الانتقال بنجاح' + (newFreeT===0 ? ' — التبديل التالي سيخصم 4 نقاط' : ''));
    return;
  }

  if(state.transferAddPos){
    // ② إضافة لاعب جديد لمكان فارغ في التشكيلة (مش استبدال — مفيش لاعب يتباع)
    if(inPlayer.pos !== state.transferAddPos){ setFlash('err','اختر لاعبًا في نفس المركز'); return; }
    if(ids.some(e=>e.id===inPlayer.id)){ setFlash('err','اللاعب موجود بالفعل في فريقك'); return; }
    if(ids.length >= 15){ setFlash('err','التشكيلة مكتملة بالفعل (15 لاعب)'); return; }
    if(squadPosCount(inPlayer.pos, null, ids) >= SQUAD_POS_LIMITS[inPlayer.pos]){
      const posLabelMap = {GK:'حراس', DEF:'مدافعين', MID:'وسط', FWD:'مهاجمين'};
      setFlash('err','لا يمكن ضم أكثر من ' + SQUAD_POS_LIMITS[inPlayer.pos] + ' ' + (posLabelMap[inPlayer.pos] || inPlayer.pos) + ' في الفريق'); return;
    }
    const newBank = bank - inPlayer.price;
    if(newBank < 0){ setFlash('err','الرصيد غير كافٍ لشراء هذا اللاعب'); return; }
    if(clubCountInSquad(inPlayer.club, null, ids) >= MAX_PER_CLUB){
      setFlash('err','لا يمكن ضم أكثر من ' + MAX_PER_CLUB + ' لاعبين من نفس النادي'); return;
    }

    ids.push({ id: inPlayer.id, slot: state.transferAddSlot || 'start' });
    if(locked){ state.draftBank = newBank; } else { state.bank = newBank; }
    state.transferAddPos = null;
    state.transferAddSlot = null;
    saveActive();

    setFlash('ok','تمت إضافة اللاعب لتشكيلتك بنجاح');
    return;
  }
}

function bindMarketListItems(container){
  container.querySelectorAll('[data-viewprofile]').forEach(b=>{
    b.addEventListener('click', (e)=>{ e.stopPropagation(); goToPlayer(parseInt(b.getAttribute('data-viewprofile'))); });
  });
  container.querySelectorAll('[data-in]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      tryBuyPlayer(parseInt(b.getAttribute('data-in')));
    });
  });
}

function bindBody(){
  const el = document.getElementById('app-body');

  // فتح تفاصيل الماتش
  el.querySelectorAll('[data-match]').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.viewMatchId = parseInt(b.getAttribute('data-match'));
      renderBody();
    });
  });

  // قفل تفاصيل الماتش
  const closeMatchBtn = el.querySelector('#closeMatchModal');
  const matchOverlay = el.querySelector('#matchModalOverlay');
  if(closeMatchBtn) closeMatchBtn.addEventListener('click', ()=>{ state.viewMatchId = null; renderBody(); });
  if(matchOverlay) matchOverlay.addEventListener('click', ()=>{ state.viewMatchId = null; renderBody(); });

  // boot retry
  const retry = el.querySelector('#retryBoot');
  if(retry) retry.addEventListener('click', ()=>{ state.bootError=null; boot(); });

  // onboarding
  const obSubmit = el.querySelector('#obSubmit');
  if(obSubmit) obSubmit.addEventListener('click', submitOnboard);

  // bell / refresh
  const bell = el.querySelector('#bellBtn');
  if(bell) bell.addEventListener('click', (e)=>{ e.stopPropagation(); state.notifOpen = !state.notifOpen; renderBody(); });
  const refreshBtn = el.querySelector('#refreshBtn');
  if(refreshBtn) refreshBtn.addEventListener('click', refreshLiveData);

  // go-to buttons
  el.querySelectorAll('[data-goto]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.tab = b.getAttribute('data-goto'); state.notifOpen=false; render(); });
  });

  // placeholders الفارغة على الملعب — تنقل المستخدم لسوق الانتقالات لاختيار لاعب في نفس المركز
  el.querySelectorAll('[data-add-pos]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const pos = b.getAttribute('data-add-pos');
      const slot = b.getAttribute('data-add-slot') || 'start';
      state.transferOutId = null;
      state.transferAddPos = pos;
      state.transferAddSlot = slot;
      state.tab = 'transfers';
      render();
    });
  });

  // league items
  el.querySelectorAll('[data-league]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.tab = 'leagues'; state.activeLeagueId = b.getAttribute('data-league'); render(); });
  });
  const leagueBack = el.querySelector('#leagueBack');
  if(leagueBack) leagueBack.addEventListener('click', ()=>{ state.activeLeagueId = null; renderBody(); });

  // member rows inside a league's standings -> open their squad
  el.querySelectorAll('[data-member]').forEach(b=>{
    b.addEventListener('click', ()=>{
      openMemberSquad(
        b.getAttribute('data-member'),
        b.getAttribute('data-teamname') || '',
        b.getAttribute('data-managername') || ''
      );
    });
  });
  const memberBack = el.querySelector('#memberBack');
  if(memberBack) memberBack.addEventListener('click', ()=>{ state.viewMemberId = null; state.viewMemberSquad = null; renderBody(); });

  // fixtures back
  const fixBack = el.querySelector('#fixBack');
  if(fixBack) fixBack.addEventListener('click', ()=>{ state.tab = 'home'; render(); });

  // profile back
  const profBack = el.querySelector('#profBack');
  if(profBack) profBack.addEventListener('click', ()=>{ state.tab = state.profileBack; render(); });

  // admin back
  const adminBack = el.querySelector('#adminBack');
  if(adminBack) adminBack.addEventListener('click', ()=>{ state.tab = 'more'; render(); });

  const pricesBack = el.querySelector('#pricesBack');
  if(pricesBack) pricesBack.addEventListener('click', ()=>{ state.tab = 'more'; render(); });

  const supportBack = el.querySelector('#supportBack');
  if(supportBack) supportBack.addEventListener('click', ()=>{ state.tab = 'more'; render(); });

  const termsBack = el.querySelector('#termsBack');
  if(termsBack) termsBack.addEventListener('click', ()=>{ state.tab = 'more'; render(); });

  // view profile triggers (jersey name tags, transfer rows)
  el.querySelectorAll('[data-viewprofile]').forEach(b=>{
    b.addEventListener('click', (e)=>{ e.stopPropagation(); goToPlayer(parseInt(b.getAttribute('data-viewprofile'))); });
  });

  // team tab: segment mode switch
  el.querySelectorAll('[data-mode]').forEach(b=>{
    if(!b.hasAttribute('data-mode') || b.tagName!=='BUTTON') return;
  });
  el.querySelectorAll('.segment [data-mode]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.teamMode = b.getAttribute('data-mode'); state.selectedBenchId = null; renderBody(); });
  });

  // team tab: player taps (captain or bench-swap) — jersey elements carry data-mode = view/captain/bench
  el.querySelectorAll('.jersey[data-player]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      const id = parseInt(b.getAttribute('data-player'));
      const mode = b.getAttribute('data-mode');
      if(mode==='view'){ return; } // مفيش أكشن هنا فالنقرة تكمل لفتح بروفايل اللاعب
      // في وضع اختيار الكابتن أو تبديل الاحتياطي: النقرة على القميص تنفذ الأكشن مباشرة
      // وتوقف الحدث عشان ميفتحش بروفايل اللاعب كمان
      e.stopPropagation();
      const ids = activeIds(); // التشكيلة الحقيقية عادةً، أو مسودة الجولة الجاية لو الجولة الحالية شغالة
      const entry = ids.find(e=>e.id===id);
      if(!entry) return;
      if(mode==='captain'){
        if(entry.slot==='start'){
          if(isGwLocked()){ state.draftCaptainId = id; } else { state.captainId = id; }
          saveActive(); renderBody();
        }
      } else if(mode==='bench'){
        if(entry.slot==='bench'){
          state.selectedBenchId = (state.selectedBenchId===id) ? null : id;
          renderBody();
        } else if(entry.slot==='start' && state.selectedBenchId){
          const benchEntry = ids.find(e=>e.id===state.selectedBenchId);
          const benchP = findPlayer(benchEntry.id);
          const startP = findPlayer(id);
          // التبديل مسموح حتى لو المركز مختلف، طالما التشكيلة الناتجة لسه قانونية
          // (حارس واحد، 3-5 مدافعين، 2-5 وسط، 1-3 مهاجمين)
          if(formationValidAfterSwap(startP.pos, benchP.pos, ids)){
            benchEntry.slot = 'start'; entry.slot = 'bench';
            state.selectedBenchId = null;
            saveActive();
            renderBody();
          } else {
            setFlash('err','هذا التبديل سيخالف قواعد التشكيلة (حارس واحد، 3-5 مدافعين، 2-5 لاعبي وسط، 1-3 مهاجمين)');
            state.selectedBenchId = null;
            renderBody();
          }
        }
      }
    });
  });

  // transfers: select "out"
  el.querySelectorAll('[data-out]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = parseInt(b.getAttribute('data-out'));
      state.transferOutId = (state.transferOutId===id) ? null : id;
      state.transferAddPos = null;
      state.transferAddSlot = null;
      renderBody();
    });
  });

  // transfers: "in" -> execute swap or add-to-empty-slot
  el.querySelectorAll('[data-in]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      tryBuyPlayer(parseInt(b.getAttribute('data-in')));
    });
  });

  // more tab: toggles
  el.querySelectorAll('[data-toggle]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.toggles[b.getAttribute('data-toggle')] = !state.toggles[b.getAttribute('data-toggle')]; renderBody(); });
  });

  // more tab: logout
  const logoutBtn = el.querySelector('#logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=>{
    if(confirm('هل تريد تسجيل الخروج؟ هتحتاج تدخل الـ FPL Team ID تاني عشان تدخل')) logout();
  });

  // more tab: install app
  const installBtn = el.querySelector('#installBtn');
  if(installBtn) installBtn.addEventListener('click', async ()=>{
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      try{ await deferredInstallPrompt.userChoice; }catch(e){}
      deferredInstallPrompt = null;
      state.canInstall = false;
    } else {
      state.showInstallGuide = !state.showInstallGuide;
    }
    renderBody();
  });

  // admin pin
  const pinInput = el.querySelector('#pinInput');
  const pinSubmit = el.querySelector('#pinSubmit');
  if(pinSubmit) pinSubmit.addEventListener('click', async ()=>{
    const val = pinInput.value;
    const valHash = await sha256Hex(val);
    if(valHash === ADMIN_PIN_HASH){ state.adminUnlocked = true; state.adminPinInput=''; adminPinPlain = val; }
    else { state.adminPinInput = 'wrong'; }
    renderBody();
  });

  // admin: force a fresh sync from the official FPL API
  const forceSync = el.querySelector('#adminForceSync');
  if(forceSync) forceSync.addEventListener('click', async ()=>{
    await loadLiveData(true);
    state.adminSavedBanner = true;
    renderBody();
    setTimeout(()=>{ state.adminSavedBanner = false; if(state.tab==='admin') renderBody(); }, 3000);
  });

  // transfers: search box — نحدث marketList فقط عشان الحقل ميفقدش الـ focus
  const searchBox = el.querySelector('#transferSearch');
  if(searchBox){
    searchBox.addEventListener('input', ()=>{
      state.transferSearch = searchBox.value;
      const marketList = el.querySelector('#marketList');
      if(marketList){
        marketList.innerHTML = renderTransferMarket();
        bindMarketListItems(marketList);
      }
    });
  }
  const filterClub = el.querySelector('#transferFilterClub');
  if(filterClub){
    filterClub.addEventListener('change', ()=>{
      state.transferFilterClub = filterClub.value;
      const marketList = el.querySelector('#marketList');
      if(marketList){ marketList.innerHTML = renderTransferMarket(); bindMarketListItems(marketList); }
    });
  }
  const filterPrice = el.querySelector('#transferFilterPrice');
  if(filterPrice){
    filterPrice.addEventListener('change', ()=>{
      state.transferFilterPrice = filterPrice.value;
      const marketList = el.querySelector('#marketList');
      if(marketList){ marketList.innerHTML = renderTransferMarket(); bindMarketListItems(marketList); }
    });
  }

  // admin: save news/advice links via secure edge function
  const saveLinks = el.querySelector('#adminSaveLinks');
  if(saveLinks) saveLinks.addEventListener('click', async ()=>{
    state.adminLinks = {
      news: el.querySelector('#adminNewsLink').value.trim(),
      advice: el.querySelector('#adminAdviceLink').value.trim(),
    };

    saveLinks.textContent = 'جاري الحفظ...';

    try {
      // Invoke the secure edge function; the PIN was captured in memory at unlock time
      // (the #pinInput element no longer exists once the admin panel is shown).
      const { data, error } = await supa.functions.invoke('save-admin-links', {
        body: { pin: adminPinPlain, links: state.adminLinks }
      });

      if(error || (data && !data.success)) throw new Error();
      saveLinks.textContent = 'تم الحفظ ✓';
    } catch (e) {
      saveLinks.textContent = 'فشل الحفظ';
      console.error(e);
    }

    setTimeout(()=>{ saveLinks.textContent = 'حفظ الروابط'; }, 2000);
  });
}

// close notif panel when tapping elsewhere
// ===== تثبيت التطبيق (Add to Home Screen) =====
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  state.canInstall = true;
  if(state.phase==='app' && state.tab==='more') renderBody();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  state.canInstall = false;
  if(state.phase==='app' && state.tab==='more') renderBody();
});

document.addEventListener('click', (e)=>{
  if(state.notifOpen && !e.target.closest('#bellBtn') && !e.target.closest('.notif-panel')){
    state.notifOpen = false;
    if(state.tab==='home') renderBody();
  }
});

// bottom nav bindings
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.tab = btn.getAttribute('data-tab');
    state.notifOpen = false;
    if(state.tab !== 'leagues'){ state.activeLeagueId = null; state.viewMemberId = null; state.viewMemberSquad = null; }
    render();
  });
});

// refresh deadline text + overall standings periodically
// وقت مفيش مباريات شغالة: نعيد الرسم بس كل دقيقة (للعدّاد التنازلي وغيره).
// وقت فيه مباريات شغالة فعليًا: نعيد الجلب من فانتازي البريميرليج كل 45 ثانية عشان
// النقط والبونص اللحظي يفضلوا لحظة بلحظة قد الإمكان (حسب سرعة تحديث الـ API الرسمي نفسه).
// (بنستخدم setTimeout بيعيد جدولة نفسه بدل setInterval، عشان مدة الانتظار تتغيّر لايف
// حسب state.hasLiveFixtures بدل ما تفضل ثابتة زي ما setInterval بيعمل).
async function scheduleLiveTick(){
  if(state.phase==='app'){
    if(state.hasLiveFixtures){
      try{ await loadLiveData(); }catch(e){}
    }
    try{ await loadOrBuildRankCurve(); }catch(e){}
    if(state.tab==='home' || state.tab==='fixtures' || state.tab==='team') renderBody();
  }
  setTimeout(scheduleLiveTick, state.hasLiveFixtures ? 45000 : 60000);
}
setTimeout(scheduleLiveTick, state.hasLiveFixtures ? 45000 : 60000);

boot();
</script>
