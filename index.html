// ===== boot =====
async function boot(){
  state.phase = 'boot';
  render();
  try{
    await loadLiveData();
    try{
      const linksRaw = await sGet('mazareta_admin_links', true);
      if(linksRaw) state.adminLinks = JSON.parse(linksRaw);
    }catch(e){}

    // if this browser already has an FPL Team ID saved, skip onboarding and go
    // straight into the app; otherwise show the onboarding screen to collect it
    const savedFplId = getLocalDeviceId();
    if(!savedFplId){
      state.phase = 'onboard';
      render();
      return;
    }

    state.deviceId = savedFplId;
    let raw = await sGet('mazareta_manager:'+state.deviceId, false);
    if(raw){
      const m = JSON.parse(raw);
      state.managerName = m.managerName; state.teamName = m.teamName;
    }

    // نجيب بيانات المدير الحقيقية من FPL — ده مصدرنا الوحيد للترتيب العام والدوريات
    const entry = await fetchFplEntry(savedFplId);
    if(entry && !entry.error){
      if(!raw){ state.managerName = entry.managerName; state.teamName = entry.teamName; await saveManager(); }
      state.overallRank = entry.overallRank;
      state.eventRank = entry.eventRank;
      state.eventPoints = entry.eventPoints;
      state.overallPoints = entry.overallPoints;
      state.realLeagues = entry.leagues;
    } else if(!raw){
      state.managerName = 'مدير ' + savedFplId;
      state.teamName = 'فريق ' + savedFplId;
      await saveManager();
    }

    await loadSquadOrDraft();
    state.phase = 'app';
    render();
  } catch(e){
    state.bootError = 'حصل خطأ في تحميل البيانات. حاول تاني.';
    render();
  }
}

// لو فيه مسودة تعديلات محفوظة (كابتن/تبديل/انتقال اتعمل وقت الجولة كانت شغالة):
// - لو الجولة اللي كانت المسودة مستنياها وصلت (أو فاتت)، نطبقها كتشكيلة رسمية دلوقتي ونمسحها.
// - غير كده (لسه بدري)، نسيبها محمّلة في state.draft* عشان المستخدم يكمّل يعدّل فيها.
async function syncDraftForGw(gw){
  try{
    const raw = await sGet('mazareta_squad_next:'+state.deviceId, false);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || !d.draftForGw) return;
    if(d.draftForGw <= gw){
      state.mySquadIds = d.mySquadIds;
      state.captainId = d.captainId;
      if(typeof d.bank === 'number') state.bank = d.bank;
      if(d.freeTransfers != null) state.freeTransfers = d.freeTransfers;
      await savePersonal();
      await sDelete('mazareta_squad_next:'+state.deviceId);
      state.draftSquadIds = null; state.draftCaptainId = null; state.draftBank = null;
      state.draftFreeTransfers = null; state.draftForGw = null;
    } else {
      state.draftSquadIds = d.mySquadIds;
      state.draftCaptainId = d.captainId;
      state.draftBank = d.bank;
      state.draftFreeTransfers = d.freeTransfers;
      state.draftForGw = d.draftForGw;
    }
  }catch(e){}
}

async function loadSquadOrDraft(){
  const gw = state.gwInfo && state.gwInfo.current;
  const isStarted = new Date(state.gwInfo.deadline).getTime() < Date.now();

  // لو الجولة المركزية لسه مبدأتش (اتقدّمنا للجولة الجاية بعد ما اللي قبلها خلصت)، نجيب
  // تشكيلة آخر جولة اتلعبت كأساس "مُرحّل" — لأن الفانتازي لسه ما عندهاش تشكيلة للجولة الجاية.
  const lastPlayed = state.gwInfo && state.gwInfo.lastPlayedGw;
  const picksGw = (!isStarted && lastPlayed && lastPlayed < gw) ? lastPlayed : gw;
  const carriedForward = (picksGw !== gw);

  // ★ لو الجولة لسه ماقفلتش (قبل الديدلاين): التشكيلة المحلية (مسودتك) هي الأساس دايمًا،
  // ومينفعش نستبدلها بإعادة جلب تشكيلة جولة قديمة/مُرحّلة من الفانتازي في كل ريفريش —
  // لأن ده بالظبط اللي كان بيمسح تعديلاتك بعد الحفظ. الفانتازي بيبقى مصدر الحقيقة
  // بس أول ما الجولة تقفل فعليًا (isStarted = true).
  if(!isStarted){
    try{
      const savedRaw = await sGet('mazareta_squad:'+state.deviceId, false);
      if(savedRaw){
        const saved = JSON.parse(savedRaw);
        if(saved && saved.mySquadIds && saved.mySquadIds.length && saved.squadGw === gw){
          state.mySquadIds = saved.mySquadIds;
          state.captainId = saved.captainId;
          state.bank = typeof saved.bank === 'number' ? saved.bank : 100;
          state.activeChip = null; // التشكيلة التجريبية مفيهاش شيب رسمي
          state.freeTransfers = (gw === 1) ? 'غير محدود' : 1;
          state.seasonBaseline = saved.seasonBaseline || 0;
          await syncDraftForGw(gw);
          return;
        }
      }
    }catch(e){}
  }

  // ١. الأولوية المطلقة (لو الجولة قفلت فعلاً، أو مفيش مسودة محلية للجولة دي لسه):
  // محاولة جلب التشكيلة الرسمية من سيرفر الفانتازي
  // (لو الديدلاين قفل، الفانتازي هيرجع الداتا الحقيقية وهنمسح بيها التشكيلة التجريبية)
  try{
    const picks = state.deviceId ? await fetchFplPicks(state.deviceId, picksGw) : null;
    if(picks && picks.squadIds && picks.squadIds.length){
      state.mySquadIds = picks.squadIds;
      state.captainId = picks.captainId;
      state.bank = picks.bank;
      // الشيب بتاع الجولة اللي جبناها — بس لو دي نفس الجولة المركزية (مش تشكيلة مُرحّلة لجولة جاية)
      state.activeChip = carriedForward ? null : (picks.activeChip || null);

      // تحديد التبديلات بذكاء (غير محدود قبل بداية الموسم، و 1 بعد البداية)
      state.freeTransfers = (gw === 1 && !isStarted) ? 'غير محدود' : 1;

      state.seasonBaseline = 0;

      // حفظ التشكيلة الرسمية في التخزين المحلي عشان نكتب فوق التشكيلة التجريبية
      await savePersonal();
      await syncDraftForGw(gw);
      return;
    }
  }catch(e){
    // الجولة لسه مقفلتش (الفانتازي مخبي التشكيلة) أو مفيش إنترنت
  }

  // ٢. لو وصلنا هنا والجولة مقفولة (فشل الفتش لأسباب زي مفيش إنترنت): نرجع لآخر تشكيلة محفوظة محليًا
  if(isStarted){
    try{
      const savedRaw = await sGet('mazareta_squad:'+state.deviceId, false);
      if(savedRaw){
        const saved = JSON.parse(savedRaw);
        if(saved && saved.mySquadIds && saved.mySquadIds.length && saved.squadGw === gw){
          state.mySquadIds = saved.mySquadIds;
          state.captainId = saved.captainId;
          state.bank = typeof saved.bank === 'number' ? saved.bank : 100;
          state.activeChip = null;
          state.freeTransfers = 1;
          state.seasonBaseline = saved.seasonBaseline || 0;
          await syncDraftForGw(gw);
          return;
        }
      }
    }catch(e){}
  }

  // ٣. لو مفيش داتا خالص: نبدأ بتشكيلة فاضية
  state.mySquadIds = [];
  state.captainId = null;
  state.bank = 100;
  state.activeChip = null;
  state.freeTransfers = (gw === 1 && !isStarted) ? 'غير محدود' : 1;
  state.seasonBaseline = 0;
  await savePersonal();
  await syncDraftForGw(gw);
}

// ===== countdown =====
function countdown(iso){
  const diff = new Date(iso).getTime() - Date.now();
  if(diff<=0) return 'التشكيلة مقفولة';
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  if(d>0) return 'يوم'.length && (d===1?'يوم واحد':(d===2?'يومان':d+' أيام')) + ' و' + h + ' ساعة';
  const m = Math.floor((diff%3600000)/60000);
  return h+' ساعة و'+m+' دقيقة';
}

// ===== عدّاد تنازلي حي (بيتحدّث كل ثانية) لديدلاين الجولة =====
// بيرجّع HTML بخانات (يوم/ساعة/دقيقة/ثانية)؛ الخانة "يوم" بتظهر بس لو فاضل أكتر من يوم.
function countdownHtml(iso){
  if(!iso) return '<span class="hx-cd-locked">غير متاح</span>';
  const diff = new Date(iso).getTime() - Date.now();
  if(isNaN(diff)) return '<span class="hx-cd-locked">غير متاح</span>';
  if(diff <= 0) return '<span class="hx-cd-locked">التشكيلة مقفولة</span>';
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  const pad = n => String(n).padStart(2,'0');
  const seg = (v,l) => '<span class="hx-cd-seg"><b>'+pad(v)+'</b><i>'+l+'</i></span>';
  const sep = '<span class="hx-cd-sep">:</span>';
  let out = '';
  if(d > 0) out += seg(d,'يوم') + sep;
  out += seg(h,'ساعة') + sep + seg(m,'دقيقة') + sep + seg(s,'ثانية');
  return out;
}
// مؤقّت واحد فقط بيحدّث خانة العدّاد؛ بيتوقف تلقائيًا لو العنصر اختفى (تبويب تاني/إعادة رسم).
let __hxCountdownTimer = null;
function startCountdownTicker(){
  if(__hxCountdownTimer){ clearInterval(__hxCountdownTimer); __hxCountdownTimer = null; }
  if(!document.getElementById('hxCountdown')) return;
  const tick = () => {
    const el = document.getElementById('hxCountdown');
    if(!el){ if(__hxCountdownTimer){ clearInterval(__hxCountdownTimer); __hxCountdownTimer = null; } return; }
    el.innerHTML = countdownHtml(el.getAttribute('data-deadline'));
  };
  tick();
  __hxCountdownTimer = setInterval(tick, 1000);
}

// ===== HOME =====
function renderLivePill(){
  if(state.liveDataError){
    return '<div class="live-pill warn"><div class="dotpulse"></div>تعذر الاتصال بخوادم FPL (وضع عدم الاتصال).</div>';
  }
  if(state.liveDataStale){
    return '<div class="live-pill warn"><div class="dotpulse"></div>تأخر التحديث الأخير (البيانات غير محدثة).</div>';
  }
  return '<div class="live-pill"><div class="dotpulse"></div>متصل (البيانات محدثة مباشرة).</div>';
}
function renderLiveSyncedAt(){
  if(!state.liveSyncedAt) return '';
  const timeText = new Date(state.liveSyncedAt).toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });
  // BUILD_ID ظاهر جنب وقت التحديث عشان نتأكد إن الجهاز شغّال على النسخة الجديدة فعلاً
  return '<div class="live-synced">آخر تحديث للنقاط: ' + timeText + ' · ' + BUILD_ID + '</div>';
}
// ===== مركز المباريات (Fixtures Hub) =====
function renderFixturesList(onlyLive) {
  if (!state.fixturesList || !state.fixturesList.length) return '';

  let matches = state.fixturesList;
  if (onlyLive) {
    // فلترة لعرض المباريات الشغالة دلوقتي بس
    matches = matches.filter(f => f.started && !f.finished);
    if (!matches.length) return '';
  }

  const listHtml = matches.map(f => {
    let timeOrScore = '';
    let badge = '';

    if (f.started && !f.finished) {
      timeOrScore = `<div class="match-score">${f.score_h} - ${f.score_a}</div>`;
      badge = `<div class="match-live-badge">مباشر • الدقيقة ${f.minutes}'</div>`;
    } else if (f.finished) {
      timeOrScore = `<div class="match-score">${f.score_h} - ${f.score_a}</div>`;
      badge = `<div class="match-time">انتهت</div>`;
    } else {
      const time = new Date(f.kickoff).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
      timeOrScore = `<div class="match-score" style="background:transparent; font-size:16px; color:var(--muted);">- : -</div>`;
      badge = `<div class="match-time">${time}</div>`;
    }

    return `
    <div class="match-card" data-match="${f.id}">
      <div class="match-team">
        <img class="match-team-logo" src="https://resources.premierleague.com/premierleague/badges/t${CLUB_CODE[f.team_h]}.png" onerror="this.style.display='none'">
        <div class="match-team-name">${CLUB_NAME[f.team_h]}</div>
      </div>
      <div class="match-center">
        ${timeOrScore}
        ${badge}
      </div>
      <div class="match-team">
        <img class="match-team-logo" src="https://resources.premierleague.com/premierleague/badges/t${CLUB_CODE[f.team_a]}.png" onerror="this.style.display='none'">
        <div class="match-team-name">${CLUB_NAME[f.team_a]}</div>
      </div>
    </div>`;
  }).join('');

  const title = onlyLive ? '<span class="h2-icon" style="color:var(--coral);">' + ICON_LIVE + ' مباريات تلعب الآن</span>' : 'مباريات الجولة ' + (activeViewGw()||'');
  return '<div class="section-title"><h2>' + title + '</h2></div>' +
         '<div class="match-list" style="margin: 0 20px 20px;">' + listHtml + '</div>';
}

// دالة منفصلة لشاشة كل المباريات
function renderFixtures(){
  const emptyMsg = (!state.fixturesList || !state.fixturesList.length)
    ? '<div class="hint" style="margin:20px;">لا توجد مباريات لهذه الجولة.</div>' : '';
  return '' +
  '<div class="topbar"><div class="spacer"></div><h1>المباريات</h1><div class="spacer"></div></div>' +
  renderGwNav() +
  renderFixturesList(false) +
  emptyMsg;
}

// تشكيلة كل فريق في الماتش (أساسي + بدلاء نزلوا فعلاً) — مبنية من بيانات اللايف
// بتاعة الجولة الحالية، فبتشتغل بس للجولة اللي بتُلعب/اتلعبت دلوقتي
function renderMatchLineup(f){
  const posOrder = { GK:0, DEF:1, MID:2, FWD:3 };
  const posGroupLabel = { GK:'حراسة المرمى', DEF:'الدفاع', MID:'الوسط', FWD:'الهجوم' };

  const teamPlayers = clubKey => state.players
    .filter(p => p.club === clubKey && (p.gwStarted || (p.gwMinutes||0) > 0))
    .sort((a,b) => (Number(b.gwStarted)-Number(a.gwStarted)));

  const hPlayers = teamPlayers(f.team_h);
  const aPlayers = teamPlayers(f.team_a);
  if(!hPlayers.length && !aPlayers.length) return '';

  const row = p => {
    const posLabel = { GK:'ح', DEF:'د', MID:'و', FWD:'هـ' }[p.pos] || p.pos;
    return '<div class="lineup-row' + (!p.gwStarted ? ' is-sub' : '') + '">' +
      '<div class="lineup-pos">' + posLabel + '</div>' +
      '<div class="lineup-name">' + p.name + '</div>' +
      (!p.gwStarted ? '<div class="lineup-sub">بديل</div>' : '') +
      (p.isPlayingLive ? '<div class="lineup-live-dot" title="بيلعب دلوقتي"></div>' : '') +
    '</div>';
  };

  const groupsHtml = ['GK','DEF','MID','FWD'].map(pos => {
    const h = hPlayers.filter(p => p.pos === pos);
    const a = aPlayers.filter(p => p.pos === pos);
    if(!h.length && !a.length) return '';
    return '<div class="lineup-group">' +
      '<div class="lineup-group-label">' + posGroupLabel[pos] + '</div>' +
      '<div class="lineup-wrap">' +
        '<div class="lineup-col home">' + h.map(row).join('') + '</div>' +
        '<div class="lineup-col away">' + a.map(row).join('') + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="section-title" style="margin:14px 0 8px;"><h2 style="font-size:12.5px;">التشكيلة</h2></div>' +
    groupsHtml;
}

function renderMatchModal() {
  if(!state.viewMatchId) return '';
  // بندوّر في مباريات الجولة المعروضة (الحالية أو جولة تاريخية اتصفّحناها)
  const f = state.fixturesList.find(x => x.id === state.viewMatchId)
    || ((state.fixturesByGw && state.fixturesByGw[activeViewGw()]) || []).find(x => x.id === state.viewMatchId);
  if(!f) return '';

  // قاموس الإحصائيات
  const labels = {
    goals_scored: `<span class="icon-inline">${ICON_GOAL} أهداف</span>`,
    assists: `<span class="icon-inline">${ICON_ASSIST} أسيست</span>`,
    own_goals: `<span class="icon-inline" style="color:var(--coral)">${ICON_CLOSE} هدف عكسي</span>`,
    penalties_saved: `<span class="icon-inline">${ICON_GLOVE} تصدي جزاء</span>`,
    penalties_missed: `<span class="icon-inline" style="color:var(--gold)">${ICON_WARN} إهدار جزاء</span>`,
    yellow_cards: `<span class="icon-inline"><div class="card-icon yellow"></div> إنذار</span>`,
    red_cards: `<span class="icon-inline"><div class="card-icon red"></div> طرد</span>`,
    saves: `<span class="icon-inline">${ICON_GLOVE} تصديات</span>`,
    bps: `<span class="icon-inline" style="color:var(--gold)">${ICON_STAR} BPS</span>`,
    bonus: `<span class="icon-inline" style="color:var(--gold)">${ICON_STAR} بونص</span>`
  };

  let statsHtml = '';
  (f.stats || []).forEach(stat => {
    if(!labels[stat.identifier]) return;
    if(stat.a.length === 0 && stat.h.length === 0) return;

    const hItems = stat.h.map(x => `<div>${findPlayer(x.element)?.name||'لاعب'} <span style="color:var(--muted);font-size:9.5px;">(${x.value})</span></div>`).join('');
    const aItems = stat.a.map(x => `<div><span style="color:var(--muted);font-size:9.5px;">(${x.value})</span> ${findPlayer(x.element)?.name||'لاعب'}</div>`).join('');

    statsHtml += `
    <div class="stat-row">
      <div class="stat-h">${hItems}</div>
      <div class="stat-lbl">${labels[stat.identifier]}</div>
      <div class="stat-a">${aItems}</div>
    </div>`;
  });

  if(!statsHtml) statsHtml = '<div class="hint" style="margin-top:20px;">لا توجد إحصائيات فعلية حتى الآن.</div>';

  return `
  <div class="modal-overlay open" id="matchModalOverlay">
    <div class="modal-content" id="matchModalContent" onclick="event.stopPropagation()">
      <button class="modal-close" id="closeMatchModal">${ICON_CLOSE}</button>
      <div style="text-align:center; margin-bottom:20px;">
        <div style="display:flex; justify-content:center; align-items:center; gap:14px; margin-bottom:10px;">
          <img src="https://resources.premierleague.com/premierleague/badges/t${CLUB_CODE[f.team_h]}.png" style="width:40px;">
          <div style="font-family:'Cairo'; font-size:22px; font-weight:900; color:var(--text);">${f.score_h!=null?f.score_h:'-'} : ${f.score_a!=null?f.score_a:'-'}</div>
          <img src="https://resources.premierleague.com/premierleague/badges/t${CLUB_CODE[f.team_a]}.png" style="width:40px;">
        </div>
        <div style="font-size:12px; color:var(--muted); font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;">${f.started && !f.finished ? '<span style="color:var(--coral);display:flex;align-items:center;">'+ICON_LIVE+' مباشر</span> - الدقيقة '+f.minutes+"'" : (f.finished ? 'انتهت المباراة' : 'لم تبدأ بعد')}</div>
      </div>
      ${renderMatchLineup(f)}
      <div style="background:rgba(255,255,255,0.02); border:1px solid var(--card-line); border-radius:16px; padding:10px;">
        ${statsHtml}
      </div>
    </div>
  </div>`;
}

function leagueRankChange(lg){
  const cur = lg.entry_rank, prev = lg.entry_last_rank;
  if(cur==null || prev==null || prev===cur) return { dir:'up', chg:0 };
  return cur < prev ? { dir:'up', chg: prev-cur } : { dir:'down', chg: cur-prev };
}

// ===== PITCH =====
// حد "لاعب النار": تأثير اللاعب على ترتيبك العام = نقطه × (١ − نسبة ملكيته).
// يعني اللي جاب نقط كتير وقليل اللي شايله بيطلّعك في الترتيب أكتر — مش النقط لوحدها.
// عدّل الرقم لو عايز النار تبان لناس أكتر (قلّله) أو أقل (كبّره).
const HOT_RANK_IMPACT = 6;
// حد "بيسحبك لتحت": لاعب شايله كتير ومكبتن كتير (EO عالية) وانت مش مكبتنه، فبينزّلك في الترتيب.
// (بيتحسب بس لما يكون عندنا EO حقيقي من الـsampling.)
const COLD_RANK_IMPACT = 2.5;
function renderJersey(p, opts){
  opts = opts || {};
  let cls = 'jersey jersey-photo';
  if(opts.selected) cls += ' selected';

  const isCap = p.id === (opts.captainId !== undefined ? opts.captainId : state.captainId);
  // لو التريبل كابتن مفعّل الجولة دي، الكابتن بياخد ×3 مش ×2 (مش بيتطبّق على جولة فاتت).
  const tripleCap = (state.activeChip === '3xc') && !isHistoricalView();
  const capMult = tripleCap ? 3 : 2;
  // نعرض النقط للأساسيين والبدلاء (البدلاء كمان بتبان نقطهم — لو مفعّل بنش بوست بتتحسب فعلاً)
  const showPts = true;
  const mode = opts.mode || 'view';
  const dataAttr = ' data-player="' + p.id + '" data-mode="' + mode + '"';
  const shirtSrc = 'https://fantasy.premierleague.com/dist/img/shirts/standard/shirt_' + p.teamCode + (p.pos==='GK' ? '_1' : '') + '-66.webp';
  const hasBonus = (p.provisionalBonus||0) > 0;
  const ptsVal = isCap ? currentGwPoints(p)*capMult : currentGwPoints(p);

  let pptsClass = 'ppts';
  let displayBottom = '';
  let liveDotHtml = '';
  let isHot = false;
  let isCold = false;
  let rankDeltaHtml = '';

  if(opts.planningMode){
    // ده عرض مسودة تشكيلة الجولة الجاية — منعرضش نقط ولا حالة لايف خالص، بس مباراة كل لاعب الجاية
    pptsClass += ' upcoming';
    displayBottom = nextFixtureText(p.club);
  } else {
    const status = getPlayerMatchStatus(p);
    if (status.started) {
      pptsClass += ' played';
      if (status.isLive) pptsClass += ' live-playing';
      if (hasBonus) pptsClass += ' has-bonus';
      // تنسيق النقط زي الصورة بالظبط (pts 10) أو (pts (C) 10) — و(TC) لو تريبل كابتن
      displayBottom = 'pts ' + (isCap ? (tripleCap ? '(TC) ' : '(C) ') : '') + ptsVal;
      // ===== تأثير اللاعب على ترتيبك العام =====
      // = (مضاعِفك − الملكية الفعّالة/100) × نقط اللاعب الأساسية.
      //   مضاعِفك: ٢ لو مكبتنه (٣ لو تريبل كابتن)، ١ لو شايله بس.
      //   الملكية الفعّالة (EO) بتشمل كبتنة الناس (من /api/eo). لو لسه ماوصلتش،
      //   بنرجع لنسبة الملكية العادية كحد أدنى.
      const basePts = currentGwPoints(p);
      const eoRec = state.eoByElement && state.eoByElement[p.id];
      const haveEO = !!eoRec;
      const eoFrac = haveEO ? (eoRec.eo/100) : (Math.min(Math.max(p.ownership||0,0),100)/100);
      const yourMult = isCap ? capMult : 1;
      const rankImpact = (yourMult - eoFrac) * basePts;
      if(!opts.isBench && haveEO){
        // العلامات بتظهر بس لما تكون عندنا EO حقيقية (مش الملكية بس) — عشان مايطلعش مؤشر غلط
        if(rankImpact >= HOT_RANK_IMPACT) isHot = true;
        else if(rankImpact <= -COLD_RANK_IMPACT) isCold = true;
      }
      // حركة اللاعب في ترتيبك الفعلي = (نقط مقابل المتوسط) × قيمة النقطة عند ترتيبك
      if(haveEO){
        const rpp = ranksPerPoint();
        if(rpp){
          const moved = rankImpact * rpp;         // موجب = طلّعك (climbed) ، سالب = نزّلك
          if(Math.abs(moved) >= 1000){
            rankDeltaHtml = '<div class="rankdelta ' + (moved>0?'up':'down') + '">' +
              (moved>0?'▲':'▼') + ' ' + fmtRanks(moved) + '</div>';
          }
        }
      }
    } else {
      pptsClass += ' upcoming';
      displayBottom = status.fixtureText; // مثال: BOU (H)
    }
    liveDotHtml = (p.isPlayingLive ? '<div class="live-dot pulse" title="بيلعب دلوقتي"></div>' : '');
  }

  return renderPitchToken(p, {
    mode: mode,
    selected: !!opts.selected,
    isCap: isCap,
    isLiveNow: !opts.planningMode && !!p.isPlayingLive,
    isHot: isHot,
    isCold: isCold,
    rankDeltaHtml: rankDeltaHtml,
    showPts: showPts,
    pptsClass: pptsClass,
    bottomText: displayBottom
  });
}
function renderPlaceholder(pos, slot){
  const label = {GK:'حارس', DEF:'مدافع', MID:'وسط', FWD:'مهاجم'}[pos] || pos;
  return '<div class="player" data-add-pos="' + pos + '" data-add-slot="' + (slot || 'start') + '" style="cursor:pointer;">' +
    '<div class="jersey placeholder">＋</div>' +
    '<div class="pname placeholder-name">' + label + '</div>' +
  '</div>';
}
function renderPitchCard(interactive){
  // في وضع التعديل (تشكيلتي): لو الجولة شغالة/مقفولة، بنشتغل على مسودة الجولة الجاية
  // مش على التشكيلة الحقيقية المقفولة؛ غير كده (أو في وضع العرض بس) بنستخدم التشكيلة الحقيقية
  const ids = interactive ? activeIds() : state.mySquadIds;
  const capId = interactive ? activeCaptainId() : state.captainId;
  const planning = interactive && isGwLocked(); // بنعرض مسودة الجولة الجاية بدل التشكيلة المقفولة

  const gkAll  = starters(ids).filter(p=>p.pos==='GK');
  const defAll = starters(ids).filter(p=>p.pos==='DEF');
  const midAll = starters(ids).filter(p=>p.pos==='MID');
  const fwdAll = starters(ids).filter(p=>p.pos==='FWD');
  const benchAll = benched(ids);

  const opts = { mode: interactive ? state.teamMode : 'view', captainId: capId, planningMode: planning };

  // دالة مساعدة: تملأ صف بلاعبين حقيقيين + placeholders لو الصف ناقص
  function rowHtml(players, needed, pos){
    let html = '';
    players.forEach(p => { html += renderJersey(p, opts); });
    for(let i = players.length; i < needed; i++){
      html += renderPlaceholder(pos, 'start');
    }
    return '<div class="row">' + html + '</div>';
  }

  // التشكيلة الأساسية لازم تكون 11 لاعب بالظبط (حارس + 10 لاعبين خط)
  // فمش كفاية إننا نوري الحد الأدنى لكل مركز (7 بس) — لازم نكمل الباقي كأماكن فاضية
  // مع الالتزام بحدود كل مركز (مدافعين 3-5، وسط 2-5، مهاجمين 1-3)
  function computeStartNeeds(gkCount, defCount, midCount, fwdCount){
    const mins = { DEF: FORMATION_RULES.DEF.min, MID: FORMATION_RULES.MID.min, FWD: FORMATION_RULES.FWD.min };
    const maxs = { DEF: FORMATION_RULES.DEF.max, MID: FORMATION_RULES.MID.max, FWD: FORMATION_RULES.FWD.max };
    const counts = { DEF: defCount, MID: midCount, FWD: fwdCount };
    const needed = { GK: 1, DEF: Math.max(mins.DEF, counts.DEF), MID: Math.max(mins.MID, counts.MID), FWD: Math.max(mins.FWD, counts.FWD) };
    let total = needed.GK + needed.DEF + needed.MID + needed.FWD;

    if(total < 11){
      // نكمل الباقي: نفضّل المركز اللي عند اللاعب فيه لاعب احتياطي جاهز أصلاً (عشان يقدر
      // يكمّل التشكيلة بتبديل فوري بدل ما يضطر يروح سوق الانتقالات)، وبعدين نرجع لترتيب
      // افتراضي معقول (مهاجم الأول، لأن ده اللي المستخدمين غالبًا بيدوروا يزودوه)
      const benchCounts = { DEF:0, MID:0, FWD:0 };
      benchAll.forEach(p=>{ if(benchCounts[p.pos] != null) benchCounts[p.pos]++; });
      const growOrder = ['FWD','MID','DEF','FWD','MID','DEF','FWD','MID']
        .slice()
        .sort((a,b)=> (benchCounts[b]>0?1:0) - (benchCounts[a]>0?1:0));
      let gi = 0, guard = 0;
      while(total < 11 && guard < 40){
        const k = growOrder[gi % growOrder.length]; gi++; guard++;
        if(needed[k] < maxs[k]){ needed[k]++; total++; }
      }
    } else if(total > 11){
      // لو المستخدم عنده لاعبين زيادة في مركز معين، نقلل الأماكن الفاضية في مراكز تانية (من غير ما نلمس لاعبين حقيقيين)
      const shrinkOrder = ['FWD','MID','DEF'];
      let guard = 0;
      while(total > 11 && guard < 40){
        guard++;
        let shrunk = false;
        for(const k of shrinkOrder){
          if(needed[k] > Math.max(mins[k], counts[k])){ needed[k]--; total--; shrunk = true; break; }
        }
        if(!shrunk) break;
      }
    }
    return needed;
  }
  const needs = computeStartNeeds(gkAll.length, defAll.length, midAll.length, fwdAll.length);
  const gkNeed  = needs.GK;
  const defNeed = needs.DEF;
  const midNeed = needs.MID;
  const fwdNeed = needs.FWD;

  // الاحتياطي: نعرض ما هو موجود + placeholders لإكمال 4
  const benchPositions = ['GK','DEF','MID','FWD'];
  let benchHtml = '';
  benchAll.forEach(p => {
    const o = Object.assign({}, opts, { selected: interactive && state.selectedBenchId===p.id, isBench: true });
    benchHtml += renderJersey(p, o);
  });
  for(let i = benchAll.length; i < 4; i++){
    benchHtml += renderPlaceholder(benchPositions[i] || 'GK', 'bench');
  }

  return '<div class="pitch-card"><div class="pitch">' +
    rowHtml(gkAll,  gkNeed,  'GK') +
    rowHtml(defAll, defNeed, 'DEF') +
    rowHtml(midAll, midNeed, 'MID') +
    rowHtml(fwdAll, fwdNeed, 'FWD') +
  '</div><div class="bench"><div class="bench-head">مقاعد البدلاء</div><div class="bench-players">' + benchHtml + '</div></div></div>';
}

function renderTransferMarket(){
  const ids = activeIds();
  const bank = activeBank();
  const outPlayer = state.transferOutId ? findPlayer(state.transferOutId) : null;
  // لو فيه لاعب مختار للبيع نعرض نفس مركزه فقط، أو لو فيه مركز فاضي محدد من الملعب نعرض مركزه فقط، غير كده نعرض الكل
  const positions = outPlayer ? [outPlayer.pos] : (state.transferAddPos ? [state.transferAddPos] : ['GK', 'DEF', 'MID', 'FWD']);
  const posLabel  = {GK:'حراس المرمى', DEF:'المدافعون', MID:'خط الوسط', FWD:'المهاجمون'};

  const searchTerm = (state.transferSearch || '').trim().toLowerCase();

  return positions.map(pos => {
    // القائمة الحقيقية فيها مئات اللاعبين — بنعرض أفضل 40 بالنسبة للنقاط المتوقعة عشان القائمة تفضل عملية
    let candidates = pool(ids)
      .filter(p => p.pos === pos)
      .filter(p => !searchTerm || p.name.toLowerCase().includes(searchTerm))
      .filter(p => state.transferFilterClub === 'all' || p.club === state.transferFilterClub)
      .filter(p => state.transferFilterPrice === 'all' || p.price <= parseFloat(state.transferFilterPrice))
      .sort((a, b) => predictedPoints(b) - predictedPoints(a) || totalPoints(b) - totalPoints(a))
      .slice(0, 40);

    if(!candidates.length) return '';

    const rows = candidates.map(p => {
      const budget = bank + (outPlayer ? outPlayer.price : 0);
      const clubLimitHit = outPlayer
        ? (p.club !== outPlayer.club && clubCountInSquad(p.club, outPlayer.id, ids) >= MAX_PER_CLUB)
        : (clubCountInSquad(p.club, null, ids) >= MAX_PER_CLUB);
      const disabled = outPlayer ? (outPlayer.pos !== pos || (budget - p.price) < 0 || clubLimitHit)
        : (state.transferAddPos ? (state.transferAddPos !== pos || (budget - p.price) < 0 || clubLimitHit) : true);
      return '<div class="p-row">' +
        '<div class="p-left" data-viewprofile="' + p.id + '">' +
          '<img class="p-mini jersey-photo" src="https://fantasy.premierleague.com/dist/img/shirts/standard/shirt_' + p.teamCode + (p.pos==='GK'?'_1':'') + '-66.webp" alt="' + p.name + '" onerror="imgFallback(this)" loading="lazy">' +
          '<div class="p-info"><div class="p-name">' + p.name + '</div>' +
          '<div class="p-meta">' + (CLUB_TAG[p.club] || '') + ' · £' + fmt(p.price) + 'm' +
            ' · ' + totalPoints(p) + ' نقطة · متوقع ' + fmt(predictedPoints(p)) + '</div></div></div>' +
        '<button class="p-btn in" data-in="' + p.id + '"' + (disabled ? ' disabled' : '') + '>إضافة</button>' +
      '</div>';
    }).join('');

    return '<div class="pos-head">' + posLabel[pos] + '</div>' +
           '<div class="league-list" style="gap:8px;">' + rows + '</div>';
  }).join('');
}

// ===== LEAGUES TAB =====
function renderLeagues(){
  // ===== شاشة تشكيلة عضو تاني في الدوري =====
  if(state.viewMemberId){
    const vm = state.viewMemberSquad || {};
    const header = '<div class="topbar"><button class="back" id="memberBack">' + ICON_BACK + '</button><h1>' + escapeHtml(vm.teamName || 'التشكيلة') + '</h1><div class="spacer"></div></div>';
    if(vm.loading){
      return header + '<div class="hint" style="margin:20px;">جاري تحميل التشكيلة...</div>';
    }
    if(vm.error || !vm.squadIds){
      return header + '<div class="hint" style="margin:20px;">تعذر تحميل تشكيلة هذا المدير حاليًا (غالبًا لسه ما أعلنش تشكيلته للجولة دي)</div>';
    }
    // بنستعير renderPitchCard اللي شغالة بتشكيلتي، بس بنبدّل بيانات التشكيلة مؤقتًا للعضو ده
    // ومعاها الشيب بتاعه (مش شيبي أنا) عشان التريبل كابتن ما يتسربش على تشكيلة حد تاني.
    // وكمان بنحط نقط الجولة اللي بنعرضها (viewPtsById) ومباريات نفس الجولة (fixturesList)
    // عشان اللاعبين يبانوا بنقط الجولة اللي اتلعبت — زي ما بيحصل في عرض جولاتي التاريخية.
    const savedSquad = state.mySquadIds, savedCap = state.captainId, savedChip = state.activeChip;
    const savedPts = state.viewPtsById, savedFx = state.fixturesList;
    state.mySquadIds = vm.squadIds;
    state.captainId = vm.captainId;
    state.activeChip = vm.carriedForward ? null : (vm.activeChip || null);
    state.viewPtsById = vm.ptsById || {};
    state.fixturesList = (state.fixturesByGw && state.fixturesByGw[vm.squadGw]) || state.fixturesList;
    const pitchHtml = renderPitchCard(false);
    state.mySquadIds = savedSquad;
    state.captainId = savedCap;
    state.activeChip = savedChip;
    state.viewPtsById = savedPts;
    state.fixturesList = savedFx;
    const gwNote = vm.carriedForward
      ? '<div class="hint" style="margin:0 20px 10px; color:var(--muted2);">تشكيلة الجولة ' + vm.squadGw + ' (آخر جولة اتلعبت) — الجولة الحالية لسه ما بدأتش</div>'
      : (vm.squadGw ? '<div class="hint" style="margin:0 20px 10px; color:var(--muted2);">تشكيلة الجولة ' + vm.squadGw + '</div>' : '');
    return header +
      (vm.managerName ? '<div class="hint" style="margin:0 20px 4px;">' + escapeHtml(vm.managerName) + '</div>' : '') +
      gwNote +
      pitchHtml;
  }

  // ===== ترتيب دوري معيّن (كل الأعضاء) =====
  if(state.activeLeagueId){
    const lg = state.realLeagues.find(l=>String(l.id)===String(state.activeLeagueId));
    const cache = state.leagueStandingsCache[state.activeLeagueId];
    if(!cache) ensureLeagueStandings(state.activeLeagueId);
    const title = (lg && lg.name) || (cache && cache.leagueName) || 'الدوري';
    const header = '<div class="topbar"><button class="back" id="leagueBack">' + ICON_BACK + '</button><h1>' + escapeHtml(title) + '</h1><div class="spacer"></div></div>';
    if(!cache || cache.loading){
      return header + '<div class="hint" style="margin:20px;">جاري تحميل الترتيب...</div>';
    }
    if(cache.error || !cache.results.length){
      return header + '<div class="hint" style="margin:20px;">تعذر تحميل ترتيب هذا الدوري حاليًا</div>';
    }
    const rows = cache.results.map(r=>{
      const isMe = state.deviceId && String(r.entryId)===String(state.deviceId);
      return '<button class="standing-row' + (isMe ? ' me' : '') + '" data-member="' + r.entryId + '" ' +
        'data-teamname="' + escapeHtml(r.teamName) + '" ' +
        'data-managername="' + escapeHtml(r.managerName) + '" ' +
        'style="width:100%;text-align:right;">' +
        '<div class="s-left"><div class="s-rank">#' + r.rank + '</div><div class="s-name">' + escapeHtml(r.teamName) + '</div></div>' +
        '<div class="s-pts">' + r.total + '</div>' +
      '</button>';
    }).join('');
    // لو ترتيبي بعيد ولسه ما ظهرش في الصفوف المحمّلة، نوريه من بيانات الدوري نفسها
    const meLoaded = state.deviceId && cache.results.some(r=>String(r.entryId)===String(state.deviceId));
    const myRankHint = (!meLoaded && lg && lg.entry_rank!=null)
      ? '<div class="hint" style="margin:2px 20px 10px;">ترتيبك في هذا الدوري: <strong style="color:var(--primary-soft);">#' + lg.entry_rank.toLocaleString() + '</strong> — اضغط "تحميل المزيد" للوصول إليه</div>'
      : '';
    const loadMoreBtn = cache.hasNext
      ? '<button class="btn-ghost" id="leagueLoadMore" style="margin:14px auto 4px;display:block;"' + (cache.loadingMore ? ' disabled' : '') + '>' +
          (cache.loadingMore ? 'جاري التحميل...' : 'تحميل المزيد') + '</button>'
      : '';
    return header + myRankHint + '<div class="league-list">' + rows + '</div>' + loadMoreBtn;
  }

  // ===== كل الدوريات الخاصة بيا =====
  return '' +
  '<div class="topbar"><div class="spacer"></div><h1>الدوريات الخاصة بك</h1><div class="spacer"></div></div>' +
  '<div class="league-list">' + renderLeaguePreviewItems() + '</div>';
}

// ===== ترشيح الأساسي/الاحتياطي: أفضل 11 لاعب ممكن بناءً على توقع النقاط مع مراعاة قواعد التشكيل =====
function optimalStartingXI(){
  const sq = squad();
  const byPos = { GK:[], DEF:[], MID:[], FWD:[] };
  sq.forEach(p=>{ if(byPos[p.pos]) byPos[p.pos].push(p); });
  Object.keys(byPos).forEach(pos=> byPos[pos].sort((a,b)=>predictedPoints(b)-predictedPoints(a)));

  const startXI = [];
  if(byPos.GK.length) startXI.push(byPos.GK[0]); // حارس واحد بس

  const mins = { DEF:3, MID:2, FWD:1 };
  const maxs = { DEF:5, MID:5, FWD:3 };
  const picked = { DEF:0, MID:0, FWD:0 };

  ['DEF','MID','FWD'].forEach(pos=>{
    for(let i=0; i<mins[pos] && i<byPos[pos].length; i++){
      startXI.push(byPos[pos][i]);
      picked[pos]++;
    }
  });

  let remainingSlots = 11 - startXI.length;
  const remainingPool = [];
  ['DEF','MID','FWD'].forEach(pos=>{
    for(let i=picked[pos]; i<byPos[pos].length; i++) remainingPool.push(byPos[pos][i]);
  });
  remainingPool.sort((a,b)=>predictedPoints(b)-predictedPoints(a));

  for(const p of remainingPool){
    if(remainingSlots<=0) break;
    if(picked[p.pos] >= maxs[p.pos]) continue; // ما يكسرش الحد الأقصى للمركز
    startXI.push(p);
    picked[p.pos]++;
    remainingSlots--;
  }

  return startXI;
}

// مقارنة التشكيلة المثالية بالتشكيلة الأساسية الحالية، وإرجاع قائمة التبديلات المقترحة
function suggestedLineupSwaps(){
  const optimal = optimalStartingXI();
  const optimalIds = new Set(optimal.map(p=>p.id));
  const currentStarters = starters();
  const currentIds = new Set(currentStarters.map(p=>p.id));

  const shouldStart = optimal.filter(p=>!currentIds.has(p.id)).sort((a,b)=>predictedPoints(b)-predictedPoints(a));
  const shouldBench = currentStarters.filter(p=>!optimalIds.has(p.id)).sort((a,b)=>predictedPoints(a)-predictedPoints(b));

  // مهم: بنطابق كل لاعب "يستحق يلعب" مع لاعب "يستحق يقعد" بحيث كل تبديل مقترح لوحده
  // يفضل قابل للتنفيذ — يعني ما يكسرش قواعد التشكيلة (حارس واحد، 3-5 مدافعين، 2-5 وسط،
  // 1-3 مهاجمين). قبل كده كنا بنطابق بالترتيب على طول، فكان ممكن يطلع اقتراح زي
  // "نزّل مدافع وطلّع لاعب وسط" وانت أصلاً على 3 مدافعين (الحد الأدنى) — اقتراح مستحيل
  // تنفيذه. دلوقتي: أولوية للتبديل في نفس المركز (آمن دايمًا)، وبعدين تبديل بمركز مختلف
  // بس لو التشكيلة الناتجة تفضل قانونية؛ وأي لاعب مالوش تبديل قانوني بيتشال بدل ما نقترح
  // حاجة مش قادر يعملها.
  const swaps = [];
  const usedOut = new Array(shouldBench.length).fill(false);
  for(const inP of shouldStart){
    let pick = -1;
    // 1) بديل في نفس المركز (تبديل آمن دايمًا) — أقل واحد توقعًا الأول
    for(let j=0; j<shouldBench.length; j++){
      if(usedOut[j]) continue;
      if(shouldBench[j].pos === inP.pos){ pick = j; break; }
    }
    // 2) بديل في مركز مختلف بشرط تفضل التشكيلة قانونية بعد التبديل
    if(pick === -1){
      for(let j=0; j<shouldBench.length; j++){
        if(usedOut[j]) continue;
        if(formationValidAfterSwap(shouldBench[j].pos, inP.pos)){ pick = j; break; }
      }
    }
    if(pick === -1) continue; // مفيش تبديل قانوني للاعب ده — نتخطاه بدل اقتراح مستحيل
    usedOut[pick] = true;
    swaps.push({ inP: inP, outP: shouldBench[pick], diff: predictedPoints(inP) - predictedPoints(shouldBench[pick]) });
  }
  // نرتّب المقترحات النهائية بالأكثر فايدة الأول
  swaps.sort((a,b)=>b.diff-a.diff);
  return swaps;
}

function toLocalInput(iso){
  const d = new Date(iso);
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}

// تنفيذ عملية الشراء: إما استبدال لاعب موجود (transferOutId) أو إضافة لاعب جديد لمكان فارغ (transferAddPos)
function tryBuyPlayer(inId){
  const inPlayer = findPlayer(inId);
  if(!inPlayer) return;

  const locked = isGwLocked();
  const ids = activeIds();
  const bank = activeBank();
  const freeT = activeFreeTransfers();

  const outEntry = ids.find(e=>e.id===state.transferOutId);
  const outPlayer = outEntry ? findPlayer(outEntry.id) : null;

  if(outPlayer){
    // ① استبدال لاعب موجود في الفريق بلاعب تاني في نفس المركز
    if(outPlayer.pos !== inPlayer.pos){ setFlash('err','اختر لاعبًا في نفس المركز'); return; }
    const newBank = bank + outPlayer.price - inPlayer.price;
    if(newBank < 0){ setFlash('err','الرصيد غير كافٍ لإتمام هذا الانتقال'); return; }
    if(inPlayer.club !== outPlayer.club && clubCountInSquad(inPlayer.club, outPlayer.id, ids) >= MAX_PER_CLUB){
      setFlash('err','لا يمكن ضم أكثر من ' + MAX_PER_CLUB + ' لاعبين من نفس النادي'); return;
    }

    outEntry.id = inPlayer.id; // keep the slot, swap identity
    const capId = locked ? state.draftCaptainId : state.captainId;
    const newCapId = (capId === outPlayer.id) ? inPlayer.id : capId;
    const newFreeT = freeT > 0 ? freeT - 1 : freeT;
    if(locked){
      state.draftBank = newBank; state.draftCaptainId = newCapId; state.draftFreeTransfers = newFreeT;
    } else {
      state.bank = newBank; state.captainId = newCapId; state.freeTransfers = newFreeT;
    }
    state.transferOutId = null;
    saveActive();

    setFlash('ok','تم تنفيذ الانتقال بنجاح' + (newFreeT===0 ? ' — التبديل التالي سيخصم 4 نقاط' : ''));
    return;
  }

  if(state.transferAddPos){
    // ② إضافة لاعب جديد لمكان فارغ في التشكيلة (مش استبدال — مفيش لاعب يتباع)
    if(inPlayer.pos !== state.transferAddPos){ setFlash('err','اختر لاعبًا في نفس المركز'); return; }
    if(ids.some(e=>e.id===inPlayer.id)){ setFlash('err','اللاعب موجود بالفعل في فريقك'); return; }
    if(ids.length >= 15){ setFlash('err','التشكيلة مكتملة بالفعل (15 لاعب)'); return; }
    if(squadPosCount(inPlayer.pos, null, ids) >= SQUAD_POS_LIMITS[inPlayer.pos]){
      const posLabelMap = {GK:'حراس', DEF:'مدافعين', MID:'وسط', FWD:'مهاجمين'};
      setFlash('err','لا يمكن ضم أكثر من ' + SQUAD_POS_LIMITS[inPlayer.pos] + ' ' + (posLabelMap[inPlayer.pos] || inPlayer.pos) + ' في الفريق'); return;
    }
    const newBank = bank - inPlayer.price;
    if(newBank < 0){ setFlash('err','الرصيد غير كافٍ لشراء هذا اللاعب'); return; }
    if(clubCountInSquad(inPlayer.club, null, ids) >= MAX_PER_CLUB){
      setFlash('err','لا يمكن ضم أكثر من ' + MAX_PER_CLUB + ' لاعبين من نفس النادي'); return;
    }

    ids.push({ id: inPlayer.id, slot: state.transferAddSlot || 'start' });
    if(locked){ state.draftBank = newBank; } else { state.bank = newBank; }
    state.transferAddPos = null;
    state.transferAddSlot = null;
    saveActive();

    setFlash('ok','تمت إضافة اللاعب لتشكيلتك بنجاح');
    return;
  }
}

function bindBody(){
  const el = document.getElementById('app-body');

  // تشغيل العدّاد التنازلي الحي لديدلاين الجولة (لو موجود على الشاشة)
  startCountdownTicker();

  // ===== تحسينات إتاحة (Accessibility) — بتتطبّق مركزيًا بعد كل رسم =====
  // 1) أزرار الرجوع أيقونة بس من غير نص — نديها اسم يقراه قارئ الشاشة
  el.querySelectorAll('.back').forEach(b=>{ if(!b.getAttribute('aria-label')) b.setAttribute('aria-label','رجوع'); });

  el.querySelectorAll('button svg, a svg').forEach(s=>{ s.setAttribute('aria-hidden','true'); s.setAttribute('focusable','false'); });

  // ===== أزرار التنقّل بين الجولات (آلة الزمن) =====
  el.querySelectorAll('[data-gwnav]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.hasAttribute('disabled')) return;
      const dir = b.getAttribute('data-gwnav');
      const cur = (state.gwInfo && state.gwInfo.current) || 1;
      if(dir==='live'){ loadGwView(cur); return; }
      const gw = activeViewGw() || cur;
      if(dir==='older') loadGwView(gw - 1);
      else if(dir==='newer') loadGwView(gw + 1);
    });
  });

  // فتح تفاصيل الماتش
  el.querySelectorAll('[data-match]').forEach(b=>{

  // team tab: segment mode switch
  el.querySelectorAll('[data-mode]').forEach(b=>{
    if(!b.hasAttribute('data-mode') || b.tagName!=='BUTTON') return;
  });
  el.querySelectorAll('.segment [data-mode]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.teamMode = b.getAttribute('data-mode'); state.selectedBenchId = null; renderBody(); });
  });

  // team tab: player taps (captain or bench-swap) — jersey elements carry data-mode = view/captain/bench
  el.querySelectorAll('.jersey[data-player]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      const id = parseInt(b.getAttribute('data-player'));
      const mode = b.getAttribute('data-mode');
      if(mode==='view'){ return; } // مفيش أكشن هنا فالنقرة تكمل لفتح بروفايل اللاعب
      // في وضع اختيار الكابتن أو تبديل الاحتياطي: النقرة على القميص تنفذ الأكشن مباشرة
      // وتوقف الحدث عشان ميفتحش بروفايل اللاعب كمان
      e.stopPropagation();
      const ids = activeIds(); // التشكيلة الحقيقية عادةً، أو مسودة الجولة الجاية لو الجولة الحالية شغالة
      const entry = ids.find(e=>e.id===id);
      if(!entry) return;
      if(mode==='captain'){
        if(entry.slot==='start'){
          if(isGwLocked()){ state.draftCaptainId = id; } else { state.captainId = id; }
          saveActive(); renderBody();
        }
      } else if(mode==='bench'){
        if(entry.slot==='bench'){
          state.selectedBenchId = (state.selectedBenchId===id) ? null : id;
          renderBody();
        } else if(entry.slot==='start' && state.selectedBenchId){
          const benchEntry = ids.find(e=>e.id===state.selectedBenchId);
          const benchP = findPlayer(benchEntry.id);
          const startP = findPlayer(id);
          // التبديل مسموح حتى لو المركز مختلف، طالما التشكيلة الناتجة لسه قانونية
          // (حارس واحد، 3-5 مدافعين، 2-5 وسط، 1-3 مهاجمين)
          if(formationValidAfterSwap(startP.pos, benchP.pos, ids)){
            benchEntry.slot = 'start'; entry.slot = 'bench';
            state.selectedBenchId = null;
            saveActive();
            renderBody();

    } else if(state.pushStatus!=='unsupported'){
      // الإذن ممكن يكون granted بس من غير اشتراك (وقّفها قبل كده) — enablePush هيعيد الاشتراك
      enablePush();
    }
  });

  // more tab: install app
  const installBtn = el.querySelector('#installBtn');
  if(installBtn) installBtn.addEventListener('click', async ()=>{
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      try{ await deferredInstallPrompt.userChoice; }catch(e){}
      deferredInstallPrompt = null;
      state.canInstall = false;
    } else {
      state.showInstallGuide = !state.showInstallGuide;
    }
    renderBody();
  });

  // admin pin
  const pinInput = el.querySelector('#pinInput');
  const pinSubmit = el.querySelector('#pinSubmit');
  if(pinSubmit) pinSubmit.addEventListener('click', async ()=>{
    const val = pinInput.value;
    const valHash = await sha256Hex(val);
    if(valHash === ADMIN_PIN_HASH){ state.adminUnlocked = true; state.adminPinInput=''; adminPinPlain = val; }
    else { state.adminPinInput = 'wrong'; }
    renderBody();
  });

  // admin: force a fresh sync from the official FPL API
  const forceSync = el.querySelector('#adminForceSync');
  if(forceSync) forceSync.addEventListener('click', async ()=>{
    await loadLiveData(true);
    state.adminSavedBanner = true;
    renderBody();
    setTimeout(()=>{ state.adminSavedBanner = false; if(state.tab==='admin') renderBody(); }, 3000);
  });

  // transfers: search box — نحدث marketList فقط عشان الحقل ميفقدش الـ focus
  const searchBox = el.querySelector('#transferSearch');
  if(searchBox){
    searchBox.addEventListener('input', ()=>{

      const marketList = el.querySelector('#marketList');
      if(marketList){

        bindMarketListItems(marketList);

  if(filterClub){
    filterClub.addEventListener('change', ()=>{
      state.transferFilterClub = filterClub.value;
      const marketList = el.querySelector('#marketList');
      if(marketList){ marketList.innerHTML = renderTransferMarket(); bindMarketListItems(marketList); }
    });
  }
  const filterPrice = el.querySelector('#transferFilterPrice');
  if(filterPrice){

      state.transferFilterPrice = filterPrice.value;
      const marketList = el.querySelector('#marketList');
      if(marketList){ marketList.innerHTML = renderTransferMarket(); bindMarketListItems(marketList); }
    });
  }

  // admin: save news/advice links via secure edge function
  const saveLinks = el.querySelector('#adminSaveLinks');
  if(saveLinks) saveLinks.addEventListener('click', async ()=>{
    state.adminLinks = {
      news: el.querySelector('#adminNewsLink').value.trim(),
      advice: el.querySelector('#adminAdviceLink').value.trim(),
    };

    saveLinks.textContent = 'جاري الحفظ...';

    try {
      // نداء الـ Edge Function الآمنة بـ fetch عادي (بدل عميل supabase-js).
      // الـ PIN اتحفظ في الميموري وقت فتح لوحة الأدمن (عنصر #pinInput مبقاش موجود).
      const res = await withTimeout(fetch(SUPABASE_URL + '/functions/v1/save-admin-links', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ pin: adminPinPlain, links: state.adminLinks }),
      }), 8000);
      const data = res.ok ? await res.json().catch(()=>null) : null;

      if(!res.ok || (data && !data.success)) throw new Error();
      saveLinks.textContent = 'تم الحفظ ✓';
    } catch (e) {
      saveLinks.textContent = 'فشل الحفظ';
      console.error(e);
    }

    setTimeout(()=>{ saveLinks.textContent = 'حفظ الروابط'; }, 2000);
  });
}

// ===== تحديث فوري لما التطبيق يرجع قدّام المستخدم =====
// على الموبايل (خصوصًا كتطبيق PWA أو مع قفل الشاشة / تبديل التطبيقات) المتصفح
// بيجمّد مؤقتات setTimeout وهو في الخلفية، فالنقط اللحظية والماتشات اللي بدأت
// بتفضل واقفة على آخر قيمة اتحدّثت لحد ما المؤقت يشتغل تاني (ممكن يوصل دقيقة أو أكتر،
// وأحيانًا الصفحة بترجع من الـ bfcache متجمّدة تمامًا). ده سبب أساسي إن اللاب بيحدّث
// كويس والتليفون لأ. الحل: أول ما التطبيق يبقى ظاهر تاني (رجوع من الخلفية / فتح
// الشاشة / رجوع النت) نعمل تحديث فوري للبيانات بدل ما نستنّى المؤقت الجاي.
let _lastFgRefresh = 0;
async function foregroundRefresh(){
  if(typeof state === 'undefined' || state.phase !== 'app') return;
  if(state.refreshing) return;
  const now = Date.now();
  if(now - _lastFgRefresh < 5000) return; // نمنع التكرار السريع لو أكتر من حدث اتظبط مع بعض
  _lastFgRefresh = now;
  try{ await refreshLiveData(); }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') foregroundRefresh();
});
window.addEventListener('pageshow', ()=>{ foregroundRefresh(); });  // رجوع الصفحة من الـ bfcache (iOS بالذات)
window.addEventListener('focus', ()=>{ foregroundRefresh(); });     // رجوع التركيز للتطبيق
window.addEventListener('online', ()=>{ foregroundRefresh(); });    // أول ما النت يرجع

// refresh deadline text + overall standings periodically
// وقت مفيش مباريات شغالة: نعيد الرسم بس كل دقيقة (للعدّاد التنازلي وغيره).
// وقت فيه مباريات شغالة فعليًا: نعيد الجلب من فانتازي البريميرليج كل 45 ثانية عشان
// النقط والبونص اللحظي يفضلوا لحظة بلحظة قد الإمكان (حسب سرعة تحديث الـ API الرسمي نفسه).
// (بنستخدم setTimeout بيعيد جدولة نفسه بدل setInterval، عشان مدة الانتظار تتغيّر لايف
// حسب state.hasLiveFixtures بدل ما تفضل ثابتة زي ما setInterval بيعمل).
let _lastRankTick = 0;
async function scheduleLiveTick(){
  if(state.phase==='app'){
    // بنحدّث لو فيه ماتشات شغّالة (نقط لايف)، أو لو آخر تحديث فشل/اتأخر — عشان الرسالة
    // "تأخر التحديث" تختفي لوحدها أول ما الاتصال يرجع، بدل ما تفضل ثابتة لحد التحديث اليدوي.
    const needsRetry = state.liveDataStale || state.liveDataError;
    if(state.hasLiveFixtures || needsRetry){
      const wasStale = needsRetry;
      // مهم: وقت اللايف بنجبر إعادة الجلب فعليًا كل تيك (force=true) بدل ما نرجّع نسخة
      // من الكاش المحلي — عشان النتيجة والدقيقة والنقط يفضلوا حيّين بنفس السرعة على كل
      // الأجهزة، ومايحصلش إن جهاز يبقى في الدقيقة 22 وجهاز في الدقيقة 13.
      try{ await loadLiveData(true); }catch(e){}
      // كمان بنحدّث الترتيب العام تلقائيًا وقت اللايف (كل ~دقيقتين) من غير تحديث يدوي،
      // عشان مايفضلش الترتيب قديم على جهاز وجديد على التاني.
      if(state.hasLiveFixtures){
        const now = Date.now();
        if(now - _lastRankTick > 120000){
          _lastRankTick = now;
          try{ await ensureLeagues(true); }catch(e){}
        }
      }
      if(wasStale && !state.liveDataStale && !state.liveDataError) renderBody(); // نجح التحديث — نحدّث الشاشة
    }
    try{ syncMazaretaTeam(); }catch(e){}   // حدّث تشكيلة المزاريطة المشتركة (بتعمل render لوحدها لو اتغيرت)
    if(state.tab==='home' || state.tab==='fixtures' || state.tab==='leagues' || state.tab==='predictions') renderBody();
  }
  // jitter بسيط (±5 ثواني) عشان كل الأجهزة ميطلبوش في نفس اللحظة بالظبط —
  // ده بيوزّع الحمل على السيرفر بدل ما يتركّز في نبضة واحدة كل 45 ثانية.
  const jitter = () => Math.floor(Math.random()*10000) - 5000;
  setTimeout(scheduleLiveTick, ((state.hasLiveFixtures || state.liveDataStale || state.liveDataError) ? 25000 : 60000) + jitter());
}
setTimeout(scheduleLiveTick, (state.hasLiveFixtures ? 25000 : 60000) + (Math.floor(Math.random()*10000) - 5000));

/* ============================================================
   المرحلة 1 — أصوات الأحداث (فورجراوند) + بانر تحميل التطبيق
   ============================================================ */

// ---- محرك الصوت (Web Audio) — بيتفعّل بعد أول لمسة من المستخدم ----
let _actx = null;
function _ensureAudio(){
  if(_actx) return _actx;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    _actx = new AC();
  }catch(e){ _actx = null; }
  return _actx;
}
// إلغاء قفل الصوت على iOS/Chrome: لازم أول تشغيل يبدأ جوه إيماءة من المستخدم
['pointerdown','touchstart','click','keydown'].forEach(ev=>{
  window.addEventListener(ev, ()=>{
    const c = _ensureAudio();
    if(c && c.state==='suspended') c.resume().catch(()=>{});
  }, { passive:true });
});

function _tone(ctx, freq, t0, dur, type, peak){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type||'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak||0.22, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
// ضجيج قصير يشبه هتاف الجمهور (للجول)
function _cheer(ctx, t0){
  const dur = 0.7, buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate*dur), ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ const p=i/d.length; d[i] = (Math.random()*2-1) * Math.pow(1-p,1.3) * 0.5; }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1100; bp.Q.value=0.7;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.16,t0+0.08);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(bp); bp.connect(g); g.connect(ctx.destination);
  src.start(t0); src.stop(t0+dur);
}
function _soundAllowed(kind){
  const t = (typeof state!=='undefined' && state.toggles) ? state.toggles : {};
  if(t.antiSpoiler) return false;                         // وضع منع الحرق = كتم كامل
  if(kind==='goal'||kind==='assist'||kind==='bonus') return t.notifGoals !== false;
  if(kind==='csleak') return t.notifCS !== false;
  if(kind==='yellow'||kind==='red') return t.notifCards === true; // الكروت افتراضيًا مكتومة
  return false;
}
function playEventSound(kind){
  if(!_soundAllowed(kind)) return;
  const ctx = _ensureAudio();
  if(!ctx) return;
  if(ctx.state==='suspended') ctx.resume().catch(()=>{});
  const t = ctx.currentTime + 0.02;
  const vib = (p)=>{ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} };
  if(kind==='goal'){
    [523.25,659.25,783.99,1046.5].forEach((f,i)=> _tone(ctx,f,t+i*0.10,0.30,'triangle',0.28));
    _cheer(ctx, t+0.14); vib([60,40,120]);
  } else if(kind==='assist'){
    _tone(ctx,659.25,t,0.16,'triangle',0.24);
    _tone(ctx,987.77,t+0.12,0.22,'triangle',0.24); vib([40,30,70]);
  } else if(kind==='bonus'){
    [1046.5,1318.5,1568].forEach((f,i)=> _tone(ctx,f,t+i*0.07,0.16,'sine',0.18));
  } else if(kind==='yellow'){
    _tone(ctx,220,t,0.22,'square',0.16); vib([130]);
  } else if(kind==='red'){
    _tone(ctx,180,t,0.22,'square',0.18);
    _tone(ctx,150,t+0.24,0.32,'square',0.18); vib([180,80,180]);
  } else if(kind==='csleak'){
    _tone(ctx,392,t,0.22,'sine',0.20);
    _tone(ctx,311.13,t+0.18,0.28,'sine',0.20);
    _tone(ctx,246.94,t+0.40,0.42,'sine',0.20); vib([90,60,90]);
  }
}

// ---- بانر تحميل التطبيق (Add to Home Screen) ----
let _pwaDismissed = false;
function _isStandalone(){
  return (window.matchMedia && (window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches)) ||
         window.navigator.standalone === true;
}
function _isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
         (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function _showInstallGuideSheet(){
  if(document.querySelector('.pwa-ios')) return;
  const ov = document.createElement('div');
  ov.className = 'pwa-ios';
  ov.innerHTML =
    '<div class="sheet">' +
      '<h4>ضيف المزاريطة على شاشتك 📲</h4>' +
      '<div class="step"><div class="n">1</div><div>دوس على زر المشاركة <b>Share</b> تحت في المتصفح (المربع اللي طالع منه سهم لفوق).</div></div>' +
      '<div class="step"><div class="n">2</div><div>انزل تحت واختار <b>«إضافة إلى الشاشة الرئيسية»</b> (Add to Home Screen).</div></div>' +
      '<div class="step"><div class="n">3</div><div>دوس <b>«إضافة»</b> — وهتلاقي أيقونة المزاريطة على موبايلك زي أي تطبيق. ومن هنا بس بتشتغل الإشعارات على الآيفون.</div></div>' +
      '<button class="close">تمام</button>' +
    '</div>';
  ov.addEventListener('click',(e)=>{ if(e.target===ov || e.target.classList.contains('close')) ov.remove(); });
  document.body.appendChild(ov);
}
function _buildInstallBanner(){
  if(document.getElementById('pwaBanner')) return;
  const b = document.createElement('div');
  b.className = 'pwa-banner'; b.id = 'pwaBanner';
  b.innerHTML =
    '<div class="pwa-x" id="pwaX" aria-label="إغلاق">✕</div>' +
    '<img class="pwa-ic" src="/icon-192.png" alt="">' +
    '<div class="pwa-tx"><b>نزّل المزاريطة كتطبيق</b>' +
      '<span>أسرع وبدون متصفح — وييجيلك إشعار بكل جول وأسيست للاعيبتك</span></div>' +
    '<button class="pwa-cta" id="pwaCta">تحميل</button>';
  document.body.appendChild(b);
  b.querySelector('#pwaX').addEventListener('click',(e)=>{ e.stopPropagation(); _pwaDismissed = true; b.remove(); });
  b.querySelector('#pwaCta').addEventListener('click', async ()=>{
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      try{ await deferredInstallPrompt.userChoice; }catch(e){}
      deferredInstallPrompt = null; state.canInstall = false;
    } else {
      _showInstallGuideSheet();   // آيفون/سفاري أو متصفح ملهوش prompt
    }
  });
}
function updateInstallBanner(){
  const shown = document.getElementById('pwaBanner');
  const shouldShow = !_isStandalone() && !_pwaDismissed &&
                     (typeof state!=='undefined') && state.phase==='app';
  if(shouldShow && !shown) _buildInstallBanner();
  else if(!shouldShow && shown) shown.remove();
}
window.addEventListener('appinstalled', ()=>{
  _pwaDismissed = true;
  const el = document.getElementById('pwaBanner'); if(el) el.remove();
});
setTimeout(updateInstallBanner, 1200);
setInterval(updateInstallBanner, 1500);

/* ============================================================
   بانر بارز لتشغيل الإشعارات (بدل ما يكون مدفون في تاب "المزيد")
   بيظهر في الهوم لو المستخدم لسه مفعّلش الإشعارات، ويختفي أول ما يفعّل،
   وبيظهر تلقائيًا أول ما يثبّت التطبيق. ما بيتكوّمش فوق بانر التثبيت.
   ============================================================ */
let _notifDismissed = false;
function _buildNotifBanner(){
  if(document.getElementById('notifBanner')) return;
  const b = document.createElement('div');
  b.className = 'pwa-banner'; b.id = 'notifBanner';
  b.innerHTML =
    '<div class="pwa-x" id="notifX" aria-label="إغلاق">✕</div>' +
    '<div class="pwa-ic" style="display:flex;align-items:center;justify-content:center;background:rgba(0,255,135,0.16);font-size:24px;">🔔</div>' +
    '<div class="pwa-tx"><b>مش عايز تفوّت جول للاعيبتك؟</b>' +
      '<span>شغّل الإشعارات — واعرف أول واحد لما لاعبك يعمل حاجة، حتى والتطبيق مقفول</span></div>' +
    '<button class="pwa-cta" id="notifCta">تشغيل</button>';
  document.body.appendChild(b);
  b.querySelector('#notifX').addEventListener('click',(e)=>{ e.stopPropagation(); _notifDismissed = true; b.remove(); });
  b.querySelector('#notifCta').addEventListener('click', async ()=>{
    const ok = await enablePush();
    if(ok){ _notifDismissed = true; const el=document.getElementById('notifBanner'); if(el) el.remove(); }
  });
}
function updateNotifBanner(){
  const shown = document.getElementById('notifBanner');
  const supported = (typeof state!=='undefined') && state.pushStatus !== 'unsupported';
  const shouldShow = (typeof state!=='undefined') && state.phase==='app' &&
                     supported && pushNeedsEnable() && !!state.deviceId &&
                     !_notifDismissed &&
                     (_isStandalone() || !_isIOS()) &&        // على آيفون-متصفح سيب بانر التثبيت هو اللي يظهر (لازم يثبّت الأول)
                     !document.getElementById('pwaBanner');    // مانكوّمش بانرين فوق بعض
  if(shouldShow && !shown) _buildNotifBanner();
  else if(!shouldShow && shown) shown.remove();
}
window.addEventListener('appinstalled', ()=>{ setTimeout(updateNotifBanner, 900); }); // أول ما يثبّت، اعرض تشغيل الإشعارات علطول
setTimeout(updateNotifBanner, 1600);
setInterval(updateNotifBanner, 1600);

// مزامنة تشكيلة المزاريطة المشتركة: أول تحميل + كل دقيقة (بتقرا/تكتب من السيرفر حسب الحالة)
setTimeout(()=>{ try{ syncMazaretaTeam(); }catch(e){} }, 4000);
setInterval(()=>{ try{ syncMazaretaTeam(); }catch(e){} }, 60000);

/* ============================================================
   المرحلة 2 — اشتراك إشعارات Web Push (تسجيل الجهاز + لاعيبة المستخدم)
   ============================================================ */

// ⚠️ لازم يبقى نفس مفتاح VAPID العام الموجود في الـ push-worker (env.VAPID_PUBLIC)
const VAPID_PUBLIC_KEY = 'BFl4KjtCGoeltFOKGVtIDo2r0FOtn68lw1wFGcLgXi45UONxOTFXqbk2fAM5vryS3AG7ndn_Syl6bgV50KMBCIo';

function urlB64ToUint8Array(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const base = (b64 + pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base); const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function _abToB64url(buf){
  const b = new Uint8Array(buf); let s='';
  for(let i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function _currentSquadIds(){
  return (state.mySquadIds||[]).map(e=>e.id).filter(x=>x!=null);
}

// بيحفظ الاشتراك في Supabase تحت push_sub:<fplId>:<hash>، ومعاه لاعيبة المستخدم
async function savePushSub(sub){
  const fplId = state.deviceId || 'anon';
  const hash = (await sha256Hex(sub.endpoint)).slice(0,16);
  const key = 'push_sub:' + fplId + ':' + hash;
  const ids = _currentSquadIds();
  const payload = {
    endpoint: sub.endpoint,
    keys: {
      p256dh: _abToB64url(sub.getKey('p256dh')),
      auth:   _abToB64url(sub.getKey('auth')),
    },
    playerIds: ids,
    fplId: fplId,
    ts: Date.now(),
  };
  await sSet(key, JSON.stringify(payload));   // push_sub مش محمي بـ owner token
  state._pushKey = key;
  state._pushPlayersHash = JSON.stringify(ids);
}

// "الإشعارات شغّالة فعلاً" = المتصفح مديّك الإذن + فيه اشتراك Push فعلي محفوظ.
// مش كفاية إن الإذن granted، لأن بعد الإيقاف الإذن بيفضل granted بس الاشتراك بيتلغي.
function pushIsOn(){ return state.pushStatus === 'granted' && state.pushSubscribed === true; }
// محتاجين نعرض دعوة التفعيل؟ (مدعوم، مش متمنوع، ولسه مفيش اشتراك شغّال)
function pushNeedsEnable(){
  return state.pushStatus !== 'unsupported' && state.pushStatus !== 'denied' && !state.pushSubscribed;
}

async function enablePush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)){
    alert('متصفحك مايدعمش الإشعارات.'); return false;
  }
  if(!state.deviceId){
    alert('ادخل رقم فريقك (FPL ID) الأول عشان نعرف لاعيبتك ونبعتلك إشعاراتهم.'); return false;
  }
  // على الآيفون لازم التطبيق يكون متثبّت الأول
  if(_isIOS() && !_isStandalone()){ _showInstallGuideSheet(); return false; }
  let perm;
  try{ perm = await Notification.requestPermission(); }catch(e){ perm = Notification.permission; }
  state.pushStatus = perm;
  if(perm !== 'granted'){ if(state.tab==='more') renderBody(); return false; }
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
    await savePushSub(sub);
    state.pushSubscribed = true;   // بقى فيه اشتراك فعلي شغّال
  }catch(e){
    alert('حصلت مشكلة وإحنا بنفعّل الإشعارات. جرّب تاني.');
    return false;
  }
  if(state.tab==='more') renderBody();
  updateNotifBanner();
  return true;
}

async function disablePush(){
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub) await sub.unsubscribe();
  }catch(e){}
  try{ if(state._pushKey) await sDelete(state._pushKey); }catch(e){}
  state._pushKey = null; state._pushPlayersHash = '';
  state.pushSubscribed = false;   // اتلغى الاشتراك — الإذن بيفضل granted بس مفيش تسجيل
  // ملاحظة: الإذن نفسه بيفضل granted على مستوى المتصفح؛ إحنا بنوقف التسجيل بس.
  // بفضل pushSubscribed=false الواجهة هتعرض دعوة "فعّل" تاني ويقدر يعيد الاشتراك.
  if(state.tab==='more') renderBody();
  updateNotifBanner();
}

// كشف حالة الاشتراك الفعلي عند فتح التطبيق: الإذن ممكن يكون granted من غير اشتراك شغّال
// (اليوزر وقّف الإشعارات قبل كده، أو المتصفح لغى الاشتراك). بنقرأ الاشتراك الحقيقي من
// pushManager ونعيد بناء مفتاح Supabase عشان الإيقاف بعدين يمسح التسجيل الصح.
async function initPushSubscribed(){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window)){ state.pushSubscribed = false; return; }
    if(state.pushStatus !== 'granted'){ state.pushSubscribed = false; return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    state.pushSubscribed = !!sub;
    if(sub && !state._pushKey && state.deviceId){
      try{
        const hash = (await sha256Hex(sub.endpoint)).slice(0,16);
        state._pushKey = 'push_sub:' + state.deviceId + ':' + hash;
      }catch(e){}
    }
  }catch(e){ state.pushSubscribed = false; }
  if(state.tab==='more') renderBody();
  updateNotifBanner();
}

// بيحدّث لاعيبة المستخدم في الاشتراك المحفوظ لو التشكيلة اتغيّرت (بعد انتقالات مثلاً)
async function refreshPushSquad(){
  try{
    if(!pushIsOn() || !state.deviceId) return;
    const ids = _currentSquadIds();
    if(!ids.length) return;
    const h = JSON.stringify(ids);
    if(h === state._pushPlayersHash) return; // مفيش تغيير
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(!sub) return;
    await savePushSub(sub);
  }catch(e){}
}

// تهيئة حالة الإذن عند الفتح
try{ state.pushStatus = ('Notification' in window) ? Notification.permission : 'unsupported'; }
catch(e){ state.pushStatus = 'unsupported'; }

// اكتشف لو فيه اشتراك فعلي شغّال (بعد deviceId ما يتحمّل) عشان الواجهة تفرّق بين
// "الإذن granted بس من غير اشتراك" و"مشترك فعلاً"
setTimeout(initPushSubscribed, 3000);

// حدّث لاعيبة الاشتراك بعد ما التشكيلة تتحمّل، وكل شوية (بيتخطّى لو مفيش تغيير)
setTimeout(refreshPushSquad, 8000);
setInterval(refreshPushSquad, 120000);

boot();
</script>
