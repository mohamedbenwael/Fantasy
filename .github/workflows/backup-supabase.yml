name: Backup Supabase KV

on:
  schedule:
    # كل يوم الساعة 3 صباحًا بتوقيت UTC (5 صباحًا بتوقيت القاهرة تقريبًا)
    - cron: '0 3 * * *'
  workflow_dispatch: {} # يسمح بتشغيله يدويًا من تبويب Actions لو حبيت تجرّبه فورًا

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run backup script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/backup-supabase.mjs

      - name: Commit backup if changed
        run: |
          git config user.name "backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "backup: $(date -u +%Y-%m-%d)"
          git push
